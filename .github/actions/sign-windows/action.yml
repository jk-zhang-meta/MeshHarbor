name: Sign Windows artifacts
description: >-
  Authenticode-sign Windows artifacts with Azure Artifact Signing (OIDC, no key
  material in GitHub), then VERIFY that they really are signed. Warns and
  no-ops when no credentials are configured; hard-fails when `require` is true
  (which defaults to true on tag pushes).

# Replaces the three copy-pasted `signtool sign /f <pfx>` blocks that used to
# live in release-agent.yml (x2) and release-setup.yml.
#
# Two properties the old blocks did not have:
#
#   1. Verification. They signed and moved on. Signedness was then encoded
#      into the FILENAME based on whether a secret happened to be set --
#      computed BEFORE signtool ran, so it never described the bytes. Here,
#      every signature is re-read with `signtool verify /pa /all`, checked for
#      an RFC3161 countersignature, and (optionally) checked for the expected
#      publisher subject.
#
#   2. A gate. `require` turns "nothing was signed" into a job failure on
#      release tags, so a release can no longer silently ship unsigned.
#
# `local` mode is not a weaker path: it imports the self-signed test cert into
# the runner's Root + TrustedPublisher stores so the identical strict verify
# runs and passes. The free rehearsal therefore exercises the same code as the
# real thing, differing only in which key signs.
#
# Composite-action constraints that shaped this file:
#   * `secrets` and `vars` contexts are NOT available inside an action, so
#     every credential arrives as an input.
#   * `permissions:` cannot be declared by an action -- the CALLING JOB must
#     carry `id-token: write` for azure/login's OIDC exchange.
#   * `continue-on-error:` and `timeout-minutes:` are not supported on
#     composite steps, so all soft-failure behaviour lives inside `run:`.

inputs:
  # ---- what to sign --------------------------------------------------------
  files:
    description: 'Newline- or comma-separated file list (workspace-relative or absolute).'
    required: false
    default: ''
  files-folder:
    description: 'Folder to sign (alternative or addition to `files`).'
    required: false
    default: ''
  files-folder-filter:
    description: 'Extension filter for files-folder, e.g. "exe,dll,msi".'
    required: false
    default: 'exe,dll,msi'
  files-folder-recurse:
    description: 'Recurse into files-folder subdirectories.'
    required: false
    default: 'false'

  # ---- policy --------------------------------------------------------------
  mode:
    description: 'auto | azure | local | off. auto = azure if configured, else local PFX, else none.'
    required: false
    default: 'auto'
  require:
    description: >-
      "true" => unsigned or unverified fails the job. "false" => warn only.
      "" (default) => auto: true iff github.ref_type == "tag".
    required: false
    default: ''
  verify:
    description: 'strict (signtool verify /pa /all must pass) | structural (signature present) | off'
    required: false
    default: 'strict'
  require-timestamp:
    description: >-
      Fail when a signature carries no RFC3161 countersignature. Artifact
      Signing certificates are valid ~3 days, so an untimestamped signature
      stops validating almost immediately after release.
    required: false
    default: 'true'
  expect-subject-contains:
    description: 'Optional substring the signer certificate subject must contain.'
    required: false
    default: ''

  # ---- Azure Artifact Signing ---------------------------------------------
  endpoint:
    description: 'Artifact Signing account endpoint, e.g. https://weu.codesigning.azure.net/'
    required: false
    default: ''
  signing-account-name:
    description: 'Artifact Signing account name.'
    required: false
    default: ''
  certificate-profile-name:
    description: 'Certificate profile name.'
    required: false
    default: ''
  azure-client-id:
    description: 'Entra app registration client id (federated, no secret).'
    required: false
    default: ''
  azure-tenant-id:
    description: 'Entra tenant id.'
    required: false
    default: ''
  azure-subscription-id:
    description: 'Azure subscription id.'
    required: false
    default: ''
  description:
    description: 'Signed-content description embedded in the signature.'
    required: false
    default: 'MeshHarbor'
  description-url:
    description: 'URL embedded alongside the description.'
    required: false
    default: 'https://meshharbor.itachi.fans/'
  file-digest:
    description: 'SHA256 | SHA384 | SHA512'
    required: false
    default: 'SHA256'
  timestamp-rfc3161:
    description: 'RFC3161 timestamp authority.'
    required: false
    default: 'http://timestamp.acs.microsoft.com'
  timestamp-digest:
    description: 'SHA256 | SHA384 | SHA512'
    required: false
    default: 'SHA256'
  batch-size:
    description: 'Files per signing request.'
    required: false
    default: '100'
  timeout:
    description: 'Signing timeout in seconds.'
    required: false
    default: '300'
  trace:
    description: 'Verbose signing diagnostics.'
    required: false
    default: 'false'

  # ---- local self-signed rehearsal mode ------------------------------------
  local-pfx-base64:
    description: 'Base64 of a self-signed test PFX (see scripts/signing/50-selfsigned-dev-cert.ps1).'
    required: false
    default: ''
  local-pfx-password:
    description: 'Password for local-pfx-base64.'
    required: false
    default: ''
  local-timestamp-url:
    description: 'Optional TSA for local mode. Empty = no timestamp (fine for a 3-year test cert).'
    required: false
    default: ''
  local-trust-store:
    description: 'Import the local cert into LocalMachine Root + TrustedPublisher so strict verify can pass.'
    required: false
    default: 'true'

outputs:
  signed:
    description: '"true" when this action produced AND verified a signature on every file.'
    value: ${{ steps.report.outputs.signed }}
  mode:
    description: 'azure | local | none'
    value: ${{ steps.resolve.outputs.mode }}
  files-signed:
    description: 'Number of files in the resolved set.'
    value: ${{ steps.resolve.outputs.count }}
  subject:
    description: 'Signer certificate subject of the first verified file ("" when unsigned).'
    value: ${{ steps.report.outputs.subject }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------
    # 1. Decide mode + requirement and expand the file set ONCE. Everything
    #    downstream reads the expanded list from RUNNER_TEMP, so sign and
    #    verify can never disagree about what was in scope.
    # -------------------------------------------------------------------
    - name: Resolve signing mode and file set
      id: resolve
      shell: pwsh
      env:
        IN_FILES:    ${{ inputs.files }}
        IN_FOLDER:   ${{ inputs.files-folder }}
        IN_FILTER:   ${{ inputs.files-folder-filter }}
        IN_RECURSE:  ${{ inputs.files-folder-recurse }}
        IN_MODE:     ${{ inputs.mode }}
        IN_REQUIRE:  ${{ inputs.require }}
        IN_ENDPOINT: ${{ inputs.endpoint }}
        IN_ACCOUNT:  ${{ inputs.signing-account-name }}
        IN_PROFILE:  ${{ inputs.certificate-profile-name }}
        IN_CLIENTID: ${{ inputs.azure-client-id }}
        IN_TENANT:   ${{ inputs.azure-tenant-id }}
        IN_PFX:      ${{ inputs.local-pfx-base64 }}
        REF_TYPE:    ${{ github.ref_type }}
      run: |
        $ErrorActionPreference = 'Stop'

        # `require` defaults to "true on a tag": a release must never be able
        # to publish unsigned, but a PR or a dispatch rehearsal should stay
        # green so packaging can be iterated without credentials.
        $require = switch ($env:IN_REQUIRE) {
          'true'  { $true }
          'false' { $false }
          default { $env:REF_TYPE -eq 'tag' }
        }

        $azureReady = [bool]($env:IN_ENDPOINT -and $env:IN_ACCOUNT -and $env:IN_PROFILE -and $env:IN_CLIENTID -and $env:IN_TENANT)
        $localReady = [bool]$env:IN_PFX

        $mode = switch ($env:IN_MODE) {
          'off'   { 'none' }
          'azure' {
            if (-not $azureReady) {
              Write-Host "::error::mode=azure but the Azure inputs are incomplete (endpoint/account/profile/client-id/tenant-id). Run scripts/signing/30-github-oidc.ps1."
              exit 1
            }
            'azure'
          }
          'local' {
            if (-not $localReady) {
              Write-Host "::error::mode=local but local-pfx-base64 is empty. Run scripts/signing/50-selfsigned-dev-cert.ps1 -PushSecrets."
              exit 1
            }
            'local'
          }
          default {
            if     ($azureReady) { 'azure' }
            elseif ($localReady) { 'local' }
            else                 { 'none' }
          }
        }

        # Expand the file set. Absolute paths win; relative resolve against
        # the workspace, which is where every call site's paths are rooted.
        $resolved = New-Object System.Collections.Generic.List[string]
        $missing  = New-Object System.Collections.Generic.List[string]

        function Add-Path([string]$p) {
          $p = $p.Trim().Trim('"')
          if (-not $p) { return }
          if (-not [IO.Path]::IsPathRooted($p)) { $p = Join-Path $env:GITHUB_WORKSPACE $p }
          if (Test-Path -LiteralPath $p -PathType Leaf) {
            $resolved.Add((Resolve-Path -LiteralPath $p).Path)
          } else {
            $missing.Add($p)
          }
        }

        foreach ($tok in ($env:IN_FILES -split "[`r`n,]")) { Add-Path $tok }

        if ($env:IN_FOLDER) {
          $folder = $env:IN_FOLDER
          if (-not [IO.Path]::IsPathRooted($folder)) { $folder = Join-Path $env:GITHUB_WORKSPACE $folder }
          if (Test-Path -LiteralPath $folder) {
            $exts = @()
            foreach ($e in ($env:IN_FILTER -split ',')) {
              $e = $e.Trim().TrimStart('*').TrimStart('.')
              if ($e) { $exts += ('.' + $e.ToLower()) }
            }
            $gc = @{ LiteralPath = $folder; File = $true }
            if ($env:IN_RECURSE -eq 'true') { $gc['Recurse'] = $true }
            # Filter extensions in PowerShell rather than with -Include:
            # -Include is silently ignored alongside -LiteralPath -Recurse
            # (it matched every file at the top level, .txt included). A
            # signing file set is the last place to accept that surprise.
            foreach ($f in (Get-ChildItem @gc)) {
              if ($exts.Count -eq 0 -or $exts -contains $f.Extension.ToLower()) {
                $resolved.Add($f.FullName)
              }
            }
          } else {
            $missing.Add($folder)
          }
        }

        # A path that does not exist is always a bug at the call site -- a
        # renamed artifact, a step that did not run, a typo. Never silently
        # sign a smaller set than was asked for.
        if ($missing.Count -gt 0) {
          foreach ($m in $missing) { Write-Host "::error::sign-windows: path not found: $m" }
          exit 1
        }

        $resolved = $resolved | Select-Object -Unique
        if ($resolved.Count -eq 0) {
          Write-Host "::error::sign-windows: resolved an EMPTY file set. Check the 'files' / 'files-folder' inputs at the call site."
          exit 1
        }

        $listPath = Join-Path $env:RUNNER_TEMP 'sign-windows-files.txt'
        $resolved | Set-Content -LiteralPath $listPath -Encoding utf8

        Write-Host "mode=$mode  require=$require  files=$($resolved.Count)"
        foreach ($r in $resolved) { Write-Host "  $r" }

        "mode=$mode"                          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "require=$($require.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "count=$($resolved.Count)"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "list_path=$listPath"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "files_list<<__SIGN_EOF__"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($resolved -join "`n")                | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "__SIGN_EOF__"                        | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # -------------------------------------------------------------------
    # 2. Azure: OIDC exchange, then sign. No client secret exists anywhere;
    #    the calling job's `id-token: write` permission is what makes this
    #    work, and its absence is the single most common failure here.
    # -------------------------------------------------------------------
    # Both actions are pinned to full commit SHAs, not tags: between them
    # they are the closest thing to a signing key that exists in this
    # pipeline, and a moved tag would be a silent supply-chain swap.
    - name: Azure login (OIDC)
      if: steps.resolve.outputs.mode == 'azure'
      uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
      with:
        client-id:       ${{ inputs.azure-client-id }}
        tenant-id:       ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Sign with Azure Artifact Signing
      if: steps.resolve.outputs.mode == 'azure'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
      with:
        endpoint:                 ${{ inputs.endpoint }}
        signing-account-name:     ${{ inputs.signing-account-name }}
        certificate-profile-name: ${{ inputs.certificate-profile-name }}
        files:                    ${{ steps.resolve.outputs.files_list }}
        file-digest:              ${{ inputs.file-digest }}
        timestamp-rfc3161:        ${{ inputs.timestamp-rfc3161 }}
        timestamp-digest:         ${{ inputs.timestamp-digest }}
        description:              ${{ inputs.description }}
        description-url:          ${{ inputs.description-url }}
        batch-size:               ${{ inputs.batch-size }}
        timeout:                  ${{ inputs.timeout }}
        trace:                    ${{ inputs.trace }}

    # -------------------------------------------------------------------
    # 3. Local self-signed rehearsal. Imports into Root + TrustedPublisher
    #    so `verify: strict` genuinely runs -- same verification code as
    #    Azure mode, different key.
    # -------------------------------------------------------------------
    - name: Sign with the local test certificate
      if: steps.resolve.outputs.mode == 'local'
      shell: pwsh
      env:
        PFX_B64:     ${{ inputs.local-pfx-base64 }}
        PFX_PW:      ${{ inputs.local-pfx-password }}
        TRUST_STORE: ${{ inputs.local-trust-store }}
        TSA:         ${{ inputs.local-timestamp-url }}
        FILE_DIGEST: ${{ inputs.file-digest }}
        LIST_PATH:   ${{ steps.resolve.outputs.list_path }}
      run: |
        $ErrorActionPreference = 'Stop'

        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                    Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { Write-Host "::error::signtool.exe not found on this runner."; exit 1 }

        $pfxPath = Join-Path $env:RUNNER_TEMP 'sign-windows-local.pfx'
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))

        if ($env:TRUST_STORE -eq 'true') {
          # Only the PUBLIC certificate goes into Root/TrustedPublisher; the
          # private key stays in the PFX that signtool reads and that the
          # cleanup step deletes.
          $pfx = New-Object Security.Cryptography.X509Certificates.X509Certificate2 @($pfxPath, $env:PFX_PW, 'Exportable')
          $pub = New-Object Security.Cryptography.X509Certificates.X509Certificate2 @(,$pfx.Export('Cert'))
          foreach ($storeName in @('Root', 'TrustedPublisher')) {
            $store = New-Object Security.Cryptography.X509Certificates.X509Store @($storeName, 'LocalMachine')
            $store.Open('ReadWrite')
            $store.Add($pub)
            $store.Close()
            Write-Host "imported $($pub.Subject) into LocalMachine\$storeName"
          }
        }

        $files = Get-Content -LiteralPath $env:LIST_PATH
        $args = @('sign', '/f', $pfxPath, '/p', $env:PFX_PW, '/fd', $env:FILE_DIGEST)
        if ($env:TSA) { $args += @('/tr', $env:TSA, '/td', $env:FILE_DIGEST) }
        $args += $files

        & $signtool.FullName @args
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::local signtool sign failed ($LASTEXITCODE)"; exit 1 }

    # -------------------------------------------------------------------
    # 4. Verify. This is the authority on signedness -- not a filename, not
    #    the presence of a secret.
    # -------------------------------------------------------------------
    - name: Verify signatures
      id: verify
      if: steps.resolve.outputs.mode != 'none' && inputs.verify != 'off'
      shell: pwsh
      env:
        LIST_PATH:      ${{ steps.resolve.outputs.list_path }}
        VERIFY_MODE:    ${{ inputs.verify }}
        REQUIRE_TS:     ${{ inputs.require-timestamp }}
        EXPECT_SUBJECT: ${{ inputs.expect-subject-contains }}
        SIGN_MODE:      ${{ steps.resolve.outputs.mode }}
      run: |
        $ErrorActionPreference = 'Stop'

        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                    Sort-Object FullName -Descending | Select-Object -First 1

        $files    = Get-Content -LiteralPath $env:LIST_PATH
        $problems = New-Object System.Collections.Generic.List[string]
        $subject  = ''

        foreach ($f in $files) {
          $name = Split-Path -Leaf $f
          $sig  = Get-AuthenticodeSignature -LiteralPath $f

          if ($sig.Status -eq 'NotSigned') { $problems.Add("$name is NOT SIGNED"); continue }

          $certSubject = $sig.SignerCertificate.Subject
          $cn = if ($certSubject -match 'CN=([^,]+)') { $Matches[1].Trim() } else { $certSubject }
          if (-not $subject) { $subject = $certSubject }

          if ($env:VERIFY_MODE -eq 'strict') {
            # /pa = Authenticode policy (what Windows itself applies to an
            # EXE/MSI); /all = every signature, not just the first.
            & $signtool.FullName verify /pa /all /q $f 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $problems.Add("$name failed 'signtool verify /pa /all' (status=$($sig.Status))")
              continue
            }
          } elseif ($sig.Status -ne 'Valid' -and $sig.Status -ne 'UnknownError') {
            $problems.Add("$name signature status = $($sig.Status)")
            continue
          }

          if ($env:REQUIRE_TS -eq 'true' -and -not $sig.TimeStamperCertificate) {
            $problems.Add("$name has NO RFC3161 timestamp -- the signature expires with the certificate")
            continue
          }

          if ($env:EXPECT_SUBJECT -and $cn -notlike "*$($env:EXPECT_SUBJECT)*") {
            $problems.Add("$name signer CN '$cn' does not contain '$($env:EXPECT_SUBJECT)'")
            continue
          }

          $ts = if ($sig.TimeStamperCertificate) { 'timestamped' } else { 'no timestamp' }
          Write-Host "  OK  $name  [$cn, $ts]"
        }

        if ($problems.Count -gt 0) {
          foreach ($p in $problems) { Write-Host "::error::sign-windows verify: $p" }
          "verified=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "subject="       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 1
        }

        "verified=true"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "subject=$subject"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # -------------------------------------------------------------------
    # 5. Never leave a private key on the runner, even on a failed run.
    # -------------------------------------------------------------------
    - name: Remove local key material
      if: always()
      shell: pwsh
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP 'sign-windows-local.pfx'
        if (Test-Path $pfx) {
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          Write-Host 'removed the staged test PFX'
        }

    # -------------------------------------------------------------------
    # 6. Report + enforce.
    # -------------------------------------------------------------------
    - name: Report
      id: report
      if: always()
      shell: pwsh
      env:
        MODE:     ${{ steps.resolve.outputs.mode }}
        REQUIRE:  ${{ steps.resolve.outputs.require }}
        COUNT:    ${{ steps.resolve.outputs.count }}
        VERIFIED: ${{ steps.verify.outputs.verified }}
        SUBJECT:  ${{ steps.verify.outputs.subject }}
        VERIFY_MODE: ${{ inputs.verify }}
      run: |
        $ErrorActionPreference = 'Stop'

        $signed = ($env:MODE -ne 'none') -and ($env:VERIFIED -eq 'true' -or $env:VERIFY_MODE -eq 'off')
        $cn = if ($env:SUBJECT -match 'CN=([^,]+)') { $Matches[1].Trim() } else { $env:SUBJECT }

        "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "subject=$($env:SUBJECT)"                | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        $line = if ($signed) {
          "signed + verified -- $($env:COUNT) file(s), mode=$($env:MODE), publisher=$cn"
        } else {
          "**UNSIGNED** -- $($env:COUNT) file(s), mode=$($env:MODE)"
        }
        "* sign-windows: $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        Write-Host $line

        if (-not $signed) {
          if ($env:REQUIRE -eq 'true') {
            Write-Host "::error::Windows artifacts are UNSIGNED and signing is REQUIRED for this run (release tag, or require_signing=true). Configure Azure Artifact Signing (scripts/signing/) or dispatch with signing_mode=local."
            exit 1
          }
          Write-Host "::warning::Windows artifacts are UNSIGNED (mode=$($env:MODE)). SmartScreen will show 'Unknown publisher' and corporate AV may quarantine them."
        }
