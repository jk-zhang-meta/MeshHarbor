name: ci-linux-system-deps
description: >-
  The Linux system packages every Rust lane of ci.yml builds against: the
  GTK/WebKit set (workspace clippy, the tray and wizard crates) and the
  libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture, audio,
  bindgen), installed through cache-apt-pkgs-action with the guards that
  catch its silent-empty-restore failure mode. These steps were inline in
  the single "Rust checks" job until FR-6 wave 14 (#773) split it into five
  parallel lanes; one definition here keeps the lanes' environments
  identical, so a package added once reaches every lane, and the apt cache
  keys (`ci-gtk-v3`, `ci-vpx-v3`) stay the same across lanes, so every lane
  restores the same apt entries. The comments below are the original
  ones, moved here unchanged. Since FR-6 wave 17 the profiles job uses it
  too, for the SFU worker's cmake + libclang, instead of a raw apt-get
  against the mirror.
runs:
  using: composite
  steps:
      # Belt for the cold path of the cached-apt steps below: apt retries
      # transient mirror failures instead of stalling into the job timeout.
      #
      # The `apt-get update` is what keeps the cached-apt steps from poisoning
      # their own cache keys, and it is why it must run BEFORE them. The runner
      # image ships a stale apt index; cache-apt-pkgs-action resolves pinned
      # versions from it, the mirror has already superseded them, every fetch
      # 404s — and the action then logs `Caching 0 installed packages`,
      # **saves the empty set under the key** and exits `success`. Every later
      # run is a cache HIT on nothing. That is how `ci-gtk-v1` died, and then
      # `ci-gtk-v2` was poisoned AT BIRTH by the same mechanism minutes later,
      # so the key bump alone did not take.
      #
      # ⚠️ A fresh key is NOT a fix by itself — only an index the action can
      # resolve against is. The guards below are the safety net and the metric,
      # not the cure: their `did not deliver` warning must be ABSENT on a
      # healthy cache.
      #
      # ⚠️ But a guard's alarm is a metric only once it has stayed SILENT on a
      # known-good input. The libvpx guard fired on every green run from 09-06
      # to 09-24 against caches that were full the whole time, because
      # `ldconfig -p` reads /etc/ld.so.cache rather than the disk (#1604) — 17
      # days of warnings that described the detector, not the cache.
      - name: Configure apt retries and refresh the index
        shell: bash
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          sudo apt-get update -qq

      # rc.18 added a Tauri-tray companion (agents/meshharbor-tray) that
      # pulls in glib-sys / gobject-sys on Linux. Workspace clippy walks
      # every crate, so the build needs libglib2.0-dev + libgtk-3-dev
      # available even before the vp9-444 / scrap apt step further down.
      # Cached via cache-apt-pkgs-action: on a cache hit the packages
      # restore from the Actions cache in seconds with ZERO mirror
      # contact — the 2026-08-18 mirror-stall class (25m47s for this one
      # step, run 32191779671) can only ever bite the first run after
      # the package list or runner image changes.
      - name: Install system deps for workspace clippy (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev pkg-config
          # v1 -> v2 on 2026-09-23 to abandon a POISONED cache entry: the run
          # below saved an EMPTY set under the v1 key, so every later run got a
          # cache *hit* on nothing and failed without even the 404s to explain
          # it. A cache key is the only way to disown a bad entry.
          #
          # v2 -> v3 the same evening, because v2 was poisoned AT BIRTH: its
          # very first run missed the fresh key, 404'd on 11 packages against
          # the image's stale index, and saved EMPTY again. The bump only works
          # now that the step above refreshes the index first — that ordering,
          # not the number, is what makes v3 able to hold a real set.
          # Verification: the first run must log `Caching N installed packages`
          # with N > 0 and NO `did not deliver` warning; the next must hit with
          # no warning either.
          version: ci-gtk-v3

      # 2026-09-23: this lane broke on master and every PR, and the shape is the
      # one this file already documents twice below — the action installs
      # NOTHING and reports success. Here the action resolved pinned versions
      # from the runner image's apt index, the mirror had already superseded
      # every one of them, and all 16 fetches 404'd:
      #
      #   E: Failed to fetch …/libglib2.0-dev_2.80.0-6ubuntu3.8_amd64.deb  404
      #   E: Unable to fetch some archives…
      #   Caching 0 installed packages... done
      #   Skipped all manifest write. No packages to install.
      #   ##[end-action …;outcome=success;conclusion=success]
      #
      # clippy then died on `glib-2.0.pc` with the 404s 400 lines upstream. The
      # guard is the same one the vp9-444 and ffmpeg lanes already carry, and it
      # was simply never added here — ask pkg-config, which is what the build
      # actually consults, never the action's status. `apt-get update` first:
      # the stale index IS the root cause, so a fallback that skipped it would
      # re-resolve the same missing versions.
      - name: Verify the GTK set really landed (fallback to apt-get)
        shell: bash
        run: |
          if ! pkg-config --exists glib-2.0 webkit2gtk-4.1; then
            echo "::warning::cached apt set did not deliver the GTK dev packages — installing directly"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev pkg-config
          fi
          for m in glib-2.0 gtk+-3.0 webkit2gtk-4.1; do
            pkg-config --exists "$m" || { echo "::error::$m still not found by pkg-config after the fallback install"; exit 1; }
          done

      # Phase Y feature gate. The `vp9-444` feature compiles libvpx
      # via `env-libvpx-sys` (needs pkg-config + libvpx system lib),
      # plus `dcv-color-primitives`. Default workspace clippy never
      # exercises this path because the feature is opt-in. Catch
      # breakage here so the standard release lane (which is still
      # `--features full`, no vp9-444 yet) doesn't ship a regression
      # latent under the feature flag — and so the `bun run e2e`
      # VP9-444 spec doesn't drift away from the agent it's testing.
      - name: Install libvpx (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # libasound2-dev is for the `audio` half of `full` in the capture
          # clippy lane below — without it alsa-sys fails its build script and
          # the lane dies before linting anything. Bump `version:` whenever
          # this list changes, or the action serves the previously cached set.
          packages: libvpx-dev pkg-config libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev libasound2-dev
          # v2 -> v3 on 2026-09-23 (#1593) on a premise that turned out WRONG
          # (corrected 2026-09-24): the v2 entry was never empty — its restores
          # delivered libvpx (`Restoring 18 packages from cache… libvpx9=…tar
          # restoring…`). The `did not deliver libvpx` warning that fired on
          # every run was the guard below misreading a stale /etc/ld.so.cache
          # (see its comment). The bump was harmless and not needed; only the
          # 09-04 entry was truly empty (manifest missing ⇒ exit 127 at load).
          version: ci-vpx-v3
      # 2026-09-04: the cache action restored NOTHING (its own manifest was
      # missing: `cat: …/cache-apt-pkgs/manifest_all.log: No such file`) and
      # did not fail the job — the vp9-444 test binary then died at LOAD with
      # `libvpx.so.9: cannot open shared object file` (exit 127) on master
      # and on every PR of that hour. The action's silence is the hazard, so
      # the lane verifies the runtime lib is really there and installs the
      # set directly when it is not. The check is the loader's own view
      # (`ldconfig -p`), not the action's status.
      #
      # ⚠️ `ldconfig -p` prints /etc/ld.so.cache, NOT the filesystem, and the
      # cache action restores a package by untarring its files — it never runs
      # the postinst that refreshes that cache. So on every cache HIT, from
      # 09-06 to 09-24, this check saw no libvpx right after `libvpx9=…tar
      # restoring…` and "fell back" to a full apt install, warning that the
      # cache "did not deliver" when it had. `sudo ldconfig` first makes the
      # cache match the disk, so the warning now means what it says.
      - name: Verify libvpx really landed (fallback to apt-get)
        shell: bash
        run: |
          sudo ldconfig
          if ! ldconfig -p | grep -q 'libvpx\.so'; then
            echo "::warning::cached apt set did not deliver libvpx — installing directly"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libvpx-dev pkg-config libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev libasound2-dev
          fi
          ldconfig -p | grep 'libvpx\.so' || { echo "::error::libvpx.so still not loadable after the fallback install"; exit 1; }
