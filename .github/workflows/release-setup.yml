name: Release meshharbor-setup

# Builds the unified `meshharbor-setup` Tauri 2 wizard for the
# desktop targets the operator might run on:
#   - Linux x86_64 (gtk + webkit2gtk) — packaged as `.tar.gz`
#   - Linux aarch64 (the same, built on the arm64 runner; FR-97 P7b) — `.tar.gz`
#   - macOS universal (x86_64 + aarch64 lipo'd) — packaged as `.tar.gz`
#   - Windows x86_64 (msvc + webview2 auto-bootstrap) — SIGNED EXE in a `.zip`
#
# The unified wizard superseded the two legacy wizard EXEs, retired
# RETIRED-NAME-ANCHOR(3): names the two wizards RETIRED in P4c-2. A history line has to
# name what existed.
# in P4c-2 (meshharbor-installer = agent/daemon, meshharbor-tunnel-installer
# = tunnel CLI). On Windows it offers all roles (daemon perMachine-SCM
# / perUser-task / perMachine + tunnel-client); on Linux/macOS only
# the tunnel-client role is functional (the daemon roles are MSI-only).
#
# Tag schema: `setup-v<workspace_version>` — a tag family of its own
# (separate from agent-v* / tunnel-v*), but since FR-84 S1 it moves in
# LOCKSTEP with the agent: release-agent.yml's `dispatch-setup-release`
# job tags `setup-v<V>` at the agent-v<V> commit and dispatches this
# workflow on it, so `/api/setup` never serves a wizard older than the
# daemon it installs (it served 0.4.48 while the agent stood at 0.4.102).
# Workspace Cargo.toml version is the source of truth (validate-version
# enforces it). The api's `/api/setup/<platform>` proxy
# (routes/setup_release.rs) serves the published assets via its 1h cache;
# `pick_setup_asset` requires the exact `meshharbor-setup-<v>-<triple>.<ext>`
# names produced below (windows→.zip, linux→.tar.gz, macos→.tar.gz).
#
# Windows signing is REQUIRED (the wizard downloads MSIs + invokes
# msiexec — corporate ESET/Defender quarantine an unsigned downloader
# as a "downloader trojan"; rc.28 BLOCKER-10). It runs through
# ./.github/actions/sign-windows (Azure Artifact Signing over OIDC; the
# signing job carries `environment: release` — the federated credential
# is bound to that GitHub environment) and HARD-FAILS on a release tag.
# A credential-less dispatch run still succeeds with a ::warning:: so
# packaging can be iterated. macOS ships a signed + notarised + STAPLED
# `MeshHarbor Setup.app` inside the tarball (same asset name — the wizard
# is the one binary users double-click from Finder, so it gets full
# offline Gatekeeper validation). See docs/code-signing.md.
#
# Triggered by:
#  - `git push` of a tag matching `setup-v*` → publishes a GitHub Release.
#  - `workflow_dispatch` with `version` + `publish_release` → artifacts
#    only (30-day retention) unless `publish_release=true`. This is also
#    how the lockstep job runs it: a tag pushed with GITHUB_TOKEN triggers
#    nothing, so release-agent.yml dispatches on `--ref setup-v<V>`
#    (ref_type == tag; validate-version asserts the ref carries the
#    version it was handed). A manual re-run after a failure has the same
#    shape — the tag already exists at the agent commit:
#      gh workflow run release-setup.yml --ref setup-v<V> -f version=<V> -f publish_release=true
#    ⚠️ A run on a tag executes THIS FILE AS IT STOOD AT THAT TAG. A tag whose
#    copy predates the #2013 fix (setup-v0.4.128 and older) still sends
#    target_commitish, so it cannot publish once master's workflow files have
#    changed since. Release the next version instead.
#
# A release is EVERY platform or none (since FR-97 P7b, Linux aarch64 too).
# The `skip_macos` escape that
# let Linux + Windows ship while the Apple enrolment was pending (FR-7)
# is gone: Apple signing is live (repo-level secrets since 2026-09-08;
# agent-v0.4.102's .pkg job signed and notarised with them), and a wizard
# release that quietly lacked macOS is exactly what left /api/setup/macos
# answering 404 for three weeks.

on:
  push:
    tags:
      - 'setup-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Setup wizard version (e.g. 0.3.0-rc.196) — must match workspace Cargo.toml'
        required: true
      publish_release:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
      signing_mode:
        description: 'Windows signing: auto (azure if configured) | azure | local (self-signed rehearsal) | off'
        type: choice
        options: [auto, local, azure, 'off']
        default: auto
      require_signing:
        description: 'Fail the job if artifacts end up unsigned (rehearses the release-tag gate)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 0. Validate version matches Cargo.toml
  # ---------------------------------------------------------------------------
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      commit: ${{ steps.resolve.outputs.commit }}
      target_commitish: ${{ steps.resolve.outputs.target_commitish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + tag
        id: resolve
        shell: bash
        # Dispatch inputs reach the script through the environment, never via
        # `${{ }}` interpolation into the shell — interpolation pastes the raw
        # value into the script text, so it would EXECUTE. See release-agent.yml.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#setup-v}"
            is_release=true
          else
            version="${INPUT_VERSION:-}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::Invalid version input: '${version}' (expected N.N.N or N.N.N-rc.N)"
              exit 1
            fi
            tag="setup-v${version}"
            if [[ "${INPUT_PUBLISH_RELEASE:-}" == "true" ]]; then
              is_release=true
            else
              is_release=false
            fi
            # FR-84 S1: a dispatch ON A TAG (the lockstep job's shape) must
            # name the version that tag carries — `--ref setup-v0.4.101
            # -f version=0.4.102` would build 0.4.101's tree and call it
            # 0.4.102. The Cargo.toml check below would trip on most of
            # that too; this one names the actual mistake.
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::dispatched on tag '${GITHUB_REF_NAME}' with version '${version}' (= ${tag}) — dispatch on the tag that carries the version"
              exit 1
            fi
          fi
          echo "Resolved: version=${version} tag=${tag} is_release=${is_release}"
          # The commit this run builds — the release's target_commitish.
          # Read from the checkout rather than GITHUB_SHA: on an ANNOTATED
          # tag GITHUB_SHA is the tag object, which is not a commitish.
          commit=$(git rev-parse 'HEAD^{commit}')
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          # #2013 — GitHub refuses a release, create OR update, whose
          # target_commitish adds or changes anything under .github/workflows
          # relative to the default branch: the call then needs the `workflows`
          # permission, which GITHUB_TOKEN can never have. It answers "Resource
          # not accessible by integration" although the job holds contents:
          # write. setup-v0.4.128 hit it: master changed one line of ci.yml 13
          # minutes after the tagged commit. Once the tag exists it pins the
          # commit, and target_commitish is only metadata — so send it ONLY when
          # this release must CREATE the tag (a branch dispatch with
          # publish_release=true).
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            target_commitish=""
            echo "${tag} exists: the release attaches to it, without a target_commitish (#2013)"
          else
            target_commitish="${commit}"
            echo "${tag} does not exist yet: the release creates it at ${commit}"
          fi
          echo "target_commitish=${target_commitish}" >> "$GITHUB_OUTPUT"
          cargo_version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml workspace version: ${cargo_version}"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: requested ${version} but Cargo.toml has ${cargo_version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Linux x86_64 — Tauri webkit2gtk needs apt-installed deps
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build wizard (Linux x86_64)
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-linux
          # Tag-ref cache saves can never be restored by a future tag run
          # (GH cache isolation: own ref or default branch only) — only
          # non-tag runs (dispatch rehearsals on master) save.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Install Tauri Linux system deps
        # webkit2gtk + libsoup + ayatana; librsvg2 for icon decode. Same
        # set as the legacy tunnel wizard (meshharbor-setup pulls the same
        # Tauri Linux runtime). meshharbord comes in with DEFAULT
        # features (signalling-only) — no vcpkg/FFmpeg/libvpx needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - name: Build wizard (release)
        run: cargo build -p meshharbor-setup --release
      - name: Strip binary
        run: strip target/release/meshharbor-setup
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-setup-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "/tmp/${name}"
          cp target/release/meshharbor-setup "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          sha256sum "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload Linux wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-linux-x86_64
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1b. Linux aarch64 (FR-97 P7b) — the same wizard, built on the arm64 runner
  # ---------------------------------------------------------------------------
  # On Linux the wizard installs the tunnel client, which it resolves by its
  # own build's platform (`linux-aarch64` here, asset_resolver.rs). The asset
  # name carries the aarch64 triple, which only `linux-aarch64` matches
  # (setup_release.rs), so an x86_64 download can never be handed this one.
  build-linux-arm64:
    name: Build wizard (Linux aarch64)
    needs: validate-version
    # 22.04: the oldest supported base sets the glibc floor (Debian 12 /
    # Raspberry Pi OS included); the companion's arm64 lane builds its
    # Tauri app on the same image.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-linux-arm64
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - name: Build wizard (release)
        run: cargo build -p meshharbor-setup --release
      - name: Strip binary
        run: strip target/release/meshharbor-setup
      - name: Smoke — the binary is aarch64 and links against this base
        # A GUI cannot open here, but a missing shared library or a wrong
        # architecture fails before it would; `ldd` names any library the
        # loader cannot find.
        shell: bash
        run: |
          set -euo pipefail
          readelf -h target/release/meshharbor-setup | grep -q 'Machine:.*AArch64'
          if ldd target/release/meshharbor-setup | grep 'not found'; then exit 1; fi
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-setup-${version}-aarch64-unknown-linux-gnu"
          mkdir -p "/tmp/${name}"
          cp target/release/meshharbor-setup "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          sha256sum "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload Linux aarch64 wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-linux-aarch64
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. macOS — universal binary (x86_64 + aarch64 lipo'd) + tarball
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build wizard (macOS universal)
    needs: validate-version
    # Not skippable (FR-84 S1): a wizard release is all three platforms or
    # none — `/api/setup/macos` 404'd for three weeks behind a release that
    # was allowed to ship without it. Apple signing is live (FR-7).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-macos
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build wizard x86_64
        run: cargo build -p meshharbor-setup --release --target x86_64-apple-darwin
      - name: Build wizard aarch64
        run: cargo build -p meshharbor-setup --release --target aarch64-apple-darwin
      - name: Lipo into universal
        run: |
          mkdir -p target/release-universal
          lipo -create -output target/release-universal/meshharbor-setup \
            target/x86_64-apple-darwin/release/meshharbor-setup \
            target/aarch64-apple-darwin/release/meshharbor-setup
          strip target/release-universal/meshharbor-setup
          file target/release-universal/meshharbor-setup

      # Wrap the universal binary in a .app BEFORE signing.
      #
      # This is the one MeshHarbor binary a user genuinely double-clicks from
      # Finder, i.e. the worst Gatekeeper case, and a bare Mach-O cannot carry
      # a stapled notarisation ticket (Apple only staples bundles/.dmg/.pkg).
      # A bundle can -- and the ticket lands as a regular file inside it, so
      # it survives the tar round-trip and the wizard validates even on an
      # offline Mac. A relative symlink keeps the documented `./meshharbor-setup`
      # invocation working, and the ARCHIVE NAME is unchanged so
      # `pick_setup_asset` (setup_release.rs) is untouched.
      - name: Stage .app bundle
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          APP="/tmp/stage/MeshHarbor Setup.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release-universal/meshharbor-setup "$APP/Contents/MacOS/meshharbor-setup"
          chmod 755 "$APP/Contents/MacOS/meshharbor-setup"
          # FR-84 S2: the bundle's icon (Finder, Dock, the Gatekeeper dialog),
          # staged BEFORE signing so it is inside the sealed contents — the
          # same PNG + CFBundleIconFile shape the companion .app uses in
          # release-agent.yml.
          cp agents/meshharbor-setup/icons/icon.png "$APP/Contents/Resources/icon.png"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>meshharbor-setup</string>
              <key>CFBundleIdentifier</key>          <string>fans.itachi.meshharbor.setup</string>
              <key>CFBundleName</key>                <string>MeshHarbor Setup</string>
              <key>CFBundleShortVersionString</key>  <string>${version}</string>
              <key>CFBundleVersion</key>             <string>${version}</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>CFBundleIconFile</key>            <string>icon.png</string>
              <key>LSMinimumSystemVersion</key>      <string>12.0</string>
              <key>NSPrincipalClass</key>            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Sign + notarise the wizard bundle
        uses: ./.github/actions/sign-macos
        with:
          bundle-path:          ${{ steps.app.outputs.path }}
          require:              ${{ needs.validate-version.outputs.is_release == 'true' }}
          app-p12-base64:       ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          cert-password:        ${{ secrets.APPLE_CERT_PASSWORD }}
          api-key-id:           ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id:        ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-p8-base64:    ${{ secrets.APPLE_API_KEY_P8_BASE64 }}

      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-setup-${version}-universal-apple-darwin"
          mkdir -p "/tmp/${name}"
          cp -R "/tmp/stage/MeshHarbor Setup.app" "/tmp/${name}/"
          # Keep `./meshharbor-setup` working (docs + muscle memory) while the
          # real, stapled code lives in the bundle.
          ln -s "MeshHarbor Setup.app/Contents/MacOS/meshharbor-setup" "/tmp/${name}/meshharbor-setup"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          # `tar` preserves the symlink and the stapled ticket; COPYFILE_DISABLE
          # stops bsdtar emitting ._ AppleDouble files alongside every entry.
          (cd /tmp && COPYFILE_DISABLE=1 tar czf "${name}.tar.gz" "${name}")
          shasum -a 256 "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # The whole point of the .app: prove the ticket survived tar/untar, so
      # the wizard validates offline. A bare-binary tarball cannot pass this.
      - name: Verify the stapled ticket survives a tar round-trip
        if: needs.validate-version.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/roundtrip && mkdir -p /tmp/roundtrip
          tar xzf "${{ steps.tar.outputs.artifact }}" -C /tmp/roundtrip
          app="$(find /tmp/roundtrip -maxdepth 3 -name '*.app' -type d | head -n1)"
          [ -n "$app" ] || { echo "::error::no .app found in the packed tarball"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/signing/stapler-retry.sh" validate "$app"
          spctl -a -vvv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt \
            || { echo "::error::extracted wizard is not Gatekeeper-clean"; exit 1; }
      - name: Upload macOS wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-macos-universal
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Windows x86_64 — SIGN the EXE, then zip it (pick_setup_asset wants .zip)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build wizard (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    # The signing federated credential is bound to this GitHub environment
    # (the tenant rejects wildcard tag subjects) — do not remove.
    environment: release
    permissions:
      contents: read
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: setup-windows
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build wizard (release)
        shell: pwsh
        # Static CRT: the wizard is a double-click EXE extracted from a
        # zip onto arbitrary fresh machines -- it must not assume the
        # MSVC runtime (vcruntime140*.dll) exists there (field report
        # 2026-07-28: loader dialog on a box without the VC++ redist).
        # The wizard graph is pure Rust (agent DEFAULT features, no
        # vcpkg /MD libs), so +crt-static is safe; link-verified
        # against the Tauri 2 stack.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p meshharbor-setup --release
      # Sign BEFORE zipping, so the EXE the operator extracts is the signed
      # one. This is the artifact rc.28 BLOCKER-10 was about: a downloader
      # that fetches MSIs and shells out to msiexec is exactly the shape
      # corporate ESET/Defender quarantine when it has no publisher.
      - name: Sign the wizard EXE
        id: sign
        uses: ./.github/actions/sign-windows
        with:
          files:                    target\release\meshharbor-setup.exe
          description:              'MeshHarbor Setup'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}
        env:
          WIN_CODESIGN_PFX_BASE64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
      - name: Pack zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ needs.validate-version.outputs.version }}"
          # Stable name (no -unsigned suffix): pick_setup_asset matches on
          # `contains(x86_64-pc-windows-msvc) && endsWith(.zip)`, and the
          # health endpoint returns whatever filename exists — a stable
          # name keeps the operator-facing URI deterministic. Signed-ness
          # is a property of the EXE inside, surfaced in the release notes.
          $name = "meshharbor-setup-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\$name" -Force | Out-Null
          Copy-Item target\release\meshharbor-setup.exe "$env:RUNNER_TEMP\$name\"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$env:RUNNER_TEMP\$name\" }
          if (Test-Path README.md) { Copy-Item README.md "$env:RUNNER_TEMP\$name\" }
          Compress-Archive -Path "$env:RUNNER_TEMP\$name\*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "artifact=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-windows-x86_64
          path: |
            ${{ steps.zip.outputs.artifact }}
            ${{ steps.zip.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [validate-version, build-linux, build-linux-arm64, build-macos, build-windows]
    # Plain `needs` semantics: every one of the three builds must have
    # SUCCEEDED, or nothing publishes. (The `always() || skipped` form that
    # let a skipped macOS build through went with the `skip_macos` input.)
    if: needs.validate-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore identity for the provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release/
      # GPG + provenance: same pattern as release-agent.yml -- .asc detached
      # signatures when the key is configured, SLSA provenance always.
      - name: GPG-sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured -- publishing without .asc signatures."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in release/*; do
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done
          gpg --batch --armor --export > release/meshharbor-release-pubkey.asc
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'
      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: meshharbor-setup ${{ needs.validate-version.outputs.version }}
          # FR-84 S1 pinned the release to the BUILT commit, so that a branch
          # dispatch with publish_release=true CREATES the tag there, and a
          # master that moved mid-run cannot tag the wrong commit. That pin is
          # now sent ONLY in that case (validate-version, #2013).
          # - With the tag already present, the tag pins the commit, and
          #   sending it 403s whenever master's workflow files differ from that
          #   commit's.
          # - Verify a lockstep roll by the TAG's commit
          #   (`git ls-remote origin refs/tags/setup-v<V>^{}`), not
          #   `targetCommitish`: a release created without it records `master`.
          # ⚠️ softprops always re-sends the EXISTING release's own value on an
          #   UPDATE. A release made before this fix recorded a SHA, and re-runs
          #   that update it 403 while master's workflow files differ. Delete
          #   that release (the tag stays) and re-run.
          target_commitish: ${{ needs.validate-version.outputs.target_commitish }}
          draft: false
          # prerelease:true for rc/alpha/beta — unlike the agent (whose
          # updater polls /releases/latest and so must be non-prerelease),
          # the `/api/setup` proxy filters by the `setup-v` prefix with a
          # prerelease fallback (setup_release.rs pick_release_for), so an
          # rc setup release is served fine while the repo's "Latest"
          # badge correctly stays on the agent release.
          prerelease: ${{ contains(needs.validate-version.outputs.version, 'rc.') || contains(needs.validate-version.outputs.version, 'alpha') || contains(needs.validate-version.outputs.version, 'beta') }}
          body: |
            Automated build of the unified `meshharbor-setup` wizard ${{ needs.validate-version.outputs.version }} via
            [release-setup.yml](.github/workflows/release-setup.yml).

            **Download / run:**
            - Windows x86_64: `.zip` containing a signed `meshharbor-setup.exe` — extract + double-click.
            - Linux x86_64: `.tar.gz` — extract, run `./meshharbor-setup`.
            - Linux aarch64: `.tar.gz` — extract, run `./meshharbor-setup`.
            - macOS universal (x86_64 + aarch64): `.tar.gz` — extract, then open `MeshHarbor Setup.app`
              (or run `./meshharbor-setup`, a symlink into the bundle). The app is Developer-ID-signed,
              notarised and stapled, so Gatekeeper accepts it even offline — no `xattr` workaround.

            **What the wizard does:** pick a role, detect existing installs, paste an enrollment token, and it
            resolves → downloads → verifies → installs → enrolls the node. On Windows the daemon roles
            (be-accessed: perMachine-SCM / perUser / perMachine + SystemContext) run the agent MSI (which
            carries the `meshharbor` CLI); every OS offers the tunnel-client role (reach-others). A terminal
            equivalent is served at `meshharbor.itachi.fans/api/setup/install.sh` (Linux/macOS) and
            `meshharbor.itachi.fans/api/setup/install.ps1` (Windows).
          files: release/*

  # ---------------------------------------------------------------------------
  # Bust the meshharbor.itachi.fans release cache — see the long-form rationale in
  # release-agent.yml. `/api/{agent,tunnel,setup}/latest-release` share ONE
  # per-pod cache, so every release family needs this step; one POST busts
  # every pod (the receiving pod fans out over the C-1 control bus).
  # Non-blocking: the 15-minute cache TTL is the backstop.
  # ---------------------------------------------------------------------------
  refresh-release-cache:
    name: Refresh meshharbor.itachi.fans release cache
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/releases/refresh
        env:
          TOKEN: ${{ secrets.MESHHARBOR_RELEASE_REFRESH_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice::MESHHARBOR_RELEASE_REFRESH_TOKEN unset (fork?); skipping cache refresh"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 90 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://meshharbor.itachi.fans/api/releases/refresh?expect_tag=${TAG}")
            if [ "$(jq -r '.all_ok' <<<"$body" 2>/dev/null)" = "true" ]; then
              jq . <<<"$body"
              echo "Release cache refreshed on every live pod for ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 10
          done
          echo "::warning::release cache refresh did not confirm on every pod for ${TAG}; the cache TTL will heal it within 15 min"

  # ---------------------------------------------------------------------------
  # Release-failure alert (FR-84 S1). This lane runs UNATTENDED now —
  # release-agent.yml dispatches it and moves on — so a failure here has
  # nobody watching: the agent release is green, the fleet updates, and
  # /api/setup quietly keeps serving the previous wizard (the exact state
  # FR-84 found: 0.4.48 served for 54 agent releases, macOS 404). Same
  # open-once / close-on-recovery shape as release-agent.yml's seed alert,
  # keyed on RELEASE runs only — a tag push, or a dispatch with
  # publish_release=true; artifacts-only rehearsals are already loud to
  # whoever dispatched them.
  #
  # Decided from the EVENT, not from validate-version's outputs: when
  # validate-version itself fails (the ref/version mismatch above, or a
  # Cargo.toml drift) its outputs are empty, and an output-keyed alert would
  # stay silent on the one failure that needs a human most.
  # ---------------------------------------------------------------------------
  release-failure-alert:
    name: Alert on a failed wizard release
    if: >-
      always() &&
      (github.event_name == 'push' || github.event.inputs.publish_release == 'true') &&
      (needs.validate-version.result == 'failure' ||
       needs.build-linux.result == 'failure' ||
       needs.build-linux-arm64.result == 'failure' ||
       needs.build-macos.result == 'failure' ||
       needs.build-windows.result == 'failure' ||
       needs.publish-release.result == 'failure')
    # Every build job, by name: a failed build SKIPS publish-release rather
    # than failing it, so a build left off this list withholds the release
    # in silence.
    needs: [validate-version, build-linux, build-linux-arm64, build-macos, build-windows, publish-release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # One issue per CONDITION (reused while it holds, closed by the next
      # green release), so an open one always means "currently broken" —
      # the lesson of the ten stale seed alerts of 2026-08-30. `--search`
      # is `in:title` against the fixed prefix, which is why the date sits
      # at the END of the title.
      - name: File or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="setup-v${INPUT_VERSION:-?}"
          fi
          version="${tag#setup-v}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "meshharbor-setup release failed"' --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "reusing open alert #$existing"
            gh issue comment "$existing" --repo "${{ github.repository }}" \
              --body "$(printf 'Failed again on %s (%s): %s\n\nStill unresolved — /api/setup still serves the previous wizard. This issue closes automatically when a wizard release succeeds.\n' "$(date -u +%F)" "$tag" "$run_url")"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "meshharbor-setup release failed — /api/setup serves a stale wizard ($(date -u +%F))" \
              --body "$(printf 'The meshharbor-setup wizard release for `%s` (ref `%s`) failed: %s\n\n`/api/setup/{windows,linux,macos}` keep serving the PREVIOUS `setup-v*` release until one exists for this version — the landing page download and the admin UI both go through it, so every new install gets a wizard older than the daemon it installs (FR-84 S1 is what makes this lane run in lockstep with the agent).\n\nRe-run once fixed (the tag already exists at the agent commit; the run is idempotent):\n\n    gh workflow run release-setup.yml --ref %s -f version=%s -f publish_release=true\n\nNever re-cut a wizard under a number that already shipped — bump the version and release again.\n\nThis issue is reused by later failures and CLOSED automatically by the next successful wizard release, so an open one always means "currently broken".\n' "$tag" "$REF_NAME" "$run_url" "$tag" "$version")"
          fi

  # ---------------------------------------------------------------------------
  # Wizard release RECOVERED — close the alert, so the alert above is not
  # write-only (an alert nobody can close is one nobody reads). Plain
  # `needs` semantics: this runs only when publish-release succeeded.
  # ---------------------------------------------------------------------------
  release-recovery-close:
    name: Close the wizard-release alert on a green release
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open wizard-release alert
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          nums=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "meshharbor-setup release failed"' --limit 50 --json number --jq '.[].number')
          if [ -z "$nums" ]; then
            echo "no open wizard-release alert — nothing to close"
            exit 0
          fi
          for n in $nums; do
            echo "closing #$n"
            gh issue close "$n" --repo "${{ github.repository }}" --reason completed \
              --comment "$(printf '%s published on %s: %s\n\n/api/setup serves the current wizard again, so the condition this issue reports no longer holds. Closed automatically; a later failure opens a new issue.\n' "$TAG" "$(date -u +%F)" "$run_url")"
          done
