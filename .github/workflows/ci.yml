name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# FR-6 wave 14 (#773): compile faster, cache smaller. Line tables keep
# file:line in a failing test's backtrace; what this drops is the full
# type/variable DWARF, which is most of what every test binary links and
# most of what each cargo cache family stores (the single `ci-linux` family
# had reached 4.1 GB against a 10 GB pool shared by every job below).
# Debug ASSERTIONS are a separate profile setting and stay on.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a PR supersedes its previous run: cancel that run instead of
# letting a stack of stale ones hold the account's concurrent-job slots (one
# run of this file is 17 jobs). A RUNNING master run is never cancelled: it
# verifies a merged commit, and it is the only kind of run that SAVES the
# cargo caches (see the Rust lanes below).
#
# FR-6 wave 25 (#773): master's runs share one group, so GitHub keeps at most
# one running and one WAITING. A newer push cancels the waiting run, which
# verified nothing yet, and the newest commit's run covers it. The group used
# to be per commit, so a burst of merges queued a full run each: on
# 2026-10-20 ten squash-merges queued ten runs (170 jobs) against the
# account's 20 concurrent slots, until a session cancelled its own superseded
# runs by hand. PR jobs waited 20-64 min for a slot on 10-19 and 10-20.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── The Rust lanes (FR-6 wave 14, #773, 2026-09-27) ──────────────────────
  #
  # These five jobs were ONE job, "Rust checks", until it grew to ~35 serial
  # steps: 18–21 min on a WARM cache and 35–45 min cold, over 58 runs. Test
  # EXECUTION was ~3.5 min of that. The rest was compiling workspace crates
  # one feature configuration after another — `roomlerd` alone in ~12 of
  # them, 40–80 s each — which no cargo cache helps: Swatinem caches the
  # third-party deps, never the workspace. Split five ways, the same work
  # runs in parallel. The aggregate job `rust` after the lanes keeps the name
  # "Rust checks", so anything keyed on that name still works.
  #
  # Every lane:
  #   * installs the SAME system packages through one composite
  #     (./.github/actions/ci-linux-system-deps), so no step can pass or fail
  #     by which lane it landed in;
  #   * has its own cargo cache family (`ci-<lane>`), holding exactly the
  #     deps its own feature sets compile;
  #   * SAVES that cache only from a master push. A cache saved on
  #     `refs/pull/N/merge` can be restored only by later runs of that same
  #     PR, yet every PR run wrote ~9–10 GB across the jobs of this file. On
  #     2026-09-27 the pool held 13.1 of its 15.0 GB on PR refs and LRU had
  #     evicted master's `ci-linux`, the one entry every PR restores from:
  #     the key run 36331413828 restored with a full match at 15:58 returned
  #     `No cache found` at 18:15 (run 36339984289, 36.8 min). PR runs now
  #     restore master's caches read-only.
  rust-lint:
    name: Rust lint (fmt, clippy)
    # History of the single "Rust checks" job these lanes replaced (its
    # cache-key premise is corrected at the end):
    #
    # FR-69 P5b — 30 minutes, not 20: the job builds clippy for the whole
    # workspace plus the unit tests of five audited crates, and since the
    # module crates arrived (P2–P5a) a COLD-cache run — every rerun is one,
    # a cancelled attempt saves no cache — takes ~20 min 18 s on the 2-core
    # runner. The P5b rerun was cancelled by this ceiling at 20:18 with
    # every step green; warm runs finish in ~10.
    #
    # ⚠️ Why this ceiling keeps rising, and why re-running never fixes it: the
    # Rust cache key below is `hashFiles(ci.yml)`, so ANY edit to this file
    # rotates it and guarantees the very next run is cold — and a cancelled
    # attempt saves no cache, so the retry is cold again. A PR that touches CI
    # therefore pays the cold time twice over and cannot converge by retrying.
    # Measured on 2026-09-04 under the then-30-minute ceiling: cancelled at
    # 31 min 29 s in `Test tunnel-core --features overlay-l3,overlay-netstack`
    # with every prior step green.
    #
    # ⚠️ Correction (2026-09-28): the premise above is wrong. rust-cache
    # ignores `key` when `shared-key` is set, so an edit to this file never
    # rotated the key, and those cold runs had another cause. The cache step
    # below says what does rotate it, and what starts a lane cold.
    #
    # Wave 14: every lane runs well under 10 min warm; 30 leaves a cold lane
    # (after an eviction, a toolchain bump or a new cache family) room to
    # finish without letting a hung step idle for most of an hour.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Warm baseline is 4-5 min; the only step that can blow past it is an
    # Ubuntu-mirror stall inside apt (2026-08-18 evening: 14/19/20/29-min
    # runs, run 32191779671's apt step alone took 25m47s). The apt-package
    # caches below take the mirror out of the hot path; this timeout turns
    # any residual pathological stall into a fast, loud, retryable failure
    # instead of a silent half-hour merge blocker.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to the version in rust-toolchain.toml so local dev
        # and CI reject the same lints. Bump both in one commit
        # when upgrading.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        # Swatinem prunes workspace-member artifacts + stale registry
        # entries before saving — ~1–1.5 GB instead of the ~4 GB
        # actions/cache tars (full ~/.cargo + target) this step used to
        # write per Cargo.lock hash. Two of those were standing at once,
        # blowing the repo's 10 GB Actions-cache budget and LRU-evicting
        # the release lane's caches (agent-v0.3.0-rc.176 rebuilt FFmpeg
        # from source for 29 min because of it).
        #
        # FR-6 wave 14: one family per lane, and only a master push saves
        # (`save-if`). The note above this lane says why.
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # ⚠️ What rotates this key (corrected 2026-09-28, FR-6 #773). It is
          # `v0-rust-<shared-key>-<os>-<arch>-<env hash>-<lockfile hash>`:
          #   * the lockfile hash moves when a member crate's Cargo.toml
          #     changes (a dependency, a feature), when Cargo.lock's
          #     third-party entries change, or with rust-toolchain.toml or a
          #     .cargo/config.toml. A version bump does NOT move it:
          #     rust-cache blanks member versions and skips the workspace's
          #     own Cargo.lock entries. On master on 09-27/28, four bumps
          #     (0.4.108 → 0.4.113) kept one key, while three member-manifest
          #     edits each rotated it (#1741 and #1752 added a dependency,
          #     #1744 changed a feature);
          #   * the env hash moves on the rustc version or any CARGO*, RUST*,
          #     CC*, CFLAGS*, CXX* or CMAKE* env var (the job's environment,
          #     not the workflow file's text). The rustc version is that of
          #     EVERY installed toolchain, the runner image's own `stable`
          #     included, so the salt step removes all but the pinned one
          #     (wave 23): an image rollout that moved it made each family
          #     flip between two keys, and every flip built cold.
          # A new lockfile hash restores the newest older generation (the
          # prefix match) and compiles only the delta. A new env hash,
          # shared-key or prefix-key starts the lane cold.
          # A `key:` input used to sit here with `hashFiles(ci.yml)`, claiming
          # an edit to this file rotated the key. rust-cache reads `key` only
          # when `shared-key` is unset (its src/config.ts, v2.9.2), so it was
          # ignored: #1728, #1735 (+95 lines) and #1736 each edited this file
          # on 09-27, and each master run restored the same key with a full
          # match and saved nothing, so a new step's dependency builds stayed
          # out of the cache. Since wave 16 the salt step above does what that
          # input claimed, per job and without going cold: it writes one of
          # the `.cargo/config.toml` files the lockfile hash covers, holding a
          # hash of this job's own definition. A changed or added step here
          # rotates this key; a comment edit or another job's edit does not.

      - name: Check formatting
        run: cargo fmt --check --all

      # The companion's icons shipped as 1x1 PLACEHOLDERS for its whole life.
      # Windows tolerated them; macOS aborts the process before the app starts —
      # `tao`'s tray setup panics on "dimensions don't match the number of
      # pixels supplied", inside a callback that cannot unwind. So the one
      # platform where the companion is the only thing telling you a permission
      # is missing was the one platform it could not run on.
      #
      # Cheap, and it fails on the commit that reintroduces a stub rather than
      # on someone's Mac. Regenerate with scripts/gen-tray-icons.py.
      #
      # FR-84 S2 extended it to the SETUP WIZARD's icons, which were the same
      # 1x1 placeholders for the wizard's whole life (its build.rs writes them
      # when the files are missing, so nothing ever failed): the one EXE a new
      # user double-clicks showed a blank icon. The .ico is what reaches the
      # EXE resource (tauri-build takes the first .ico in bundle.icon), so it
      # is checked structurally: an icon SET (≥ 5 entries, one of them 256 px,
      # which the format stores as a width byte of 0) rather than a stub.
      - name: Assert the icons are real
        run: |
          python3 - <<'PY'
          import sys, struct, pathlib

          bad = []

          def check_png(p, min_px):
              raw = p.read_bytes()
              if raw[:8] != b"\x89PNG\r\n\x1a\n":
                  bad.append(f"{p}: not a PNG"); return
              # IHDR is always the first chunk: width/height at bytes 16..24.
              w, h = struct.unpack(">II", raw[16:24])
              if min(w, h) < min_px:
                  bad.append(f"{p}: {w}x{h} — a placeholder, not an icon (need >= {min_px} px)")

          def check_ico(p):
              raw = p.read_bytes()
              # ICONDIR: reserved u16 (0), type u16 (1 = icon), count u16; then
              # 16-byte ICONDIRENTRYs whose first byte is the width (0 == 256).
              if len(raw) < 6 or struct.unpack("<HH", raw[:4]) != (0, 1):
                  bad.append(f"{p}: not an ICO"); return
              count = struct.unpack("<H", raw[4:6])[0]
              widths = [raw[6 + 16 * i] for i in range(count) if 6 + 16 * i < len(raw)]
              if count < 5:
                  bad.append(f"{p}: {count} entries — a placeholder, not an icon set (need >= 5)")
              if 0 not in widths:
                  bad.append(f"{p}: no 256 px entry (widths {widths})")
              if len(raw) <= 4096:
                  bad.append(f"{p}: {len(raw)} bytes — a placeholder, not an icon set (need > 4 KiB)")

          desktop = pathlib.Path("agents/roomler-desktop/icons")
          check_png(desktop / "tray.png", 16)
          # FR-85 — the tray while a recording runs (tray.rs swaps it in).
          check_png(desktop / "tray-recording.png", 16)
          check_png(desktop / "icon.png", 128)
          check_ico(desktop / "icon.ico")

          setup = pathlib.Path("agents/roomler-setup/icons")
          check_png(setup / "icon.png", 128)
          check_ico(setup / "icon.ico")

          if bad:
              print("::error::" + "; ".join(bad))
              print("regenerate with: python3 scripts/gen-tray-icons.py [--target setup]")
              sys.exit(1)
          print("  companion + wizard icons OK")
          PY

      # P5 (invariant I5) — the vendored webrtc-ice must equal pristine
      # upstream + the ONE canonical patch. An edit to the fork without a
      # matching `--regen` of the patch fails here, so third-party debt
      # stays auditable instead of silently re-accreting.
      - name: Vendored webrtc-ice drift check
        run: bash scripts/revendor-webrtc-ice.sh --check

      # Same invariant for the wintun-bindings fork (windows-target-only
      # crate — Linux CI never compiles it, but the content gate runs here).
      - name: Vendored wintun-bindings drift check
        run: bash scripts/revendor-wintun-bindings.sh --check

      # Same invariant for the scrap fork (the macOS IOSurface row-pitch
      # accessor). The patched arms compile only on a Mac, so this content
      # gate is the part that can run here.
      - name: Vendored scrap drift check
        run: bash scripts/revendor-scrap.sh --check

      # Same invariant for the webrtc-sctp fork (the FORWARD-TSN bundled-
      # chunk parse fix; see crates/vendored/webrtc-sctp/Cargo.toml).
      - name: Vendored webrtc-sctp drift check
        run: bash scripts/revendor-webrtc-sctp.sh --check

      # Same invariant for the smoltcp fork (cwnd bounds bytes in flight, and
      # a NewReno-lite; see crates/vendored/smoltcp/Cargo.toml).
      - name: Vendored smoltcp drift check
        run: bash scripts/revendor-smoltcp.sh --check

      # The GTK/WebKit set (workspace clippy, the tray and wizard crates) and
      # the libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture,
      # audio, bindgen), from cache-apt-pkgs-action with the guards against
      # its silent-empty-restore failure. One definition for every lane: the
      # composite carries the full history of why each guard exists.
      - name: System packages — GTK/WebKit + libvpx/xcb/alsa sets (cached apt, verified)
        uses: ./.github/actions/ci-linux-system-deps

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      # FR-27 — the native X11 consent panel. Off by default, so the workspace
      # clippy above never sees it; without this step it would compile in NO
      # lane until a release tag, which is exactly the "invisible until
      # <platform> builds it" class the macOS job exists for.
      - name: Run clippy on the X11 consent panel
        run: cargo clippy -p roomlerd --lib --features viewer-indicator-x11 -- -D warnings

      # The step above is deliberately NOT `--all-targets`, so it never
      # compiles `#[cfg(test)]` bodies — the same blind spot the API-unit-test
      # and integration-type-check steps below exist to cover, but for LINTS
      # rather than compilation. It hid two real things at once: two
      # `items after a test module` errors, and a security control that was
      # dead code (the exec/SSH per-caller rate limit — its constants had no
      # readers and its deny reason was constructed only in tests, which
      # `--all-targets` would have surfaced as unused).
      #
      # Scoped to the audited crates rather than `--workspace`: these are
      # verified green, while the wider workspace has not been audited under
      # `--all-targets` and must not be flipped blind. Widen it per crate as
      # each is checked.
      #
      # `roomler-ai-tests` joined the list in #894. It is the crate that most
      # needed it: virtually all of it is `#[cfg(test)]`, so the `--workspace`
      # step above compiles almost NONE of it, and 24 lints had accumulated
      # unread — 9 when the issue was filed on 2026-08-29, 24 by the time it was
      # fixed, which is the accrual rate of a guard nobody runs.
      #
      # This is the same crate whose history is "it rotted because nothing ran
      # it" (#646). Lints are the cheap half of that guard, and they were off for
      # exactly the crate with the worst record. It also catches a specific
      # mistake nothing else does: a `mod x_tests;` added to `lib.rs` WITHOUT its
      # `#[cfg(test)]` gate compiles the module's helpers into the lib target as
      # dead code, which only `--all-targets` surfaces.
      - name: Run clippy on the audited crates (incl. test targets)
        run: cargo clippy -p roomler-ai-api -p roomler-ai-services -p roomler-ai-tests -p roomler-core --all-targets -- -D warnings

      # The integration crate cannot RUN here (it needs MongoDB + Redis), but
      # it can still be compiled — and compiling it is what was missing. It sat
      # broken for an unknown stretch because `OverlayNodeDao::create` grew
      # three fields and its 8 test callers didn't: `--workspace` clippy skips
      # `#[cfg(test)]` bodies, and no step named this crate, so all 288
      # integration tests were unrunnable while every PR went green.
      #
      # A type-check needs no services and catches that whole class on the
      # commit that introduces it. It does NOT tell you the tests pass — only
      # that they still build. Running them remains a separate lane.
      #
      # ⚠️ It sits in THIS lane, straight after the clippy above, on purpose:
      # clippy builds the non-workspace deps with plain rustc in check mode,
      # the same metadata `cargo check` needs, so here it re-checks only the
      # workspace crates (~26 s). Placed alone in the unit lane (PR #1743's
      # first run) it re-checked ~800 dependencies from scratch: 369 s.
      - name: Type-check the integration test crate
        run: cargo check -p roomler-ai-tests --all-targets

      # Pair `vp9-444` with `vp9-444-bindgen` on Linux so env-libvpx-sys
      # regenerates its FFI bindings via bindgen against the installed
      # libvpx headers. The apt package on Ubuntu 24.04 (the GH-hosted
      # runner image since 2026-04) ships libvpx 1.14+, but env-libvpx-sys
      # 5.1.3's pre-generated bindings cap at 1.13.0. Without the
      # bindgen feature the build script panics with "Expected file
      # generated/vpx-ffi-1.14.0.rs not found but 'generate' cargo
      # feature not used." `libclang-dev` (installed above) is the
      # bindgen runtime requirement.
      # The capture path is linted by NO other lane. `--workspace` clippy
      # compiles roomlerd with DEFAULT features, and its default is `[]`, so
      # `capture/scrap_backend.rs` — the screen-capture backend on every OS —
      # is never even compiled there. The two agent feature lanes miss it too:
      # `vp9-444` does not enable `scrap-capture`, and `cargo check` does not
      # fail on warnings anyway. Same trap this file already documents for
      # `clipboard` and `ssh-server`, and it had already sprung: an
      # `unused_mut` in scrap_backend.rs survived indefinitely, and FR-29's
      # `capture/x11_damage.rs` landed with no lint coverage at all.
      #
      # `dead_code` is allowed deliberately. This feature set legitimately
      # leaves the ffmpeg-encoder paths unconstructed (`RatePlan`, `FfmpegDc`,
      # …), and enabling `ffmpeg-encoder` here would need the vendored FFmpeg
      # tree — a large cost to silence findings that are not defects. Every
      # other class still bites.
      - name: Clippy agent --features full (the capture + encode + input path)
        # `recording` (FR-85) is in `full` again (P4c, after the canaries). It
        # stays named so this lane keeps linting it if it is ever held out
        # of `full` again, as it was from 2026-09-26 to 09-27.
        # `hive` (FR-90 P0c) is held out of `full` until the P0 field cell,
        # so it is named here for the same reason: no other lane lints it.
        # `vault` (FR-90 P3-3) implies `hive` and is in no release build yet.
        run: cargo clippy -p roomlerd --features full,vp9-444,vp9-444-bindgen,clipboard,ssh-server,recording,hive,vault --all-targets -- -D warnings -A dead_code

      # Overlay L3 (Phase 3) feature gate. `overlay-l3` pulls the `tun`
      # crate (Wintun on Windows / /dev/net/tun on Linux) + the TUN↔WG
      # bridge; the default `--workspace` clippy never compiles it
      # (opt-in), so lint + test it explicitly here — mirrors the
      # vp9-444 gate, catching an L3-path regression before it ships
      # under the flag.
      - name: Clippy tunnel-core --features overlay-l3,overlay-netstack
        # BOTH overlay features, because the release build ships both
        # (`release-agent.yml`: `overlay-l3,overlay-netstack`) and neither the
        # default `--workspace` clippy nor an `overlay-l3`-only lane compiles
        # `overlay::netstack*`. That gap hid a broken TEST helper in
        # netstack_socks.rs for two weeks: #111 added two `PeerInfo` fields
        # without updating a literal that only exists under `overlay-netstack`,
        # and no lane ever compiled it. `--all-targets` covers test code, which
        # is exactly where that class of break lands.
        run: cargo clippy -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --all-targets -- -D warnings

      - name: Clippy roomlerd --features overlay-l3
        # Phase 3b: the agent's overlay glue (overlay.rs + the main /
        # signaling hooks) only compiles under the opt-in feature, so the
        # default --workspace clippy never sees it. Lint it explicitly.
        run: cargo clippy -p roomlerd --features overlay-l3 -- -D warnings

  rust-unit:
    name: Rust unit tests (server + crates)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Same pin as rust-lint (and rust-toolchain.toml). No rustfmt or
        # clippy: this lane runs neither.
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        # rust-lint's cache step carries the notes: this lane's own family,
        # saved only from a master push, keyed on Cargo.lock + the env.
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-unit
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The GTK/WebKit set (workspace clippy, the tray and wizard crates) and
      # the libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture,
      # audio, bindgen), from cache-apt-pkgs-action with the guards against
      # its silent-empty-restore failure. One definition for every lane: the
      # composite carries the full history of why each guard exists.
      - name: System packages — GTK/WebKit + libvpx/xcb/alsa sets (cached apt, verified)
        uses: ./.github/actions/ci-linux-system-deps

      # `crates/api` unit tests ran in NO lane until now: the clippy step above
      # is `--workspace` WITHOUT `--all-targets`, so it does not even compile
      # `#[cfg(test)]` code, and the `cargo test` steps further down name
      # `roomlerd` / `roomler-ai-tunnel-core` explicitly. Every policy test
      # under `routes/` — who may open a session, what a refusal records — was
      # therefore decorative: a green PR did not mean they had run.
      #
      # `--lib` only: the integration suite in `crates/tests` needs MongoDB and
      # Redis and belongs to a different lane. These are pure in-crate unit
      # tests and need no services.
      - name: Run API unit tests
        run: cargo test -p roomler-ai-api --lib

      # FR-69 — `roomler-core` carries the module contract's own guards (the
      # DAG stays acyclic, the hook order covers every module, the axum Debug
      # parser behind the composition baseline still reads a real router) and,
      # since P1b, the cluster/storage/analytics primitives that moved out of
      # the api crate with their unit tests. Named explicitly for the same
      # reason the api step above is: `--workspace` clippy compiles none of
      # their `#[cfg(test)]` bodies, and a test no lane runs is decorative.
      - name: Run core unit tests
        run: cargo test -p roomler-core --lib

      # FR-69 P5a — the Hub's unit tests (consent, the session state machine,
      # nudges) moved with it into the fleet module.
      - name: Run fleet module unit tests
        run: cargo test -p roomler-ai-mod-fleet --lib

      # Every other crate that carries `#[cfg(test)]` bodies — and until
      # 2026-09-25 ran them in NO lane, for the reason the api step above
      # gives: `--workspace` clippy never compiles a test body, and the test
      # steps name crates explicitly. Found when two of `remote_control`'s
      # wire-format tests had been failing on master since FR-78 taught the
      # codec vocabulary `vulkan` and `d3d12va`, and a `setup-core` fixture
      # since a retired-name anchor was inserted INSIDE its JSON string.
      # `remote_control` holds the `rc:*` wire locks CLAUDE.md calls
      # load-bearing, `mod-network` the SSH gates and the grant-ack table,
      # `agent-core` the config round-trips. One invocation, one build graph.
      # `roomler-setup` (the wizard app, lib `wizard_app`) joined with FR-84
      # S2: its orchestrator now decides the overlay default per install
      # flavour, and that rule ran in no lane either. `--lib` only — its
      # bin is `test = false` by the UAC lib-naming rule.
      # `roomler-hive-node` (FR-90 P0a) joined with its first commit: the
      # transcript chain's one-writer and no-gap checks, the replica store's
      # search scoping and the empty-roots-means-nowhere rule are its tests.
      # `roomler-ai-mod-hive` (FR-90 P0b) the same way: the start-ack table
      # bound to its device, the status sets a device report may move, and
      # the folder/title checks the start route applies.
      # `roomler-ai-mod-remote` (FR-101 P2a) joined with its first tests: how
      # the owner pod reads the session policy off the cross-pod relay (absent
      # vs unreadable), and the policy route's strict values.
      # `roomler-ai-mod-vault` (FR-90 P3-1) with its first commit: a value
      # moved to another place, altered, or held to another KEK does not
      # open; a KEK never prints; paths and fields have one spelling.
      - name: Run the remaining crates' unit tests
        run: >-
          cargo test --lib
          -p roomler-ai-remote-control -p roomler-ai-mod-network
          -p roomler-node-core -p roomler-cli -p roomler-localapi
          -p roomler-ai-services -p roomler-ai-db -p roomler-ai-config
          -p roomler-ai-mod-chat -p roomler-ai-mod-saas
          -p tcp-turn-conn -p roomler-setup-core -p roomler-setup
          -p roomler-hive-node -p roomler-ai-mod-hive -p roomler-ai-mod-remote
          -p roomler-ai-mod-vault

      # FR-115 P4a-2 — `derp-relay`, the regional PoPs' DERP relay, ran its
      # tests in NO lane: it is a binary crate, so the `--lib` step above
      # cannot name it, and `--workspace` clippy compiles none of its
      # `#[cfg(test)]` bodies. It now holds the relay allowance on the PoPs —
      # a set only the API's key can sign, a throttle that must never hold a
      # WireGuard handshake — so its tests run here.
      - name: Run the PoP relay's tests
        run: cargo test -p derp-relay --bins

      # FR-85 P2b — the desktop companion's unit tests ran in NO lane: the
      # macOS job only `cargo check`s it, and the step above is `--lib`, which
      # a bin-only crate cannot join. Its tests include the Recordings view's
      # Rust half (the tray's wording and when its item is enabled; only a bare
      # `*.mp4` name is ever opened; a refusal the daemon ANSWERED for a
      # `record_*` key is final), alongside the FR-84 D1 refresh ledger and
      # the config-path split, which were already here and already unrun.
      # The GTK/WebKit dev packages it links come from the system-deps
      # composite above.
      - name: Test the desktop companion (roomler-desktop)
        run: cargo test -p roomler-desktop --bins

  rust-agent:
    name: Agent tests (vp9-444, overlay, kernel TUN)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Same pin as rust-lint (and rust-toolchain.toml). No rustfmt or
        # clippy: this lane runs neither.
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        # rust-lint's cache step carries the notes: this lane's own family,
        # saved only from a master push, keyed on Cargo.lock + the env.
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-agent
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The GTK/WebKit set (workspace clippy, the tray and wizard crates) and
      # the libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture,
      # audio, bindgen), from cache-apt-pkgs-action with the guards against
      # its silent-empty-restore failure. One definition for every lane: the
      # composite carries the full history of why each guard exists.
      - name: System packages — GTK/WebKit + libvpx/xcb/alsa sets (cached apt, verified)
        uses: ./.github/actions/ci-linux-system-deps

      # `vp9-444-bindgen`, and why Linux needs the pair: see the note on
      # rust-lint's "Clippy agent --features full" step.
      - name: Check agent --features vp9-444
        run: cargo check -p roomlerd --features vp9-444,vp9-444-bindgen

      - name: Test agent under vp9-444
        # Runs the full `--features vp9-444` lib test suite:
        #   - 3 video_bytes wire-format tests (byte layout lock
        #     against the worker parser)
        #   - libvpx encoder tests: first-frame-keyframe lock +
        #     odd-dim rejection. These exercise the
        #     env-libvpx-sys-direct rewrite (Y.runtime-encoder,
        #     0.1.47) — vpx_codec_enc_init_ver with g_profile=1,
        #     g_lag_in_frames=0, VPX_IMG_FMT_I444. Without the
        #     rewrite the keyframe test would fail because
        #     `vpx-encode 0.6` hardcoded I420 + buffered the first
        #     ~25 frames behind a non-zero default g_lag_in_frames.
        #   - caps probe assertions: detect_advertises_vp9_444_*
        #     locks the rc:agent.hello advertisement contract.
        #   - clipboard-v2 tests (parse locks, CRLF canonicalization,
        #     PNG codec, ImageRx, FNV vectors): `clipboard` was never
        #     in any CI feature lane before v2 — the module is
        #     `#![cfg(feature = "clipboard")]`, so without it here the
        #     whole suite silently never ran. arboard/png are pure
        #     Rust on Linux (X11 headers already installed above).
        #   - roomler SSH (`ssh-server`, which implies `overlay-netstack`):
        #     same trap the clipboard note above describes, and it had already
        #     sprung — `agents/roomlerd/src/ssh.rs`'s suite (host key,
        #     auth accept/deny, grant redemption, single-use, expiry) is
        #     `#[cfg(feature = "ssh-server")]` and was in NO CI lane, so none
        #     of it ran here. It also puts the Unix half of the privilege drop
        #     under test on a real Linux host, which a Windows dev box cannot
        #     exercise at all. russh is pure Rust; the cost is compile time.
        #   - Hive (`hive`, FR-90 P0c): the device's gates and the supervisor
        #     driving a stand-in harness through start, prompt, turn, crash and
        #     stop. Linux-only by construction and held out of `full`, so this
        #     is the one lane that runs it. Bundled SQLite compiles from C.
        #   - the desktop portal + mutter capture helper (`portal-capture`,
        #     FR-45): the same trap a fourth time — `capture::portal`'s whole
        #     suite is behind that feature and ran in NO lane, which is how the
        #     helper's spawn could fail EPERM in every per-user daemon with no
        #     test anywhere near it (#1719 run B). zbus is pure Rust and
        #     libpipewire is dlopen'd, never linked, so the runner needs no new
        #     package; the EPERM test needs only that the runner is not root.
        #   - DRM/KMS capture (`drm-capture`, FR-36/FR-93): a fifth time —
        #     `capture::drm_backend`'s suite (the 10-bit repack, the fused
        #     downscale, FR-93's GEM-handle guard) was compiled by the `full`
        #     clippy step and RUN by none. drm/drm-sys are pure Rust (drm-sys
        #     builds without bindgen) and no test opens a DRM node.
        #   - the injectors (`uinput-input`, `enigo-input`, #1945): a sixth —
        #     each backend's own suite (uinput's ABI pins and the events it
        #     writes, enigo's key and pointer mapping, and #1945's release that
        #     never moves) ran in no lane; the Xvfb step runs only its real-X modules.
        #     uinput is plain ioctls, and no test opens /dev/uinput or needs X.
        #     FR-97 P3f's keymap tests compile real XKB keymaps (us, de, fr)
        #     through a dlopen'd libxkbcommon, which GTK's dev packages above
        #     bring; ROOMLERD_TEST_XKB=1 makes its absence a failure, not a skip.
        #   - FR-52's device half (`external-access`): a seventh. The OPAQUE
        #     login's replies, the device's admission (its own ceiling and
        #     consent mode, and the RECORD/PRIVACY an outsider never holds),
        #     the MAC binding and the single-use login table are all behind
        #     the feature, and no lane enabled it. The integration crate builds
        #     the agent WITH it, but only as a dependency, and a dependency's
        #     own tests never run. opaque-ke and argon2 are pure Rust; the suite
        #     takes ~20 s.
        env:
          ROOMLERD_TEST_XKB: "1"
        run: cargo test -p roomlerd --features vp9-444,vp9-444-bindgen,clipboard,ssh-server,hive,vault,portal-capture,drm-capture,uinput-input,enigo-input,external-access --lib

      - name: Test tunnel-core --features overlay-l3,overlay-netstack
        # WG handshake (direct + RelayConn) + the TUN↔WG bridge loopback
        # test — all in-process over 127.0.0.1, no real device.
        # `--test-threads=1`: several tests each stand up a full loopback
        # WebRTC/QUIC peer PAIR (ICE + SCTP 8-DC pool). Run in parallel on a
        # 2-core CI runner they starve each other and intermittently blow the
        # pool-open timeout (`Elapsed`) — flaky on master + PRs alike. Serial
        # execution keeps at most one peer-pair up at a time; the tests are
        # individually fast (<1s), so the whole step stays well under a minute.
        run: cargo test -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --lib -- --test-threads=1

      - name: Test the tunnel CLI (roomler-cli --lib)
        # FR-97 P6b: no lane ran the CLI's own tests before this one, so its
        # self-update (the artifact picked per host, the version an archive
        # names inside its signed bytes, the dpkg owner, the atomic swap) was
        # covered by nothing. The release-signature check those rest on is
        # tunnel-core's `pgp_verify`, tested in the step above.
        run: cargo test -p roomler-cli --lib

      - name: Multi-org shared TUN against real kernel networking
        # The mux's bookkeeping is unit-tested against a fake device; the half
        # that touches the OS — a REFUSED registration leaving no address
        # behind, a disjoint block really getting one, a released org really
        # losing it — was never run against a kernel, because reproducing it
        # in the field needs a third organization and there is no way to
        # retire a throwaway one (docs/multi-org.md §12). A `tun` device is
        # free here, so it runs on every push instead.
        #
        # Needs CAP_NET_ADMIN, hence sudo + the env opt-in (the test skips
        # itself silently everywhere else, including developer machines).
        # Built as the normal user and only RUN under sudo, so root never
        # takes ownership of the shared cargo cache.
        run: |
          sudo modprobe tun || true
          # Build FIRST with human diagnostics. The json pass below would
          # otherwise swallow a compile error into records jq drops, leaving
          # only an empty $BIN and "sudo: : command not found".
          cargo test -p roomlerd --features overlay-l3 --lib --no-run
          BIN=$(cargo test -p roomlerd --features overlay-l3 --lib \
                  --no-run --message-format=json \
                | jq -r 'select(.profile.test == true) | .executable' | head -1)
          echo "test binary: $BIN"
          sudo ROOMLER_TUN_KERNEL_TEST=1 "$BIN" tun_kernel_tests \
            --test-threads=1 --nocapture

      - name: DERP dialer — unit tests (#2512)
        # `derp.rs` compiles only under an overlay feature. Its suite already
        # runs in "Test agent under vp9-444" (`ssh-server` enables
        # `overlay-netstack`); this runs it under `overlay-l3` too, on the build
        # the step above makes. #2512's tests hold the dialer while the control
        # socket's verdict on the token is "refused", and pin that its OWN 401
        # never parks it (`/derp` answers 401 for any lookup error). They bind
        # loopback only; no sudo. The build is the step above's, so this costs
        # only the run. A filter that matches nothing passes too, hence the
        # count check.
        run: |
          cargo test -p roomlerd --features overlay-l3 --lib -- derp:: > derp-tests.txt 2>&1 \
            || { cat derp-tests.txt; exit 1; }
          cat derp-tests.txt
          grep -E 'test result: ok\. [1-9][0-9]* passed' derp-tests.txt

  rust-recorder:
    name: Recorder tests (FR-85)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Same pin as rust-lint (and rust-toolchain.toml). No rustfmt or
        # clippy: this lane runs neither.
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        # FR-6 wave 21 (#773): restores rust-recorder-audio's family and never
        # saves one of its own; a second copy cost ~600 MB of the free 10 GB
        # pool. That lane builds these features plus `audio`, and `cargo tree`
        # resolves the two TEST graphs to the same features for every shared
        # crate (only roomlerd and the 7 audio-only crates differ), so the
        # tests here reuse it. NOT a full superset: this lane's non-test
        # `cargo build -p roomlerd` (no dev-dependency features under resolver
        # v2) needs tokio and ~25 dependents in a variant the audio lane never
        # builds, and rebuilds them. Measured on #1939: 273 s for the lane
        # against 221-295 s on master, off the CI critical path. Same workflow
        # env ⇒ same env hash ⇒ the prefix restore finds the family.
        # rust-lint's cache step carries the general notes.
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-recorder-audio
          save-if: false

      # The GTK/WebKit set (workspace clippy, the tray and wizard crates) and
      # the libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture,
      # audio, bindgen), from cache-apt-pkgs-action with the guards against
      # its silent-empty-restore failure. One definition for every lane: the
      # composite carries the full history of why each guard exists.
      - name: System packages — GTK/WebKit + libvpx/xcb/alsa sets (cached apt, verified)
        uses: ./.github/actions/ci-linux-system-deps

      - name: Test the recorder (FR-85) — unit tests + the recorder integration binary
        # ⚠️ Named explicitly, twice, on purpose. Every other roomlerd test
        # step is `--lib`, so `agents/roomlerd/tests/*.rs` runs only when a
        # step NAMES it — `tests/file_dc.rs` has never run in CI for exactly
        # that reason. And `recording` is not in any other feature set here,
        # so its unit tests would not run under the `--lib` step above either.
        # `synthetic-frame-source` lets the `roomlerd record` process tests
        # capture on a runner with no display; openh264 is both the encoder and
        # the decoder the oracle reads frames back through.
        #
        # FR-85 P1c — and twice over: WITH `audio` (the mixer on the
        # recorder's clock, the Opus track decoded back at 440 Hz, the process
        # with the synthetic tone) and WITHOUT it (an audio request is refused
        # by name, never recorded silently without). Each half has tests the
        # other cannot compile.
        #
        # FR-85 P3b — `control_dc_record`: the `record` DataChannel over a
        # loopback PeerConnection pair, the production handler, the real
        # recorder child (the owner's gates, the host prompt with a fresh id,
        # the indicator before the first frame, every way a recording ends).
        #
        # FR-85 P5a — `export`: a recording whose every frame paints its own
        # index, exported through keep / cut / 4× / keep, decoded back frame
        # for frame (the oracle is proven against the unedited source), plus
        # the real `roomlerd media probe|export` process.
        #
        # FR-85 P5b — `export` again WITH `audio`: the recording's own sound
        # through the same edit (a stepped tone, so every second of the export
        # names the second of the recording it came from), muted under a
        # speed-up, and music looped, faded and mixed under it. Without
        # `audio` the same binary proves a recording's sound is reported
        # `not_carried`, never dropped in silence.
        #
        # FR-85 P1d — `recorder` again: a pointer the "backend" cannot draw is
        # drawn by the recorder, decoded back where the source said, with no
        # trail when it moves; `recording::pointer` holds the layer's units.
        #
        # FR-6 wave 14: the WITH-`audio` half of this step now runs in the
        # `rust-recorder-audio` lane, in parallel with this one.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --lib recording::
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test recorder
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test control_dc_record
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test export

      - name: The privacy channel (FR-99 P1b) — the production handler over a loopback pair
        # The `privacy` DataChannel's handlers as `peer.rs` routes them, with a
        # recorder standing in for the overlay: each gate refuses by name
        # before the overlay is asked, on/off/status, the owner's OFF taking a
        # curtain down unasked, and the session's end doing the same.
        # ⚠️ Named explicitly: a `tests/*.rs` file nobody names runs in no
        # lane. It needs no feature; it is built with the step above's so it
        # reuses that build instead of compiling the agent a third time.
        run: cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test privacy_dc

      - name: A DataChannel session answers an offer without H.264 (#2231)
        # The production AgentPeer on the VP9 DataChannel transport against a
        # webrtc-rs "browser" that registers VP8 alone, as a Firefox without
        # OpenH264 offers: the RTP placeholder track must take a codec the
        # offer carries, or `create_answer` fails before the DataChannel opens.
        # The second test keeps the failure itself (an H.264 track cannot
        # answer that offer). ⚠️ Named explicitly, as the steps around it are;
        # built with the same features, so it reuses that build.
        run: cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test dc_track_codec

      - name: L0 latency harness (FR-16) — capture → decode on one clock, over a vnet
        # FR-16 L0. The production AgentPeer and media pump on the synthetic
        # source and openh264, a webrtc-rs controller decoding the RTP track,
        # both on a webrtc-util vnet: a clean link, +100 ms, a planted 50 ms
        # capture-stage hold, and a lossy link. The hold is the negative
        # control: a harness that cannot see it gates nothing.
        # ⚠️ Named explicitly for the same reason as the step above: a
        # `tests/*.rs` file nobody names runs in no lane, and the synthetic
        # source's own unit tests (the marker, its CRC) compile only with
        # `synthetic-frame-source`, which no `--lib` step elsewhere enables.
        # Same features as the recorder step, so it reuses that build.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --lib capture::synthetic_backend
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test l4_latency -- --nocapture

      - name: Linux recorder identity (FR-85) — as root, the drop and the thread's filesystem identity
        # FR-85 P1e-unix. A root daemon launches the recorder as the person
        # signed in at the screen, and does its own work in their folder with
        # the thread's fsuid, fsgid and groups switched to theirs. None of it
        # can be exercised without root, so the lib test binary is built as
        # the runner and then run under sudo. ROOMLERD_TEST_REQUIRE_ROOT
        # turns a skip into a failure: the step cannot pass by not running.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --lib --no-run --message-format=json > /tmp/p1eu.json
          BIN=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' /tmp/p1eu.json | head -1)
          if [ -z "$BIN" ]; then echo "::error::no roomlerd lib test binary in the build output"; exit 1; fi
          sudo ROOMLERD_TEST_REQUIRE_ROOT=1 "$BIN" recording::launch

      - name: The tarball repair, as root — another account's tree comes back root's, and no symlink is followed
        # Up to 0.4.126 a tarball install left /usr and the unit directories
        # another account's; the daemon repairs at start, as root
        # (agents/roomlerd/src/tarball_owner.rs). Only root can chown, so the
        # lib test binary runs under sudo, and ROOMLERD_TEST_REQUIRE_ROOT turns
        # the test's skip into a failure.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --lib --no-run --message-format=json > /tmp/tob.json
          BIN=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' /tmp/tob.json | head -1)
          if [ -z "$BIN" ]; then echo "::error::no roomlerd lib test binary in the build output"; exit 1; fi
          sudo ROOMLERD_TEST_REQUIRE_ROOT=1 "$BIN" tarball_owner

      - name: Received files on a Linux system install (FR-97 P3d) — as root, born the person's
        # FR-97 P3d. A root daemon writes a received file into the person's
        # folder with the thread's fsuid, fsgid and groups switched to theirs,
        # and a link planted in that folder gets only their rights (the test's
        # control shows root's own rights go straight through it). Only root
        # can take on another identity, so the lib test binary runs under sudo,
        # and ROOMLERD_TEST_REQUIRE_ROOT turns the tests' skip into a failure.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --lib --no-run --message-format=json > /tmp/p3d.json
          BIN=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' /tmp/p3d.json | head -1)
          if [ -z "$BIN" ]; then echo "::error::no roomlerd lib test binary in the build output"; exit 1; fi
          sudo ROOMLERD_TEST_REQUIRE_ROOT=1 "$BIN" files::seat_user_tests

      - name: The Linux user unit's sandbox (FR-85 P2c) — it starts on a fresh host, and the recorder writes ~/Videos
        # FR-85 P2c. `roomler.service` (the per-user install; what
        # `install.sh --role daemon` enables without `--system`) runs the
        # daemon with ProtectHome=read-only. This starts a unit carrying its
        # sandbox lines VERBATIM, on a runner that never ran the pre-rename
        # agent, and asks the real recorder where it would write:
        #   * a ReadWritePaths entry that does not exist, listed WITHOUT
        #     systemd's `-`, fails the whole unit with 226/NAMESPACE — the
        #     unit could not start on any such host until P2c;
        #   * `record --where` must choose ~/Videos/Roomler, and the rest of
        #     home must stay read-only.
        # A SYSTEM unit with User= needs no user session on the runner and
        # ALWAYS sets up the mount namespace, i.e. the configuration where
        # both failures bite. A user manager applies the sandbox only inside
        # an unprivileged user namespace it may mount in; where it cannot
        # create one, or may not mount in it (default Ubuntu 24.04, whose
        # AppArmor restricts them: field-verified on a vmtest guest), it runs
        # the unit with no sandbox at all. `%h` is expanded here
        # because in a system unit it means root's home whatever User= says.
        run: |
          set -eu
          cargo build -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --message-format=json > /tmp/p2c-build.json
          BIN=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "roomlerd" and .executable != null) | .executable' /tmp/p2c-build.json | tail -1)
          if [ -z "$BIN" ]; then echo "::error::no roomlerd binary in the build output"; exit 1; fi
          ME=$(id -un)
          H=$(getent passwd "$ME" | cut -d: -f6)
          # What `roomlerd enroll` leaves behind, and an XDG Videos folder.
          mkdir -p "$H/.config/roomler" "$H/.local/share/roomler" "$H/Videos"
          printf 'XDG_VIDEOS_DIR="$HOME/Videos"\n' > "$H/.config/user-dirs.dirs"
          # Every path the unit lists as optional (`-`), the XDG user folders
          # (~/Videos, ~/Downloads) aside, must be MISSING, as on any host
          # installed after the rename, or the cell proves nothing about a
          # missing path. /var/tmp is aside too: it exists on every Linux
          # host, its `-` is belt and braces, and what FR-96 P2a needs from it
          # is that the sandbox leaves it WRITABLE — asserted below, with a
          # negative control.
          for p in $(grep -E '^ReadWritePaths=' agents/roomlerd/packaging/linux/roomler.service | sed 's/^ReadWritePaths=//' | tr ' ' '\n' | grep '^-' | sed "s|^-||; s|%h|$H|g"); do
            if [ "$p" != "$H/Videos" ] && [ "$p" != "$H/Downloads" ] && [ "$p" != /var/tmp ] && [ -e "$p" ]; then echo "::error::$p exists on the runner; the cell proves nothing"; exit 1; fi
          done
          OUT=/tmp/p2c-where.out
          # Can the unit create a file in /var/tmp? Used by both units below.
          # No `%` or `$` in it: systemd would expand either in ExecStart.
          WAKE_PROBE='if touch /var/tmp/.p2c-wake-probe 2>/dev/null; then echo VARTMP_WRITABLE; rm -f /var/tmp/.p2c-wake-probe; else echo VARTMP_READ_ONLY; fi'
          {
            echo "[Service]"
            echo "Type=oneshot"
            echo "User=$ME"
            echo "StandardOutput=file:$OUT"
            echo "StandardError=journal"
            echo "ExecStart=/bin/sh -c '\"$BIN\" record --where; if touch \"$H/.p2c-probe\" 2>/dev/null; then echo HOME_WRITABLE; else echo HOME_READ_ONLY; fi; $WAKE_PROBE'"
            grep -E '^(NoNewPrivileges|ProtectSystem|ProtectHome|ReadWritePaths)=' agents/roomlerd/packaging/linux/roomler.service | sed "s|%h|$H|g"
          } | sudo tee /etc/systemd/system/p2c-sandbox.service
          sudo systemctl daemon-reload
          if ! sudo systemctl start p2c-sandbox.service; then
            sudo journalctl -u p2c-sandbox.service --no-pager | tail -20
            echo "::error::a unit carrying roomler.service's sandbox did not start"; exit 1
          fi
          cat "$OUT"
          grep -q "$H/Videos/Roomler" "$OUT" || { echo "::error::under the sandbox the recorder did not choose ~/Videos/Roomler"; exit 1; }
          grep -q HOME_READ_ONLY "$OUT" || { echo "::error::the sandbox left the rest of home writable"; exit 1; }
          # FR-96 P2a: a per-user daemon whose host has the root update
          # helper touches its wake file, /var/tmp/roomler-update-check.
          # ProtectSystem=strict leaves /var/tmp read-only (measured on
          # Fedora 44 KDE: EROFS), so the unit grants it.
          grep -q VARTMP_WRITABLE "$OUT" || { echo "::error::under the sandbox the daemon cannot write /var/tmp — FR-96's wake file would fail EROFS"; exit 1; }
          # The negative control: the same sandbox WITHOUT that grant must
          # leave /var/tmp read-only, or the probe cannot tell the two apart
          # and the check above proves nothing.
          NC=/tmp/p2c-nogrant.out
          {
            echo "[Service]"
            echo "Type=oneshot"
            echo "User=$ME"
            echo "StandardOutput=file:$NC"
            echo "StandardError=journal"
            echo "ExecStart=/bin/sh -c '$WAKE_PROBE'"
            grep -E '^(NoNewPrivileges|ProtectSystem|ProtectHome|ReadWritePaths)=' agents/roomlerd/packaging/linux/roomler.service | grep -vx 'ReadWritePaths=-/var/tmp' | sed "s|%h|$H|g"
          } | sudo tee /etc/systemd/system/p2c-nogrant.service
          if grep -q '^ReadWritePaths=.*/var/tmp' /etc/systemd/system/p2c-nogrant.service; then echo "::error::the negative control still grants /var/tmp"; exit 1; fi
          sudo systemctl daemon-reload
          if ! sudo systemctl start p2c-nogrant.service; then
            sudo journalctl -u p2c-nogrant.service --no-pager | tail -20
            echo "::error::the negative control's unit did not start"; exit 1
          fi
          cat "$NC"
          grep -q VARTMP_READ_ONLY "$NC" || { echo "::error::without its grant the sandbox still let the unit write /var/tmp: the probe cannot tell, so the check above proves nothing"; exit 1; }

      - name: The Linux user unit runs where its user manager sandboxes it — Fedora's configuration (#1997)
        # #1997. The cell above copies the unit's sandbox into a SYSTEM unit,
        # where `%t` means /run, and its oneshot never takes the lock. So it
        # could not see the per-user daemon failing to start on Fedora, every
        # 5 s, forever: "acquiring single-instance lock … Read-only file
        # system". This cell starts the SHIPPED unit under the
        # runner's own user manager, as an install does. Ubuntu's AppArmor
        # stops a user manager from mounting inside an unprivileged user
        # namespace, and the unit then runs with NO sandbox, as on every
        # Ubuntu desktop. Lifting that is Fedora's configuration, where the
        # sandbox applies. The cell fails unless the daemon really ran in its
        # own mount namespace, so it cannot pass by not sandboxing. Measured
        # before it landed, under a user manager that applies the sandbox:
        # master's unit fails here (the lock, EROFS), the fixed one passes.
        run: |
          set -eu
          cargo build -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --message-format=json > /tmp/uu-build.json
          BIN=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "roomlerd" and .executable != null) | .executable' /tmp/uu-build.json | tail -1)
          if [ -z "$BIN" ]; then echo "::error::no roomlerd binary in the build output"; exit 1; fi
          ME=$(id -un)
          MYUID=$(id -u)
          H=$(getent passwd "$ME" | cut -d: -f6)
          RUN=/run/user/$MYUID
          export XDG_RUNTIME_DIR=$RUN
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo loginctl enable-linger "$ME"
          for _ in $(seq 1 30); do [ -S "$RUN/systemd/private" ] && break; sleep 1; done
          [ -S "$RUN/systemd/private" ] || { echo "::error::no user manager for $ME"; exit 1; }
          # What `roomlerd enroll` leaves behind, for a server nobody answers:
          # the daemon takes its lock and binds LocalAPI before it needs one.
          mkdir -p "$H/.config/roomler" "$H/.local/share/roomler" "$H/.config/systemd/user"
          printf '%s\n' 'server_url = "http://127.0.0.1:9"' 'agent_token = "ci"' \
            'agent_id = "000000000000000000000000"' 'tenant_id = "000000000000000000000000"' \
            'machine_id = "ci"' 'machine_name = "ci"' > "$H/.config/roomler/config.toml"
          sed "s|^ExecStart=.*|ExecStart=$BIN run|" agents/roomlerd/packaging/linux/roomler.service > "$H/.config/systemd/user/roomler.service"
          systemctl --user daemon-reload
          systemctl --user start roomler.service
          sock=""
          for _ in $(seq 1 45); do [ -S "$RUN/roomler.sock" ] && { sock=1; break; }; sleep 1; done
          show_log() { sudo journalctl "_UID=$MYUID" _SYSTEMD_USER_UNIT=roomler.service --no-pager -n 25 || true; }
          PID=$(systemctl --user show -p MainPID --value roomler.service)
          case "$PID" in ''|0) show_log; echo "::error::the unit has no running daemon"; exit 1 ;; esac
          [ "$(sudo readlink "/proc/$PID/ns/mnt")" != "$(sudo readlink /proc/1/ns/mnt)" ] \
            || { echo "::error::the unit ran in the host's mount namespace: its sandbox did not apply, and this cell proves nothing"; exit 1; }
          [ -n "$sock" ] || { show_log; echo "::error::no LocalAPI socket at $RUN/roomler.sock within 45 s"; exit 1; }
          opts() { sudo awk -v p="$1" '$5 == p { o = $6 } END { print o }' "/proc/$PID/mountinfo"; }
          # The mount that governs a path: the longest mount point containing
          # it. /home is often not a mount of its own, and then ProtectSystem's
          # read-only / is the one.
          governing() {
            sudo awk -v p="$1" '{ m = $5; ok = (m == "/" || p == m || index(p, m "/") == 1) } ok && length(m) >= best { best = length(m); o = $6 } END { print o }' "/proc/$PID/mountinfo"
          }
          # /var/tmp: FR-96 P2a's wake file for the root update helper.
          # Measured on Fedora 44 KDE, the field configuration this cell
          # reproduces: 0.4.128's unit left it read-only (EROFS) in the
          # daemon's namespace; the grant makes it a read-write mount of its own.
          for p in "$RUN" "$H/.local/state/roomler" "$H/.config/roomler" "$H/.local/share/roomler" /var/tmp; do
            case "$(opts "$p")" in
              rw*) ;;
              *) echo "::error::$p is not writable inside the unit (mount options '$(opts "$p")')"; sudo awk '{ print $5, $6 }' "/proc/$PID/mountinfo" | grep -E "^($H|/run/user|/var/tmp)"; exit 1 ;;
            esac
          done
          case "$(governing "$H")" in ro*) ;; *) echo "::error::$H is writable inside the unit ('$(governing "$H")')"; exit 1 ;; esac
          echo "the user unit: sandboxed, LocalAPI bound, the runtime, state, config and data folders and /var/tmp writable, the rest of home read-only"
          systemctl --user stop roomler.service

  rust-recorder-audio:
    name: Recorder tests with audio + X11 pointer (FR-85)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Same pin as rust-lint (and rust-toolchain.toml). No rustfmt or
        # clippy: this lane runs neither.
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        # rust-lint's cache step carries the notes: this lane's own family,
        # saved only from a master push, keyed on Cargo.lock + the env.
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-recorder-audio
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The GTK/WebKit set (workspace clippy, the tray and wizard crates) and
      # the libvpx / xcb / alsa / cmake / libclang set (vp9-444, capture,
      # audio, bindgen), from cache-apt-pkgs-action with the guards against
      # its silent-empty-restore failure. One definition for every lane: the
      # composite carries the full history of why each guard exists.
      - name: System packages — GTK/WebKit + libvpx/xcb/alsa sets (cached apt, verified)
        uses: ./.github/actions/ci-linux-system-deps

      - name: Test the recorder WITH audio (FR-85 P1c, P5b) — unit tests + the recorder integration binary
        # The WITH-`audio` half of rust-recorder's "Test the recorder
        # (FR-85)" step. That step's note says what each binary proves and
        # why the recorder is tested both with and without `audio`. It has
        # its own lane (FR-6 wave 14) so the two halves compile in parallel.
        run: |
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source,audio --lib recording::
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source,audio --test recorder
          cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source,audio --test export

      - name: The recorder's pointer (FR-85 P1d) and keep busy (FR-92 P3) on X11 — against a real X server
        # FR-85 P1d. XShm frames carry no pointer, so on X11 the recorder
        # draws it, from XFixes `GetCursorImage` placed by the monitor's origin
        # on the root window. A unit test cannot fake a server's answer, so
        # this one runs against Xvfb: the pointer warped to a known place
        # reads back there, less its hotspot and less a monitor's origin.
        # ROOMLERD_TEST_X11 turns a missing server into a failure: the step
        # cannot pass by running nothing.
        #
        # FR-92 P3 — keep busy's X11 host, against the same Xvfb: XTest motion
        # resets the MIT-SCREEN-SAVER idle counter; the whole engine
        # calibrates and runs through the arbiter's own injector and keeps the
        # server's idle near zero; a key typed by ANOTHER client pauses it.
        # Both tests print an `x11-real:` line and both are grepped, so a
        # filter that matched nothing cannot pass either. `--test-threads=1`:
        # every test here shares ONE display, and to keep busy another test's
        # pointer move IS a person (measured: in parallel it paused, correctly,
        # 0.3 s in).
        #
        # FR-93 P1 — the Xwayland guard, against the same Xvfb: a server that
        # is NOT Xwayland must never be refused, or every X11 host and the
        # virtual desktop would lose capture; and an Xwayland older than 23.1
        # (no XWAYLAND extension) is still known by its monitors — shown with
        # a client-defined XWAYLAND0 monitor, since only the fallback can see
        # it. Both `x11-real:` lines are grepped.
        #
        # FR-93 P6a — the native consent panel (FR-27), against the same Xvfb:
        # a prompt that is dismissed leaves the screen, as a second client sees
        # it. Its unmap was never flushed, and on the FR-93 lab's GNOME 50 the
        # panel stayed up after the person at the screen had approved. This
        # Xvfb has no font packages, so the panel's `fixed` fallback is tested
        # too.
        #
        # FR-97 P3a — the live pointer on X11, against the same Xvfb: the
        # capture worker's XFixes reader puts the pointer in the cursor
        # channel's slot at its place on the captured monitor, with its name's
        # CSS keyword, and reads a new cursor on its notification.
        #
        # FR-97 P3e — the keyboard layout on X11, against the same Xvfb: two
        # layouts configured as `setxkbmap` does it (xvfb brings it, with the
        # server's own keymap compiler) read back as the viewer's snapshot, and
        # the XKB group switched to the second and back. The test puts the
        # display's one layout back for the tests that share it.
        #
        # FR-97 P3e-3a — the clipboard's X11 change gate, against the same
        # Xvfb: another client takes CLIPBOARD, as a copy does, and the gate
        # counts it once and then holds. `clipboard` joins the features for it
        # (arboard is pure Rust on Linux).
        #
        # `-noreset`: without it Xvfb regenerates whenever its last client
        # disconnects, and a test that connects during the regeneration gets
        # ConnectionReset (os 104) — the flake that failed 0.4.148's bump
        # (`xwayland_probe_tests::an_old_xwayland_is_known_by_its_monitors`).
        # The screen stays xvfb-run's own default.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env ROOMLERD_TEST_X11=1 cargo test -p roomlerd --features scrap-capture,enigo-input,viewer-indicator-x11,clipboard --lib -- capture::pointer capture::x11_cursor keep_busy::host_x11 capture::xwayland_probe_tests indicator::x11 input::layout_x11 clipboard::x11_gate_tests --nocapture --test-threads=1 | tee /tmp/x11-tests.log
          grep -q "x11-real: XTest motion reset the idle counter" /tmp/x11-tests.log
          grep -q "x11-real: ran with idle" /tmp/x11-tests.log
          grep -q "x11-real: Xvfb does not advertise XWAYLAND" /tmp/x11-tests.log
          grep -q "x11-real: an XWAYLAND monitor reads as Xwayland" /tmp/x11-tests.log
          grep -q "x11-real: a dismissed prompt left the screen" /tmp/x11-tests.log
          grep -q "x11-real: the X11 pointer reached the cursor channel" /tmp/x11-tests.log
          grep -q "x11-real: the layouts .* read back, and the switch to de-DE and back took" /tmp/x11-tests.log
          grep -q "x11-real: the clipboard gate counted an owner change" /tmp/x11-tests.log

  rust:
    # The name the five lanes above shared when they were one job. It builds
    # nothing: it fails unless every lane succeeded, so this one check still
    # answers "is Rust green?" for people, `gh pr checks`, and the autopilot
    # board. `!cancelled()` rather than `always()`: a superseded PR run that
    # the concurrency group cancels should not start a runner just to fail.
    name: Rust checks
    if: ${{ !cancelled() }}
    needs: [rust-lint, rust-unit, rust-agent, rust-recorder, rust-recorder-audio]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Rust lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::Rust lanes that did not succeed: $bad"
            exit 1
          fi

  macos-overlay-check:
    # The agent's macOS build exists ONLY in release-agent.yml, so a
    # macOS-only compile error is invisible until an `agent-v*` tag is
    # already pushed — where it fails the whole release after the Windows
    # and Linux artifacts have built. rc.297 burned exactly that way:
    # #295 added a `#[cfg(not(any(linux, windows)))]` fallback for
    # `purge_one` but not for `enumerate_if_routes`, and nothing compiled
    # the macOS arm until the tag ran.
    #
    # A cheap `cargo check` on the overlay features closes it. Check only,
    # not a full build — the goal is "does the cfg tree compile on this
    # target", which is the entire class of break this catches.
    name: macOS overlay compile check
    runs-on: macos-latest
    timeout-minutes: 25
    # FR-6 wave 22 (#773): this job's cargo cache lives on the seed-cache
    # release, not in the Actions cache (see .github/actions/ci-seed-restore),
    # and publishing a release asset needs `contents: write`. Only a master
    # push publishes; a fork PR's token is read-only regardless.
    permissions:
      contents: write
    env:
      # rust-cache set this for the job; with it gone, set it here.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt
      - name: Restore the cargo cache (release-asset store)
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-overlay-check
          # Its pruned target measured 3,038 MB on the first publish (#1954),
          # too close to the default 4000 to leave room for accretion.
          max-target-mb: "6000"
      - name: cargo check tunnel-core (overlay-l3 + overlay-netstack)
        run: cargo check -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack

      # This job checked tunnel-core ONLY, so `roomlerd`'s `cfg(unix)` code
      # was never compiled for macOS anywhere except a release-tag build — and
      # that has now broken a release three times, always the same way: a libc
      # declaration that differs between Linux and macOS.
      #
      #   `vec![0i8]`               — c_char is u8 on aarch64
      #   `setgroups(len)`          — macOS takes c_int
      #   `openpty(.., *const ..)`  — macOS declares termp/winp as *mut  ← rc.422
      #
      # Every one of those passed x86_64-linux and Windows and was invisible
      # until tag time. `ssh-server` because that is where the raw libc lives
      # (`src/pty.rs`, `exec.rs`'s privilege drop); check-only, so it costs a
      # compile and not a link.
      - name: cargo check agent (ssh-server — the raw-libc surface)
        run: cargo check -p roomlerd --lib --features ssh-server

      # The capture path is the OTHER macOS-only surface, and until rc.454 it
      # compiled nowhere but a release tag either. It now calls
      # `Frame::bytes_per_row()` from the vendored scrap fork behind
      # `#[cfg(target_os = "macos")]` — a cfg arm that exists on exactly this
      # target. `scrap-capture` also pulls in the quartz backend itself, so
      # this is the only lane that type-checks the fork at all.
      - name: cargo check agent (scrap-capture — the macOS capture surface)
        run: cargo check -p roomlerd --lib --features scrap-capture

      # FR-27 — the native AppKit consent panel. `--bins` as well as `--lib`,
      # and that is the whole point: this feature ALSO changes `main.rs`, which
      # is a separate crate root, to move tokio off the main thread so AppKit
      # can pump. A `--lib` check would compile the panel and miss the swap
      # entirely — the exact escape rc.454 hit, one feature over.
      - name: cargo check agent (viewer-indicator-macos — the AppKit panel + the main-thread swap)
        run: cargo check -p roomlerd --lib --bins --features viewer-indicator-macos

      # `--bins`, because `--lib` alone was not enough. main.rs is a SEPARATE
      # crate root: a `#[cfg(target_os = "macos")]` block there referring to a
      # lib module needs `roomlerd::`, and a bare path compiles nowhere —
      # but nothing on this lane ever built the binary, so rc.454's startup
      # permission preflight passed every check and then failed on master.
      # Same "invisible until a Mac compiles it" class this whole job exists
      # for, one crate root over.
      - name: cargo check agent BINARY (macOS cfg arms in main.rs)
        run: cargo check -p roomlerd --bins --features scrap-capture

      # FR-90 P1h — agent sessions on macOS (`cfg(hive_host)`): the launcher,
      # the harness's paths, its process lifetime (`hive/procs.rs` calls
      # `proc_pidinfo`, which exists only here) and main.rs's `wind_down` arm.
      # Then the supervisor's own tests, which need nothing a Mac runner lacks:
      # a fake harness, a Unix socket and a loopback sidecar. Before this, the
      # supervisor had never compiled for a Mac at all. FR-90 P3-5b-1:
      # `vault_proxy::`, the vault's proxy engines (the system's roots read
      # from the Mac's keychain here), which `vault::` does not match.
      # FR-97 P6e-2: `macos_supervisor::` rides the same test build. Its crash
      # classifier reads Darwin's signal numbers off a wait status, and a Mac
      # is the only runner where they are checked against `libc`.
      - name: cargo check + test agent sessions on macOS (FR-90 P1h — `hive`)
        run: |
          cargo check -p roomlerd --lib --bins --features hive,vault
          cargo test -p roomlerd --lib --features hive,vault -- hive:: vault:: vault_proxy:: macos_supervisor::

      # FR-85 — the release feature set (`full`, less the vendored FFmpeg
      # and libvpx), which carries `recording` again (P4c, after the
      # canaries). Still named, so the recorder's macOS arms (the unix
      # identity rule, the Movies folder, the microphone refusal, the
      # `record` subcommand in main.rs) keep compiling here, and never for
      # the first time at TAG time, even if it is held out of `full` again.
      - name: cargo check agent with the release feature set (FR-85 — `full`, recording included)
        # `full` carries `audio`, and audiopus_sys builds its bundled libopus
        # with CMake, whose CMakeLists declares a minimum below 3.5 that
        # current CMake refuses. The release builds set the same variable on
        # every platform; the first run of this step failed on exactly that.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo check -p roomlerd --lib --bins --features full,recording

      # The desktop companion ships on macOS from rc.455 and owns the
      # permissions panel — the one surface that tells an operator why their
      # remote screen is blank. Its macOS arms (the TCC probes, `open` for the
      # Settings pane) exist on exactly this target.
      - name: cargo check the desktop companion
        run: cargo check -p roomler-desktop

      - name: Lint the macOS packaging
        # A malformed plist or postinstall only fails at INSTALL time, on
        # someone's Mac, with launchctl's famously unhelpful diagnostics.
        # Both checks are free here.
        run: |
          set -euo pipefail
          for p in agents/roomlerd/packaging/macos/*.plist; do
            plutil -lint "$p"
          done
          bash -n agents/roomlerd/packaging/macos/postinstall
          # The daemon plist must point at a path the .pkg actually creates,
          # and must NOT reuse the LaunchAgent's Label — launchctl would
          # refuse the second bootstrap and the failure reads as "already
          # loaded" rather than "you shipped one label twice".
          # Every launchd job this package installs must have a DISTINCT Label:
          # launchctl refuses the second bootstrap of a duplicate and the error
          # reads "already loaded" rather than "you shipped one label twice".
          #
          # Globbed on `com.roomler.*` — the launchd jobs — rather than every
          # .plist in the directory, which also holds entitlements.plist (a
          # codesign input with no Label at all).
          labels=$(for p in agents/roomlerd/packaging/macos/com.roomler.*.plist; do
                     plutil -extract Label raw "$p" \
                       || { echo "::error::$p has no Label"; exit 1; }
                   done)
          echo "$labels" | sed 's/^/  label: /'
          # agent + daemon + desktop. A lower count means a job stopped being
          # globbed, which would silently make the duplicate check vacuous.
          count=$(echo "$labels" | grep -c .)
          [ "$count" -ge 3 ] || { echo "::error::expected >=3 launchd jobs, found $count"; exit 1; }
          dupes=$(echo "$labels" | sort | uniq -d)
          [ -z "$dupes" ] || { echo "::error::duplicate launchd Label(s): $dupes"; exit 1; }
          # FR-46 P5b — the daemon plist must point INSIDE the bundle, at the
          # renamed executable. This assert is why a half-done rename cannot ship:
          # a plist still naming the old path installs fine and the daemon simply
          # never starts, which reads as "the overlay is down", not as a typo.
          grep -q '/Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd' \
            agents/roomlerd/packaging/macos/com.roomler.daemon.plist

      - name: macOS overlay against a real utun
        # The macOS arms of add_address_sync / add_peer_route /
        # add_cidr_route / assign_derived_v6 were no-ops until now, so none
        # of them had ever run anywhere. Compiling them is not evidence —
        # a hardcoded interface name compiles fine and addresses an
        # interface that does not exist, which is precisely what was wrong.
        #
        # This runner has sudo and utun, so the code gets exercised instead
        # of trusted. Built as the normal user and only RUN under sudo, so
        # root never takes ownership of the cargo cache.
        run: |
          BIN=$(cargo test -p roomler-ai-tunnel-core --features overlay-l3 --lib \
                  --no-run --message-format=json \
                | jq -r 'select(.profile.test == true) | .executable' | head -1)
          echo "test binary: $BIN"
          sudo ROOMLER_TUN_KERNEL_TEST=1 "$BIN" macos_kernel_tests \
            --test-threads=1 --nocapture

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-overlay-check
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

  windows-overlay-clippy:
    # Windows-only code was entirely UN-LINTED: the Rust lanes run on
    # ubuntu-latest, so their `-D warnings` never compiles the 66
    # `#[cfg(windows)]` sites in overlay/ (wfp.rs alone is 456 LOC), the
    # win_service supervisor, or the Windows halves of tun.rs/dns.rs/nat.rs.
    # A dead-code warning shipped in rc.359 sat invisible for 5 rc's
    # because only local Windows builds ever saw it (2026-08-14 audit).
    #
    # Crate-scoped on purpose — a workspace-wide `--all-features` clippy
    # does NOT build on Windows (audiopus pulls cmake); these two lanes
    # mirror the Linux feature lanes and the local dev gates exactly.
    # `--all-targets`/`--tests` included: test-only code is where the
    # first fix wave's lints lived (constant asserts, guard-across-await).
    name: Windows overlay clippy
    runs-on: windows-latest
    timeout-minutes: 40
    # FR-6 wave 22: the cache publishes as a release asset; see macos-overlay-check.
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt
      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): see macos-overlay-check and the action.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: windows-clippy
      - name: Clippy tunnel-core (overlay-l3 + overlay-netstack, all targets)
        run: cargo clippy -p roomler-ai-tunnel-core --features overlay-l3,overlay-netstack --all-targets -- -D warnings
      # `ssh-server` is in the set because this is the ONLY lane that lints the
      # Windows ConPTY implementation — it is `#[cfg(windows)]` AND behind that
      # feature, so every Linux lane compiles straight past it. It ships in all
      # four release feature sets, so without this a lint failure there would
      # surface at TAG time, on the slowest possible feedback loop. `overlay-l3`
      # stays in the same invocation deliberately: it is what makes tunnel-core's
      # helpers reachable, and dropping it turns pre-existing dead-code warnings
      # into errors that have nothing to do with the change under test.
      # `hive` (FR-90 P1i): agent sessions on Windows, which no release build
      # carries yet, so this is the only place their code is linted.
      - name: Clippy roomlerd (overlay-l3 + ssh-server + hive, incl. tests)
        run: cargo clippy -p roomlerd --features overlay-l3,ssh-server,hive,vault --tests -- -D warnings
      # FR-92 P10b — the LocalAPI crate's Windows half ran in NO lane: its
      # tests run on Linux, where every `#[cfg(windows)]` test compiles out,
      # and tunnel-core's clippy above builds only its library. That half is
      # the named pipe the person's tray and CLI dial, the peer read from the
      # OS at accept time, and (P10b) the token probe that refuses a SYSTEM
      # caller keep busy's On.
      - name: LocalAPI on Windows — clippy + unit tests (FR-92 P10b)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p roomler-localapi --all-targets -- -D warnings
          cargo test -p roomler-localapi --lib
      # FR-90 P1i — a Windows session's launcher: a process started SUSPENDED
      # into a Job Object, with the session's variables over the user's
      # environment; ending or closing the job ending what it started; the
      # console-user mapping, the harness and its command line, and
      # `roomlerd hive-prep`. The whole `win_service::supervisor` suite runs
      # here too: it ran in no lane before. P1i-2: `hive::` as Windows compiles
      # it: the toolbelt over its named pipe, processes by creation time, the
      # store's file in a DACL'd directory. (The supervisor's own tests drive a
      # `/bin/sh` stand-in for Claude Code, and run on Linux and macOS.)
      # #2010: `win_service::tests` — the SCM host's own (the STOP_PENDING
      # report and its order against the supervisor), also in no lane before.
      # #2465: `win_service::orphan` — which roomlerd is an earlier host's
      # worker, and the reaper's reads through a real process handle.
      # FR-90 P3-5b-1: `vault_proxy::` — the vault's proxy engines, against a
      # fake upstream over real TLS. `proxy` is the only mode a session on
      # Windows gets (decision 17), and `vault::` does not match the module.
      # FR-90 P3-8-2a: `ssh_service::` — the SYSTEM service's claim and publish
      # are `cfg(windows)`, so no other lane runs what they say of one command.
      - name: Agent sessions on Windows — unit tests (FR-90 P1i)
        if: ${{ !cancelled() }}
        # A block scalar: `hive:: ` holds `: `, which a plain YAML scalar reads
        # as a mapping, and then this whole file fails to parse.
        run: |
          cargo test -p roomlerd --lib --features overlay-l3,ssh-server,hive,vault -- hive:: hive_win win_service::supervisor win_service::tests win_service::orphan vault:: vault_proxy:: ssh_service::

      # FR-99 P1b — the overlay behind `viewer-indicator`: the "being viewed"
      # border and badge, the native consent panel, and the privacy curtain
      # (its capture exclusion set before it shows and read back after). It
      # is `#[cfg(windows)]` AND behind that feature, so no PR lane compiled
      # it: a mistake there surfaced at TAG time. `privacy::` runs too, because
      # only this build has a curtain that can be possible.
      - name: The overlay and the privacy curtain — clippy + unit tests (FR-99 P1b)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p roomlerd --lib --features viewer-indicator -- -D warnings
          cargo test -p roomlerd --lib --features viewer-indicator -- privacy:: indicator::

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: windows-clippy
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

  windows-recorder:
    # FR-85 P1e — the recorder's identity rule is Windows code that no other
    # lane compiles: every recorder test step above runs on Linux, and the
    # Windows job lints overlay + ssh-server only. It is the code that keeps
    # a recording from ever being made elevated (a restricted, medium copy of
    # an elevated worker's token) and keeps the daemon's reads and deletes in
    # the person's folder to the person's own rights (impersonation).
    #
    # ⚠️ GitHub's Windows runner is ELEVATED, which is what makes this lane
    # worth having: the elevated branch of each cell runs for real.
    # `ROOMLERD_TEST_REQUIRE_ELEVATED` turns a runner that is not elevated
    # into a failure instead of a quiet skip that proves nothing.
    #
    # A job of its own (not a step of the one above) so the recorder's
    # openh264 build does not spend that job's timeout, and without `audio`:
    # audiopus pulls cmake, which is why the Windows lanes avoid it.
    name: Windows recorder identity (FR-85)
    runs-on: windows-latest
    timeout-minutes: 45
    # FR-6 wave 22: the cache publishes as a release asset; see macos-overlay-check.
    permissions:
      contents: write
    env:
      ROOMLERD_TEST_REQUIRE_ELEVATED: "1"
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt
      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): see macos-overlay-check and the action.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: windows-recorder
      - name: Clippy roomlerd (recording, incl. tests)
        run: cargo clippy -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --tests -- -D warnings
      - name: The identity rule — unit tests (the table, argv, env, impersonation)
        run: cargo test -p roomlerd --lib --features recording,openh264-encoder,synthetic-frame-source -- recording::launch --nocapture
      # #1727 — not the recorder, but this is the one lane that builds
      # roomlerd's lib tests on Windows, and `win_service` is Windows-only:
      # its units ran in NO lane before. The same test binary as the step
      # above, so it costs seconds. What an MSI install with no
      # ENABLE_SYSTEM_CONTEXT does is decided here.
      - name: The installer's SystemContext record — unit tests (#1727)
        if: ${{ !cancelled() }}
        run: cargo test -p roomlerd --lib --features recording,openh264-encoder,synthetic-frame-source -- win_service::system_context_attempt --nocapture
      # Runs even when the unit step failed: the two prove different halves
      # (the child's integrity, the daemon's impersonation), and one red must
      # not hide the other's evidence.
      - name: The identity rule — the recorder launched as the person, end to end
        if: ${{ !cancelled() }}
        run: cargo test -p roomlerd --features recording,openh264-encoder,synthetic-frame-source --test recorder -- process::an_elevated process::the_manager_records_as_the_person --nocapture
      # FR-85 P1d — the pointer's Windows half sits in code no lane compiled:
      # WGC, the live cursor tracker and scrap's DXGI path are built only by
      # release-agent.yml, at tag time. `wgc-capture`, `mf-encoder` and
      # `scrap-capture` bring them in. The units: a recording's WGC session
      # draws the pointer and the live one does not (unless
      # ROOMLERD_WGC_CURSOR=1), and the pointer's placement.
      - name: The recorder's pointer — Windows capture compiles, lints, and its units pass
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p roomlerd --features recording,openh264-encoder,wgc-capture,mf-encoder,scrap-capture --tests -- -D warnings
          cargo test -p roomlerd --lib --features recording,openh264-encoder,wgc-capture,mf-encoder,scrap-capture -- capture::pointer capture::wgc_backend::tests::only_a_recording_or_the_escape_hatch_bakes_the_pointer

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: windows-recorder
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

  ffmpeg-encoder-check:
    # `ffmpeg-encoder` compiled in NO pull-request lane. It needs a vendored
    # FFmpeg 9.0.1 (Ubuntu apt ships 6.1 and `ffmpeg-next = 9.0` needs 9.x),
    # so the only place it has ever been built is release-agent.yml — at TAG
    # time, on the slowest feedback loop there is.
    #
    # That is the exact shape as the macOS job above, which exists because
    # tag-time-only compilation broke three releases in a row. This one guards
    # the main video pump's hardware-encoder backend, so the same accident
    # here fails a release after every other artifact has already built.
    #
    # A SEPARATE job rather than a step in `rust`, deliberately: that job has a
    # 20-minute timeout against a 4-5 minute warm baseline, and the timeout is
    # load-bearing (it turns an apt-mirror stall into a fast, loud failure).
    # Bolting a from-source FFmpeg-linked compile onto it would spend that
    # headroom and make the timeout meaningless.
    name: ffmpeg-encoder compile + dispatch locks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: ci-ffmpeg-encoder
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Same ordering requirement as the Rust lanes' system-deps composite
      # (./.github/actions/ci-linux-system-deps): the index must be fresh
      # BEFORE the cached-apt step, or a cache miss resolves superseded
      # versions, 404s, and saves an EMPTY set under the key — poisoning it for
      # every later run. This job had no refresh at all before its cache step
      # (its apt-retries step sits ~400 lines further down, long after this),
      # so `ci-ffmpeg-*` was one superseded libvpx version away from the same
      # outage the GTK set just caused.
      - name: Configure apt retries and refresh the index
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          sudo apt-get update -qq

      - name: Install build deps (cached apt)
        # libclang is bindgen's runtime requirement (ffmpeg-sys-next and
        # env-libvpx-sys both generate FFI at build time); pkg-config is how the
        # vendored FFmpeg tree is found; libvpx-dev is needed because this lane
        # lints WITH `vp9-444` — see the clippy step for why that matters.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libclang-dev libvpx-dev
          # v2 -> v3 on 2026-09-23 (#1593) on the same wrong premise as
          # `ci-vpx` (see the vp9-444 lane): the entry was full, and the
          # warning was the guard's stale-ld.so.cache false positive.
          # Harmless, not needed.
          version: ci-ffmpeg-v3
      # Same self-heal as the vp9-444 lane (2026-09-04: a silent empty cache
      # restore left `libvpx.so.9` missing at test-binary load, exit 127),
      # including its `sudo ldconfig` — without it this check misreads every
      # cache HIT as "not delivered" (see the vp9-444 lane's comment).
      - name: Verify libvpx really landed (fallback to apt-get)
        run: |
          sudo ldconfig
          if ! ldconfig -p | grep -q 'libvpx\.so'; then
            echo "::warning::cached apt set did not deliver libvpx — installing directly"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libvpx-dev
          fi
          ldconfig -p | grep 'libvpx\.so' || { echo "::error::libvpx.so still not loadable after the fallback install"; exit 1; }
      - name: Fetch vendored FFmpeg 9.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The SAME artifact release-agent.yml consumes, so this lane and the
          # tag build cannot disagree about what "the FFmpeg backend" compiles
          # against. Minimal build: exactly the ten encoders the cascade
          # dispatches, whole lib dir ~2.5 MB.
          gh release download vendored-ffmpeg-9.0.1 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz' \
            --dir /tmp/ffdl
          sudo mkdir -p /opt/roomler-ffmpeg
          sudo tar xf /tmp/ffdl/ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz \
            -C /opt/roomler-ffmpeg --strip-components=1
          # The .pc files hardcode the vendor machine's prefix.
          sudo sed -i "s|^prefix=.*|prefix=/opt/roomler-ffmpeg|" \
            /opt/roomler-ffmpeg/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=/opt/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=/opt/roomler-ffmpeg/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/roomler-ffmpeg/lib"
          } >> "$GITHUB_ENV"
      - name: Prove pkg-config resolved the VENDORED tree
        # ⚠️ Without this, a silent fall-through to some system FFmpeg would
        # make the lane pass against a library the release never ships — a
        # green tick that proves nothing, which is the failure mode this
        # whole class of gate exists to avoid. Assert the prefix, not the
        # version: the prefix is the property that distinguishes the two.
        run: |
          set -euo pipefail
          prefix=$(pkg-config --variable=prefix libavcodec)
          echo "libavcodec $(pkg-config --modversion libavcodec) from $prefix"
          if [ "$prefix" != "/opt/roomler-ffmpeg" ]; then
            echo "::error::pkg-config resolved libavcodec to '$prefix', not the vendored tree — this lane would be testing the wrong library"
            exit 1
          fi
      - name: Clippy agent --features ffmpeg-encoder + vp9-444 (incl. tests)
        # This code was UNLINTED. `--workspace` clippy never compiles it (the
        # feature is opt-in), and #672 added compile+test here but left lint out
        # because the feature "had pre-existing warnings" — which is circular:
        # it stayed unlinted BECAUSE it was unlinted. Opt-in features are
        # exactly where lints accumulate unseen; same argument as the Windows
        # overlay lane above, where a dead-code warning sat invisible 5 rc's.
        #
        # ⚠️ `vp9-444` is in the set ON PURPOSE, and dropping it makes this lane
        # LIE. Four of the "pre-existing warnings" were `dead_code` on
        # `on_encoder_rebuilt_mirror_only`, `PipelineKey::Vp9Dc`,
        # `quality_state` and `min_quality` — all of which ARE used, from call
        # sites inside `#[cfg(feature = "vp9-444")]` functions in peer.rs. Lint
        # a feature set no one ships and you get findings that are artifacts of
        # the configuration; "fixing" them by deleting would have broken every
        # real build. Keep this set a subset of what release-agent.yml builds.
        #
        # `--all-targets` so test-only lints fire, matching the repo rule.
        run: cargo clippy -p roomlerd --features ffmpeg-encoder,vp9-444,vp9-444-bindgen --all-targets -- -D warnings

      - name: Test agent --features ffmpeg-encoder
        # Test, not merely check. The ten encoder names the cascade dispatches
        # (`*_nvenc`/`*_qsv`/`*_amf` x h264/hevc/av1, plus `vp9_qsv`) are locked
        # by unit tests, and those locks are exactly what keeps the minimal
        # vendored build and the dispatch table from drifting apart — a drift
        # that is invisible until a device silently falls back to software.
        # They need the library present, not a GPU.
        run: cargo test -p roomlerd --features ffmpeg-encoder --lib

  recording-ffmpeg:
    # FR-85 P4 — the recorder and the export engine against the vendored
    # FFmpeg that carries the AAC encoder and the H.264 decoder (the
    # `-h264dec-aac` asset, built by vendor-ffmpeg-*.yml from `fr85-p4`).
    #
    # The `rust` job's recorder step builds WITHOUT `ffmpeg-encoder`, so it
    # proves the Opus path only; `ffmpeg-encoder-check` links FFmpeg but not
    # `recording`. Nothing else compiles the two together, and the codec a
    # recording carries is decided by exactly that pairing at runtime.
    #
    # ⚠️ `ROOMLER_EXPECT_FFMPEG_AAC=1` turns "this FFmpeg has no AAC encoder"
    # from a skip into a FAILURE, and `ROOMLER_EXPECT_FFMPEG_H264_DECODER=1`
    # does the same for the decoder. Without them, a wrong asset (or a flip
    # back) would fall back to Opus and to `decoder_unavailable`, and every
    # test here would pass on the path this lane exists NOT to take.
    #
    # Its own job, like `ffmpeg-encoder-check`: a feature set nothing else
    # builds is a cold compile, and it must not spend another job's timeout.
    # Until P4c flips the release assets, this lane is the only thing that
    # runs the AAC path, or FFmpeg's H.264 decoder, at all.
    name: Recording with FFmpeg — AAC and H.264 decode (FR-85 P4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # ⚠️ `vp9-444` rides along ON PURPOSE, as in `ffmpeg-encoder-check`:
      # every shipped build that has `ffmpeg-encoder` has it, and without it
      # clippy reports `dead_code` on items that ARE used — from call sites
      # inside `#[cfg(feature = "vp9-444")]` functions in peer.rs.
      REC_FEATURES: recording,openh264-encoder,synthetic-frame-source,audio,ffmpeg-encoder,vp9-444,vp9-444-bindgen
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: ci-recording-ffmpeg
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Configure apt retries and refresh the index
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          sudo apt-get update -qq
      - name: Install build deps
        # libclang: bindgen (ffmpeg-sys-next, env-libvpx-sys). libasound2-dev:
        # cpal, for `audio`. cmake: libopus from source (audiopus_sys).
        # libvpx-dev: `vp9-444` (see the job's env). Plain apt, not the cached
        # action — a handful of packages do not pay for a cache key that can
        # silently restore nothing.
        run: sudo apt-get install -y --no-install-recommends pkg-config libclang-dev libasound2-dev cmake libvpx-dev
      - name: Fetch the vendored FFmpeg with the AAC encoder + H.264 decoder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download vendored-ffmpeg-9.0.1 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz' \
            --dir /tmp/ffdl
          sudo mkdir -p /opt/roomler-ffmpeg
          sudo tar xf /tmp/ffdl/ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz \
            -C /opt/roomler-ffmpeg --strip-components=1
          # The .pc files hardcode the vendor machine's prefix.
          sudo sed -i "s|^prefix=.*|prefix=/opt/roomler-ffmpeg|" \
            /opt/roomler-ffmpeg/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=/opt/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=/opt/roomler-ffmpeg/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/roomler-ffmpeg/lib"
          } >> "$GITHUB_ENV"
      - name: Prove pkg-config resolved the VENDORED tree
        run: |
          set -euo pipefail
          prefix=$(pkg-config --variable=prefix libavcodec)
          echo "libavcodec $(pkg-config --modversion libavcodec) from $prefix"
          if [ "$prefix" != "/opt/roomler-ffmpeg" ]; then
            echo "::error::pkg-config resolved libavcodec to '$prefix', not the vendored tree — this lane would be testing the wrong library"
            exit 1
          fi
      - name: Clippy the recorder with FFmpeg (incl. tests)
        run: cargo clippy -p roomlerd --features "$REC_FEATURES" --all-targets -- -D warnings
      - name: The recorder and the export record AAC and edit hardware recordings — never a quiet fallback
        # `--lib recording::`: the encoder (1024-sample frames, the declared
        # priming, the standard AudioSpecificConfig) and a click that must
        # decode exactly as far after the first video frame as it was made;
        # `decode`: High profile is readable here. `--test recorder`: a
        # recording's track is AAC end to end, and its sidecar says so.
        # `--test export`: an export writes AAC, a recording whose own track
        # is AAC is read back through the edit, and the committed NVENC
        # recordings (High, High 4:4:4) export frame for frame through
        # FFmpeg's H.264 decoder — the same tests that, in the `rust` job's
        # recorder step (no FFmpeg), prove they are refused
        # `decoder_unavailable` by name.
        env:
          ROOMLER_EXPECT_FFMPEG_AAC: "1"
          ROOMLER_EXPECT_FFMPEG_H264_DECODER: "1"
        run: |
          cargo test -p roomlerd --features "$REC_FEATURES" --lib recording::
          cargo test -p roomlerd --features "$REC_FEATURES" --test recorder
          cargo test -p roomlerd --features "$REC_FEATURES" --test export

  fr-registry:
    name: FR registry integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The FR registry is not documentation -- it is the mechanism that
    # ARBITRATES FR-number collisions between parallel sessions. The standing
    # rule is "claim the number by adding your row to docs/fr/README.md in the
    # SAME commit as the spec", precisely so git rejects the loser's push
    # instead of two sessions discovering the clash after both have published.
    # That only holds while the row and the spec travel together.
    #
    # They stopped, and nothing noticed. Master carried an FR-52 row whose spec
    # had NEVER been on master -- carried in as a passenger by a PR about FR-49
    # and FR-50 -- so the registry advertised a claimed number, linked to a 404,
    # and documented nothing for two days. It also made the real FR-52 PR
    # unmergeable (both sides added the row), so that stalled silently with
    # every check green.
    #
    # A spec with no row is the worse half: it fails no build and no test, and
    # simply leaves the next session free to take the same number.
    steps:
      - uses: actions/checkout@v4
      - name: Audit the FR registry
        run: bash scripts/fr-registry-audit.sh

  anchor-ranges:
    name: No inverted anchor ranges in the docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The docs point into the code by line (`file.rs:N-M`, `#LN-LM`), and every
    # merge that moves code re-shifts those numbers. A shift that moves only
    # the START of a range leaves `file.rs:2088-2087`, which no build, test or
    # link check notices: the file exists and both numbers are in range. There
    # were 31 on master when this landed (2026-10-21), all half-shifted. They
    # are pinned in scripts/anchor-range-baseline.txt. The audit fails on any
    # NEW one, and on a pinned one that is gone, so the baseline only shrinks.
    steps:
      - uses: actions/checkout@v4
      - name: Audit anchor ranges
        run: bash scripts/anchor-range-audit.sh

  mermaid-sequences:
    name: Every mermaid sequence diagram parses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mermaid's sequence lexer ends a message's text at a `;` (a statement
    # separator) or a `#` (a comment). With a `;` GitHub draws "Unable to
    # render rich display: Parse error" where the diagram should be; with a
    # `#` the message is silently cut short. There were 69 such lines on
    # master when this landed (2026-10-21), across 24 docs, and no build,
    # test or link check noticed. Mermaid's entity codes (`#59;`, `#35;`,
    # `#lt;`) are decoded before the lexer runs, so they spell either one.
    steps:
      - uses: actions/checkout@v4
      - name: Audit mermaid sequence diagrams
        run: bash scripts/mermaid-sequence-audit.sh

  machine-names:
    name: No real machine names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This repo is PUBLIC, and field notes are written in the heat of debugging
    # — which is exactly when someone writes down the name of the machine they
    # are debugging. Committed hostnames are reconnaissance value: they map the
    # fleet and say which host runs what.
    #
    # SHAPE-based, not name-based, so it needs no secret: the map that pairs
    # each real name with its replacement lives outside the repo and must stay
    # there. Shape is also the stronger test — the 2026-08-30 whole-history
    # sweep applied a four-name map to every blob, message and issue, and this
    # scan still found two machines nobody had ever listed, one of them
    # published in an FR spec since the PR that created it.
    #
    # ⚠️ Its OWN job, deliberately, and a 5-minute one: it is the REQUIRED
    # status check on master, so it must not be welded to the 30-minute Rust
    # suite. It was a step inside `Rust checks` until 2026-09-04, which made it
    # unusable as a required check and gave it no separate signal.
    #
    # When it fires: add the real name to the map (outside the repo), re-run
    # the sweep, and let this go green. NEVER add a real name to the allowlist.
    # See .claude/skills/sanitize-hostnames/SKILL.md.
    steps:
      - uses: actions/checkout@v4
      - name: Guard self-test, then scan
        run: |
          # The selftest plants a canary of every shape IN BOTH CASINGS and
          # asserts the guard FAILS, then asserts it passes on the real tree.
          # It runs first because this guard has silently self-disarmed four
          # times and every symptom was a confident "none found" — most
          # recently by matching uppercase only, while the leak that got
          # through was written in lowercase.
          bash .claude/skills/sanitize-hostnames/selftest.sh
          python3 .claude/skills/sanitize-hostnames/check_shapes.py --root .

  commit-identity:
    name: No foreign commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The sibling of `No real machine names`, one layer over. That job asks
    # whether the CONTENT names a real machine; this asks whether the COMMIT
    # names a real person we did not mean to publish.
    #
    # Neither can see the other's surface. A commit's author and committer are
    # METADATA — they are in no blob and no message, so the shape scan walks
    # straight past them — and this repo is PUBLIC, so an address from a corp
    # mailbox names an employer beside a personal project in every clone,
    # forever.
    #
    # Why it exists: an audit on 2026-09-05 found a second GitHub account (a
    # corp one, whose LOGIN alone named an employer) had authored an issue and
    # three comments here. It had authored no commits, and that was luck rather
    # than design — nothing anywhere checked, while 520 commits already in this
    # history carried a corp mailbox as their author address.
    #
    # ⚠️ An ALLOWLIST, not a denylist, and the reason is structural rather than
    # stylistic: a denylist of unwanted addresses would have to write them into
    # a public file, publishing exactly what the guard exists to remove. It
    # would also only find the mistakes someone already thought of. Same
    # reasoning as check_shapes.py being shape-based rather than map-based — a
    # denylist finds the identities you know about, an allowlist finds the class.
    #
    # ⚠️ `--require-commits` is load-bearing. Without it an empty range answers
    # "all known" over zero commits, which is indistinguishable from a real
    # pass — the same defect as a `cargo test` filter matching no test, which
    # this repo's integration lane already shipped once.
    #
    # ⚠️ A merge made through the GitHub web UI is created ON GitHub from the
    # email set on the ACCOUNT, after every local hook and PR check has already
    # passed — so nothing can BLOCK it here. A ruleset would, but the whole
    # metadata-rule family is organisation-and-paid-plan only and is refused
    # with HTTP 422 on this user-owned repo (measured 2026-09-06).
    #
    # This job's `push` trigger is therefore the backstop: it scans
    # `event.before..sha` and turns master red within a minute. Detection, not
    # prevention — but the alternative was finding out in an audit eleven days
    # later, which is how the leak that prompted all this was found.
    #
    # ⚠️ The `event.before` fallback below is load-bearing, and was exercised on
    # its first real run: after a force-push that SHA no longer exists, and
    # `git log A..B` against a missing A is an error, not a pass.
    steps:
      - uses: actions/checkout@v4
        with:
          # The identity check reads commits, so it needs their objects. The
          # default shallow checkout has the PR head but not the base, and
          # `base..head` against a missing base is an error, not a pass.
          fetch-depth: 0

      - name: Guard self-tests, then scan the commits this PR adds
        run: |
          # Selftests first, and both of them: a guard nobody has watched FAIL
          # is not evidence of anything. The sibling shape guard has silently
          # self-disarmed four times and every symptom was a confident pass.
          bash .githooks/check-identity-selftest.sh
          bash .claude/hooks/gh-account-guard-selftest.sh

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # ⚠️ A history rewrite (the sanitize-hostnames sweep) force-pushes
            # master and every open PR's head together, and the synchronize
            # event that fires for a PR can still name the PRE-rewrite base,
            # which no longer exists. `git log A..B` against a missing A is an
            # error (exit 20), not a pass: measured 2026-10-21 on two open
            # PRs. The fork point on the CURRENT base branch selects the same
            # commits, so fall back to it -- the PR twin of the push path's
            # missing-BEFORE fallback below.
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "$HEAD_SHA")
            fi
            RANGE="$BASE..$HEAD_SHA"
          else
            # A push to master. `github.event.before` is the zero sha for the
            # first push to a new branch and for a force-push over a deleted
            # ref; fall back to the single head commit rather than scanning
            # nothing or the whole history.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          echo "range: $RANGE"
          bash .githooks/check-identity.sh --require-commits --range "$RANGE"

  name-audit:
    name: Retired-name audit (FR-21)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # FR-21 (#809). Two assertions, and the PAIR is what makes it sound while the
    # migration is still in flight:
    #
    #   1. unclassified must not RISE   -> nobody adds a fresh retired name
    #   2. anchors must not FALL        -> nobody deletes a dual-read fallback
    #
    # (2) is the half a plain ratchet misses, and it is the half that matters:
    # deleting an anchor fails no build and no test, it just strands every
    # pre-rename host at its next update. The macOS `.app` anchor is the worst
    # case -- its name keys the TCC grants.
    #
    # P5: this job now BLOCKS. It was `continue-on-error` while P1-P4 were in
    # flight, because a job that is red for a whole program trains people to
    # ignore it — but an advisory guard nobody ever flips is a guard that does
    # nothing, so the flip is the phase.
    #
    # P7: now `--check --strict`. Every remaining occurrence was resolved one
    # at a time, so `unclassified == 0` and the third assertion is live:
    #
    #   3. unclassified must be ZERO -> every retired name left in the tree is
    #      marked, and the marker says WHY the name is still real
    #
    # That is the assertion worth having. (1) only says the number stopped
    # growing; (3) says a reader can no longer meet a retired name without an
    # explanation next to it, and the ~730 anchored sites are the map of what
    # the field still depends on — RPATHs, published asset names, legacy service
    # and task names, the macOS bundle whose name keys the TCC grants, the QUIC
    # ALPN, and the pre-rename appdirs tree.
    #
    # (1) and (2) stay: strict alone would accept deleting an anchor and its
    # dual-read fallback together, which is exactly the change that strands a
    # fleet while every build and test stays green.
    #
    # The job also fails on a shebang that is not on line 1 — the anchor
    # system's own failure mode, which broke the macOS .pkg on this branch.
    steps:
      - uses: actions/checkout@v4
      - name: Audit retired product names
        run: bash scripts/name-audit.sh --check --strict
      - name: Report (always, so a red run shows WHAT moved)
        if: always()
        run: bash scripts/name-audit.sh --summary

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        # Pin bun to match local reproducible builds; setup-bun@v2 with
        # no version input resolves to `latest`, which has silently
        # shipped regressions that broke `vue-tsc --noEmit` for us in
        # the past. Local 1.3.12 on Windows + Linux (WSL) passes, so
        # we pin there and bump intentionally.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # `ui/bun.lock` is the text-format lockfile bun 1.2+ writes.
          # The older `bun.lockb` binary format isn't produced by our
          # installs, so the previous key hashed a non-existent file
          # (always the empty-string hash) and the cache never varied.
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # `--frozen-lockfile` fails the build if bun.lock is missing
        # or stale. Without it the resolver silently up-versions
        # transitive deps between runs, which is how the CI frontend
        # build started diverging from local.
        run: cd ui && bun install --frozen-lockfile

      - name: Build (includes vue-tsc --noEmit)
        # Override the default runner shell to drop -e/pipefail so we
        # can capture exit codes and always flush output, and emit the
        # last 30 lines as ::error:: annotations so the failure mode
        # is visible via the anonymous GitHub API (annotations endpoint
        # is publicly readable for public repos; step summaries and
        # raw logs are not without auth).
        shell: bash --noprofile --norc {0}
        run: |
          cd ui
          echo "bun $(bun --version)"

          echo "::group::vue-tsc --noEmit"
          bun x vue-tsc --noEmit 2>&1 | tee /tmp/vue-tsc.log
          tsc_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$tsc_rc" != 0 ]; then
            {
              echo "### vue-tsc --noEmit (exit $tsc_rc)"
              echo '```'
              cat /tmp/vue-tsc.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Emit last 30 lines of tsc output as a single error
            # annotation. %0A escapes newlines per GHA workflow command
            # grammar so the annotation preserves multi-line output.
            tail -30 /tmp/vue-tsc.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::vue-tsc: /'
            exit "$tsc_rc"
          fi

          echo "::group::vite build"
          bun x vite build 2>&1 | tee /tmp/vite.log
          vite_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$vite_rc" != 0 ]; then
            {
              echo "### vite build (exit $vite_rc)"
              echo '```'
              cat /tmp/vite.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/vite.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::vite: /'
          fi
          exit "$vite_rc"

      - name: Build the docs site (FR-60)
        # `bun run build` chains `vue-tsc && vite build && bun docs/build.ts`,
        # but this job deliberately runs the first two separately so each
        # failure gets its own annotation. Without this step the docs
        # generator's BUILD GATES — dangling internal links, missing or
        # over-length descriptions, duplicate slugs, unclosed containers, a
        # search index over budget — would never run in CI, which is exactly
        # the "a job that silently runs nothing is indistinguishable from a
        # passing one" failure the integration lane already learned.
        # ⚠️ It must run AFTER `vite build`: vite empties `dist/`.
        shell: bash --noprofile --norc {0}
        run: |
          cd ui
          echo "::group::docs build"
          bun docs/build.ts 2>&1 | tee /tmp/docs.log
          docs_rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$docs_rc" != 0 ]; then
            {
              echo "### docs build (exit $docs_rc)"
              echo '```'
              cat /tmp/docs.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/docs.log | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error::docs: /'
          fi
          # The SEO files land at the site root, next to the SPA — assert
          # they exist rather than trusting the generator's own log line.
          test -f dist/sitemap.xml || { echo "::error::docs: dist/sitemap.xml missing"; exit 1; }
          test -f dist/robots.txt || { echo "::error::docs: dist/robots.txt missing"; exit 1; }
          test -f dist/docs/index.html || { echo "::error::docs: dist/docs/index.html missing"; exit 1; }
          # FR-87: /sitemap.xml is an INDEX; the docs' URLs live in its child.
          grep -q '<sitemapindex' dist/sitemap.xml || { echo "::error::docs: dist/sitemap.xml is not a sitemap index"; exit 1; }
          test -f dist/sitemap-docs.xml || { echo "::error::docs: dist/sitemap-docs.xml missing"; exit 1; }
          test -f dist/docs/404.html || { echo "::error::docs: dist/docs/404.html missing (nginx's error_page for /docs/ and /blog/)"; exit 1; }
          # FR-87 P6: nginx answers `/` without a session cookie with this
          # file, via `try_files $root_doc =404` — missing, every guest and
          # every crawler would get a 404 at the site root.
          test -f dist/home/index.html || { echo "::error::docs: dist/home/index.html missing (nginx serves it at / to guests and crawlers)"; exit 1; }
          grep -q '<loc>https://roomler.ai/</loc>' dist/sitemap-docs.xml || { echo "::error::docs: / is missing from dist/sitemap-docs.xml"; exit 1; }
          exit "$docs_rc"

      - name: Run unit tests
        run: cd ui && bun run test:unit

  # FR-69 P8 (D13) — the four reduced profiles must COMPILE, and the C++ SFU
  # worker and the tunnel stack must be ABSENT from the graphs that do not
  # sell them (AC3). `cargo clippy --workspace` above compiles the feature
  # UNION, so it can never see a profile: these checks are per package, with
  # `--no-default-features`, or they check nothing.
  #
  # One job, four sequential checks, not a 4-way matrix: every module crate
  # is a shared artifact in the cache and only the api crate's own objects
  # differ per set — a matrix would pay the cold cache four times for the
  # same result.
  profiles:
    name: Build profiles (FR-69)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Rust cache
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ci-profiles
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # `collab` is the only reduced profile that links mediasoup, whose worker
      # build wants cmake + libclang; the others need nothing beyond the
      # toolchain (python3-pip ships with the runner image). FR-6 wave 17
      # (#773): from the Rust lanes' cached apt sets rather than a raw
      # `apt-get install` against the Ubuntu mirror, which on 2026-09-30
      # 15:47–16:20Z stalled ~7.5 min fetching libclang (113 s on a 28.8 MB
      # package, then 300 s on a 5 kB one) and stretched this ~2 min job to
      # 9.3–10.6 min three runs in a row. The sets cover both packages and
      # their dependencies, and the composite carries the empty-restore guards.
      - name: Build deps for the SFU worker (collab) — cached apt, verified
        uses: ./.github/actions/ci-linux-system-deps

      - name: Check every reduced profile compiles
        run: |
          for p in collab remote mesh access; do
            echo "::group::profile-$p"
            cargo check -p roomler-ai-api --no-default-features --features "profile-$p"
            echo "::endgroup::"
          done

      # AC3 — what a profile does NOT link is the product claim. Read the
      # graph per profile and assert the absence; a `cargo tree` that lists
      # nothing is also a failure (the assertion must be able to fail).
      - name: Assert what each profile leaves out (AC3)
        run: |
          tree() { cargo tree -p roomler-ai-api --no-default-features --features "profile-$1" -e normal --prefix none 2>/dev/null | awk '{print $1}' | sort -u; }
          fail=0
          for p in remote mesh access; do
            T=$(tree "$p"); N=$(printf '%s\n' "$T" | wc -l)
            if [ "$N" -lt 100 ]; then echo "::error::profile-$p: cargo tree returned $N crates — the assertion cannot be trusted"; fail=1; fi
            if printf '%s\n' "$T" | grep -qxE 'mediasoup(-sys)?'; then echo "::error::profile-$p links mediasoup"; fail=1; else echo "  profile-$p: no mediasoup ($N crates)"; fi
          done
          T=$(tree collab); N=$(printf '%s\n' "$T" | wc -l)
          if [ "$N" -lt 100 ]; then echo "::error::profile-collab: cargo tree returned $N crates"; fail=1; fi
          if printf '%s\n' "$T" | grep -qx 'roomler-ai-tunnel-core'; then echo "::error::profile-collab links roomler-ai-tunnel-core"; fail=1; else echo "  profile-collab: no tunnel-core ($N crates)"; fi
          # And the positive control: the FULL graph must contain both, or
          # the greps above prove nothing about the names they look for.
          F=$(cargo tree -p roomler-ai-api -e normal --prefix none 2>/dev/null | awk '{print $1}' | sort -u)
          printf '%s\n' "$F" | grep -qx 'mediasoup' || { echo "::error::positive control failed: full does not list mediasoup"; fail=1; }
          printf '%s\n' "$F" | grep -qx 'roomler-ai-tunnel-core' || { echo "::error::positive control failed: full does not list roomler-ai-tunnel-core"; fail=1; }
          exit $fail
