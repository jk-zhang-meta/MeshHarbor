# FR-73 P3 (#1389) — promote a hosted image to prod: bump `newTag` in the
# deploy repo, which ArgoCD reconciles (automated + selfHeal + prune, webhook
# on the deploy repo ⇒ the roll starts within seconds).
#
# This is the HUMAN step the hosted-image lane deliberately does not take
# (FR-73 D5): a roll replaces a pod and every long-lived socket on it re-homes
# — agents reconnect, RC sessions drop, tunnels and DERP re-register — so
# which merge becomes prod, and when, stays a decision. Every roll is then
# field-verified from the fleet as before (CLAUDE.md, "field-validate via
# exec after every roll"); this workflow only proves the public /health
# answers again.
#
# Needs ONE operator-created secret: `DEPLOY_REPO_TOKEN`, a fine-grained PAT
# scoped to the private deploy repository with Contents: read and write. It
# lives on the `release` ENVIRONMENT (next to the signing credentials), so
# the job declares that environment — an environment secret is invisible to
# a job that does not. Without it the job prints the exact bump it would
# have made and stops with a warning — the manual bump (any machine with the
# deploy repo) still works. With it, the job first PROVES it can write (an
# empty commit pushed with --dry-run: the server checks push permission on
# receive-pack, nothing lands), so a read-only or expired token fails here
# with a clear message rather than after the bump was computed.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Hosted image tag to roll (hosted-<YYYYMMDD>-<sha7>). Empty = whatever `hosted` points at now.'
        type: string
        default: ''
      deploy_repo:
        description: 'Deploy repository (owner/name)'
        type: string
        default: 'jk-zhang-meta/meshharbor-deploy'

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  KUSTOMIZATION: k8s/overlays/prod/kustomization.yaml

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment that holds DEPLOY_REPO_TOKEN (and the signing
    # credentials the release workflows use). Its protection rules, if any,
    # gate every promote — which is the right place for a deploy gate.
    environment: release
    steps:
      # The tag must exist in the package and be a hosted-* tag: a typo must
      # not reach the deploy repo, where ArgoCD would roll to an image that
      # cannot be pulled and leave one pod in ImagePullBackOff.
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then
            # `hosted` is a moving pointer; find the dated tag with the same digest.
            D="$(docker buildx imagetools inspect "${IMAGE}:hosted" --format '{{ .Manifest.Digest }}')"
            TAG="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions" \
                  --jq ".[] | select(.name == \"$D\") | .metadata.container.tags[] | select(startswith(\"hosted-2\"))" | head -1)"
            [ -n "$TAG" ] || { echo "::error::could not map the hosted pointer ($D) to a dated tag"; exit 1; }
            echo "hosted -> $TAG ($D)"
          fi
          case "$TAG" in
            hosted-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-*) ;;
            *) echo "::error::'$TAG' is not a hosted-<YYYYMMDD>-<sha7> tag — this workflow only promotes the hosted lane's images"; exit 1 ;;
          esac
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null \
            || { echo "::error::${IMAGE}:${TAG} does not exist in the package"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # FR-87 P7 (#1776) — IndexNow: Bing, Yandex, Seznam, Naver and the other
      # engines that share api.indexnow.org (not Google: Search Console covers
      # it) learn which public pages a roll changed. The served sitemaps are
      # read BEFORE the bump and again after the roll; their lastmods come
      # from git, never the build clock, so the diff is exactly the pages
      # whose content changed. Off unless the repository variable
      # INDEXNOW_ENABLED is 'true'. Warn-only: a missed hint to a crawler never
      # fails a promote. The key is public by design: an engine verifies a
      # submission by fetching https://meshharbor.itachi.fans/<key>.txt (`ui/public/`).
      - name: IndexNow — check out the script and the key
        if: vars.INDEXNOW_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/indexnow.sh
            ui/public/*.txt
          sparse-checkout-cone-mode: false

      - name: IndexNow — snapshot the served sitemaps before the bump
        if: vars.INDEXNOW_ENABLED == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh snapshot https://meshharbor.itachi.fans "$RUNNER_TEMP/sitemaps-before.tsv"

      - name: Bump the deploy repo
        id: bump
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOY_REPO: ${{ inputs.deploy_repo }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_REPO_TOKEN:-}" ]; then
            echo "::warning title=DEPLOY_REPO_TOKEN is not set::No bump made. Run on any machine with the deploy repo:"
            echo "    sed -i 's|newTag:.*|newTag: ${TAG}|' ${KUSTOMIZATION} && git commit -am 'chore(k8s): bump meshharbor to ${TAG}' && git push"
            echo "bumped=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${DEPLOY_REPO}.git" deploy \
            || { echo "::error::could not clone ${DEPLOY_REPO} with DEPLOY_REPO_TOKEN — the token cannot READ the deploy repo (wrong repo scope, or expired)"; exit 1; }
          cd deploy
          git config user.name  'meshharbor-promote[bot]'
          git config user.email 'promote@meshharbor.itachi.fans'
          # Prove WRITE access before touching anything: an empty commit pushed
          # with --dry-run makes the server run its receive-pack permission
          # check and update nothing. A Contents:read-only token dies here.
          git commit -q --allow-empty -m 'promote: write-access probe (never lands)'
          set +e
          PROBE="$(git push --dry-run origin HEAD:master 2>&1)"
          PROBE_RC=$?
          set -e
          git reset -q --hard HEAD~1
          if [ "$PROBE_RC" -ne 0 ]; then
            echo "$PROBE" | sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' | tail -5
            echo "::error::DEPLOY_REPO_TOKEN can read ${DEPLOY_REPO} but cannot PUSH to master — it needs Contents: write (and master must accept pushes from it)"
            exit 1
          fi
          echo "  write access to ${DEPLOY_REPO} confirmed (dry-run push accepted by the server)"
          # The registry switch is FR-73 P2's commit, made once by hand. Until
          # it is there, a hosted-* tag would point the cluster at the OLD
          # registry, which has no such tag: refuse rather than roll a 404.
          if ! grep -qE "^\s*newName:\s*${IMAGE}\s*$" "$KUSTOMIZATION"; then
            echo "::error::${KUSTOMIZATION} does not name ${IMAGE} (newName) — the cluster has not been switched to GHCR (FR-73 P2); not bumping"
            grep -nE 'newName|newTag' "$KUSTOMIZATION" || true
            exit 1
          fi
          OLD="$(grep -oE '^\s*newTag:\s*\S+' "$KUSTOMIZATION" | awk '{print $2}')"
          if [ "$OLD" = "$TAG" ]; then
            echo "already at $TAG — nothing to do"
            echo "bumped=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^\(\s*newTag:\).*|\1 ${TAG}|" "$KUSTOMIZATION"
          git commit -am "chore(k8s): bump meshharbor to ${TAG} (was ${OLD}) — promoted by ${GITHUB_ACTOR} via FR-73"
          git push
          echo "bumped=yes" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "  ${OLD} -> ${TAG}"

      # ArgoCD rolls one pod at a time (maxSurge 0 / maxUnavailable 1). The
      # public /health answering throughout is the only thing this runner can
      # see; the pods' image, the online-agent count and an RC session are
      # read from the fleet, by a human or an agent, after every roll.
      - name: Watch the public health while the roll runs
        if: steps.bump.outputs.bumped == 'yes'
        run: |
          set -u
          T0=$(date +%s)
          BAD=0
          for i in $(seq 1 60); do
            C="$(curl -s -o /dev/null -m 5 -w '%{http_code}' https://meshharbor.itachi.fans/health || echo 000)"
            [ "$C" = "200" ] || BAD=$((BAD + 1))
            sleep 10
          done
          echo "10 min after the bump: $BAD of 60 health probes were not 200 (a roll under maxUnavailable 1 should show 0)"
          [ "$BAD" -eq 0 ] || echo "::warning::the public /health was not 200 on $BAD probes during the roll — check the pods"

      # After the watch, so both pods serve the new image: its sitemaps, and
      # the key file the engines fetch to verify the submission.
      - name: IndexNow — submit the pages the roll changed
        if: steps.bump.outputs.bumped == 'yes' && vars.INDEXNOW_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -u
          KEY="$(ls ui/public | sed -nE 's/^([0-9a-f]{32})\.txt$/\1/p' | head -1)"
          [ -n "$KEY" ] || { echo "::warning title=IndexNow::no ui/public/<key>.txt in the checkout — nothing submitted"; exit 1; }
          bash scripts/indexnow.sh snapshot https://meshharbor.itachi.fans "$RUNNER_TEMP/sitemaps-after.tsv" || exit 1
          bash scripts/indexnow.sh changed "$RUNNER_TEMP/sitemaps-before.tsv" "$RUNNER_TEMP/sitemaps-after.tsv" > "$RUNNER_TEMP/changed.txt"
          bash scripts/indexnow.sh submit https://meshharbor.itachi.fans "$KEY" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/indexnow.txt" 2>&1
          RC=$?
          cat "$RUNNER_TEMP/indexnow.txt"
          { echo '### IndexNow'; echo '```'; cat "$RUNNER_TEMP/indexnow.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - name: Summary
        if: always()
        # Values reach bash through env, never spliced into the script: a
        # backtick an expression produced inside a double-quoted echo is a
        # command substitution (it ran the old tag as a command).
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BUMPED: ${{ steps.bump.outputs.bumped || 'no' }}
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          was=""
          if [ -n "$OLD" ]; then was=" (was \`$OLD\`)"; fi
          {
            echo "## promote"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`$TAG\` |"
            echo "| bumped | $BUMPED$was |"
            echo
            echo "Field-verify from the fleet now: pods on the new image, online-agent count, an RC session, an overlay pair, a tunnel forward."
          } >> "$GITHUB_STEP_SUMMARY"
