# The integration suite, actually running.
#
# `crates/tests` — 288 tests across 25 modules — ran in NO CI lane for
# months. It needs MongoDB + Redis, `ci.yml` has neither, and every module is
# `#[cfg(test)]`-gated so `--workspace` clippy compiles only `pub mod
# fixtures`. The crate stopped compiling entirely (a DAO grew three fields and
# its 8 test callers didn't) and every PR stayed green throughout. #603 added
# a `cargo check` so the crate at least BUILDS; this lane is the other half.
#
# ⚠️ The failure mode that let it rot is a lane that runs NOTHING and reports
# success — a build log printing `Checking meshharbor-tests` was mistaken for
# coverage for months. So this workflow asserts a MINIMUM TEST COUNT: if the
# harness executes far fewer tests than the suite contains, the job fails
# loudly instead of passing quietly. A green tick here has to mean the tests
# ran.
#
# Deliberately NOT on every PR: the suite is ~40 min on the build host, and
# a job that long on every push trains people to ignore it. Master pushes
# that touch backend code, plus manual dispatch.
name: integration-tests

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'agents/meshharbord/**'
      - '.github/workflows/integration-tests.yml'
  # ⚠️ On PRs this used to fire ONLY for `crates/tests/**` — i.e. when someone
  # edited the tests, not when they edited what the tests cover. A change to a
  # DAO, a route or the WS layer went straight to master and turned THAT red
  # after merging. A gate that only runs post-merge reports history, not risk;
  # the lane found two real defects on day one and both would have been caught
  # a step earlier here.
  #
  # Scoped by measurement rather than instinct, because this job is ~20 min.
  # Over the last 90 days on master: these paths carry 170 of 1075 commits
  # (16%), against 447 (42%) for all of `crates/**`. So it fires on roughly one
  # commit in six — the ones touching what the suite actually exercises: the
  # models/indexes, the DAOs, the HTTP routes and the WS handlers.
  #
  # ⚠️ If a new crate becomes part of what these tests drive, add it here.
  # Otherwise the suite quietly goes back to being verified only after merge.
  pull_request:
    paths:
      - 'crates/tests/**'
      - 'crates/db/**'
      - 'crates/services/src/dao/**'
      - 'crates/api/src/routes/**'
      - 'crates/api/src/ws/**'
      # Added 2026-08-28: these two carry the overlay/wire code the suite's
      # agent + DERP + relay-region tests actually drive, and their absence
      # was not theoretical — FR-19 P1a (#816) touched `crates/tunnel-core/**`
      # and this lane did not run on the PR at all, only after the merge. That
      # is the exact "verified only post-merge" state the comment above says
      # this filter exists to prevent.
      - 'crates/tunnel-core/**'
      - 'crates/remote_control/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only run tests matching this substring (empty = whole suite)'
        required: false
        default: ''
      # FR-6 wave 23 (#773): the knobs the suite's runtime was measured with.
      threads:
        description: 'Test threads (empty = the lane default)'
        required: false
        default: ''
      mongo_tmpfs:
        description: 'MongoDB data directory on tmpfs: true, false, or empty for the lane default'
        required: false
        default: ''
      report_time:
        description: "Print every test's duration and the slowest ones (true/false)"
        required: false
        default: 'false'

permissions:
  contents: read

# FR-6 wave 25 (#773): ci.yml's rule, since one run here is three jobs. A
# newer push to a PR cancels its running suite. On master a running suite
# always finishes (it publishes the cargo cache), and a newer push cancels
# only the run still waiting behind it. A dispatch gets a group of its own,
# so arms dispatched side by side all run.
concurrency:
  group: integration-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Integration suite (MongoDB + Redis) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # FR-6 wave 24 (#773): the suite runs as three shards, each on its own
    # runner with its own mongod, and each takes every third test of the
    # sorted listing (see "Run the suite"). Not more threads against one
    # mongod: every test creates and drops a database of ~246 WiredTiger
    # files, and at 4 threads the dropped ones piled up to 63,769 open files
    # of the 64,000 ceiling until mongod aborted (dispatch run 39312454242).
    # Three shards at 2 threads each keep every mongod at the load this lane
    # has always run. A shard is ~10 min warm, so 45 leaves a cold build room.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 45
    # FR-6 wave 22 (#773): a master push publishes this job's cargo cache as a
    # release asset (ci-seed-save), which needs `contents: write`.
    permissions:
      contents: write

    services:
      # MongoDB is deliberately NOT a service container — see "Start MongoDB"
      # below. Service containers accept no command arguments, and this
      # workload needs one.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      ROOMLER__DATABASE__URL: mongodb://localhost:27019
      # File storage defaults to local disk in dev/test (see
      # crates/api/src/storage.rs), so no MinIO/S3 is needed here. Leaving
      # ROOMLER__S3__* unset is what selects that backend.
      RUST_BACKTRACE: 1
      # FR-6 wave 21b (#773): line tables only, as ci.yml has had since wave 14.
      # This lane was still building with FULL debuginfo, for a 1.1 GB cache
      # family in a pool that has to fit the free 10 GB. Line tables are
      # what RUST_BACKTRACE above needs for file:line; the rest (types,
      # variables) serves a debugger, and nothing attaches one in CI.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # rust-cache set this for the job until wave 22; set it here.
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): this lane's cache (~1 GB) lives on the
        # seed-cache release, not in the Actions cache, whose free 10 GB holds
        # the PR lanes (see .github/actions/ci-seed-restore). The cap is above
        # the default: a debug build of the whole server is the biggest target.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: integration
          max-target-mb: "6000"

      - name: Start MongoDB (capped WiredTiger cache)
        # A service container cannot take command arguments, and this one
        # needs `--wiredTigerCacheSizeGB`. The default cache is ~50 % of RAM;
        # on a 2-core/7 GB runner that competes with the test binary, and the
        # first run of this lane (32670680394) lost Mongo mid-suite —
        # 28 tests died on `Connection refused (os error 111)` with
        # `SystemOverloadedError`, while 263 around them passed. Those were
        # never 28 code failures; they were one process going away.
        #
        # Port 27019 on the host, not 27017: `TestApp` and the local
        # docker-compose both use 27019, so the tests need no override.
        env:
          MONGO_TMPFS: ${{ github.event.inputs.mongo_tmpfs || 'false' }}
        run: |
          set -euo pipefail
          data=()
          if [ "$MONGO_TMPFS" = true ]; then
            data=(--tmpfs /data/db:rw,size=6g)
          fi
          # ⚠️ --ulimit nofile FIXED NOTHING, and the record should say so.
          # I added it after run 32673736740 died on
          #   "couldn't open [/proc/1/stat] Too many open files"
          #   WiredTiger error 24 (EMFILE) -> fatal assertion 50853 -> abort
          # But that run had NO ulimit flag and died at 265 tests; with 64000
          # set, the next died at 256. Both at ~62 000 descriptors — so the
          # runner's own default is ~65 536 and this flag merely restated it.
          # (Local Docker Desktop defaults to 1 048 576, which is why "the
          # default must be too low" felt obvious. It was not measured.)
          #
          # The real cause was the harness never dropping its test databases;
          # see `impl Drop for TestApp`. The flag stays only as a DELIBERATE
          # ceiling: a bounded limit makes a future leak fail loudly and early
          # instead of quietly consuming a million descriptors. 64000 is
          # MongoDB's own documented production minimum.
          docker run -d --name roomler-test-mongo -p 27019:27017 \
            --ulimit nofile=64000:64000 \
            "${data[@]}" \
            --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            mongo:7 --wiredTigerCacheSizeGB 0.5
          for i in $(seq 1 40); do
            if docker exec roomler-test-mongo mongosh --quiet \
                 --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              echo "mongo ready after ${i} attempt(s)"
              # Prove where the data directory is, rather than trust the flag.
              docker exec roomler-test-mongo sh -c "grep ' /data/db ' /proc/mounts" || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB never became ready"; docker logs roomler-test-mongo | tail -40; exit 1

      - name: Prove the ulimit actually applied
        # ⚠️ Do not assume a flag took. Two runs were "fixed" by raising
        # nofile and both still died on EMFILE, which means either the flag
        # did not apply or the ceiling is not where I thought. Print the
        # effective limit so the next failure is diagnosable from the run
        # page instead of by another guess-and-rerun cycle.
        run: |
          echo "--- mongod's effective limits ---"
          docker exec roomler-test-mongo sh -c 'grep -i "open files" /proc/1/limits' || true
          docker exec roomler-test-mongo sh -c 'ulimit -n' || true

      - name: Build the test binary
        # Separate from the run so a compile failure reads as a compile
        # failure, not as "0 tests passed".
        run: cargo test -p meshharbor-tests --no-run

      - name: Watch mongod while the suite runs
        # ⚠️ THE MISTAKE THIS FIXES. The leaked-database count below runs
        # AFTER the suite — and mongod dies mid-suite, so on run 32675563670
        # it printed "(mongo is gone)". The one step built to discriminate
        # between hypotheses could not run at the moment that mattered. A
        # post-mortem instrument cannot observe the thing that killed the
        # patient.
        #
        # So sample DURING, and separate FILES from SOCKETS, because "what is
        # consuming the descriptors" is the actual question and I have already
        # answered it wrong once: `conn1333` in the mongod log was read as "too
        # many connections", a client-pool cap was added, and it fixed nothing
        # — the ceiling was EMFILE on FILES.
        #
        #   wt_files   — WiredTiger's own "files currently open". This IS the
        #                EMFILE quantity; one table per collection AND per
        #                index, per database. Climbs if databases leak.
        #   dhandles   — data handles active; the same story one level up.
        #   conns      — connections. Climbs if the driver leaks sockets.
        #   leaked_dbs — `roomler_ai_test_*` databases still present.
        #
        # Whichever curve climbs is the culprit; the flat ones are exonerated.
        #
        # ⚠️ These come from `serverStatus()`, NOT from classifying the
        # symlinks in /proc/1/fd, and that is not a style choice: `readlink`
        # on those entries is DENIED in this container runtime even as uid 0,
        # so `ls -l` prints names with no targets. The first version of this
        # step classified them anyway and — with stderr sent to /dev/null —
        # silently reported `fds_wt=0 fds_sock=0` against a live mongod that
        # obviously held both. It was caught by rehearsing the step against a
        # local container before pushing, which took two minutes.
        run: |
          set -euo pipefail
          setsid nohup bash -c '
            while true; do
              t=$(date -u +%H:%M:%S)
              fd=$(docker exec roomler-test-mongo sh -c "ls /proc/1/fd 2>/dev/null | wc -l" 2>/dev/null || echo -1)
              m=$(docker exec roomler-test-mongo mongosh --quiet --eval "const s=db.serverStatus();const n=db.adminCommand({listDatabases:1,nameOnly:true}).databases.filter(x=>x.name.startsWith(\"roomler_ai_test\")).length;print(\"wt_files=\"+s.wiredTiger[\"connection\"][\"files currently open\"]+\" dhandles=\"+s.wiredTiger[\"data-handle\"][\"connection data handles currently active\"]+\" conns=\"+s.connections.current+\" leaked_dbs=\"+n)" 2>/dev/null || echo "wt_files=-1 dhandles=-1 conns=-1 leaked_dbs=-1")
              echo "$t fds=$fd $m"
              sleep 15
            done' > /tmp/mongo-watch.log 2>&1 < /dev/null &
          sleep 16
          echo "--- first sample (baseline, before any test has run) ---"
          cat /tmp/mongo-watch.log
          # ⚠️ Prove the instrument works BEFORE the suite depends on it. A
          # watcher that silently produced nothing would leave the next run
          # as undiagnosable as the last one.
          grep -qE 'wt_files=[0-9]+ ' /tmp/mongo-watch.log || {
            echo "::error::the mongod watcher is not producing usable samples — fix it before trusting this run"; exit 1; }

      - name: Run the suite
        id: run
        env:
          FILTER: ${{ github.event.inputs.filter }}
          THREADS: ${{ github.event.inputs.threads || '2' }}
          REPORT_TIME: ${{ github.event.inputs.report_time || 'false' }}
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          # FR-69 P4/P5a — the test binary is a DEBUG build whose frames are
          # enormous, and `peer_relay_mint_tests::every_refusal_is_audited…`
          # builds SEVEN servers in one body. On the harness's default 2 MiB
          # test thread it overflowed twice, deterministically: once when the
          # conference module made the server-construction future bigger
          # (fixed by boxing it in the fixture), and again when the fleet
          # module added one more Core-sized state per server — the margin
          # that boxing bought was ~25 KB. 8 MiB is the honest floor for a
          # server-in-a-test binary at opt-level 0; it costs nothing (stack
          # pages are committed on touch).
          RUST_MIN_STACK: "8388608"
        run: |
          set -o pipefail
          # 2 threads per shard. Every test creates and drops its OWN database
          # (~246 WiredTiger files), and mongod closes a dropped database's
          # files only minutes later, so what bounds one mongod's threads is
          # its open files, not the runner's 4 cores. At 2 they peak at 22-35 k
          # of the 64 k ceiling; at 4 they reached it and mongod aborted (FR-6
          # wave 24). More speed comes from more shards, each its own mongod.
          #
          # The skips were MEASURED here (run 32671814889), not inherited from
          # the build host — porting that box's list across would have been the
          # same environment-assumption this lane exists to catch. There is now
          # ONE, and it needs a reason and a way out:
          #
          #   conference … call_leave_cleans_up_participant_media
          #     Wants a live mediasoup worker; the runner has none, so it gets
          #     `media:error` where `media:router_capabilities` is expected.
          #     Un-skip if the worker is ever provisioned in CI.
          #
          # (`rate_limit … returns_429_after_burst` used to be the second skip.
          # It was not environmental: the test issued its 65 requests
          # SEQUENTIALLY against a limiter that refills 1/s, so on a slow
          # runner the loop outlasted the burst it was exhausting and nothing
          # was ever limited. Fired concurrently it depends on the limiter
          # rather than the runner, so the skip is gone.)
          #
          # ⚠️ Adding a third skip should feel expensive. If this list grows,
          # the lane is drifting back toward the unfalsifiable state it
          # replaced.
          skip=conference_tests::call_leave_cleans_up_participant_media
          # FR-6 wave 24 (#773): the shard runs the test binaries itself, with
          # the exact names it owns, from the directory cargo runs them in.
          # Every shard lists the same binaries, sorts the same (test, binary)
          # pairs and takes every Nth from its own offset, so between them the
          # shards run each test exactly once, and a module's tests spread
          # over all three. (The crate has no doc tests to lose.)
          mapfile -t bins < <(cargo test -p meshharbor-tests --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable')
          echo "test binaries: ${#bins[@]}"
          [ "${#bins[@]}" -gt 0 ] || { echo "::error::cargo listed no test binaries"; exit 1; }
          cd crates/tests
          for b in "${bins[@]}"; do
            "$b" --list --format terse ${FILTER:+"$FILTER"} | sed -n 's/: test$//p' \
              | awk -v b="$b" '{ print b "\t" $0 }'
          done | awk -F'\t' -v s="$skip" '$2 != s' | LC_ALL=C sort -t$'\t' -k2,2 -k1,1 > /tmp/suite-listing.tsv
          awk -v n="$SHARD_TOTAL" -v i="$SHARD_INDEX" '(NR - 1) % n == i' /tmp/suite-listing.tsv > /tmp/shard-plan.tsv
          echo "suite: $(wc -l < /tmp/suite-listing.tsv) tests; shard $((SHARD_INDEX + 1))/$SHARD_TOTAL runs $(wc -l < /tmp/shard-plan.tsv)"
          for b in "${bins[@]}"; do
            mapfile -t names < <(awk -F'\t' -v b="$b" '$1 == b { print $2 }' /tmp/shard-plan.tsv)
            [ "${#names[@]}" -gt 0 ] || continue
            echo "     Running ${b##*/} (${#names[@]} tests)"
            if [ "$REPORT_TIME" = true ]; then
              # FR-6 wave 23: libtest prints each test's duration only under
              # `-Z unstable-options --report-time`, which a stable test binary
              # accepts when RUSTC_BOOTSTRAP is set in ITS environment. Here it
              # is, and the build never sees it.
              RUSTC_BOOTSTRAP=1 "$b" --exact --test-threads="$THREADS" \
                -Z unstable-options --report-time "${names[@]}"
            else
              "$b" --exact --test-threads="$THREADS" "${names[@]}"
            fi
          done 2>&1 | tee /tmp/itest.log

      - name: The mongod watch log (READ THIS FIRST on a failure)
        # The curve, not the corpse. Read the last sample before the numbers
        # stop moving: that is the state mongod was in when it died.
        if: always()
        run: |
          echo "--- mongod descriptors + leaked databases over the run ---"
          cat /tmp/mongo-watch.log || echo "(watcher produced nothing)"

      - name: Where the suite's time went (report_time)
        if: always() && github.event.inputs.report_time == 'true'
        env:
          THREADS: ${{ github.event.inputs.threads || '2' }}
          MONGO_TMPFS: ${{ github.event.inputs.mongo_tmpfs || 'false' }}
        run: |
          set -uo pipefail
          sed -nE 's/^test ([^ ]+) \.\.\. ([A-Za-z]+) <([0-9.]+)s>.*/\3 \2 \1/p' /tmp/itest.log \
            | sort -rn > /tmp/test-times.txt
          peak() { grep -oE "$1=[0-9]+" /tmp/mongo-watch.log | cut -d= -f2 | sort -n | tail -1; }
          {
            echo "### Test durations: threads=$THREADS, mongo_tmpfs=$MONGO_TMPFS"
            awk '{ s += $1 } END { printf "%d tests, %.0f s of test time\n", NR, s }' /tmp/test-times.txt
            echo "mongod peaks: fds=$(peak fds) wt_files=$(peak wt_files) dhandles=$(peak dhandles)"
            echo '#### Slowest 40'
            echo '```'
            head -40 /tmp/test-times.txt
            echo '```'
            echo '#### Seconds per module (sum, count)'
            echo '```'
            awk '{ split($3, p, "::"); s[p[1]] += $1; c[p[1]]++ }
                 END { for (m in s) printf "%8.1f %4d %s\n", s[m], c[m], m }' /tmp/test-times.txt \
              | sort -rn | head -40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert the suite actually ran
        # ⚠️ THE POINT OF THIS STEP. A test lane that silently executes
        # nothing is indistinguishable from a passing one, and that is
        # precisely how this crate rotted. `cargo test` happily reports
        # success for a filter that matches no test, so success alone is
        # not evidence.
        #
        # The floor is deliberately well under the real count (288 as of
        # 2026-08-23) so ordinary churn does not trip it, while a harness
        # that runs a handful — or none — fails loudly. Raise it when the
        # suite grows; if you find yourself LOWERING it, that is the signal
        # to stop and ask what stopped running.
        #
        # Since wave 24 the floor applies to the whole listing, which every
        # shard reads, and each shard must also report every test it was
        # handed: a shard that drops tests on the way fails here even while
        # the suite as a whole still clears the floor.
        if: ${{ github.event.inputs.filter == '' }}
        run: |
          set -euo pipefail
          sum() { grep -oE '^test result: .*' /tmp/itest.log | grep -oE "[0-9]+ $1" \
                  | grep -oE '^[0-9]+' | awk '{s+=$1} END {print s+0}'; }
          listed=$(wc -l < /tmp/suite-listing.tsv)
          planned=$(wc -l < /tmp/shard-plan.tsv)
          passed=$(sum passed); ignored=$(sum ignored)
          echo "suite listed: $listed tests; this shard was handed $planned, passed $passed, ignored $ignored"
          MIN=200
          if [ "$listed" -lt "$MIN" ]; then
            echo "::error::the suite lists only $listed tests (floor $MIN). A green run that executes nothing is the failure this lane exists to prevent — find out what stopped running before touching this number."
            exit 1
          fi
          if [ $((passed + ignored)) -ne "$planned" ]; then
            echo "::error::this shard was handed $planned tests and reported $((passed + ignored)) (passed + ignored). Tests went missing between the plan and the run."
            exit 1
          fi

      - name: Assert the harness cleaned up after itself
        # This began as a diagnostic and is now a regression check, because the
        # measurement came back: `impl Drop for TestApp` cleaned up with a
        # DETACHED `tokio::spawn`, and every test here is a plain
        # `#[tokio::test]` — a current-thread runtime that is dropped the
        # instant the body returns, taking the queued-but-never-polled cleanup
        # task with it. Run 32767662554: 29 tests ran, 29 databases remained.
        #
        # That is what killed mongod. Sampled mid-run, connections were FLAT
        # (conns 5 -> 11) while files exploded (wt_files 14 -> 5166 across 21
        # databases) — ~246 WiredTiger files per database, one per collection
        # and per index. `fds ~= 26 + 246 x databases` reaches the 64 000
        # nofile ceiling at ~260 databases, i.e. mid-suite, which is exactly
        # where EMFILE -> WiredTiger error 24 -> fatal assertion 50853 landed.
        # Raising nofile could never have fixed it; it only moved the wall.
        #
        # ⚠️ Keep this a FAILURE, not a print. A teardown that silently stops
        # running is invisible until it takes the database server down with
        # it — which is precisely how this cost a day.
        if: always()
        run: |
          set -uo pipefail
          n=$(docker exec roomler-test-mongo mongosh --quiet --eval \
                'print(db.adminCommand({listDatabases:1,nameOnly:true}).databases.filter(d=>d.name.startsWith("roomler_ai_test")).length)' \
                2>/dev/null) || n=""
          peak=$(grep -oE 'leaked_dbs=[0-9]+' /tmp/mongo-watch.log 2>/dev/null \
                 | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "test databases still present: ${n:-<unreadable>}   (peak during the run: ${peak:-<none>})"
          if [ -z "$n" ]; then
            echo "::notice::mongod did not outlive the suite, so the final count could not be read — the watch log above is the evidence. Not failing the job twice for one fault."
            exit 0
          fi
          # A handful is fine: a test may hold a TestApp past the suite, and
          # the count races the last teardown. Hundreds is the bug.
          MAX=5
          if [ "$n" -gt "$MAX" ]; then
            echo "::error::$n test databases were left behind (max $MAX). TestApp's teardown is not running — see impl Drop for TestApp in crates/tests/src/fixtures/test_app.rs. Left unchecked this exhausts mongod's file descriptors mid-suite."
            exit 1
          fi

      - name: Did MongoDB survive?
        # Ask FIRST on a failure. A dead or restarted Mongo turns one
        # environmental fault into dozens of unrelated-looking test failures,
        # and reading those as code bugs is a long detour — it is exactly what
        # the first run of this lane looked like.
        if: failure()
        run: |
          echo "--- container state ---"
          docker inspect -f 'Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}' \
            roomler-test-mongo || true
          echo "--- mongod fatal/error lines (the CAUSE) ---"
          # ⚠️ Grep for severity first. A plain `--tail` catches only the
          # BACKTRACE frames mongod prints on its way out — which says it died
          # but not why. That happened on run 32672829603: 59 `Frame` lines and
          # no assertion, because the fatal message had already scrolled past.
          docker logs roomler-test-mongo 2>&1 | grep -E '"s":"[FE]"' | tail -20 || true
          echo "--- last 120 lines ---"
          docker logs --tail 120 roomler-test-mongo 2>&1 || true

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: /tmp/itest.log
          retention-days: 7

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        # The first shard alone: all three build the same target, and three
        # uploads of one asset would race each other's --clobber.
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success' && strategy.job-index == 0
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: integration
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}
