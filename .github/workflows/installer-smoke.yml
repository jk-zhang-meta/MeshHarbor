# RETIRED-NAME-ANCHOR-BEGIN
# This lane installs and uninstalls the real installers, so it must assert on
# the names a host actually has — including the pre-rename ones it is checking
# are cleaned up: the legacy service and task, the meshharbor-agent.exe alias, the
# old install folders and the published MSI names.
# INVARIANT: a retired name here must be one the installer has to create, find or
# remove on a real host. docs/fr/FR-21
# Phase 6 Chunk 6A — install + uninstall smoke for the per-User MSI
# on windows-latest. Catches the regressions install_detect locks
# (UpgradeCode registry presence) + the WiX bundle's basic
# correctness (the MSI installs cleanly + the agent binary lands at
# the expected path + uninstall cleans up). Cheap signal (~10 min) on
# every push that touches the agent or installer source.
#
# Explicitly NOT in scope this iteration:
#   * WebView2 UI automation of the wizard EXE (Welcome → Server →
#     Token → Install → Done). Tauri 2 + tauri-driver on a headless
#     GitHub runner is a 1–2 day spike in itself; deferred to Chunk
#     6B once this baseline is green.
#   * SystemContext swap testing. `ROOMLER_AGENT_ENABLE_SYSTEM_SWAP=1`
#     + WTSQueryUserToken + winlogon-token spawn needs an interactive
#     desktop session that GitHub-hosted Windows runners don't expose;
#     requires a self-hosted runner on a real Win11 VM. Phase 6 plan
#     called this risk out — see commit message.
#   * The per-Machine MSI's full install assertions. It IS installed now,
#     since #1727: four upgrades that check the SystemContext switch in the
#     service's Environment survives a hand-run install. It is not put
#     through the per-User payload and registry asserts below.
#   * REAL code signing. The smoke doesn't ship anywhere, so it never
#     touches Azure Artifact Signing. It DOES exercise the sign-windows
#     action in `local` mode when the WIN_TEST_PFX_* secrets exist, which
#     gives the release path free per-push regression coverage: the
#     "assert install payload" step below then proves a SIGNED payload
#     still installs. Without the secrets the step skips, so forks and
#     unconfigured repos stay green.
name: installer-smoke

on:
  push:
    branches: [master]
    paths:
      - 'agents/meshharbord/**'
      - '.github/workflows/installer-smoke.yml'
      - 'scripts/macos-productbuild-gated.sh'
  # Also on PRs — but only those touching the INSTALLER surface, not the whole
  # agent. Until now this job ran on push-to-master and dispatch only, so its
  # checks (including the PE import audit added in #647) first executed AFTER
  # a change had already landed. A gate that cannot run on the change under
  # review is a gate that reports history.
  #
  # Scoped deliberately rather than mirroring the push paths: this is a ~20 min
  # windows-latest job, and Windows runner contention in this repo is real —
  # rc.424's MSI job sat QUEUED for 70 minutes behind a release burst. Measured
  # over the last 90 days, these paths carry 29 commits against 316 for
  # `agents/meshharbord/**`, so this fires on roughly one agent PR in ten:
  # the ones where the installer itself changed.
  #
  # ⚠️ If you change what the MSI SHIPS (a new native dependency, a wxs
  # component, the CRT staging list), add that path here too — otherwise the
  # audit silently stops covering the change that needed it most.
  pull_request:
    paths:
      - 'agents/meshharbord/wix/**'
      - 'agents/meshharbord/wix-perMachine/**'
      - 'agents/meshharbord/packaging/windows/**'
      # The macOS packaging was missing here, so the postinstall — the script
      # that decides whether the root daemon lives or is DELETED — could change
      # without this job ever running on the PR. That is the hole the warning
      # above describes, and it cost a real regression: an rc.458 -> rc.460
      # self-update silently removed the daemon on a field MacBook.
      - 'agents/meshharbord/packaging/macos/**'
      - 'agents/meshharbord/build.rs'
      # #1727 — the per-Machine MSI runs `roomlerd keep-system-context`, which
      # decides from this module; a change to it changes what an install does.
      - 'agents/meshharbord/src/win_service/system_context_attempt.rs'
      - '.github/workflows/installer-smoke.yml'
      - 'scripts/macos-productbuild-gated.sh'
  workflow_dispatch: {}

# actions:write was for a "Refresh the cache seed (delete BEFORE restore)"
# step, removed in FR-6 wave 14 (#773): it ran on PRs too, and a PR deleting
# a master cache it may not re-save (see `save-if` below) is eviction by
# another name. Nothing else here needs it — artifact uploads use the
# runner's own token.
permissions:
  contents: read

# FR-6 wave 25 (#773): ci.yml's rule. A newer push to a PR cancels its
# running smokes. On master a running smoke always finishes (it publishes
# the cargo caches), and a newer push cancels only the run still waiting.
# A dispatch gets a group of its own.
concurrency:
  group: installer-smoke-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-msi-install-uninstall:
    name: per-User MSI install + uninstall (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    # FR-6 wave 22 (#773): a master push publishes this job's cargo cache as a
    # release asset (ci-seed-save), which needs `contents: write`.
    permissions:
      contents: write
    env:
      # Mirrored so the payload-signing step's `if:` can test it -- secrets
      # are not available in step-level `if:` conditions.
      WIN_TEST_PFX_BASE64: ${{ secrets.WIN_TEST_PFX_BASE64 }}
      # rust-cache set this for the job until wave 22; set it here.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): this job's cache lives on the seed-cache release,
        # not in the Actions cache, whose free 10 GB holds the PR lanes (see
        # .github/actions/ci-seed-restore). It carries the cargo-installed
        # cargo-wix too, as rust-cache did.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: installer-smoke-windows

      - name: Install WiX Toolset v3 + cargo-wix
        shell: pwsh
        run: |
          choco install -y wixtoolset
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' | Select-Object -First 1
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Idempotent: the seed caches (#488) can restore ~/.cargo/bin with
          # the tool present; a plain install hard-errors on it.
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }

      - name: Build agent (release, minimal feature set)
        # Chunk 6A scope: install/uninstall validation only. Drop
        # `vp9-444` (avoids the vcpkg/libvpx dance) and `wgc-capture`
        # (Windows.Graphics.Capture not needed for install
        # validation). The MSI bundle just packages whatever exe is
        # at target/release/meshharbor-agent.exe; feature set affects
        # runtime behaviour only.
        shell: pwsh
        run: |
          cargo build -p meshharbord --release `
            --features "mf-encoder,scrap-capture,openh264-encoder,enigo-input,clipboard,viewer-indicator,system-context"

      - name: Build the roomler CLI shim for the MSI bundle (P3e lever D)
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `TunnelExe` component, so
          # the WiX `light` step needs its source EXE present or it fails with
          # LGHT0103 — same failure mode as the wintun.dll staging below.
          # P3e lever D moved that source from the full tunnel CLI to the
          # ~150 KB shim that re-execs `roomlerd cli`; the INSTALLED name is
          # still meshharbor.exe, which is what the payload assert below checks.
          # Mirrors release-agent.yml's shim build step.
          cargo build -p meshharbor-cli-shim --release
          if (-not (Test-Path target\release\meshharbor-shim.exe)) {
            Write-Host "::error::meshharbor-shim.exe not produced — TunnelExe harvest would fail (LGHT0103)"
            exit 1
          }
          $kb = [math]::Round((Get-Item target\release\meshharbor-shim.exe).Length/1KB, 0)
          Write-Host "Staged meshharbor-shim.exe ($kb KB, installs as meshharbor.exe) for the TunnelExe component"

      # Mirrors release-agent.yml's payload-signing placement exactly: after
      # the binaries are built, BEFORE the third-party DLLs (wintun, VC-CRT)
      # are staged so they cannot be caught up in it, and before cargo-wix
      # harvests. Skipped entirely when the test cert is not configured --
      # `mode: local` is a hard error without a PFX by design (an explicit
      # request to sign must never silently degrade), so the gate is here.
      # `mode` is pinned to local rather than auto so a configured repo does
      # not burn real Azure signing quota on every master push.
      - name: Sign MSI payload binaries (local rehearsal)
        if: env.WIN_TEST_PFX_BASE64 != ''
        uses: ./.github/actions/sign-windows
        with:
          files: |
            target\release\meshharbord.exe
            target\release\meshharbor-shim.exe
          mode:               local
          require:            'true'
          # The action imports the self-signed cert into the runner's Root +
          # TrustedPublisher stores, so strict verification genuinely applies
          # here -- this is the same code path a release run takes.
          local-pfx-base64:   ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password: ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: Stage wintun.dll for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `WintunDll` component
          # (overlay-l3's TUN driver) from target\release\wintun.dll, so the
          # WiX `light` step needs the DLL present even in this minimal-feature
          # smoke build — otherwise it fails with LGHT0103 (the long-standing
          # installer-smoke red). Mirrors release-agent.yml's staging step.
          $ver = '0.14.1'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile $zip -UseBasicParsing
          $dest = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Join-Path $dest 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::wintun.dll (amd64) not found in the downloaded archive"; exit 1 }
          Copy-Item $dll target\release\wintun.dll -Force
          Write-Host "Staged wintun.dll ($([math]::Round((Get-Item target\release\wintun.dll).Length/1KB,0)) KB) for the MSI bundle"

      - name: Stage VC++ runtime DLLs for the MSI bundle
        shell: pwsh
        run: |
          # wix/main.wxs UNCONDITIONALLY bundles a `VcRedistCrt` component
          # (app-local Microsoft.VC14x.CRT so fresh machines without the
          # VC++ redistributable can run meshharbord.exe -- field report
          # 2026-07-28) from target\release\*.dll, so the WiX `light`
          # step needs the DLLs present or it fails with LGHT0103.
          # Mirrors release-agent.yml's staging step.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe not found on the runner"; exit 1 }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem -Directory "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { Write-Host "::error::no Microsoft.VC14x.CRT redist folder under $vsRoot"; exit 1 }
          # Kept in lockstep with release-agent.yml: only the three CRT DLLs
          # our binaries import (see that step's comment for the import-table
          # evidence and the re-check recipe). The payload assert below locks
          # the same three by name.
          $expected = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($n in $expected) {
            $src = Join-Path $crtDir.FullName $n
            if (-not (Test-Path $src)) { Write-Host "::error::$n missing from $($crtDir.FullName) -- VcRedistCrt harvest would fail (LGHT0103)"; exit 1 }
            Copy-Item $src target\release\ -Force
          }
          Write-Host "Staged $($expected.Count) VC++ runtime DLLs from $($crtDir.FullName)"

      - name: Build per-User MSI
        shell: pwsh
        env:
          # cargo-wix reads the version from Cargo.toml but
          # `--install-version` lets us pin a known-marker version
          # for the registry assertion (the MSI's ProductVersion
          # lands under the UpgradeCode key alongside the
          # InstallProperties).
          #
          # cargo-wix requires the prerelease component to be
          # parseable as an integer — `0.0.0-smoke` fails with
          # "we couldn't convert the prerelease components to an
          # integer" (it maps semver `X.Y.Z-<text>.<N>` to MSI
          # `X.Y.Z.N`). Use a trailing `.1` so it lands as MSI
          # `0.0.0.1` — distinct enough from any real release
          # (which always start at 0.3.0+ rc.N) that an operator
          # who finds it on a machine knows it's a smoke artifact.
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          cargo wix -p meshharbord --nocapture --no-build --install-version $env:SMOKE_VERSION
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not produced by cargo-wix' }
          'MSI_PATH=' + $msi.FullName | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MSI ready: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      - name: Install the MSI (quiet, per-User)
        shell: pwsh
        run: |
          # /quiet runs without UI; /norestart prevents implicit reboot
          # if the MSI calls for one; /l*v emits a verbose log so the
          # workflow's artifact upload below captures it on failure.
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $log = Join-Path $logDir 'install.log'
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" `
            -Wait -PassThru
          'INSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 200
            throw "msiexec /i failed with exit $($proc.ExitCode)"
          }
          Write-Host "Install succeeded (exit 0)"

      - name: Assert registry UpgradeCode present (rc.27 install_detect lock)
        shell: pwsh
        run: |
          # rc.27's `install_detect::detect_existing_install` reads
          # HKCU + HKLM `Software\\…\\Installer\\UpgradeCodes\\<packed>`
          # where <packed> is the Windows-Installer-compressed encoding
          # of the UpgradeCode GUID. The MSI we just built carries
          # UpgradeCode `1F2D7B1C-8B2F-4D2E-B1A3-6B1E2C7E4D91` (see
          # `agents/meshharbord/Cargo.toml::package.metadata.wix`).
          #
          # First attempt used `Get-Package -Provider msi` but the
          # PackageManagement `msi` provider isn't available on
          # PowerShell 7 (the runner's pwsh.exe), only on Windows
          # PowerShell 5.x. Run #26376742677 hit `Unable to find
          # package providers (msi)`. Switch to a direct registry walk
          # against `Uninstall\*` — works on every PS version, is
          # faster than Get-Package, and observably equivalent (an
          # MSI install lands BOTH an Uninstall entry AND the
          # UpgradeCodes entry; checking the former is sufficient
          # for "the MSI installed and the system sees it").
          # rc.279 asserted the ARP record must live in HKCU. That is NOT a
          # reliable per-user signal, and the check has failed on EVERY master
          # run since it landed in #260 -- it never once passed.
          #
          # The verbose MSI log from run 30843667006 settles what actually
          # happens: the payload installs per-user exactly as intended
          # (APPLICATIONFOLDER = C:\Users\<u>\AppData\Local\Programs\MeshHarbor,
          # Start Menu under the user's Roaming profile, no ALLUSERS authored),
          # while Windows Server 2025 still mirrors the ARP record into an HKLM
          # Uninstall hive. So the install is correct and the assertion was
          # wrong about where to look.
          #
          # The AUTHORITATIVE per-user signal is the Installer UserData hive: a
          # per-user install registers the product under the INSTALLING USER's
          # SID, a per-machine one under SYSTEM (S-1-5-18). Assert that. The
          # scope-flip guard rc.279 wanted is PRESERVED, just re-pointed: a
          # genuine perMachine regression shows up under S-1-5-18 and still
          # fails this step.
          $sid    = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $udRoot = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData'
          function Find-RoomlerProduct($scopeSid) {
            $products = Join-Path $udRoot "$scopeSid\Products"
            if (-not (Test-Path $products)) { return $null }
            Get-ChildItem $products -ErrorAction SilentlyContinue |
              ForEach-Object {
                Get-ItemProperty (Join-Path $_.PSPath 'InstallProperties') -ErrorAction SilentlyContinue
              } |
              Where-Object { $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent' } |
              Select-Object -First 1
          }
          $perUser    = Find-RoomlerProduct $sid
          $perMachine = Find-RoomlerProduct 'S-1-5-18'

          if (-not $perUser) {
            Write-Host "--- Roomler ARP entries, per hive (installing SID: $sid) ---"
            $hives = @{
              'HKCU\Uninstall'           = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\Uninstall'           = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM\WOW6432Node\Uninstall' = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            }
            foreach ($label in $hives.Keys) {
              $root = $hives[$label]
              if (-not (Test-Path $root)) { Write-Host "${label}: (absent)"; continue }
              $rows = Get-ChildItem $root -ErrorAction SilentlyContinue |
                        Get-ItemProperty -ErrorAction SilentlyContinue |
                        Where-Object { $_.DisplayName -like '*roomler*' } |
                        Select-Object DisplayName, DisplayVersion, UninstallString
              if ($rows) { Write-Host "${label}:"; $rows | Format-Table -AutoSize }
              else { Write-Host "${label}: (no roomler entry)" }
            }
            Write-Host '--- Installer UserData SIDs present ---'
            Get-ChildItem $udRoot -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty PSChildName
            throw "MSI product not registered for the installing user ($sid) — the perUser flavour did not install per-user"
          }
          Write-Host "Installed per-user: $($perUser.DisplayName) $($perUser.DisplayVersion) (UserData SID $sid)"
          if ($perMachine) {
            throw "perUser MSI unexpectedly registered machine-wide (UserData S-1-5-18): $($perMachine.DisplayName)"
          }
          # Product code for later steps: the ARP mirror carries the real GUID
          # (the UserData key name is the PACKED form, which msiexec /x rejects).
          $arp = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          ) | Where-Object { Test-Path $_ } |
              ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent' } |
              Select-Object -First 1
          if ($arp) {
            'INSTALLED_PRODUCT_CODE=' + $arp.PSChildName | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Assert install payload at the canonical path (P4b)
        shell: pwsh
        run: |
          # P4b renamed the per-User install dir to
          # %LOCALAPPDATA%\Programs\MeshHarbor and added the tunnel CLI
          # to the bundle. Assert the EXACT canonical layout (the old
          # loose multi-candidate probe would silently pass on a
          # regression back to the pre-rename dir): daemon
          # + tunnel CLI + wintun must all land. Also assert the
          # TunnelExe component's user-PATH append took (HKCU\
          # Environment — MSI writes it for Environment System='no').
          # P3d Slice C: the meshharbor-agent.exe alias is retired — the MSI
          # ships only the canonical names now.
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\MeshHarbor'
          # msvcp140/vcruntime140* lock the app-local VcRedistCrt component
          # (fresh machines without the VC++ redist -- 2026-07-28 fix).
          $mustExist = @('meshharbord.exe', 'meshharbor.exe', 'wintun.dll',
                         'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $missing = @()
          foreach ($f in $mustExist) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              Write-Host "present: $p"
            } else {
              $missing += $p
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host '--- Searching for stray payloads under common roots ---'
            $roots = @(
              $env:LOCALAPPDATA,
              $env:ProgramFiles
            ) | Where-Object { Test-Path $_ }
            foreach ($r in $roots) {
              Get-ChildItem -Path $r -Include 'meshharbord.exe','meshharbor-agent.exe' -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  found at: $($_.FullName)" }
            }
            throw "missing from $($installDir): $($missing -join ', ')"
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if (-not ($userPath -and $userPath -match [regex]::Escape('Programs\MeshHarbor'))) {
            throw "user PATH does not contain Programs\MeshHarbor after install (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host "User PATH contains the install dir"

      - name: Assert the install is self-contained (PE import audit)
        shell: pwsh
        run: |
          # A file-EXISTS check is not a self-containment check.
          #
          # The step above proves msvcp140/vcruntime140* were laid down; it
          # cannot prove they are SUFFICIENT, and running the binary here
          # would not either — `windows-latest` carries the VC redist (it is
          # where the staging step SOURCES those DLLs from, via vswhere), so
          # the loader would satisfy the imports from System32 and pass on a
          # machine that is guaranteed to have the dependency. That is the
          # exact shape that shipped a launch-crashing macOS .pkg in every
          # release until rc.453: a check executed in the environment that
          # supplies the missing dependency cannot detect a dependency on
          # that environment.
          #
          # So read the imports instead of trusting a successful start —
          # the Windows analogue of the Mach-O load-command scan. This is
          # the `dumpbin -dependents` check CLAUDE.md tells humans to run by
          # hand before adding a C++ dependency, made automatic.
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\MeshHarbor'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }

          # Redistributables — shipped by us, never by Windows. These MUST be
          # app-local; finding them in System32 proves nothing about a fresh
          # machine, so they are excluded from the System32 allowance below.
          $mustBeAppLocal = '^(msvcp|vcruntime|concrt|mfc|vcomp|msvcr)'

          function Audit-Imports {
            param([switch]$Quiet)
            $found    = @()
            $appLocal = @()
            foreach ($exe in @('meshharbord.exe', 'meshharbor.exe')) {
              $path = Join-Path $installDir $exe
              if (-not (Test-Path $path)) { $found += "$exe missing"; continue }
              $imports = & $dumpbin /dependents $path |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { $_.Matches[0].Groups[1].Value }
              if (-not $imports) { $found += "$exe : dumpbin listed no imports (parse broke?)"; continue }
              if (-not $Quiet) { Write-Host "$exe imports $($imports.Count) DLLs" }
              foreach ($dll in $imports) {
                if (Test-Path (Join-Path $installDir $dll)) { $appLocal += $dll; continue }
                if ($dll -match $mustBeAppLocal) {
                  $found += "$exe -> $dll is a REDISTRIBUTABLE and is not app-local"
                  continue
                }
                # API sets and OS DLLs are fine — they ship with Windows.
                if ($dll -match '^(api-ms-win-|ext-ms-win-)') { continue }
                if (Test-Path (Join-Path $env:SystemRoot 'System32' $dll)) { continue }
                $found += "$exe -> $dll is neither app-local nor an OS DLL"
              }
            }
            [pscustomobject]@{
              Problems = @($found)
              AppLocal = @($appLocal | Sort-Object -Unique)
            }
          }

          Write-Host '--- 1/2: the real install must be clean ---'
          $r = Audit-Imports
          if ($r.Problems.Count -gt 0) {
            $r.Problems | ForEach-Object { Write-Host "::error::$_" }
            throw "install is not self-contained"
          }
          Write-Host "OK: every import is app-local or shipped by Windows"
          Write-Host "app-local imports: $($r.AppLocal -join ', ')"

          # ⚠️ A gate proven only on the passing case is the failure mode this
          # step exists to fix — "it printed OK" is not evidence it can say
          # anything else. Hide a bundled DLL and require a complaint.
          #
          # The victim is chosen from what the binaries ACTUALLY import, not
          # named up front: this job builds a minimal feature set, so the C++
          # deps that pull in msvcp140 may be absent, and hiding a DLL nothing
          # imports proves nothing. (First attempt did exactly that and the
          # control caught it — which is the argument for having one.)
          Write-Host '--- 2/2: negative control — hiding a bundled import must FAIL the audit ---'
          if ($r.AppLocal.Count -eq 0) {
            throw "NEGATIVE CONTROL IMPOSSIBLE: no imported DLL is app-local, so this audit has nothing to detect. Either the bundle is unnecessary in this build, or the dumpbin parse is wrong — both need a human."
          }
          $victim = Join-Path $installDir $r.AppLocal[0]
          $stash  = "$victim.hidden"
          Write-Host "hiding $($r.AppLocal[0])"
          Move-Item $victim $stash
          try {
            $neg = Audit-Imports -Quiet
            if ($neg.Problems.Count -eq 0) {
              throw "NEGATIVE CONTROL FAILED: $($r.AppLocal[0]) was removed and the audit still passed — this check cannot detect what it claims to."
            }
            Write-Host "OK: audit reported $($neg.Problems.Count) problem(s): $($neg.Problems[0])"
          } finally {
            Move-Item $stash $victim
          }

      - name: Uninstall the MSI (quiet)
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          $log = Join-Path $logDir 'uninstall.log'
          $proc = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/x `"$env:MSI_PATH`" /quiet /norestart /l*v `"$log`"" `
            -Wait -PassThru
          'UNINSTALL_LOG=' + $log | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 200
            throw "msiexec /x failed with exit $($proc.ExitCode)"
          }
          Write-Host 'Uninstall succeeded (exit 0)'

      - name: Assert cleanup — registry + install dir gone
        shell: pwsh
        run: |
          # Same registry-direct query as the post-install assert.
          # Get-Package -Provider msi is PowerShell 5.x-only and the
          # runner uses pwsh 7 (see post-install step's comment).
          $uninstallRoots = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          # Same loose filter as the post-install step — match either
          # "Roomler Agent" (WiX DisplayName) or "roomler-agent"
          # (Cargo package name) so a future WiX rename in either
          # direction doesn't silently turn this assert into a no-op.
          $stragglers = @()
          foreach ($root in $uninstallRoots) {
            if (-not (Test-Path $root)) { continue }
            $stragglers += Get-ChildItem $root -ErrorAction SilentlyContinue |
                             Get-ItemProperty -ErrorAction SilentlyContinue |
                             Where-Object {
                               $_.DisplayName -and $_.DisplayName -match '(?i)roomler.*agent'
                             }
          }
          if ($stragglers.Count -gt 0) {
            throw "roomler-agent install record still present after uninstall: $($stragglers.DisplayName -join ', ')"
          }
          # P4b canonical layout: every component-managed payload must
          # be gone from Programs\MeshHarbor (all files are component-
          # managed, and the wxs RemoveFolder pair drops the dir when
          # empty), and the TunnelExe component's user-PATH append
          # must have been removed (Environment Part='last' +
          # implicit Permanent='no').
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\MeshHarbor'
          foreach ($f in @('meshharbord.exe', 'meshharbor-agent.exe', 'meshharbor.exe', 'wintun.dll', 'msvcp140.dll', 'vcruntime140_1.dll')) {
            $p = Join-Path $installDir $f
            if (Test-Path $p) {
              throw "$f still at $p after uninstall — MSI uninstaller is broken"
            }
          }
          if (Test-Path $installDir) {
            Write-Host "::warning::$installDir still exists (empty dir tolerated; component files verified gone)"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  leftover: $($_.FullName)" }
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue).PATH
          if ($userPath -and $userPath -match [regex]::Escape('Programs\MeshHarbor')) {
            throw "user PATH still contains Programs\MeshHarbor after uninstall (HKCU\Environment PATH = '$userPath')"
          }
          Write-Host 'Uninstall left no traces: payload, install dir contents, PATH entry and MSI registry record all clean'

      - name: Compile per-Machine MSI (wxs lint, no install)
        shell: pwsh
        env:
          SMOKE_VERSION: 0.0.0-smoke.1
        run: |
          # The release pipeline builds the per-Machine flavour by
          # file-swapping wix-perMachine/main.wxs over wix/main.wxs
          # (cargo-wix auto-discovers every wxs under wix/), and until
          # now NOTHING validated that file before the agent-v* tag run
          # -- the first rc.266 tag burned on a per-Machine-only
          # LGHT0368 that this smoke never compiled. Mirror the swap
          # and compile it here (candle + light + ICE = the actual
          # gate); no install, the flavour needs elevation semantics
          # this job doesn't exercise. Clear target\wix first: both
          # flavours emit the SAME output filename, and the per-User
          # MSI at $env:MSI_PATH was already installed + uninstalled
          # above, so clobbering is fine but a stale file would make
          # the produced-MSI assert vacuous.
          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          $wixDir = "agents\roomlerd\wix"
          $pmSrc  = "agents\roomlerd\wix-perMachine\main.wxs"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item $pmSrc "$wixDir\main.wxs" -Force
          try {
            cargo wix -p meshharbord --nocapture --no-build --install-version $env:SMOKE_VERSION
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }
          $msi = Get-ChildItem 'target/wix/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'per-Machine MSI not produced by cargo-wix' }
          Write-Host "per-Machine MSI compiles clean: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MiB)"

      - name: A hand-run per-Machine upgrade keeps the SystemContext mode (#1727)
        # The per-Machine MSI's first INSTALL coverage. A person running
        # `msiexec /i` with no ENABLE_SYSTEM_CONTEXT used to switch
        # SystemContext OFF: the property defaulted to "0", and every install
        # recreates the service, taking the ROOMLERD_ENABLE_SYSTEM_SWAP entry of
        # its Environment with it. A SystemContext laptop went offline that way
        # (2026-09-26). The fix keeps the mode the machine was last switched to
        # (`roomlerd keep-system-context`, from the product's own record).
        #
        # Four builds of the SAME binary at rising versions, so each install is
        # a real major upgrade (RemoveExistingProducts runs the old product's
        # service uninstall), the shape a hand-run install of a newer release
        # has. ⚠️ Windows Installer ignores a version's FOURTH field when it
        # decides an upgrade, so the versions differ in the third.
        #
        # What this CAN prove on a hosted runner: the switch in the service's
        # Environment, the record, and that the service is Running after each
        # step. What it cannot: the winlogon-token swap itself (the header's
        # "not in scope"), which needs a real interactive session.
        #
        # Negative control: on master the v2 cell fails (the swap is gone).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'pm-msi'
          $logDir = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Path $out, $logDir -Force | Out-Null

          Remove-Item target\wix\*.msi -Force -ErrorAction SilentlyContinue
          $wixDir = "agents\roomlerd\wix"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item "agents\roomlerd\wix-perMachine\main.wxs" "$wixDir\main.wxs" -Force
          try {
            foreach ($n in 1..4) {
              cargo wix -p meshharbord --nocapture --no-build --install-version "0.0.$n-smoke.1"
              if ($LASTEXITCODE -ne 0) { throw "cargo wix failed for v$n" }
              $msi = Get-ChildItem 'target/wix/*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              Move-Item $msi.FullName (Join-Path $out "pm-$n.msi") -Force
            }
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }

          function Invoke-Msi([string]$verb, [string]$msi, [string]$log, [string]$props) {
            $a = "$verb `"$msi`" /qn /norestart /l*v `"$log`" $props"
            $p = Start-Process msiexec.exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log -Tail 120
              throw "msiexec $verb $(Split-Path $msi -Leaf) [$props] exited $($p.ExitCode)"
            }
          }
          function Get-Swap {
            $block = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Roomler' -Name Environment -ErrorAction SilentlyContinue).Environment
            [bool](@($block) -contains 'ROOMLERD_ENABLE_SYSTEM_SWAP=1')
          }
          function Assert-Mode([string]$label, [bool]$want, [string]$version) {
            $svc = $null
            foreach ($i in 1..60) {
              $svc = Get-Service Roomler -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') { break }
              Start-Sleep -Seconds 1
            }
            $swap = Get-Swap
            $rec = Get-Content "$env:ProgramData\meshharbor\last-system-context-attempt.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            $products = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Roomler*per-Machine*' })
            Write-Host ("{0}: swap={1} (want {2}) service={3} record={4}/{5} products={6}" -f $label, $swap, $want, $svc.Status, $rec.command, $rec.stage, (($products | ForEach-Object { $_.DisplayVersion }) -join ','))
            if ($swap -ne $want) { throw "${label}: the SystemContext swap is $swap, want $want" }
            if (-not $svc -or $svc.Status -ne 'Running') { throw "${label}: the Roomler service is $($svc.Status), want Running" }
            if ($products.Count -ne 1 -or $products[0].DisplayVersion -ne $version) {
              throw "${label}: want exactly one per-Machine product at $version, found: $(($products | ForEach-Object { $_.DisplayVersion }) -join ',')"
            }
          }

          try {
            Invoke-Msi '/i' (Join-Path $out 'pm-1.msi') (Join-Path $logDir 'pm-1.log') 'ENABLE_SYSTEM_CONTEXT=1'
            Assert-Mode 'v1, installed with =1' $true '0.0.1.1'
            # THE regression cell: a person upgrading by hand, no property.
            Invoke-Msi '/i' (Join-Path $out 'pm-2.msi') (Join-Path $logDir 'pm-2.log') ''
            Assert-Mode 'v2, hand-run upgrade with no property' $true '0.0.2.1'
            Invoke-Msi '/i' (Join-Path $out 'pm-3.msi') (Join-Path $logDir 'pm-3.log') 'ENABLE_SYSTEM_CONTEXT=0'
            Assert-Mode 'v3, upgrade with an explicit =0' $false '0.0.3.1'
            Invoke-Msi '/i' (Join-Path $out 'pm-4.msi') (Join-Path $logDir 'pm-4.log') ''
            Assert-Mode 'v4, hand-run upgrade with no property' $false '0.0.4.1'
          } finally {
            Copy-Item "$env:ProgramData\meshharbor\roomler\service-logs" (Join-Path $logDir 'service-logs') -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:ProgramData\meshharbor\last-system-context-attempt.json" $logDir -Force -ErrorAction SilentlyContinue
          }

          Invoke-Msi '/x' (Join-Path $out 'pm-4.msi') (Join-Path $logDir 'pm-uninstall.log') ''
          if (Get-Service Roomler -ErrorAction SilentlyContinue) { throw 'the Roomler service survived the uninstall' }
          Write-Host 'per-Machine uninstall removed the service'

      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs/
          retention-days: 7

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: installer-smoke-windows
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

  # macOS had NO installer coverage at all until rc.454, and the platform
  # shipped for months with an install that could not work: the pkg payload was
  # the .app and nothing else (no CLI), the privileged half was gated on a
  # marker file nothing ever created, and running the one-liner under `sudo`
  # silently enrolled into the wrong profile. None of that is visible to a
  # compile check — it needs a real install.
  #
  # What this CAN prove on a hosted runner: the pkg builds, installs, puts both
  # binaries where the plists and the docs say they are, loads the LaunchAgent,
  # and the CLI shim resolves the daemon inside the bundle. What it CANNOT: TCC
  # grants, since there is no way to accept a privacy prompt headlessly — so it
  # asserts the honest REFUSAL path instead, which is exactly what runtime
  # permission reporting made assertable.
  macos-pkg-install:
    name: macOS pkg install smoke
    # Pinned to the image release-agent.yml builds the shipped .pkg on (GitHub
    # retires macos-14 by 2026-11-02).
    runs-on: macos-15
    timeout-minutes: 40
    # FR-6 wave 22 (#773): a master push publishes this job's cargo cache as a
    # release asset (ci-seed-save), which needs `contents: write`.
    permissions:
      contents: write
    env:
      # rust-cache set this for the job until wave 22; set it here.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Salt the cargo cache key with this job's definition
        # FR-6 wave 16 (#773): rotates this job's cargo cache when its own
        # steps change. After checkout, before the cache; see the action.
        uses: ./.github/actions/cargo-cache-salt

      - name: Restore the cargo cache (release-asset store)
        # FR-6 wave 22 (#773): see the Windows job above and the action.
        id: seed
        continue-on-error: true
        uses: ./.github/actions/ci-seed-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-pkg-smoke

      - name: Install system deps
        run: brew install cmake libvpx pkg-config

      # Feature set is a subset of release-agent.yml's build-macos: `full`
      # would drag in the whole media stack for no extra signal, and the
      # payload shape plus the launchd wiring are what this job is about.
      - name: Build the agent + the CLI shim
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          cargo build -p meshharbord --release \
            --features "media,vp9-444,vp9-444-bindgen,overlay-l3" \
            --target aarch64-apple-darwin
          cargo build -p meshharbor-cli-shim --release --target aarch64-apple-darwin
          cargo build -p meshharbor-desktop --release --target aarch64-apple-darwin

      - name: Stage + build the pkg
        run: |
          set -euo pipefail
          VERSION="0.0.0-smoke"
          APP=stage/meshharbord.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp target/aarch64-apple-darwin/release/roomlerd "$APP/Contents/MacOS/roomlerd"

          # The same dependency walk the release lane runs. Without it the
          # binary loads Homebrew paths that exist here and nowhere else, and
          # the install "passes" while being undeployable.
          FW="$APP/Contents/Frameworks"
          bundle_deps() {
            local target="$1" dep base
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in /usr/lib/*|/System/*|@*) continue ;; esac
              base="$(basename "$dep")"
              if [ ! -f "$FW/$base" ]; then
                cp -L "$dep" "$FW/$base"
                chmod u+w "$FW/$base"
                install_name_tool -id "@rpath/$base" "$FW/$base"
                bundle_deps "$FW/$base"
              fi
              install_name_tool -change "$dep" "@rpath/$base" "$target"
            done
          }
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/roomlerd"
          bundle_deps "$APP/Contents/MacOS/roomlerd"
          # Deliberately AD-HOC here, diverging from the release lane's stable
          # self-signed identity: identity stability is a FLEET property (TCC
          # grants surviving updates), meaningless on a throwaway runner — and
          # fork PRs have no secrets, so requiring the cert would break them.
          find "$APP" -type f \( -name '*.dylib' -o -name 'roomlerd' \) \
            -exec codesign --force --sign - {} \;

          cp agents/meshharbord/packaging/macos/fans.itachi.meshharbor.agent.plist "$APP/Contents/Resources/"
          cp agents/meshharbord/packaging/macos/fans.itachi.meshharbor.daemon.plist "$APP/Contents/Resources/"
          cp agents/meshharbord/packaging/macos/fans.itachi.meshharbor.desktop.plist "$APP/Contents/Resources/"
          cp agents/meshharbord/packaging/macos/fans.itachi.meshharbor.update.plist "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>roomlerd</string>
            <key>CFBundleIdentifier</key><string>fans.itachi.meshharbor.agent</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST

          # Seal the bundle LAST, mirroring the release lane. Signing the main
          # executable earlier seals the whole bundle, and everything written
          # after that (both plists, Info.plist) falsifies the seal — which is
          # what shipped in rc.453/rc.454 and what this job kept failing on.
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP" || {
            echo "::error::the .app's signature does not match its contents"
            exit 1
          }

          # The companion, staged the same way the release lane does it.
          DESK=stage/MeshHarbor.app
          mkdir -p "$DESK/Contents/MacOS" "$DESK/Contents/Resources"
          cp target/aarch64-apple-darwin/release/meshharbor-desktop "$DESK/Contents/MacOS/meshharbor-desktop"
          cat > "$DESK/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>meshharbor-desktop</string>
            <key>CFBundleIdentifier</key><string>fans.itachi.meshharbor.agent-tray</string>
            <key>CFBundleName</key><string>Roomler</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$DESK"

          mkdir -p payload/Applications payload/usr/local/bin scripts dist
          mkdir -p payload/Library/Roomler
          cp -R "$APP" payload/Library/Roomler/
          cp -R "$DESK" payload/Applications/
          cp target/aarch64-apple-darwin/release/roomler-shim payload/usr/local/bin/roomler
          chmod 755 payload/usr/local/bin/roomler
          ln -s /Library/Roomler/meshharbord.app/Contents/MacOS/roomlerd \
            payload/usr/local/bin/roomlerd
          cp agents/meshharbord/packaging/macos/postinstall scripts/postinstall
          chmod 755 scripts/postinstall
          # pkgbuild THEN productbuild — the same two steps release-agent.yml
          # runs, and not an optimisation to skip.
          #
          # `pkgbuild` infers the .app as a relocatable BUNDLE COMPONENT
          # ("Inferring bundle components from contents of payload"). Installing
          # that raw component package directly does not put the payload at its
          # final path before the top-level postinstall runs, so the script
          # fails on a bundle that is demonstrably IN the payload — verified
          # here with `pkgutil --payload-files`. Wrapping it in a product
          # archive is what the shipped artifact is, and it installs correctly
          # on a real Mac.
          #
          # The general rule this cost three CI cycles to relearn: an installer
          # smoke must build its artifact EXACTLY as the release does, or it
          # tests something nobody ships.
          # Pin the bundle to its payload path — see the same block in
          # release-agent.yml. Without it PackageKit relocates the .app to
          # whatever copy LaunchServices already knows about, which on this
          # runner is the staging directory this pkg was built from, and the
          # postinstall then finds nothing at /Applications.
          pkgbuild --analyze --root payload component.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i:BundleIsRelocatable" component.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" component.plist
            i=$((i + 1))
          done
          [ "$i" -gt 0 ] || { echo "::error::pkgbuild --analyze found no bundle component to pin"; exit 1; }
          plutil -p component.plist

          pkgbuild --root payload --component-plist component.plist \
            --scripts scripts --identifier fans.itachi.meshharbor.agent \
            --version "$VERSION" --install-location / component.pkg
          # Gated exactly as the release is (release-agent.yml's MACOS_FLOOR), and
          # a second product gated at an impossible macOS for the negative
          # control below.
          bash scripts/macos-productbuild-gated.sh component.pkg dist/smoke.pkg 15.0
          bash scripts/macos-productbuild-gated.sh component.pkg dist/smoke-gate-99.pkg 99.0

          # Prove what is actually IN the package before installing it, so a
          # script failure can never again be confused with a staging failure.
          echo "=== payload ==="
          pkgutil --payload-files component.pkg | sed -n '1,40p'
          pkgutil --payload-files component.pkg | grep -q 'Contents/Resources/fans.itachi.meshharbor.agent.plist' \
            || { echo "::error::the LaunchAgent plist is not in the payload"; exit 1; }
          pkgutil --payload-files component.pkg | grep -q 'usr/local/bin/roomler' \
            || { echo "::error::the CLI is not in the payload"; exit 1; }

      # The shipped .pkg refuses a Mac below its floor, and on this runner every
      # real floor passes, so prove the mechanism with an impossible one. If
      # `installer` ever stopped honouring <allowed-os-versions>, a Mac below the
      # floor would install a daemon that cannot start. Runs BEFORE the real
      # install, while nothing of ours is on this runner yet.
      - name: The installer gate refuses an unsupported macOS (negative control)
        run: |
          set -uo pipefail
          if sudo installer -pkg dist/smoke-gate-99.pkg -target / > gate.log 2>&1; then
            cat gate.log
            echo "::error::installer ACCEPTED a package gated at macOS 99.0"
            exit 1
          fi
          cat gate.log
          [ ! -e /Library/Roomler/meshharbord.app ] \
            || { echo "::error::the refused install still put the daemon bundle down"; exit 1; }
          echo "refused, and nothing landed"

      - name: Install it
        run: sudo installer -verbose -pkg dist/smoke.pkg -target /

      # `installer` reports script failures as one opaque sentence ("An error
      # occurred while running scripts from the package") and puts the actual
      # stderr in the system log. Without this the only way to find out why a
      # postinstall failed is to guess.
      - name: Why the install failed
        if: failure()
        run: |
          echo "=== console user ==="
          stat -f "%Su" /dev/console || true
          echo "=== install.log (roomler + script lines) ==="
          sudo tail -200 /var/log/install.log | grep -iE "roomler|script|error|fail" || true
          echo "=== what landed anyway ==="
          ls -la /Library/Roomler/meshharbord.app/Contents/MacOS/ 2>&1 || true
          ls -la /usr/local/bin/roomler 2>&1 || true
          echo "=== is /Applications what we think it is? ==="
          ls -ld /Applications 2>&1 || true
          echo "=== did the bundle land SOMEWHERE else? ==="
          # pkgbuild infers the .app as a bundle component, and bundle
          # components are RELOCATABLE by default: PackageKit may install one
          # wherever it finds an existing copy rather than at the payload path.
          sudo find / -maxdepth 6 -name 'meshharbord.app' -not -path '*/work/*' 2>/dev/null || true
          echo "=== component metadata (relocatable? install-location?) ==="
          rm -rf /tmp/pkgexp
          pkgutil --expand dist/smoke.pkg /tmp/pkgexp 2>&1 || true
          find /tmp/pkgexp -maxdepth 2 -name PackageInfo -o -maxdepth 2 -name Distribution 2>/dev/null \
            | while read -r f; do echo "--- $f"; cat "$f"; echo; done

      - name: Assert the payload landed where everything expects it
        run: |
          set -euo pipefail
          BIN=/Library/Roomler/meshharbord.app/Contents/MacOS/roomlerd
          # Both plists and the docs name this path literally, and a rename
          # would void every TCC grant keyed to the binary.
          test -x "$BIN" || { echo "::error::missing $BIN"; exit 1; }
          # The CLI the pkg did not ship at all before rc.454.
          test -x /usr/local/bin/roomler || { echo "::error::missing /usr/local/bin/roomler"; exit 1; }
          # Command-surface parity with Linux and Windows: `roomlerd` on PATH.
          test -x /usr/local/bin/roomlerd || { echo "::error::missing /usr/local/bin/roomlerd"; exit 1; }
          [ "$(readlink /usr/local/bin/roomlerd)" = "$BIN" ] \
            || { echo "::error::roomlerd does not point at the bundle binary"; exit 1; }
          "$BIN" --version
          /usr/local/bin/roomlerd --version >/dev/null \
            || { echo "::error::roomlerd on PATH does not run"; exit 1; }
          echo "  payload OK"

      # FR-46 P5b — the pre-rename bundle must be SWEPT, not left beside the new
      # one. A pkg install is additive, so without the sweep an upgraded Mac
      # keeps a second signed, launchable copy of the daemon — and, worse, the
      # copy that every existing Privacy grant still points at. An operator
      # hunting the right thing to approve would find two candidates.
      #
      # Seeded and re-installed rather than asserted on a fresh box, because on
      # a fresh box the old bundle never exists and the assert would pass while
      # proving nothing.
      - name: The pre-rename bundle is swept by an upgrade
        run: |
          set -euo pipefail
          sudo mkdir -p /Library/Roomler/meshharbor-agent.app/Contents/MacOS
          sudo cp /Library/Roomler/meshharbord.app/Contents/MacOS/roomlerd \
            /Library/Roomler/meshharbor-agent.app/Contents/MacOS/roomler-agent
          test -d /Library/Roomler/meshharbor-agent.app \
            || { echo "::error::could not seed the pre-rename bundle"; exit 1; }
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          test ! -d /Library/Roomler/meshharbor-agent.app \
            || { echo "::error::the pre-rename bundle survived the upgrade"; exit 1; }
          test -x /Library/Roomler/meshharbord.app/Contents/MacOS/roomlerd \
            || { echo "::error::the sweep took the CURRENT bundle with it"; exit 1; }
          echo "  pre-rename bundle swept; current bundle intact"

      - name: Assert the LaunchAgent is registered, and the root half is not
        run: |
          set -euo pipefail
          # Two legitimate outcomes, and the job must not confuse them.
          #
          # A hosted runner usually has NO Aqua session, which is the same
          # situation as installing over SSH or at the login window. The
          # postinstall must then place what it can and say so — NOT abort and
          # leave a half-applied install reported as a failure, which is what
          # it did before this job existed to catch it.
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          echo "console user: '${console_user:-<none>}'"

          if [ -z "$console_user" ] || [ "$console_user" = root ]; then
            # No GUI session: the install must still have SUCCEEDED (asserted by
            # the step above, which would have failed on a missing payload).
            echo "  no GUI session — install completed without registering the agent, as intended"
          else
            uid_now=$(id -u "$console_user")
            plist="$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')/Library/LaunchAgents/fans.itachi.meshharbor.agent.plist"
            test -f "$plist" || { echo "::error::plist not placed at $plist"; exit 1; }
            echo "  plist placed at $plist"
            if launchctl print "gui/$uid_now/fans.itachi.meshharbor.agent" >/dev/null 2>&1; then
              echo "  LaunchAgent loaded in gui/$uid_now"
            else
              # Placed but not loaded is the documented degraded outcome (it
              # loads at next login), so this is a note, not a failure.
              echo "  plist placed but not loaded in gui/$uid_now — starts at next login"
            fi
          fi
          # Opt-in, and NOT requested here, so it must be absent. The
          # postinstall declining to install a root daemon nobody asked for is
          # as load-bearing as installing one that was asked for.
          if [ -f /Library/LaunchDaemons/fans.itachi.meshharbor.daemon.plist ]; then
            echo "::error::the root LaunchDaemon appeared without the enable-daemon marker"
            exit 1
          fi
          echo "  privileged half correctly absent"

      - name: Assert the update helper is installed BY DEFAULT
        run: |
          set -euo pipefail
          # The update half is the OPPOSITE polarity of the overlay daemon:
          # default ON, marker opts OUT. A default install must carry it, or
          # the DEFAULT macOS flavour (per-user only) can never self-update —
          # which is the exact state that left a Mac permanently stale.
          test -f /Library/LaunchDaemons/fans.itachi.meshharbor.update.plist \
            || { echo "::error::fans.itachi.meshharbor.update.plist missing — default install has no updater"; exit 1; }
          # Loaded, not merely placed: RunAtLoad/StartInterval/WatchPaths all
          # hang off the loaded job. (Its RunAtLoad fires the helper once here;
          # the smoke binary's version >= the latest published release, so the
          # helper reports up-to-date/skipped and exits — no install happens.)
          launchctl print system/fans.itachi.meshharbor.update >/dev/null 2>&1 \
            || { echo "::error::fans.itachi.meshharbor.update installed but not loaded"; exit 1; }
          echo "  update helper installed + loaded (default ON)"

      - name: Assert the menu-bar companion shipped and registered
        run: |
          set -euo pipefail
          # macOS had no companion at all before rc.456 — the platform where the
          # OS silently withholds capture and input was the one with nowhere to
          # SAY so.
          test -x /Applications/MeshHarbor.app/Contents/MacOS/meshharbor-desktop \
            || { echo "::error::the companion .app is missing"; exit 1; }
          # LSUIElement is what keeps a menu-bar app out of the Dock; without it
          # the user gets a Dock tile for something that has no main window.
          [ "$(plutil -extract LSUIElement raw /Applications/MeshHarbor.app/Contents/Info.plist)" = "true" ] \
            || { echo "::error::the companion is not marked LSUIElement"; exit 1; }
          console_user=$(stat -f "%Su" /dev/console 2>/dev/null || echo "")
          if [ -n "$console_user" ] && [ "$console_user" != root ]; then
            home=$(dscl . -read /Users/"$console_user" NFSHomeDirectory | awk '{print $2}')
            test -f "$home/Library/LaunchAgents/fans.itachi.meshharbor.desktop.plist" \
              || { echo "::error::the companion LaunchAgent was not installed"; exit 1; }
            echo "  companion registered for $console_user"
          else
            echo "  no GUI session — companion installed, registration deferred"
          fi

      - name: Assert the CLI shim resolves the daemon inside the bundle
        run: |
          set -euo pipefail
          # macOS is the one platform where the shim's sibling-`roomlerd` probe
          # cannot work, so this covers the bundle fallback. Nothing is enrolled
          # here, so the command itself will fail — what must NOT happen is the
          # shim failing to locate the daemon at all.
          out="$(/usr/local/bin/roomler status 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"daemon binary is missing"*)
              echo "::error::the shim could not resolve the bundle executable"
              exit 1
              ;;
          esac
          echo "  shim resolves the daemon"

      - name: Assert permissions are reported HONESTLY when denied
        run: |
          set -euo pipefail
          # A hosted runner grants neither Screen Recording nor Accessibility,
          # so this is the denied path — the one that used to advertise itself
          # as working because `has_input_permission` was a compile-time
          # constant. Being able to assert this at all is the point of moving
          # it to a runtime probe.
          caps="$(/Library/Roomler/meshharbord.app/Contents/MacOS/roomlerd caps 2>&1 || true)"
          echo "$caps"
          if echo "$caps" | grep -qi 'has_input_permission: true'; then
            echo "::error::input advertised as granted on a runner that granted nothing"
            exit 1
          fi
          echo "  permissions reported honestly"

      - name: An enabled daemon must SURVIVE the next install (self-update)
        run: |
          set -euo pipefail
          # The postinstall removes the root daemon when the marker is absent,
          # which is correct for a real opt-out — but a SELF-UPDATE is not an
          # opt-out, and it runs the very same pkg. Until the enabling branch
          # recorded the choice, a daemon enabled via ROOMLER_MACOS_DAEMON=1
          # left no marker, so the NEXT update silently deleted it: overlay
          # and SSH both gone. Field-hit on a MacBook 2026-08-25 across an
          # rc.458 -> rc.460 self-update.
          #
          # `installer` sends postinstall stdout to /var/log/install.log, NOT to
          # this job's log, so a bare failure here says nothing about what the
          # script actually decided. Dump the script's own lines after every
          # install — the one diagnostic that turns "it failed" into a cause.
          since=$(date -u "+%Y-%m-%d %H:%M:%S")
          dump_log() {
            echo "--- postinstall output from /var/log/install.log ---"
            sudo awk -v s="$since" '$0 ~ /roomler|enable-daemon|daemon/ {print "    " $0}' \
              /var/log/install.log 2>/dev/null | tail -25 || true
          }

          # Enable via the MARKER — the only mechanism that exists. There is no
          # env-var form: macOS runs package scripts from package_script_service,
          # a separate PackageKit daemon, so they never see the environment of
          # whoever ran `installer`. This job proved that on 2026-08-25 — an
          # install with ROOMLER_MACOS_DAEMON=1 logged the per-user lines and
          # none of the daemon ones — and the dead condition was removed.
          echo "=== install 1: enabled via the marker ==="
          # FR-46 P5a — deliberately seeded at the LEGACY path, so this install
          # exercises the postinstall migration end to end rather than only the
          # happy path. A marker the migration failed to carry would fall through
          # to the else branch and BOOT OUT the daemon, which is the failure this
          # whole phase is shaped around.
          # RETIRED-NAME-ANCHOR(2): the migration SOURCE, seeded on purpose.
          sudo mkdir -p /etc/roomler-agent
          sudo touch /etc/roomler-agent/enable-daemon
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          test -f /Library/LaunchDaemons/fans.itachi.meshharbor.daemon.plist \
            || { echo "::error::daemon plist missing after an enabled install"; exit 1; }
          echo "  daemon installed"
          # The migration must have MOVED it, not copied it: a legacy directory
          # left behind would be read again by the dual-read gates forever.
          test -f /etc/roomler/enable-daemon \
            || { echo "::error::the marker was not migrated to /etc/roomler"; exit 1; }
          test ! -d /etc/roomler-agent \
            || { echo "::error::the legacy /etc/roomler-agent survived the migration"; exit 1; }
          echo "  config dir migrated off the retired name"

          echo "=== install 2: plain, i.e. what a self-update runs ==="
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          test -f /Library/LaunchDaemons/fans.itachi.meshharbor.daemon.plist \
            || { echo "::error::a plain re-install DELETED the enabled daemon — \
                 the self-update regression is back"; exit 1; }
          echo "  daemon survived the update"

          # And the opt-OUT path must still work: remove the marker, install,
          # daemon goes. Otherwise this test would pass by making the removal
          # branch unreachable, which is the opposite defect.
          echo "=== install 3: marker removed = a real opt-out ==="
          sudo rm -f /etc/roomler/enable-daemon
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          if [ -f /Library/LaunchDaemons/fans.itachi.meshharbor.daemon.plist ]; then
            echo "::error::opt-out no longer removes the daemon"
            exit 1
          fi
          echo "  opt-out still honoured"

      - name: The update helper's opt-out round-trip (disable -> gone, enable -> back)
        run: |
          set -euo pipefail
          since=$(date -u "+%Y-%m-%d %H:%M:%S")
          dump_log() {
            echo "--- postinstall output from /var/log/install.log ---"
            sudo awk -v s="$since" '$0 ~ /roomler|update helper|disable-auto-update/ {print "    " $0}' \
              /var/log/install.log 2>/dev/null | tail -25 || true
          }

          # The three installs above all ran WITHOUT the disable marker, so the
          # helper must still be present at this point (regression guard for
          # "an unrelated re-install dropped the updater").
          test -f /Library/LaunchDaemons/fans.itachi.meshharbor.update.plist \
            || { echo "::error::update plist vanished across plain re-installs"; exit 1; }

          echo "=== opt out: marker set -> the helper must GO ==="
          # FR-46 P5a — by this point install 1 has already migrated the directory,
          # so `/etc/roomler` EXISTS and the migration (dest-absent only) will not
          # run again. That makes this block exercise the DUAL-READ fallback arm:
          # an opt-out marker sitting at the legacy path must still be honoured,
          # because reading only the current path would auto-update a Mac whose
          # operator opted out. Deliberate coverage, not an accident of ordering.
          # RETIRED-NAME-ANCHOR(2): the legacy opt-out path, seeded on purpose.
          sudo mkdir -p /etc/roomler-agent
          sudo touch /etc/roomler-agent/disable-auto-update
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          if [ -f /Library/LaunchDaemons/fans.itachi.meshharbor.update.plist ]; then
            echo "::error::disable-auto-update did not remove the helper plist"
            exit 1
          fi
          # The idle job must have been booted out too (the in-flight guard
          # only defers when an update is actually running, which none is here).
          if launchctl print system/fans.itachi.meshharbor.update >/dev/null 2>&1; then
            echo "::error::helper job still loaded after opt-out"
            exit 1
          fi
          echo "  opt-out removes the helper"

          echo "=== opt back in: marker removed -> the helper must RETURN ==="
          sudo rm -f /etc/roomler-agent/disable-auto-update
          sudo installer -verbose -pkg dist/smoke.pkg -target /
          dump_log
          test -f /Library/LaunchDaemons/fans.itachi.meshharbor.update.plist \
            || { echo "::error::helper plist not restored after removing the opt-out"; exit 1; }
          launchctl print system/fans.itachi.meshharbor.update >/dev/null 2>&1 \
            || { echo "::error::helper not re-loaded after removing the opt-out"; exit 1; }
          echo "  opt-in restores the helper"

      # FR-6 wave 22 (#773): the job's LAST step. Only a master push
      # publishes, and an unchanged cache is not re-uploaded; see the action.
      - name: Publish the cargo cache (release-asset store)
        if: github.ref == 'refs/heads/master' && steps.seed.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/ci-seed-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          family: macos-pkg-smoke
          key: ${{ steps.seed.outputs.key }}
          exact: ${{ steps.seed.outputs.exact }}

# RETIRED-NAME-ANCHOR-END
