name: Licensing

# FR-24 — the mechanism that stops the AGPL/MPL split from rotting.
#
# Three independent checks, in increasing order of what they'd catch:
#   1. every workspace member declares an explicit `license`
#   2. every first-party source file carries the right SPDX header
#   3. NO server crate appears in a shipped agent binary's dependency graph
#
# (3) is the load-bearing one. (1) and (2) catch a forgotten file; (3) catches
# the change that would actually break the promise in LICENSING.md — an
# AGPL-licensed crate reaching a binary customers install on their own machines.

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'scripts/licence-classes.sh'
      - 'scripts/apply-spdx.sh'
      - '.github/workflows/licensing.yml'
      - 'crates/**'
      - 'agents/**'
      - 'ui/src/**'
      # ⚠️ The trigger names EXTENSIONS, not directories. `apply-spdx.sh --check`
      # grades every TRACKED file whose extension has a `comment_style` and whose
      # path is outside `EXCLUDE_PATTERNS` — wherever it lives. A directory list
      # cannot keep up with that: #1194 touched only `ui/public/`, this job never
      # fired, its headerless `rc-vp9-444-harness.js` merged, and master went red
      # on the next push — failing every unrelated PR after it. On 2026-09-25 the
      # same gap still covered `ui/docs/` (the docs site), the `ui/` root and
      # `docs/assets/`: 24 graded files no PR could trigger this job for.
      # A gate that cannot see the files it grades is worse than no gate,
      # because it reports success.
      # ⚠️ An extension added to `comment_style` must be added here too.
      - '**.rs'
      - '**.ts'
      - '**.mts'
      - '**.cts'
      - '**.js'
      - '**.vue'
      - '**.html'
      - 'LICENSE*'
      - 'LICENSING.md'
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: licensing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    name: Licence split integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Every workspace member declares an explicit `license`
        run: |
          set -euo pipefail
          source scripts/licence-classes.sh
          fail=0
          # The WORKSPACE decides what is a member, not a glob. This step used to
          # iterate `crates/*/Cargo.toml agents/*/Cargo.toml`, one level deep, so
          # when FR-69 put six crates under `crates/modules/` it checked 18 of 24
          # members and still printed OK. The six happened to declare AGPL
          # correctly; nothing here would have noticed if they had not.
          members=$(awk '/^members *= *\[/{p=1; next} p && /^\]/{exit} p' Cargo.toml \
            | sed -E 's/#.*//' | grep -oE '"[^"]+"' | tr -d '"')
          n=$(printf '%s\n' "$members" | grep -c . || true)
          if [ "$n" -eq 0 ]; then
            echo "::error::parsed no workspace members from Cargo.toml — refusing to report a clean split"
            exit 1
          fi
          for m in $members; do
            f="$m/Cargo.toml"
            pkg=$(grep -m1 '^name = ' "$f" | sed 's/name = //;s/"//g')
            # Only the [package] section counts — [package.metadata.wix] also
            # has a `license` key, and it means something entirely different.
            got=$(awk '/^\[/{n++} n>1{exit} /^license = /{print $3}' "$f" | tr -d '"')
            want=$(licence_for_crate "$pkg") || {
              echo "::error file=$f::$pkg is not classified in scripts/licence-classes.sh"
              fail=1; continue
            }
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::$pkg declares '${got:-<none>}', expected '$want'"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "OK: all $n workspace members declare the expected licence."
          exit $fail

      - name: Every first-party source file carries the right SPDX header
        run: bash scripts/apply-spdx.sh --check

      # ── The one that matters ────────────────────────────────────────────────
      # An AGPL crate inside meshharbord would make the agent effectively AGPL,
      # which is a procurement blocker at most enterprises and would falsify the
      # MSP paragraph in LICENSING.md. Nothing else in this workflow would catch
      # it: the new edge would be a one-line Cargo.toml change that compiles.
      - uses: dtolnay/rust-toolchain@stable
      - name: No AGPL crate reaches a shipped agent binary
        run: |
          set -euo pipefail
          source scripts/licence-classes.sh
          fail=0
          for agent in "${SHIPPED_AGENT_CRATES[@]}"; do
            # -e normal drops dev-dependencies: a test-only edge cannot reach a
            # shipped binary, and treating it as a violation would be a false
            # positive that trains people to disable this check.
            graph=$(cargo tree -p "$agent" -e normal --prefix none --no-dedupe 2>/dev/null | awk '{print $1}' | sort -u)
            for server in "${SERVER_CRATES[@]}"; do
              if printf '%s\n' "$graph" | grep -qx "$server"; then
                echo "::error::$agent (MPL-2.0, shipped to customer machines) depends on $server ($SERVER_LICENCE)."
                echo "         This would make the agent effectively $SERVER_LICENCE. See LICENSING.md."
                cargo tree -p "$agent" -e normal --invert "$server" 2>/dev/null | head -20
                fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "OK: no $SERVER_LICENCE crate reaches any shipped agent binary."
          exit $fail

      - name: Dependency licences are on the allowlist
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
