# RETIRED-NAME-ANCHOR-BEGIN
# Every retired name in this workflow is either a PUBLISHED release-asset name
# (already-released files cannot be renamed, and the updater's picker matches
# those strings) or a FROZEN install path — the macOS .app bundle whose name keys
# the TCC grants, or the inert meshharbor-agent.exe alias deployed fleet resolves.
# INVARIANT: a retired name here must be a published artifact name or a path a
# real host has. If you add one that is neither, that is a bug, not a new
# exemption. docs/fr/FR-21
name: Release meshharbor-tunnel

# Builds the `meshharbor-tunnel` CLI binary for the desktop targets the
# operator might run on — Linux x86_64, Linux aarch64 (FR-97 P7b), macOS
# (universal — x86_64 + aarch64), and Windows x86_64. Outputs a plain archive
# (tar.gz / zip) per target, plus a `.deb` per Linux arch for Debian / Ubuntu
# installs.
#
# The Windows `mh.exe` is Authenticode-signed via
# ./.github/actions/sign-windows (the signing job carries `environment:
# release` — the federated credential is bound to that GitHub environment);
# the macOS universal binary is Developer-ID-signed + notarised (NOT stapled
# — Apple cannot staple a bare Mach-O; the curl|tar install paths never set
# the quarantine attribute, so this only matters for browser downloads on
# offline Macs). See docs/code-signing.md.
#
# Triggered by:
#  - `git push` of a tag matching `tunnel-v*` → publishes a GitHub Release
#  - `workflow_dispatch` with `version` + optional `publish_release` →
#    artifacts only (30-day retention) unless `publish_release=true`.
#
# meshharbor-tunnel has NO native deps beyond what `webrtc-rs` brings (rustls,
# pure Rust). No libvpx, no scrap, no enigo. Builds compile cleanly on every
# target's default GitHub runner.

on:
  push:
    tags:
      - 'tunnel-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tunnel version (e.g. 0.3.0-rc.46) — must match workspace Cargo.toml'
        required: true
      publish_release:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
      signing_mode:
        description: 'Windows signing: auto (azure if configured) | azure | local (self-signed rehearsal) | off'
        type: choice
        options: [auto, local, azure, 'off']
        default: auto
      require_signing:
        description: 'Fail the job if artifacts end up unsigned (rehearses the release-tag gate)'
        type: boolean
        default: false

permissions:
  contents: write

# P3e Phase 2: single-codegen-unit release artifacts — same rationale and
# measurements as release-agent.yml's env block (CLI 21.29 -> 15.53 MiB,
# -27.1%; LTO loses to this on both axes here, don't "upgrade" it).
env:
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Validate version matches Cargo.toml
  # ---------------------------------------------------------------------------
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + tag
        id: resolve
        shell: bash
        # Dispatch inputs reach the script through the environment, never via
        # `${{ }}` interpolation into the shell — interpolation pastes the raw
        # value into the script text, so it would EXECUTE. See release-agent.yml.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#tunnel-v}"
            is_release=true
          else
            version="${INPUT_VERSION:-}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::Invalid version input: '${version}' (expected N.N.N or N.N.N-rc.N)"
              exit 1
            fi
            tag="tunnel-v${version}"
            if [[ "${INPUT_PUBLISH_RELEASE:-}" == "true" ]]; then
              is_release=true
            else
              is_release=false
            fi
          fi
          echo "Resolved: version=${version} tag=${tag} is_release=${is_release}"
          cargo_version=$(awk '
            /^\[workspace\.package\]/ {in_section=1; next}
            /^\[/ {in_section=0}
            in_section && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml workspace version: ${cargo_version}"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: requested ${version} but Cargo.toml has ${cargo_version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Linux x86_64 — tarball + .deb (Debian / Ubuntu)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux x86_64)
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: tunnel-linux
          # Tag-ref cache saves can never be restored by a future tag run
          # (GH cache isolation: own ref or default branch only) — only
          # non-tag runs (dispatch rehearsals on master) save.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Install cargo-deb
        # Idempotent: the seed caches (#488) can restore ~/.cargo/bin with
        # the tool present; a plain install hard-errors on it (rc.383's
        # agent release died on exactly this).
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked
      - name: Build meshharbor-tunnel (release)
        run: cargo build -p meshharbor-cli --release
      - name: Strip binary
        # P3d Slice B: CLI OUTPUT binary is now `mh` (was `meshharbor-tunnel`).
        run: strip target/release/mh
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-tunnel-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "/tmp/${name}"
          # P3d Slice C: the legacy `meshharbor-tunnel` in-archive alias is retired —
          # every live consumer (rc.194+ self-update, meshharbor-setup's
          # find_tunnel_binary, install.sh) resolves the new `mh` name first.
          # Archive NAME keeps the meshharbor-tunnel-… prefix (frozen contract).
          cp target/release/mh "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          sha256sum "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build .deb
        working-directory: agents/meshharbor-cli
        run: cargo deb --no-build --no-strip
      - name: Rename .deb + checksum
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          # FR-21 P2b: cargo-deb emits `<package>_…`, and the package is
          # `meshharbor-cli` now. The DESTINATION asset name deliberately stays
          # `meshharbor-tunnel-…` — a published, immutable surface that every prior
          # release carries, and the updater matches on extension + arch, not
          # the prefix.
          src=$(ls target/debian/meshharbor-cli_*_amd64.deb | head -n1)
          dst="meshharbor-tunnel-${version}-x86_64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
            ${{ steps.deb.outputs.artifact }}
            ${{ steps.deb.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1b. Linux aarch64 — tarball + .deb (FR-97 P7b)
  # ---------------------------------------------------------------------------
  # The same two artifacts, built natively on the arm64 runner. The asset names
  # follow the frozen `meshharbor-tunnel-<version>-<target>` contract with the
  # aarch64 triple, which is what the installer proxy matches
  # (tunnel_release.rs: `linux-aarch64`, `linux-deb-aarch64`). An x86_64 client
  # can never be handed one: every x86_64 pattern names its own triple.
  build-linux-arm64:
    name: Build (Linux aarch64)
    needs: validate-version
    # 22.04, not latest: the oldest supported base sets the glibc floor, so the
    # binary also loads on Debian 12 (Raspberry Pi OS) and Ubuntu 22.04 — the
    # agent's and the companion's arm64 lanes build here for the same reason.
    # The .deb names OpenSSL by both names (the CLI's Cargo.toml, #2472).
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: tunnel-linux-arm64
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Install cargo-deb
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked
      - name: Build meshharbor-tunnel (release)
        run: cargo build -p meshharbor-cli --release
      - name: Strip binary
        run: strip target/release/mh
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-tunnel-${version}-aarch64-unknown-linux-gnu"
          mkdir -p "/tmp/${name}"
          cp target/release/mh "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          sha256sum "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build .deb
        working-directory: agents/meshharbor-cli
        run: cargo deb --no-build --no-strip
      - name: Rename .deb + checksum
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          src=$(ls target/debian/meshharbor-cli_*_arm64.deb | head -n1)
          dst="meshharbor-tunnel-${version}-aarch64-unknown-linux-gnu.deb"
          mv "$src" "$dst"
          sha256sum "$dst" | awk '{print $1"  "$2}' > "${dst}.sha256"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"
      - name: Smoke — the package installs here and its binary is aarch64 and runs
        # Only an arm64 runner can run what it built; a cross-built binary that
        # never ran is the failure this lane exists to rule out.
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --field "${{ steps.deb.outputs.artifact }}" Architecture | grep -qx arm64
          sudo dpkg -i "${{ steps.deb.outputs.artifact }}"
          readelf -h /usr/bin/mh | grep -q 'Machine:.*AArch64'
          mh --version
          sudo dpkg -r meshharbor-cli
      - name: Upload Linux aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
            ${{ steps.deb.outputs.artifact }}
            ${{ steps.deb.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. macOS — universal binary (x86_64 + aarch64 lipo'd) + tarball
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build (macOS universal)
    needs: validate-version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: tunnel-macos
          # Tag-ref cache saves can never be restored by a future tag run
          # (GH cache isolation: own ref or default branch only) — only
          # non-tag runs (dispatch rehearsals on master) save.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build meshharbor-tunnel x86_64
        run: cargo build -p meshharbor-cli --release --target x86_64-apple-darwin
      - name: Build meshharbor-tunnel aarch64
        run: cargo build -p meshharbor-cli --release --target aarch64-apple-darwin
      - name: Lipo into universal
        run: |
          # P3d Slice B: per-target CLI binary is now `mh` (was
          # `meshharbor-tunnel`); lipo the two arch builds into the new name.
          mkdir -p target/release-universal
          lipo -create -output target/release-universal/mh \
            target/x86_64-apple-darwin/release/mh \
            target/aarch64-apple-darwin/release/mh
          strip target/release-universal/mh
          file target/release-universal/mh
      # Sign + notarise the bare CLI. NOT stapled -- Apple only staples
      # bundles/.dmg/.pkg, never a loose Mach-O. That is acceptable here
      # because the CLI's install paths (`curl … | tar`, scripts/install.sh,
      # `mh self-update`) never set the quarantine attribute, so
      # Gatekeeper does not evaluate those copies at all; signing +
      # notarisation covers the browser-download case on ONLINE Macs and
      # satisfies `spctl` policy on managed fleets. If offline validation is
      # ever needed, add a second stapled .pkg asset + a `macos-pkg` platform
      # key in tunnel_release.rs (the linux-deb precedent).
      - name: Sign + notarise meshharbor (universal)
        uses: ./.github/actions/sign-macos
        with:
          binary-path:          target/release-universal/mh
          require:              ${{ needs.validate-version.outputs.is_release == 'true' }}
          app-p12-base64:       ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          cert-password:        ${{ secrets.APPLE_CERT_PASSWORD }}
          api-key-id:           ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id:        ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-p8-base64:    ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      - name: Pack tarball
        id: tar
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          name="meshharbor-tunnel-${version}-universal-apple-darwin"
          mkdir -p "/tmp/${name}"
          # P3d Slice C: legacy `meshharbor-tunnel` in-archive alias retired
          # (see the Linux tarball step for the rationale).
          cp target/release-universal/mh "/tmp/${name}/"
          cp LICENSE README.md "/tmp/${name}/" 2>/dev/null || true
          (cd /tmp && tar czf "${name}.tar.gz" "${name}")
          shasum -a 256 "/tmp/${name}.tar.gz" | awk '{print $1"  "$2}' > "/tmp/${name}.tar.gz.sha256"
          mv "/tmp/${name}.tar.gz" "/tmp/${name}.tar.gz.sha256" .
          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            ${{ steps.tar.outputs.artifact }}
            ${{ steps.tar.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Windows x86_64 — zip with .exe
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build (Windows x86_64)
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 45
    # The signing federated credential is bound to this GitHub environment
    # (the tenant rejects wildcard tag subjects) — do not remove.
    environment: release
    permissions:
      contents: read
      id-token: write     # azure/login OIDC inside ./.github/actions/sign-windows
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: tunnel-windows
          # Tag-ref cache saves can never be restored by a future tag run
          # (GH cache isolation: own ref or default branch only) — only
          # non-tag runs (dispatch rehearsals on master) save.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Build meshharbor-tunnel (release)
        shell: pwsh
        # Static CRT: the standalone zip's mh.exe runs from any
        # dir on arbitrary fresh machines -- it must not assume the
        # MSVC runtime (vcruntime140.dll) exists there (field report
        # 2026-07-28). Pure-Rust graph, so +crt-static is safe. The
        # MSI-carried copy stays dynamic (release-agent.yml) -- it
        # sits beside the MSI's app-local CRT DLLs.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p meshharbor-cli --release
      # Sign before zipping so the EXE the operator extracts is signed. A zip
      # cannot itself carry an Authenticode signature, so the binary inside is
      # the only thing that can vouch for the download.
      - name: Sign mh.exe
        id: sign
        uses: ./.github/actions/sign-windows
        with:
          files:                    target\release\mh.exe
          description:              'MeshHarbor CLI'
          mode:                     ${{ github.event.inputs.signing_mode || 'auto' }}
          require:                  ${{ needs.validate-version.outputs.is_release == 'true' || github.event.inputs.require_signing == 'true' }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          local-pfx-base64:         ${{ secrets.WIN_TEST_PFX_BASE64 }}
          local-pfx-password:       ${{ secrets.WIN_TEST_PFX_PASSWORD }}
      - name: Pack zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ needs.validate-version.outputs.version }}"
          $name = "meshharbor-tunnel-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\$name" -Force | Out-Null
          # P3d Slice C: legacy `meshharbor-tunnel.exe` in-zip alias retired — rc.194+
          # self-updaters and the setup wizard both extract `mh.exe` first.
          # (A pre-rc.194 CLI waking from dormancy can still RUN; only its
          # self-update would need a manual refresh — none live in the fleet,
          # verified against prod tunnel_clients 2026-07-22.) Zip asset name
          # keeps the `meshharbor-tunnel-…zip` prefix (updater/proxy prefix-agnostic).
          Copy-Item target\release\mh.exe "$env:RUNNER_TEMP\$name\"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$env:RUNNER_TEMP\$name\" }
          if (Test-Path README.md) { Copy-Item README.md "$env:RUNNER_TEMP\$name\" }
          Compress-Archive -Path "$env:RUNNER_TEMP\$name\*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "artifact=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            ${{ steps.zip.outputs.artifact }}
            ${{ steps.zip.outputs.artifact }}.sha256
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [validate-version, build-linux, build-linux-arm64, build-macos, build-windows]
    if: needs.validate-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sigstore identity for the provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release/
      # GPG + provenance: same pattern as release-agent.yml -- .asc detached
      # signatures when the key is configured, SLSA provenance always.
      - name: GPG-sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::GPG_PRIVATE_KEY not configured -- publishing without .asc signatures."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in release/*; do
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done
          gpg --batch --armor --export > release/meshharbor-release-pubkey.asc
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'
      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: meshharbor-tunnel ${{ needs.validate-version.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.validate-version.outputs.version, 'rc.') || contains(needs.validate-version.outputs.version, 'alpha') || contains(needs.validate-version.outputs.version, 'beta') }}
          body: |
            Automated build of `meshharbor-tunnel` ${{ needs.validate-version.outputs.version }} via
            [release-tunnel.yml](.github/workflows/release-tunnel.yml).

            **Install / download:**
            - Linux x86_64: `.tar.gz` or `.deb`
            - Linux aarch64: `.tar.gz` or `.deb`
            - macOS universal (x86_64 + aarch64): `.tar.gz`
            - Windows x86_64: `.zip` containing `mh.exe`

            **First-use:**
            1. Extract the archive.
            2. From the MeshHarbor admin UI → Tenant → Tunnels, click "Issue enrollment token".
            3. Run the copied `mh enroll …` command.
            4. From Admin → Tunnel ACL, create at least one policy authorising your subject + agent + destination.
            5. Run `mh forward --agent <hex> --local <port> --remote <host:port>`.
          files: release/*

  # ---------------------------------------------------------------------------
  # Bust the meshharbor.itachi.fans release cache — see the long-form rationale in
  # release-agent.yml. `/api/{agent,tunnel,setup}/latest-release` share ONE
  # per-pod cache, so every release family needs this step; one POST busts
  # every pod (the receiving pod fans out over the C-1 control bus).
  # Non-blocking: the 15-minute cache TTL is the backstop.
  # ---------------------------------------------------------------------------
  refresh-release-cache:
    name: Refresh meshharbor.itachi.fans release cache
    if: needs.validate-version.outputs.is_release == 'true'
    needs: [validate-version, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/releases/refresh
        env:
          TOKEN: ${{ secrets.MESHHARBOR_RELEASE_REFRESH_TOKEN }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice::MESHHARBOR_RELEASE_REFRESH_TOKEN unset (fork?); skipping cache refresh"
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 90 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://meshharbor.itachi.fans/api/releases/refresh?expect_tag=${TAG}")
            if [ "$(jq -r '.all_ok' <<<"$body" 2>/dev/null)" = "true" ]; then
              jq . <<<"$body"
              echo "Release cache refreshed on every live pod for ${TAG}"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-<no response>}"
            sleep 10
          done
          echo "::warning::release cache refresh did not confirm on every pod for ${TAG}; the cache TTL will heal it within 15 min"
# RETIRED-NAME-ANCHOR-END
