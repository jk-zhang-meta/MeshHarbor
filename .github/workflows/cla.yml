name: CLA

# FR-24 P3 — contributor licence agreement gate.
#
# ⚠️ DELIBERATELY DISABLED. `docs/CLA.md` v1.0 has not been through legal
# review, and a signature collected against un-reviewed terms is worse than no
# signature: contributors believe they have signed something binding, and we
# believe we hold a relicensing right we may not actually hold. That right is
# the whole basis of COMMERCIAL.md, so it is not a detail to be optimistic
# about.
#
# TO ENABLE, once a lawyer has signed off on docs/CLA.md:
#   1. delete the `if: false` on the job below
#   2. create a PAT with `repo` scope on an account that can write to the
#      signatures repo, and store it as the `CLA_SIGNATURES_TOKEN` secret
#   3. create the (private) signatures repo named in `remote-repository-name`
#   4. bump the version in docs/CLA.md and in `path-to-document` together —
#      changing the terms without changing the URL leaves earlier signatories
#      recorded against terms they never saw
#
# Until then this file exists so the intent is visible in the tree rather than
# living only in an issue.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    if: false   # ← remove after legal review; see the header
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/jk-zhang-meta/MeshHarbor/blob/master/docs/CLA.md'
          branch: 'main'
          allowlist: 'gjovanov,dependabot[bot]'
          remote-organization-name: 'gjovanov'
          remote-repository-name: 'meshharbor-cla-signatures'
          custom-notsigned-prcomment: |
            Thanks for the contribution! Before we can merge it, please read the
            [MeshHarbor CLA](https://github.com/jk-zhang-meta/MeshHarbor/blob/master/docs/CLA.md)
            and sign it by commenting below with exactly:
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
