name: macOS mesh test

# Does a macOS host actually JOIN the overlay and move bytes?
#
# `ci.yml`'s `macos-overlay-check` proves the OS calls work — a second
# address lands, a peer /32 lands, routes come back off. That is not the
# same as meshing: it never opens a WireGuard session, never talks to a
# peer, and never carries a packet. This does.
#
# MANUAL ONLY, and deliberately so. It enrolls a REAL device into a REAL
# organization, which is not something a push should do. The enrollment
# token is a run-time INPUT rather than a repository secret: enrollment
# tokens are single-use with a 10-minute TTL, so there is nothing worth
# storing, and no long-lived fleet credential is ever handed to GitHub.
#
# Mint one immediately before running:
#   POST /api/tenant/{tenant_id}/agent/enroll-token   (admin JWT)
#
# NOTE the device row it creates is NOT removed by this job — deleting a
# device needs an admin credential, which is exactly what this workflow
# avoids holding. Delete it afterwards from the admin UI or:
#   DELETE /api/tenant/{tenant_id}/agent/{agent_id}
# The job prints the agent id it enrolled as.

on:
  workflow_dispatch:
    inputs:
      enrollment_token:
        description: "Single-use enrollment JWT (10 min TTL) — mint it right before running"
        required: true
      peer_ip:
        description: "Overlay IP to ping. LEAVE EMPTY to pick a live peer from the daemon itself (renumber-proof)."
        required: false
        default: ""
      server:
        description: "Roomler API base URL"
        required: false
        default: "https://roomler.ai"

jobs:
  mesh:
    name: macOS joins the overlay and pings a peer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-mesh-test

      - name: Build the daemon and the CLI
        # overlay-l3 only: this test is about the mesh, not media, and the
        # full release feature set drags in FFmpeg/VP9 for no benefit here.
        # The `roomler` CLI comes too — it is how a user session reaches the
        # ROOT daemon, which is the thing the system socket exists for.
        run: |
          cargo build -p meshharbord --release --features overlay-l3
          cargo build -p meshharbor-cli --release

      - name: Enroll
        id: enroll
        env:
          TOKEN: ${{ inputs.enrollment_token }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/roomler-ci
          # Enrolled AND run as root: creating a utun and installing routes
          # both require it. The shipped .pkg installs a per-user LaunchAgent
          # instead, which is why the overlay has never come up on a real
          # macOS install — see docs/multi-org.md.
          sudo ./target/release/roomlerd --config /etc/roomler-ci/config.toml \
            enroll --server "${{ inputs.server }}" --token "$TOKEN" \
            --name "ci-macos-${GITHUB_RUN_ID}"
          AGENT_ID=$(sudo grep -E '^agent_id' /etc/roomler-ci/config.toml | head -1 | cut -d'"' -f2)
          echo "agent_id=$AGENT_ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=Enrolled::agent_id=$AGENT_ID — delete this device row when you are done"

      - name: Enable the overlay
        # Default-OFF by design: the feature being compiled in is not consent
        # to join a mesh.
        run: |
          set -euo pipefail
          sudo sed -i '' 's/^overlay_enabled = false/overlay_enabled = true/' /etc/roomler-ci/config.toml
          # Verify rather than trust the sed — a serialisation change would
          # otherwise leave the overlay off and this test would "pass" by
          # never having tried.
          if ! sudo grep -qE '^overlay_enabled = true' /etc/roomler-ci/config.toml; then
            echo "overlay_enabled = true" | sudo tee -a /etc/roomler-ci/config.toml >/dev/null
          fi
          sudo grep -E '^overlay_enabled' /etc/roomler-ci/config.toml

      - name: Run the daemon
        run: |
          set -euo pipefail
          sudo mkdir -p /var/log/roomler-ci
          # MESHHARBORD_AUTO_UPDATE=0 is load-bearing, not tidiness: this
          # daemon is built FROM SOURCE on a branch, so its version usually
          # lags the newest release and the updater would download it, spawn
          # the installer and exit — killing the test seconds after start.
          # Observed exactly that (run 31336223450: "new release available —
          # spawning installer and exiting", 3 s in). The earlier green run
          # only passed because the branch happened to equal the latest tag.
          sudo bash -c 'MESHHARBORD_AUTO_UPDATE=0 \
            RUST_LOG=info,tunnel_core::overlay=debug \
            ./target/release/roomlerd --config /etc/roomler-ci/config.toml run \
            > /var/log/roomler-ci/agent.log 2>&1 &'
          sleep 5
          pgrep -f roomlerd >/dev/null && echo "daemon up" || (sudo cat /var/log/roomler-ci/agent.log; exit 1)

      - name: The root daemon's LocalAPI must be findable
        # A root daemon cannot use the per-user socket path: `temp_dir()` is
        # per-user on macOS, so it would land in ROOT's /var/folders/… and a
        # user-session `roomler peers` would search its own, find nothing,
        # and report "not running" for a daemon that is running. This job is
        # the only place a root daemon actually runs, so it is the only place
        # that assertion can be made.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if sudo test -S /var/run/roomler/roomler.sock; then
              echo "::notice title=System socket::/var/run/roomler/roomler.sock is bound after ${i}s"
              sudo ls -l /var/run/roomler/
              exit 0
            fi
            sleep 3
          done
          echo "::error title=No system socket::a root daemon must bind /var/run/roomler/roomler.sock"
          sudo ls -l /var/run/roomler/ 2>&1 || echo "(dir absent)"
          sudo tail -60 /var/log/roomler-ci/agent.log || true
          exit 1

      - name: Wait for the utun to carry an overlay address
        id: tun
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            IF=$(ifconfig -l | tr ' ' '\n' | grep '^utun' | while read -r u; do
                   if ifconfig "$u" 2>/dev/null | grep -qE 'inet 100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'; then echo "$u"; fi
                 done | head -1)
            if [ -n "${IF:-}" ]; then
              IP=$(ifconfig "$IF" | awk '/inet 100\./ {print $2; exit}')
              echo "utun=$IF" >> "$GITHUB_OUTPUT"
              echo "overlay_ip=$IP" >> "$GITHUB_OUTPUT"
              echo "::notice title=Overlay up::$IF has $IP after ${i}s"
              ifconfig "$IF"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=No overlay address::the daemon never brought up a utun with a CGNAT address"
          sudo tail -100 /var/log/roomler-ci/agent.log
          exit 1

      - name: The CLI reaches the root daemon, and names a peer
        id: peer
        # Two things at once, and the first is the point of this PR: a
        # user-session CLI finding a ROOT daemon. It can only work through
        # the system socket — the per-user path belongs to root here.
        # `sudo` because that socket is 0600 root-owned by design.
        #
        # The peer also comes FROM the daemon rather than a hardcoded input:
        # Grox was renumbered onto its own /22 on 2026-08-09, which silently
        # invalidated the old 100.64.0.14 default. Asking the daemon cannot
        # go stale.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if OUT=$(sudo ./target/release/roomler peers --json 2>/tmp/peers.err); then
              echo "$OUT" > /tmp/peers.json
              break
            fi
            sleep 5
          done
          if [ ! -s /tmp/peers.json ]; then
            echo "::error title=CLI cannot reach the daemon::the system socket is the only path to a root daemon"
            cat /tmp/peers.err || true
            exit 1
          fi
          echo "::notice title=CLI reached the root daemon::via /var/run/roomler/roomler.sock"
          head -c 600 /tmp/peers.json; echo
          IP="${{ inputs.peer_ip }}"
          if [ -z "$IP" ]; then
            # First peer carrying an overlay address. jq keeps this honest
            # rather than regexing a table.
            IP=$(jq -r '[.. | objects | .overlay_ip? // empty] | map(select(test("^100\\."))) | first // empty' /tmp/peers.json)
          fi
          [ -n "$IP" ] || { echo "::error title=No peer::the daemon lists no peer with an overlay address"; cat /tmp/peers.json; exit 1; }
          echo "peer_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "::notice title=Peer chosen::$IP"

      - name: Peer routes installed?
        run: |
          set -euo pipefail
          netstat -rn -f inet | grep "${{ steps.tun.outputs.utun }}" || true
          COUNT=$(netstat -rn -f inet | grep -c "${{ steps.tun.outputs.utun }}" || true)
          echo "routes on ${{ steps.tun.outputs.utun }}: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "::error::no routes point at the overlay interface"; exit 1; }

      - name: Ping a fleet peer over the overlay
        # THE assertion. Everything above can pass on a host that carries no
        # traffic; this is the one that needs a WireGuard session, a correct
        # route, and a working data plane.
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if ping -c 3 -t 5 "${{ steps.peer.outputs.peer_ip }}" > /tmp/ping.txt 2>&1; then
              cat /tmp/ping.txt
              echo "::notice title=Meshed::reached ${{ steps.peer.outputs.peer_ip }} from ${{ steps.tun.outputs.overlay_ip }} after ~$((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=No data plane::the overlay came up but ${{ steps.peer.outputs.peer_ip }} never answered"
          cat /tmp/ping.txt || true
          sudo grep -iE "carrier|handshake|peer installed|relay|derp" /var/log/roomler-ci/agent.log | tail -40
          exit 1

      - name: Evidence
        if: always()
        run: |
          echo "=== interfaces ==="; ifconfig | grep -A4 '^utun' || true
          echo "=== routes ==="; netstat -rn -f inet | head -40
          echo "=== agent log (tail) ==="; sudo tail -200 /var/log/roomler-ci/agent.log || true

      - name: Stop the daemon
        if: always()
        run: sudo pkill -f roomlerd || true
