# FR-90 P2h-1 — the archive replica image (Dockerfile.hive-archive;
# docs/hive.md §12 "P2h-1").
#
# Two ways in, one job:
#   * a PR that touches the image builds it and smoke-tests it, pushing nothing:
#     an image that builds but does not start would only be found by the org
#     that runs it;
#   * a DISPATCH builds, smoke-tests and, unless `dry_run`, publishes it.
#
# ⚠️ Publishing is DISPATCH-ONLY, as the self-host image's is (FR-42): it puts a
# PUBLIC package under the operator's account, and when it is published, and
# under which tag, is theirs to decide. No push trigger, no schedule, and
# `dry_run` defaults ON.
name: Archive replica image

on:
  pull_request:
    paths:
      - 'Dockerfile.hive-archive'
      - 'scripts/hive-archive-entrypoint.sh'
      - 'agents/meshharbord/src/archive_replica.rs'
      - '.github/workflows/hive-archive-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.4.138). Required — there is no implicit tag.'
        required: true
        type: string
      also_latest:
        # FR-90 P2h-2 — the policy page's "Add an archive replica" shows
        # `docker run … hive-archive:latest`: leave it on unless this is
        # an older line's patch.
        description: 'Also move `latest` to this image (the tag the policy page shows)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Build and smoke-test, but do NOT push'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/hive-archive

jobs:
  image:
    name: build, smoke${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && ', publish' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            TAG='${{ inputs.tag }}'
            # A tag with a slash or a space makes a reference nobody can pull.
            if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'; then
              echo "::error::tag '$TAG' is not a valid OCI tag (alnum start, then [A-Za-z0-9._-], <=127 chars)"
              exit 1
            fi
          else
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hive-archive
          # Loaded into the local daemon, so the smoke below runs against the
          # EXACT image that would be pushed.
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.tag }}
          cache-from: type=gha,scope=hive-archive
          # A cache that cannot be written costs the NEXT build its speed,
          # never this one its image (#1904).
          cache-to: type=gha,mode=max,scope=hive-archive,ignore-error=true

      # ⚠️ Someone runs this without reading the source. Each line below is a
      # promise the image keeps before anything is pushed.
      - name: Smoke test
        run: |
          set -euo pipefail
          IMG='${{ env.IMAGE }}:${{ env.tag }}'
          # The binary starts, with the libraries it links.
          docker run --rm --entrypoint roomlerd "$IMG" --version
          # It is the build that enrolls archive replicas.
          docker run --rm --entrypoint roomlerd "$IMG" enroll --help | grep -q -- '--archive-replica'
          # It runs as no one in particular, with the volume as its home.
          test "$(docker run --rm --entrypoint id "$IMG" -u)" = 10001
          # It says it is the archive image, so an archive replica enrolled
          # before the posture joined the mesh joins it here (FR-90 P2k-4).
          test "$(docker run --rm --entrypoint printenv "$IMG" MESHHARBORD_ARCHIVE_IMAGE)" = 1
          # A first start with nothing to enroll with says why, and fails.
          set +e
          out=$(docker run --rm "$IMG" 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'MESHHARBOR_SERVER'
          # An enrollment that fails writes nothing: the volume stays empty,
          # and the next start enrolls again. (Port 9 refuses at once: no
          # network is needed, and no server is told anything.)
          docker volume create hive-archive-smoke >/dev/null
          set +e
          out=$(docker run --rm -v hive-archive-smoke:/data \
            -e MESHHARBOR_SERVER=http://127.0.0.1:9 -e MESHHARBOR_ENROLL_TOKEN=not-a-token \
            "$IMG" 2>&1); rc=$?
          set -e
          echo "$out" | grep -v 'not-a-token' || true
          test "$rc" -ne 0
          if echo "$out" | grep -q 'not-a-token'; then
            echo "::error::the entrypoint printed the enrollment token"
            exit 1
          fi
          docker run --rm -v hive-archive-smoke:/data --entrypoint sh "$IMG" \
            -c 'test ! -e /data/config.toml'
          docker volume rm hive-archive-smoke >/dev/null
          echo "smoke ok"

      - name: Log in to ghcr.io
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          set -euo pipefail
          docker push '${{ env.IMAGE }}:${{ env.tag }}'
          if [ '${{ inputs.also_latest }}' = 'true' ]; then
            docker tag '${{ env.IMAGE }}:${{ env.tag }}' '${{ env.IMAGE }}:latest'
            docker push '${{ env.IMAGE }}:latest'
          fi
