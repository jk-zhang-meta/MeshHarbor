# FR-73 (#1389) — the hosted (prod) image, built HERE instead of by hand on the
# build host.
#
# A merge to master that can change the image builds it, smoke-boots it (the
# image must answer /health with every module the hosted service runs, serve
# the SPA and mount the device listing), attests it and pushes it to the public
# package as `hosted-<YYYYMMDD>-<sha7>` plus the moving `hosted` pointer.
#
# ⚠️ This lane NEVER writes `latest`. `latest` is the self-host `full` image
# (no `saas`), owned by publish-selfhost-image.yml; the hosted image carries
# the billing module and would be the wrong thing for a self-hoster to pull.
# There is deliberately no code path here that tags it — do not add one.
#
# ⚠️ Build ≠ deploy (FR-73 D5). Rolling prod re-homes every long-lived socket
# on the replaced pod — agents, RC sessions, tunnels, DERP — so the deploy
# stays a human decision: the `promote` workflow bumps the deploy repo's tag.
#
# Cache: a registry-backed BuildKit cache (`buildcache-hosted`, same package,
# `mode=max`) rather than the Actions cache — this lane runs on every merge and
# would otherwise evict the self-host workflow's `type=gha` scopes under the
# 10 GB repo cap. How much the cache buys depends on the Dockerfile's layering
# (FR-73 P1b); the summary records the build time so that is measured, not
# assumed.
name: hosted image

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'ui/**'
      - 'files/**'
      - 'config/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/fetch-geoip.sh'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/hosted-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image (false = build + smoke only, cache still updated)'
        type: boolean
        default: true

# A burst of merges builds only the newest commit; the cancelled ones would
# have produced images nobody promotes.
concurrency:
  group: hosted-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}:buildcache-hosted

jobs:
  build:
    name: build · smoke · push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe --tags` needs the tags; the runner's default is a
          # single commit with none.
          fetch-depth: 0

      # The tag names the COMMIT (sha7), not the image id the build-host
      # recipe used: a running pod's tag then says what it was built from.
      - name: Derive the tag
        id: tag
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHA7="$(git rev-parse --short=7 HEAD)"
          DATE="$(date -u +%Y%m%d)"
          VERSION="$(git describe --tags --always)"
          echo "tag=hosted-${DATE}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hosted-${DATE}-${SHA7}  version=$VERSION  sha=$SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FR-87 (#1776): the docs' dates come from git, and the Docker build has
      # none (.dockerignore drops .git). This checkout has full history
      # (fetch-depth 0, above), so the manifest is written HERE and reaches the
      # UI stage through `COPY ui/ .` (a path context sends untracked files).
      # Without it the image publishes no dates at all, and the smoke's
      # lastmod check fails. `dates.ts` imports node:* only, so no install.
      - name: Install bun (the docs dates manifest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Docs dates manifest
        run: |
          set -euo pipefail
          cd ui
          bun docs/dates.ts --write

      # #1896: the country database for the user analytics, DB-IP's CC BY 4.0
      # "IP to Country Lite", which a public image may carry. Staged into the
      # build context (files/geoip/, which the Dockerfile COPYs), so the layer
      # is keyed by the file's content. A failed download warns and builds on:
      # an image without it reports `country: unknown`, the designed state.
      # The script already exits 0 on every failure and bounds its own waits;
      # `continue-on-error` + `timeout-minutes` make sure that NOTHING in this
      # step (a hang, a bug) can fail the build. The smoke then warns.
      - name: GeoIP database (DB-IP, CC BY 4.0)
        id: geoip
        continue-on-error: true
        timeout-minutes: 8
        run: bash scripts/fetch-geoip.sh files/geoip

      - name: Build clock — start
        id: t0
        run: echo "s=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Built into the local daemon (`load`), pushed only after the smoke
      # passed. `cache-to` runs regardless: a build that fails its smoke still
      # warms the next one.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            PROFILE=full
            SAAS=1
            VERSION=${{ steps.tag.outputs.version }}
            GIT_SHA=${{ steps.tag.outputs.sha }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max

      - name: Build clock — stop
        id: t1
        run: |
          S='${{ steps.t0.outputs.s }}'
          E="$(date +%s)"
          echo "secs=$((E - S))" >> "$GITHUB_OUTPUT"
          echo "build took $((E - S)) s"

      # The image must BE what it claims before anyone can pull it: the label
      # names its commit (AC6), and the hosted build mounts every module
      # including saas.
      - name: Labels name the commit
        run: |
          set -euo pipefail
          IMG='${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}'
          REV="$(docker image inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          VER="$(docker image inspect "$IMG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          echo "  revision=$REV  version=$VER"
          if [ "$REV" != '${{ steps.tag.outputs.sha }}' ]; then
            echo "::error::org.opencontainers.image.revision is '$REV', expected the built commit"
            exit 1
          fi

      # Same recipe as the self-host publish workflow's smoke, with the hosted
      # expectation: all six modules. Credentials are generated per run and die
      # with the runner.
      - name: Smoke — the image must actually serve, as the hosted composition
        run: |
          set -euo pipefail
          IMG='${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}'
          DBPW="$(openssl rand -hex 16)"
          JWT="$(openssl rand -hex 32)"
          docker network create meshharbor-smoke
          docker run -d --name mongo --network meshharbor-smoke \
            -e MONGO_INITDB_ROOT_USERNAME=smoke -e MONGO_INITDB_ROOT_PASSWORD="$DBPW" mongo:7
          docker run -d --name redis --network meshharbor-smoke redis:7-alpine
          docker run -d --name meshharbor --network meshharbor-smoke -p 8080:80 \
            -e MESHHARBOR__APP__ENVIRONMENT=development \
            -e MESHHARBOR__JWT__SECRET="$JWT" \
            -e MESHHARBOR__DATABASE__URL="mongodb://smoke:${DBPW}@mongo:27017/?authSource=admin" \
            -e MESHHARBOR__REDIS__URL=redis://redis:6379 \
            -e MESHHARBOR__MEDIASOUP__NUM_WORKERS=1 \
            "$IMG"
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}0s"
              curl -fsS http://localhost:8080/health; echo
              curl -fsS -o /dev/null -w '  GET / -> %{http_code}\n' http://localhost:8080/
              WANT='chat conference fleet network remote saas'
              GOT="$(curl -fsS http://localhost:8080/health | jq -r '.modules | sort | join(" ")')"
              if [ "$GOT" != "$WANT" ]; then
                echo "::error::the hosted image mounts [$GOT], expected [$WANT]"
                exit 1
              fi
              echo "  modules: $GOT ✓"
              DEV="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tenant/000000000000000000000000/device)"
              if [ "$DEV" != "401" ]; then
                echo "::error::GET /api/tenant/…/device answered $DEV, expected 401 — the device listing is not mounted"
                exit 1
              fi
              echo "  device listing: 401 ✓"
              # #1896: the image carries a country database and the server
              # LOADS it. A download that failed is a supported state (warn,
              # build on). A database the fetch step DID stage that the server
              # then does not load is our bug (the ENV and the file name
              # drifted, or the reader refused it), and it fails here rather
              # than as weeks of `unknown` on the dashboard.
              docker logs meshharbor > /tmp/meshharbor.log 2>&1 || true
              GEO="$(grep -m1 'geoip database' /tmp/meshharbor.log || true)"
              echo "  geoip: ${GEO:-no geoip line in the boot log}"
              if [ '${{ steps.geoip.outputs.present }}' = 'true' ]; then
                case "$GEO" in
                  *'geoip database loaded'*'DBIP-Country-Lite'*)
                    echo "  geoip: DB-IP database loaded ✓" ;;
                  *)
                    echo "::error::the fetch step staged a GeoIP database, but the server did not load it"
                    exit 1 ;;
                esac
                # This smoke runs as root, which reads anything; a container
                # run as any other user must be able to read the file too.
                GEO_PATH="$(docker exec meshharbor printenv MESHHARBOR__STATS__GEOIP_MMDB)"
                if ! docker exec --user 65534:65534 meshharbor test -r "$GEO_PATH"; then
                  echo "::error::$GEO_PATH is not readable by a non-root user: a container not run as root would read every country as 'unknown'"
                  exit 1
                fi
                echo "  geoip: readable by a non-root user ✓"
              else
                echo "::warning title=No GeoIP database::this image carries none, so the user analytics will read every country as 'unknown'"
              fi
              # FR-87 (#1776) — how the public site is SERVED: relative redirects,
              # real 404s (no soft 404s), no-cache HTML, the Atom feed type, and every
              # static page keeping `/`'s security headers (one `add_header` in an
              # nginx location drops them all); content-hashed assets; and, given
              # this full-history checkout, every docs <lastmod> equal to git's.
              # The same script runs against production after a promote.
              bash scripts/public-site-smoke.sh http://localhost:8080 .
              exit 0
            fi
            sleep 10
          done
          echo "::error::the image did not answer /health within 600s"
          docker logs meshharbor 2>&1 | tail -60
          exit 1

      - name: Push the tag and move `hosted`
        id: push
        if: github.event_name == 'push' || inputs.push
        run: |
          set -euo pipefail
          IMG='${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}'
          docker push "$IMG"
          docker tag "$IMG" '${{ env.IMAGE }}:hosted'
          docker push '${{ env.IMAGE }}:hosted'
          D="$(docker buildx imagetools inspect "$IMG" --format '{{ .Manifest.Digest }}')"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "pushed $IMG @ $D"

      - name: Attest build provenance
        if: steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          GEO_PRESENT: ${{ steps.geoip.outputs.present }}
          GEO_RELEASE: ${{ steps.geoip.outputs.release }}
          GEO_SHA256: ${{ steps.geoip.outputs.sha256 }}
        run: |
          if [ "$GEO_PRESENT" = true ]; then
            GEO="DB-IP IP to Country Lite $GEO_RELEASE (sha256 \`$GEO_SHA256\`)"
          else
            GEO="none: every country reads \`unknown\`"
          fi
          {
            echo "## hosted image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| commit | \`${{ steps.tag.outputs.sha }}\` (\`${{ steps.tag.outputs.version }}\`) |"
            echo "| build | ${{ steps.t1.outputs.secs }} s (cache: \`buildcache-hosted\`) |"
            echo "| geoip | $GEO |"
            echo "| pushed | ${{ steps.push.outputs.digest != '' && steps.push.outputs.digest || 'no' }} |"
            echo
            echo "Promote with the \`promote\` workflow (FR-73 P3) — this lane never deploys."
          } >> "$GITHUB_STEP_SUMMARY"
