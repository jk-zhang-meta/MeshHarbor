# FR-42 P3 (#967) + FR-57 (#1161) — publish the self-host container image.
#
# Turns the documented self-host path from a 6-20 minute source build into a
# pull. That is the difference between "I tried it" and "I gave up" for the
# audience this was written for (r/selfhosted, awesome-selfhosted), and the
# source build stays available for anyone who wants it.
#
# ⚠️ DISPATCH-ONLY, on purpose. Publishing puts a PUBLIC package under the
# operator's account, and the tag and retention policy are theirs to decide.
# Nothing is published without someone deciding to publish it — there is no
# push trigger and no schedule, and that is the phase's kill switch.
#
# ⚠️ FR-57: one job per ARCHITECTURE, each on its own NATIVE runner, joined by a
# manifest. Not QEMU: cross-building mediasoup and the Rust tree under emulation
# takes hours, and an arm64 image checked under emulation proves the bytes exist
# rather than that they run. Each arch smoke-tests on the architecture it was
# built for, which is the whole reason arm64 is now defensible when FR-42 ruled
# it out.
name: Publish self-host image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.4.43). Required — there is no implicit tag.'
        required: true
        type: string
      also_latest:
        description: 'Also move `latest` to this image'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build and verify, but do NOT push'
        required: false
        default: false
        type: boolean
      arm64:
        description: 'Also build linux/arm64 (adds a second native job)'
        required: false
        default: true
        type: boolean
      profile:
        # FR-69 P8 (D9/D13) — which pillars the image carries. `full` is THE
        # documented image and the only one `latest` may point at; the others
        # publish as `<tag>-<profile>` and are the same server composed from
        # fewer modules. No profile carries the hosted service's billing
        # module: the build passes SAAS=0 and the smoke asserts it.
        description: 'Pillars the image carries: full (default) | collab | remote | mesh | access — non-full publishes as <tag>-<profile>'
        required: false
        default: full
        type: choice
        options: [full, collab, remote, mesh, access]

permissions:
  contents: read

env:
  # ghcr.io needs no extra secret (GITHUB_TOKEN suffices) and is where a
  # self-hoster looks first for an image belonging to a GitHub project.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── one job per architecture ────────────────────────────────────────────────
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The Rust tree and mediasoup both build from source on a 4-core runner.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      # ⚠️ amd64 is PUBLISHED, DOCUMENTED and MEASURED at 88 s. arm64 is new and
      # unproven. One must never take the other down, so the matrix does not
      # cancel siblings and the merge below tolerates a missing arch.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Skip arm64 when not requested
        id: gate
        run: |
          if [ '${{ matrix.arch }}' = 'arm64' ] && [ '${{ inputs.arm64 }}' != 'true' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "arm64 not requested — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Reject a tag that is not a tag
        if: steps.gate.outputs.skip != 'true'
        run: |
          TAG='${{ inputs.tag }}'
          # A tag with a slash or a space produces a reference nobody can pull
          # and, worse, one that looks fine in the run log.
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$'; then
            echo "::error::tag '$TAG' is not a valid OCI tag (alnum start, then [A-Za-z0-9._-], <=127 chars)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_ENV"

      # FR-69 P8 — the IMAGE tag carries the profile: `<tag>` for full,
      # `<tag>-<profile>` otherwise, so two profiles of one release never
      # overwrite each other. `latest` is reserved for full: a `latest` that
      # silently became a `mesh` image would break every self-hoster's next
      # `pull` in a way no error names.
      - name: Resolve the image tag for this profile
        if: steps.gate.outputs.skip != 'true'
        run: |
          PROFILE='${{ inputs.profile }}'
          if [ "$PROFILE" = 'full' ]; then
            ITAG='${{ env.tag }}'
          else
            ITAG='${{ env.tag }}'"-$PROFILE"
            if [ '${{ inputs.also_latest }}' = 'true' ]; then
              echo "::error::also_latest is only valid for profile=full — latest must stay the full image"
              exit 1
            fi
          fi
          echo "itag=$ITAG" >> "$GITHUB_ENV"
          echo "  profile=$PROFILE  image tag=$ITAG"

      - name: Set up Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.gate.outputs.skip != 'true' && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # #1896: the same country database the hosted image carries (DB-IP's
      # CC BY 4.0 "IP to Country Lite"), staged into the build context before
      # the build. A failed download warns and builds on: the image then
      # reports `country: unknown`, the designed state.
      # Nothing in this step (a hang, a bug) may fail a release:
      # `continue-on-error` + `timeout-minutes`, as in the hosted lane.
      - name: GeoIP database (DB-IP, CC BY 4.0)
        id: geoip
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: bash scripts/fetch-geoip.sh files/geoip

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Load into the local daemon so the smoke test below runs against the
          # EXACT image that would be pushed, rather than a rebuild of it.
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.itag }}-${{ matrix.arch }}
          # FR-69 P8 — the profile selects the Cargo features the Dockerfile
          # builds with; SAAS=0 because a published image never carries the
          # hosted service's billing module (the Dockerfile's own default is
          # 1, for the operator's manual prod build).
          build-args: |
            VERSION=${{ env.tag }}
            GIT_SHA=${{ github.sha }}
            PROFILE=${{ inputs.profile }}
            SAAS=0
          # Cache is PER-ARCH and PER-PROFILE: a shared scope would have each
          # architecture (and each feature set) evicting the other's layers on
          # every run.
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ inputs.profile }}
          # #1904 — `ignore-error=true`: a cache that cannot be written (the
          # repository's Actions cache goes read-only once its budget is used
          # up) costs the NEXT build its speed, never this one its image.
          # Without it the export failed the step after a good build, and no
          # self-host image could be published at all.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-${{ inputs.profile }},ignore-error=true

      # ⚠️ The point of publishing is that someone else runs this without
      # reading the source. An image that builds but does not start is worse
      # than no image, so it has to answer before it is pushed — and it answers
      # HERE, on its own architecture, which is what makes the arm64 leg mean
      # something.
      - name: Smoke test — the image must actually serve
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMG='${{ env.IMAGE }}:${{ env.itag }}-${{ matrix.arch }}'
          # Generated per run, never written down. A literal here would be a
          # credential-shaped string in a public repo — inert, but secret
          # scanners cannot know that and neither can a reader skimming the
          # file. These live for one job and die with the runner.
          DBPW="$(openssl rand -hex 16)"
          JWT="$(openssl rand -hex 32)"
          docker network create meshharbor-smoke
          docker run -d --name mongo --network meshharbor-smoke \
            -e MONGO_INITDB_ROOT_USERNAME=smoke -e MONGO_INITDB_ROOT_PASSWORD="$DBPW" mongo:7
          docker run -d --name redis --network meshharbor-smoke redis:7-alpine
          docker run -d --name meshharbor --network meshharbor-smoke -p 8080:80 \
            -e MESHHARBOR__APP__ENVIRONMENT=development \
            -e MESHHARBOR__JWT__SECRET="$JWT" \
            -e MESHHARBOR__DATABASE__URL="mongodb://smoke:${DBPW}@mongo:27017/?authSource=admin" \
            -e MESHHARBOR__REDIS__URL=redis://redis:6379 \
            -e MESHHARBOR__MEDIASOUP__NUM_WORKERS=1 \
            "$IMG"
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}0s on ${{ matrix.arch }}"
              curl -fsS http://localhost:8080/health; echo
              # The SPA must be served too — an API-only container would pass a
              # /health check and still be useless as "the whole product".
              curl -fsS -o /dev/null -w '  GET / -> %{http_code}\n' http://localhost:8080/
              # FR-69 P8 — the image must BE the profile it claims. `/health`
              # lists the modules this binary mounts (not the DAG), so an image
              # built with the wrong features, or one that quietly kept `saas`,
              # fails here rather than on a self-hoster's box.
              WANT_full='chat conference fleet network remote'
              WANT_collab='chat conference'
              WANT_remote='fleet remote'
              WANT_mesh='fleet network'
              WANT_access='fleet network remote'
              eval "WANT=\$WANT_${{ inputs.profile }}"
              GOT=$(curl -fsS http://localhost:8080/health | jq -r '.modules | sort | join(" ")')
              if [ "$GOT" != "$WANT" ]; then
                echo "::error::profile '${{ inputs.profile }}' mounts [$GOT], expected [$WANT] — the image is not the profile it claims"
                exit 1
              fi
              case " $GOT " in *" saas "*) echo "::error::a self-host image must never carry saas"; exit 1;; esac
              echo "  modules: $GOT (profile ${{ inputs.profile }}) ✓"
              # The devices page's listing is the host's composition view over
              # fleet (required) and network (optional): every profile that
              # carries fleet must MOUNT it — 401 unauthenticated proves the
              # route exists, 404 proves it does not (the `remote` profile
              # shipped that 404 once, unnoticed by a smoke that read only
              # /health). collab has no fleet and must answer 404.
              DEV=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tenant/000000000000000000000000/device)
              case " $GOT " in
                *" fleet "*) WANT_DEV=401 ;;
                *)           WANT_DEV=404 ;;
              esac
              if [ "$DEV" != "$WANT_DEV" ]; then
                echo "::error::GET /api/tenant/…/device answered $DEV, expected $WANT_DEV for profile ${{ inputs.profile }} — the device listing is not mounted where fleet is"
                exit 1
              fi
              echo "  device listing: $DEV ✓"
              # #1896: a staged country database must be one the server LOADS
              # (the same rule as the hosted lane). No database is a warning,
              # never a failure: a download outage must not block a release.
              docker logs meshharbor > /tmp/meshharbor.log 2>&1 || true
              GEO="$(grep -m1 'geoip database' /tmp/meshharbor.log || true)"
              echo "  geoip: ${GEO:-no geoip line in the boot log}"
              if [ '${{ steps.geoip.outputs.present }}' = 'true' ]; then
                case "$GEO" in
                  *'geoip database loaded'*'DBIP-Country-Lite'*)
                    echo "  geoip: DB-IP database loaded on ${{ matrix.arch }} ✓" ;;
                  *)
                    echo "::error::the fetch step staged a GeoIP database, but the ${{ matrix.arch }} server did not load it"
                    exit 1 ;;
                esac
                # This smoke runs as root; a self-hoster may not (`user:` in
                # compose, runAsNonRoot), so the file must be world-readable.
                GEO_PATH="$(docker exec meshharbor printenv MESHHARBOR__STATS__GEOIP_MMDB)"
                if ! docker exec --user 65534:65534 meshharbor test -r "$GEO_PATH"; then
                  echo "::error::$GEO_PATH is not readable by a non-root user: a container not run as root would read every country as 'unknown'"
                  exit 1
                fi
                echo "  geoip: readable by a non-root user ✓"
              else
                echo "::warning title=No GeoIP database::this image carries none, so the user analytics will read every country as 'unknown'"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::${{ matrix.arch }} image did not answer /health within 600s"
          docker logs meshharbor 2>&1 | tail -60
          exit 1

      - name: Report the version the image reports about ITSELF
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -uo pipefail
          IMG='${{ env.IMAGE }}:${{ env.itag }}-${{ matrix.arch }}'
          docker image inspect "$IMG" \
            --format '  labels: version={{index .Config.Labels "org.opencontainers.image.version"}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker image inspect "$IMG" --format '  arch: {{.Architecture}}  size: {{.Size}} bytes'

          # ⚠️ The tag and the binary's own version are DIFFERENT CLAIMS, and
          # they drift silently: master moves while a 20-minute build runs, so
          # a tag chosen when the dispatch was typed can already name a version
          # this image is not. The first dry run produced exactly that —
          # `version=v0.4.44` on a binary reporting `0.4.42`.
          #
          # A warning rather than a failure: `v1.0.0-rc1` and other deliberate
          # names are legitimate, and refusing them would make the workflow
          # unusable for the one case where a human has thought hardest about
          # the tag. Being unmissable is what this needs to be.
          WS=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG='${{ env.tag }}'
          echo "  workspace version: $WS"
          if [ "${TAG#v}" != "$WS" ]; then
            echo "::warning title=Tag does not match the workspace version::\
          tag '$TAG' vs Cargo.toml '$WS'. The image will report $WS about itself \
          while the registry calls it $TAG. Intended for a release candidate; \
          a mistake if you meant v$WS."
          else
            echo "  ✓ tag matches the version the binary reports"
          fi

      # ⚠️ Pushes BY DIGEST, not by tag. Two architecture jobs cannot both push
      # `:<tag>` — the second silently wins and the published manifest names one
      # architecture while claiming to be the release. The digests are collected
      # by the merge job below and assembled into a manifest list, which is what
      # makes `:<tag>` resolve per-architecture for whoever pulls it.
      #
      # It also pushes the image that was just SMOKE-TESTED rather than asking
      # build-push-action to build again with `push: true`. A second build is
      # near-instant off the cache and would almost certainly be identical — but
      # "almost certainly" is not what testing-before-publishing is for.
      - name: Push by digest
        if: steps.gate.outputs.skip != 'true' && !inputs.dry_run
        id: push
        run: |
          set -euo pipefail
          SRC='${{ env.IMAGE }}:${{ env.itag }}-${{ matrix.arch }}'
          docker push "$SRC"
          DIGEST=$(docker image inspect "$SRC" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "  ${{ matrix.arch }} -> $DIGEST"
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/${{ matrix.arch }}"

      - name: Carry the digest to the merge job
        if: steps.gate.outputs.skip != 'true' && !inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ── assemble one tag from whatever succeeded ────────────────────────────────
  merge:
    name: Manifest
    needs: build
    # `always()` so a failed arm64 leg does not withhold the amd64 publish:
    # amd64 is published, documented and measured, and arm64 is the new thing.
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write # actions/attest-build-provenance
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assemble the manifest
        id: manifest
        run: |
          set -euo pipefail
          # FR-69 P8 — the same tag rule the build job applied (the merge job
          # has no env from it): `<tag>` for full, `<tag>-<profile>` otherwise.
          TAG='${{ inputs.tag }}'
          if [ '${{ inputs.profile }}' != 'full' ]; then
            TAG="$TAG-${{ inputs.profile }}"
          fi
          REFS=""
          FOUND=""
          for a in amd64 arm64; do
            if [ -f "/tmp/digests/$a" ]; then
              D=$(cat "/tmp/digests/$a")
              REFS="$REFS ${{ env.IMAGE }}@$D"
              FOUND="$FOUND $a"
            fi
          done
          if [ -z "$REFS" ]; then
            echo "::error::no architecture produced a digest — nothing to publish"
            exit 1
          fi
          # Say what is NOT in the tag. A manifest quietly missing an arch is
          # indistinguishable from one that never wanted it, and the person who
          # finds out is a Pi owner whose pull fails.
          case "$FOUND" in
            *amd64*arm64*) echo "  both architectures present" ;;
            *) echo "::warning title=Publishing a single-architecture image::\
          only[$FOUND ] succeeded. The tag will publish, but hosts on the missing \
          architecture cannot pull it." ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "${{ env.IMAGE }}:$TAG" $REFS
          if [ '${{ inputs.also_latest }}' = 'true' ]; then
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${{ env.IMAGE }}:latest" $REFS
            echo "  moved latest"
          fi
          LIST=$(docker buildx imagetools inspect "${{ env.IMAGE }}:$TAG" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null || true)
          echo "  published platforms: $LIST"
          D=$(docker buildx imagetools inspect "${{ env.IMAGE }}:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "platforms=$LIST" >> "$GITHUB_OUTPUT"
          echo "itag=$TAG" >> "$GITHUB_OUTPUT"

      # The image runs a privileged product on someone else's machine. Signing
      # its provenance costs one step and lets them verify where it came from,
      # matching what release-agent.yml already does for the agent artifacts.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Self-host image"
            echo
            echo '```'
            echo 'docker pull ${{ env.IMAGE }}:${{ steps.manifest.outputs.itag }}'
            echo '```'
            echo
            echo "Profile: \`${{ inputs.profile }}\`"
            echo
            echo "Platforms: \`${{ steps.manifest.outputs.platforms }}\`"
            echo
            echo "\`latest\` moved: \`${{ inputs.also_latest }}\`"
            echo
            echo "Digest: \`${{ steps.manifest.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
