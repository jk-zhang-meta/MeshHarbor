# FR-87 (#1776) P6 — who gets which page at `/`. This file is included inside
# `http {}` (it lands in /etc/nginx/conf.d/), which is where `map` must live.
#
# The session is the HttpOnly `access_token` cookie (crates/api/src/routes/
# auth.rs). With it, `/` is the SPA, exactly as before. Without it — every
# guest, and every crawler — `/` is the static homepage the docs generator
# writes: real HTML, where the SPA shell is one empty `<div id="app">`.
# ⚠️ The access cookie lives 7 days and the refresh cookie 30, but the refresh
# cookie is scoped to /api/auth/refresh, so nginx cannot see it here. The
# static page's home.js hands a returning user (the SPA's localStorage hint
# says signed in) to the app, which refreshes the session.
map $cookie_access_token $root_doc {
    ""      /home/index.html;
    default /index.html;
}

server {
    listen 80;
    server_name _;
    root /var/www/meshharbor;
    index index.html;

    client_max_body_size 100m;

    # FR-87 — every redirect nginx itself issues (the directory-slash 301 on
    # `/docs` and `/blog` above all) carries a RELATIVE `Location: /docs/`.
    # This pod listens on :80 behind the TLS edge, so an absolute redirect is
    # built from the scheme nginx sees — `http://` — and `curl -sI /docs`
    # answered `301 Location: http://meshharbor.itachi.fans/docs/`: a scheme downgrade on
    # the way to every docs index, and a redirect chain for every crawler. A
    # relative Location resolves against the URL the browser actually used.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml application/atom+xml image/svg+xml application/wasm;
    gzip_min_length 256;

    # Security headers: one file, shared with the blog lane's server (FR-91), so
    # every page of meshharbor.itachi.fans sends the same set. Server level only — an
    # `add_header` inside a location drops all of them there (see `/docs/` below).
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed static assets — cache aggressively (Vite content-hashed filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # FR-60 (#1165) — the static documentation site (`ui/docs` -> `ui/dist/docs`),
    # and FR-87 (#1776) — the blog built by the same generator (`ui/dist/blog`).
    #
    # Longest-prefix wins over `location /` below, so these URLs never reach the
    # SPA fallback, and a missing page is a REAL 404 — never the SPA shell, which
    # would be a soft-404: a 200 carrying an unrelated page, the single worst
    # thing to serve a crawler.
    #
    # No `try_files`, on purpose. With none, nginx's static handler owns the
    # request: `/docs/start/` → the directory's index.html (server-level `index`);
    # `/docs/start` → a 301 to the slash form (relative, see `absolute_redirect`),
    # so every page has ONE URL; a missing file → 404. FR-60's
    # `try_files $uri $uri/index.html =404` served `/docs/start` as a 200
    # duplicate of `/docs/start/` (measured on production): its `$uri/index.html`
    # test matches the FILE, so nothing ever redirects. Never bring that form back.
    #
    # ⚠️ `expires` IS SAFE HERE; `add_header` IS NOT. nginx inherits the parent's
    # `add_header` list ONLY IF the current level declares none, so a single
    # `add_header` here would silently drop CSP, HSTS, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy and Permissions-Policy for every page.
    # `expires` is a separate setting that nginx merges on its own
    # (ngx_http_headers_merge_conf merges `expires` and `headers` independently),
    # so it adds `Cache-Control: no-cache` and takes nothing away.
    # `scripts/public-site-smoke.sh` proves it on every image: it diffs the security
    # header set of a docs page against `/`.
    # The `\.(js|css|…)$` block above DOES declare `add_header Cache-Control`, and
    # therefore drops the security headers for static assets; the generator
    # content-hashes its assets (FR-87 P2), which is what makes that block's
    # one-year `immutable` safe for them.
    #
    # `expires -1` = revalidate every HTML page. The assets a page references are
    # content-hashed and cached for a year, so a page must never be the stale
    # half of that pair.
    location /docs/ {
        expires -1;
        error_page 404 /docs/404.html;
    }

    location /blog/ {
        expires -1;
        error_page 404 /docs/404.html;
    }

    # The Atom feed. An exact match beats both the prefix above and the regex
    # asset block. `types {}` empties the MIME map here, so `default_type`
    # applies and the feed is `application/atom+xml`, not `text/xml`.
    location = /blog/feed.xml {
        types { }
        default_type application/atom+xml;
        expires -1;
    }

    # FR-87 P6 — `/` by the `$root_doc` map above: the static homepage for a
    # request without a session cookie, the SPA with one. `try_files` serves
    # the chosen file IN this location, so `expires` (never `add_header`, see
    # `/docs/`) applies to both, and the server's security headers survive.
    location = / {
        expires -1;
        try_files $root_doc =404;
    }

    # The homepage's own file is reachable only through `location = /` above.
    # Served directly it would be a second URL for the same page. `^~` keeps
    # the asset regex location from matching anything under it.
    location ^~ /home/ {
        internal;
    }

    # The SPA's old marketing routes: one page now, at `/`. The query string
    # rides along (FR-88): a published `/pricing?utm_source=…` link must reach
    # the homepage WITH its campaign, or there is nothing there to carry.
    # Without a query the Location is `/` and `/#pricing`, exactly as before.
    location = /landing {
        return 301 /$is_args$args;
    }
    location = /pricing {
        return 301 /$is_args$args#pricing;
    }

    # FR-88 (#1790) P2 — the link hub the generator writes to `dist/links/`.
    # The same rules as `/docs/`, for the same reasons: no `try_files` (a
    # missing page is a real 404, and `/links` 301s to the slash form), and
    # `expires`, never `add_header`.
    location /links/ {
        expires -1;
        error_page 404 /docs/404.html;
    }

    # One short path per channel profile, for the places a link cannot carry
    # a campaign: a profile bio, a URL said out loud. Each is `CHANNELS` in
    # ui/docs/site.ts, and `docs/__tests__/links-page.spec.ts` checks these
    # lines against that list both ways, and that no SPA route shares a path.
    # 302, not 301: a browser keeps a 301 for good, and where a short path
    # points may change. Relative, per `absolute_redirect off`. No `add_header`.
    location = /yt { return 302 /links/?utm_source=youtube&utm_medium=bio&utm_campaign=profile; }
    location = /tt { return 302 /links/?utm_source=tiktok&utm_medium=bio&utm_campaign=profile; }
    location = /x { return 302 /links/?utm_source=x&utm_medium=bio&utm_campaign=profile; }
    location = /fb { return 302 /links/?utm_source=facebook&utm_medium=bio&utm_campaign=profile; }

    # SPA — serve static files, fallback to index.html for client-side routing.
    #
    # `expires -1`, as on every HTML page above (and `expires`, never
    # `add_header`, for the reason `/docs/` gives). index.html names this
    # build's content-hashed chunks, and the next image deletes them. Without a
    # `Cache-Control`, a browser caches the shell heuristically (a tenth of its
    # age), so after a promote it kept drawing the previous build: measured on
    # production 2026-10-20, 14 minutes after a roll, every deep link still
    # loaded the old entry script from cache, and that script was a 404 on the
    # new pods. `location = /` already revalidates; every other route came
    # here and did not.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Rust backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Health endpoints (direct to Rust). `= /health` is the cheap liveness
    # check; `= /health/ready` is the readiness/dependency check (Mongo +
    # Redis + pub/sub subscriber). Both exact — the SPA fallback must never
    # answer a probe.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # WebSocket proxy
    location /ws {
        # The handshake carries `?token=<JWT>` (a WS dial cannot use a header
        # from the browser API, and a fragment is not sent at all), so the
        # default access log wrote a live 7-day credential to disk on every
        # connect — long-lived sockets reconnect constantly, so these piled up.
        # The API logs this request itself with the token redacted, so nothing
        # observable is lost. Remove once the dial uses a short-lived
        # single-use ticket instead of the JWT.
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # DERP overlay relay — the pubkey-addressed WS carrier for the
    # both-UDP-blocked overlay tier (NAT-traversal Phase D). A dedicated
    # location (NOT folded into /ws) so line-rate WG data can't head-of-line-
    # block the control channel; same WS-upgrade + long-idle timeouts. Without
    # this the SPA `location /` fallback would serve index.html to the upgrade.
    location /derp {
        # Same as /ws: the relay handshake carries the agent/tunnel token in
        # the query string.
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
