# Security headers for every page of roomler.ai — ONE file, included at server
# level by the pod nginx (files/nginx-pod.conf) and by the blog lane's server
# (files/nginx-blog.conf, FR-91 #1880), so a page served by either sends the same
# set. The image installs it as /etc/nginx/snippets/security-headers.conf (see the
# Dockerfile); the blog lane mounts the same file at the same path.
#
# ⚠️ Include it at SERVER level only. nginx inherits the parent's `add_header` list
# only into a location that declares none, so these reach every location that
# adds no header of its own — and an `add_header` in a location drops them all
# there (see the `/docs/` note in files/nginx-pod.conf).
# ⚠️ agents/meshharbord/src/rc_local_turn.rs reads the CSP from THIS file: the
# remote-desktop viewer's loopback probes need every port in connect-src.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# `(self)`, not `*`. The app needs all three (conference camera/mic in
# `stores/conference.ts`, plus `getDisplayMedia` for screen share) but only
# in the TOP-LEVEL document. The one embed is FR-88's click-to-load YouTube
# player (`frame-src` below), which needs none of the three, so `(self)`
# keeps them out of it. `*` would delegate them to every cross-origin frame.
# Adding an embed that genuinely needs a camera means naming its origin
# here, deliberately.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
# HSTS: belt to the edge nginx (which already sends it) — covers direct
# pod access and any future exposure path.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP tuned to what the SPA actually does:
#  - script-src: self + the site's own purestat analytics (index.html
#    loads https://purestat.ai/js/purestat.js — first-party analytics).
#    'wasm-unsafe-eval' (FR-52 P4e): the /connect page's OPAQUE client is
#    WebAssembly (`@serenity-kit/opaque`, compiled with
#    `WebAssembly.compile`), which a browser refuses to compile under a
#    script-src without it. It permits compiling WebAssembly and NOTHING
#    else — JS `eval`/`new Function` stay blocked, which is why it is this
#    keyword and never 'unsafe-eval'. One policy per document and SPA
#    navigation never refetches it, so it cannot be scoped to /connect.
#  - style-src 'unsafe-inline': Vuetify injects <style> tags.
#  - img-src https:: avatars / Giphy load from arbitrary https hosts.
#  - connect-src: self/wss/https for the API + WS + purestat beacon, PLUS
#    the loopback ports the remote-control viewer probes. The agent serves
#    `/rc-local-turn` (loopback-TURN relay descriptor) and `/rc-clipboard`
#    (clipboard bridge) on 47989-47993 and 41989-41993 — the two bands in
#    `LOCAL_RELAY_PROBE_PORTS` (`ui/src/composables/useRemoteControl.ts`),
#    which mirror `PROBE_PORT` + `PROBE_PORT_FALLBACK` + `PROBE_PORT_BAND`
#    in `agents/meshharbord/src/rc_local_turn.rs`. Without these the
#    loopback-TURN corp-relay path is CSP-blocked.
#    ⚠️ These are ENUMERATED, not `127.0.0.1:*`. A wildcard let any XSS on
#    this origin port-scan the whole of the user's loopback and reach any
#    local service — Private Network Access is the browser's own mitigation
#    for that, and its enforcement has slipped repeatedly, so it is not a
#    control we get to rely on. Enumerating costs nothing: an XSS can still
#    reach these ten, but only our own agent answers there.
#    ⚠️ If the port bands change, this list and BOTH sources above must
#    change together. A missed port here is silent: the probe just times
#    out and the viewer falls back to the far coturn.
#    ⚠️ `turn:` ICE-server URLs (`turn:127.0.0.1:{turn_port}`, a port we
#    cannot enumerate — the agent binds it dynamically) are deliberately
#    absent and always were: `connect-src` does not govern ICE servers, as
#    the field-working local-TURN path proves against a policy that never
#    listed a `turn:` source.
#  - frame-src: FR-88 (#1790) P3's video facade swaps in the
#    youtube-nocookie.com player on a click (`ui/docs/theme/docs.js`,
#    `ui/src/components/common/VideoFacade.vue`). It is the only frame any
#    page loads; without this directive frames fall back to default-src
#    'self' and the player is blocked. Nothing loads from it before the click.
#  - worker-src blob:: the rc decode workers are same-origin module chunks
#    (blob: as belt for inline workers). MediaStreams bind via srcObject
#    and are not CSP-governed. frame-ancestors mirrors X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://purestat.ai; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https: http://127.0.0.1:47989 http://127.0.0.1:47990 http://127.0.0.1:47991 http://127.0.0.1:47992 http://127.0.0.1:47993 http://127.0.0.1:41989 http://127.0.0.1:41990 http://127.0.0.1:41991 http://127.0.0.1:41992 http://127.0.0.1:41993 http://localhost:47989 http://localhost:47990 http://localhost:47991 http://localhost:47992 http://localhost:47993 http://localhost:41989 http://localhost:41990 http://localhost:41991 http://localhost:41992 http://localhost:41993; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
