# FR-91 (#1880) — the blog lane's server, `meshharbor-blog`.
#
# It serves the tree `bun docs/build.ts --blog-only --out <dir>` writes: `blog/**`
# (its own `blog/assets/` and `blog/404.html`) and `sitemap-blog.xml`, mirrored
# from the MinIO bucket into the expected root, /usr/share/nginx/html. The mars
# edge sends it `/blog/` and `/sitemap-blog.xml`; every other URL of meshharbor.itachi.fans
# stays with the pod nginx (files/nginx-pod.conf). A post published here goes
# live without rolling `meshharbor2`.
#
# This file MIRRORS the pod's rules for the same URLs, so the lane is the blog
# FR-87 built and nothing else: same security headers (the one shared include),
# `expires -1` on HTML, a year of `immutable` on content-hashed assets, relative
# redirects, real 404s, the Atom content type. `scripts/public-site-smoke.sh
# --blog <base-url>` proves it on the served site, including that `/blog/`'s
# security headers equal `/docs/`'s byte for byte.
#
# Not wired into any deployment by this file: the Deployment, its Service and the
# edge route are FR-91 P2 (the deploy repo and the edge vhost).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative `Location`s, as in the pod: this server sits behind the TLS edge,
    # so an absolute redirect would be built from `http://` (see nginx-pod.conf).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml application/atom+xml image/svg+xml application/wasm;
    gzip_min_length 256;

    # The SAME security headers as every other page of meshharbor.itachi.fans, from the one
    # file both servers include. Server level only.
    include /etc/nginx/snippets/security-headers.conf;

    # Content-hashed assets (`blog/assets/*.<hash>.*`), exactly as the pod caches
    # them. ⚠️ This block declares `add_header`, so it drops the server-level
    # security headers for these files, as the pod's does. That is safe only
    # because every name changes with its bytes.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The blog's pages. No `try_files` (one URL per page; `/blog` 301s to the
    # slash form; a missing page is a real 404), and `expires`, NEVER `add_header`:
    # one `add_header` here would silently drop every security header on every
    # page. The 404 is the lane's own copy of the docs 404.
    location /blog/ {
        expires -1;
        error_page 404 /blog/404.html;
    }

    # The Atom feed: `types {}` empties the MIME map, so `default_type` applies.
    location = /blog/feed.xml {
        types { }
        default_type application/atom+xml;
        expires -1;
    }

    # `/blog` → the slash form, relative, as the pod answers it (`location /`
    # there redirects the directory). The catch-all below would 404 it.
    location = /blog {
        return 301 /blog/;
    }

    # The lane's urlset. The sitemap index and robots.txt stay the image's.
    location = /sitemap-blog.xml {
    }

    # Nothing else is this server's; the edge never sends it anything else.
    location / {
        return 404;
    }
}
