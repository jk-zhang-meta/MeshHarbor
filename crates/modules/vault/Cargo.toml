[package]
name = "meshharbor-mod-vault"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-90 module: vault — IAM for secrets, the server side: secrets and their versions under envelope encryption (an age KEK), RRNs, and the audit of every decision. Never a value in an answer."

[lib]
name = "meshharbor_mod_vault"
path = "src/lib.rs"

# P3-1 depended on core alone. P3-3b adds the design's `vault → hive` edge: a
# lease is believed only from the session record's device at its fence, read
# through hive's own DAO. `vault → fleet` (the Hub, to push a revocation)
# arrives with P3-3c.
[dependencies]
meshharbor-core = { path = "../../core" }
meshharbor-config = { path = "../../config" }
meshharbor-db = { path = "../../db" }
meshharbor-services = { path = "../../services" }
meshharbor-remote-control = { path = "../../remote_control" }
meshharbor-mod-hive = { path = "../hive" }

# Envelope encryption: a data key per version under XChaCha20-Poly1305, the
# data key wrapped to the KEK, an `age` X25519 identity — so a wrapped key
# opens with the stock `age` tool and an `age-keygen` file is the KEK.
age.workspace = true
# P3-2 — roles and policies in Cedar, every policy validated against the
# vault's schema on write.
cedar-policy.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
# P3-3b — a leased value crosses to the device as a libsodium sealed box for
# the vault key its daemon holds (`meshharbord`'s `vault` feature opens it).
crypto_box.workspace = true
base64.workspace = true
# One lease queue per agent connection.
dashmap.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bson.workspace = true
futures.workspace = true
mongodb.workspace = true
serde.workspace = true
serde_json.workspace = true
# A verify opens every version: CPU work, moved off the request's thread.
tokio.workspace = true
tracing.workspace = true
