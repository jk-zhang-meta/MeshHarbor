[package]
name = "meshharbor-mod-conference"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-69 module: conference — the mediasoup SFU rooms, the media:* WebSocket namespace, the call lifecycle, recordings and the media sampler."

[lib]
name = "meshharbor_mod_conference"
path = "src/lib.rs"

# The third module crate (FR-69 P4), and the only crate in the workspace that
# links `mediasoup` — the C++ worker build leaves every other server crate's
# graph with this PR. Depends on `chat` (rooms are the container a call runs
# in; the room guards are chat's) and on `meshharbor-core`, never on the api crate.
[dependencies]
meshharbor-core = { path = "../../core" }
meshharbor-config = { path = "../../config" }
meshharbor-db = { path = "../../db" }
meshharbor-services = { path = "../../services" }
# TURN credential minting + URL expansion for the media join's ICE servers and
# the sampler's relay classification (`turn_creds`, `turn_url`).
meshharbor-remote-control = { path = "../../remote_control" }
meshharbor-mod-chat = { path = "../chat" }

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bson.workspace = true
dashmap.workspace = true
futures.workspace = true
hmac.workspace = true
mediasoup.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
