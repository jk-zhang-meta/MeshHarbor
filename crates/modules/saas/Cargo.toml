[package]
name = "meshharbor-mod-saas"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-69 module: the hosted-product layer — Stripe billing, the public updates list and the newsletter, plan compliance. An add-on over any profile; never in a self-host image."

[lib]
name = "meshharbor_mod_saas"
path = "src/lib.rs"

# The first module crate (FR-69 P2). It depends on `meshharbor-core` and on the
# crates below it — never on the api crate, which composes it. Its handlers
# take `State<SaasState>` (or `State<Core>` where the core suffices); the
# extractors, `ApiError` and the guards come from `meshharbor-core`.
[dependencies]
meshharbor-core = { path = "../../core" }
meshharbor-config = { path = "../../config" }
meshharbor-db = { path = "../../db" }
meshharbor-services = { path = "../../services" }

anyhow.workspace = true
axum.workspace = true
bson.workspace = true
# FR-102 P6 — the purestat puller's UTC days and its freeze horizon.
chrono.workspace = true
futures.workspace = true
# FR-102 P7 — the Search Console service account's RS256 assertion (the
# OAuth JWT-bearer grant).
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# FR-102 P5 — the unsubscribe link's `i=` read from the raw query.
url = "2"

[dev-dependencies]
# FR-102 P7 — an RSA key made at test time, so the service-account path
# (a PKCS#8 key and RS256, as Google issues it) is exercised without a
# private key in the repository. The version already in the lock file
# (through web-push).
rsa = { version = "0.7", features = ["getrandom"] }
