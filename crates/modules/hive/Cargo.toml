[package]
name = "meshharbor-mod-hive"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-90 module: hive — agent sessions, the server side: the session record and its lifecycle, the start/stop routes with their gates, and the devices' rc:hive.* answers. Never what is in a session."

[lib]
name = "meshharbor_mod_hive"
path = "src/lib.rs"

# Built ON `fleet` (`hive → fleet` in the module graph): a session lives on a
# device and its frames ride the agent socket, so the module needs the Hub and
# the agent rows. And ON `chat` (`hive → chat`, P0d): a session is a room, its
# turns are messages in it. Never on `remote` or `network` — a session's
# content travels device-to-browser, not through another module.
[dependencies]
meshharbor-core = { path = "../../core" }
meshharbor-config = { path = "../../config" }
meshharbor-db = { path = "../../db" }
meshharbor-services = { path = "../../services" }
meshharbor-remote-control = { path = "../../remote_control" }
meshharbor-mod-fleet = { path = "../fleet" }
meshharbor-mod-chat = { path = "../chat" }

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bson.workspace = true
dashmap.workspace = true
mongodb.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
