[package]
name = "meshharbor-mod-network"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-69 module: network — the overlay mesh (IPAM, netmaps, ACL, relays, DERP ACL), tunnels, peer relays, Roomler SSH and key rotation: the server side of pillar 2."

[lib]
name = "meshharbor_mod_network"
path = "src/lib.rs"

# The sixth module crate (FR-69 P7a): pillar 2's server side. Built on `fleet`
# (the Hub, the agent row, presence — `network → fleet` in the module graph)
# and on `meshharbor-core`; never on the api crate. P7a moves the engine
# (`overlay`, `org_relay`, `derp_acl`), the routes and the hooks; the sockets
# (tunnel client, `/derp`, the agent-socket half) follow in P7b, which is why
# the host still depends on this crate unconditionally until then.
[features]
path-planner-test-support = []

[dependencies]
meshharbor-core = { path = "../../core" }
meshharbor-config = { path = "../../config" }
meshharbor-db = { path = "../../db" }
meshharbor-services = { path = "../../services" }
meshharbor-remote-control = { path = "../../remote_control" }
meshharbor-tunnel-core = { path = "../../tunnel-core" }
meshharbor-mod-fleet = { path = "../fleet" }

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bson.workspace = true
dashmap.workspace = true
# Subnet / static-endpoint validation in the overlay ACL and relay routes (not a workspace dep).
ipnet = "2"
rand.workspace = true
# FR-115 P4b — the pattern subscription to coturn's statistics DB.
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
# FR-115 P4a — the relay allowance tests' month boundary (UTC); the
# arithmetic itself lives in `meshharbor-services::relay_allowance`.
chrono.workspace = true
