[package]
name = "meshharbor-hive-node"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true
description = "FR-90 — Hive on the device: transcript events and their hash chain, the Claude Code stream-json adapter, the replica store (SQLite + FTS5), the harness launch spec, and folder confinement."

[lib]
name = "meshharbor_hive_node"
path = "src/lib.rs"

# Device-side only. The server never reads a transcript — FR-90 D1 keeps them on a
# replicaset of the org's own devices — so nothing here is linked by the server, and
# SQLite stays out of the server's build. Kept free of tokio and of `meshharbord`
# itself so its tests run in seconds; the daemon applies the privilege drop and
# owns the processes.
[dependencies]
blake3 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
