[package]
name = "meshharbor-localapi"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true
description = "Roomler LocalAPI — the daemon's local control-surface protocol (wire types, client, and dispatch)."

[lib]
name = "meshharbor_localapi"
path = "src/lib.rs"

# P3e lever E: this used to be `tunnel-core::localapi`. It moved out verbatim
# because it is the ONE thing thin clients need from tunnel-core — the desktop
# companion reads node/peer/route state over it — while tunnel-core itself
# carries the whole data plane (webrtc, quinn, turn, rustls are NON-optional
# deps there, 285 crates in its default graph). Depending on the protocol no
# longer means compiling the transport. tunnel-core re-exports this crate as
# `tunnel_core::localapi`, so every existing call site is unchanged.
#
# Keep this crate leaf-shaped: newline-delimited JSON over a named pipe / unix
# socket, nothing else. If something here ever needs a transport type, put the
# type in the wire protocol instead.
[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# FR-85 — `geteuid`, for the console-user check on the recording verbs (the
# peer's uid itself comes from tokio's `peer_cred`).
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
# Just the pipe security descriptor (SDDL -> SECURITY_ATTRIBUTES) and its
# LocalFree. Same 0.61 line the rest of the tree resolves.
version = "0.61"
features = [
    "Win32_Foundation",             # LocalFree
    "Win32_Security",               # PSECURITY_DESCRIPTOR, SECURITY_ATTRIBUTES
    "Win32_Security_Authorization", # ConvertStringSecurityDescriptorToSecurityDescriptorW
    # FR-85 — who is on the far end of the pipe: the client's pid, then its
    # session, compared with the active console session.
    "Win32_System_Pipes",           # GetNamedPipeClientProcessId
    "Win32_System_RemoteDesktop",   # ProcessIdToSessionId, WTSGetActiveConsoleSessionId
    # FR-92 P10b — and which account it runs as: its token's user, so a
    # SYSTEM / LocalService / NetworkService client can be told from a person.
    "Win32_System_Threading",       # OpenProcess, OpenProcessToken
    # FR-97 P4c — the adopt pipe's client: opened with an exact access mask,
    # then kept only when its server is SYSTEM or the caller's own account.
    "Win32_Storage_FileSystem",     # CreateFileW, SECURITY_IDENTIFICATION
]
