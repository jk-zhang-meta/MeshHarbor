[package]
name = "meshharbor-services"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
meshharbor-config = { path = "../config" }
meshharbor-db = { path = "../db" }
meshharbor-remote-control = { path = "../remote_control" }
mongodb.workspace = true
bson.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
argon2.workspace = true
password-hash.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
lettre.workspace = true
pulldown-cmark.workspace = true
dashmap.workspace = true
rust_xlsxwriter.workspace = true
genpdf.workspace = true
tempfile.workspace = true
redis.workspace = true
rand.workspace = true
base64.workspace = true
futures.workspace = true
validator.workspace = true
async-trait.workspace = true
urlencoding.workspace = true
# FR-102 P5 — the newsletter's per-issue link tags parse each link's host.
url = "2"
# FR-102 P5 — ECDSA P-256 / SHA-256 verification of SendGrid's signed Event
# Webhook (`sendgrid.rs`; the version the workspace already builds).
ring = "0.17"
nanoid.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
web-push.workspace = true

[dev-dependencies]
# Source-only tenant write boundary; never a production parser dependency.
syn = { version = "=2.0.117", features = ["full", "visit"] }
quote = "=1.0.45"
proc-macro2 = "=1.0.106"
