[package]
name = "meshharbor-core"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true
description = "The server's composition contract (FR-69): the Module trait, capabilities, hooks, index plans and jobs every pillar module implements, plus the composition snapshot that gates every module move."

[lib]
name = "meshharbor_core"
path = "src/lib.rs"

# FR-69 P0 — TYPES ONLY. This crate carries the contract every server module
# implements and the tooling that proves a module move changed nothing. It has
# no runtime behaviour of its own until P1 fills `Core`. It is SERVER-side
# (AGPL, `SERVER_CRATES` in scripts/licence-classes.sh), and the licensing
# workflow's dependency-graph assertion is what keeps it out of every shipped
# agent binary — that assertion is AC10 of the FR.
#
# ⚠️ Not to be confused with `meshharbor-node-core` (crates/agent-core), the
# daemon's shared building blocks, which held THIS name from FR-21 until FR-69.
[dependencies]
meshharbor-config = { path = "../config" }
meshharbor-db = { path = "../db" }
# P1b — `Core` holds the auth service and the identity/tenancy DAOs, and the
# relay-load poller writes `stats_relay` samples.
meshharbor-services = { path = "../services" }
# P1b — TURN issuance (`TurnMap`, `RelayLoadMap`) is core: RC, tunnels and
# the mediasoup ICE servers all issue from it.
meshharbor-remote-control = { path = "../remote_control" }

axum.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bson.workspace = true
bytes = "1"
dashmap.workspace = true
futures.workspace = true
# FR-102 P3c — `growth::InternalNetworks`, the operator's internal source
# networks (the same crate `fleet` already validates subnets with).
ipnet = "2"
maxminddb.workspace = true
mongodb.workspace = true
# S3/MinIO file-storage backend (`storage.rs`), moved with `Core` in P1b.
object_store = { version = "0.12", features = ["aws"] }
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
