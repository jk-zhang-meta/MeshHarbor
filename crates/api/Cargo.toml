[package]
name = "meshharbor-api"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "meshharbor_api"
path = "src/lib.rs"

[[bin]]
name = "meshharbor-api"
path = "src/main.rs"

[features]
# FR-69 — one feature per module crate, and five PROFILES that aggregate them
# (D9): each profile is a product story, and what it leaves OUT is the claim
# (`remote`/`mesh`/`access` never compile the C++ SFU worker; `collab` never
# links the tunnel stack) — asserted by the `profiles` job in ci.yml (AC3).
#
# `default` is the HOSTED build: the full profile plus `saas`, the add-on the
# published self-host images never carry. ⚠️ Deliberately not D9's bare
# `["profile-full"]`: the hosted image is a manual `docker build` with no
# feature argument and the integration suite builds this crate with `default`,
# so a default without `saas` would drop billing from the next prod deploy
# silently. The self-host publish workflow passes `SAAS=0` explicitly and its
# boot smoke asserts the image does not mount it — enforced where the image is
# made, not by a default a recipe would have to remember.
default = ["profile-full", "saas"]
profile-full = ["chat", "conference", "fleet", "remote", "network", "hive", "vault"]
profile-collab = ["chat", "conference"]
profile-remote = ["fleet", "remote"]
profile-mesh = ["fleet", "network"]
profile-access = ["fleet", "remote", "network"]
saas = ["dep:meshharbor-mod-saas"]
chat = ["dep:meshharbor-mod-chat"]
# `conference` is the only feature that links mediasoup (the C++ worker build).
# It is built ON `chat` (rooms are the container calls run in — the graph's
# `conference → chat` edge), so the feature implies it.
conference = ["dep:meshharbor-mod-conference", "chat"]
# `fleet` (P5a) is device management; `remote` (P6) and `network` (P7) are built
# ON it, so their features imply it. Kill switches: `[modules] <id> = false`.
fleet = ["dep:meshharbor-mod-fleet"]
remote = ["dep:meshharbor-mod-remote", "fleet"]
network = ["dep:meshharbor-mod-network", "fleet"]
# FR-90 — agent sessions, built ON `fleet` (a session's frames ride the agent
# socket) and ON `chat` (a session is a room; its turns are messages in it).
# In `profile-full` only, and its runtime switch is the one that defaults OFF:
# `[modules] hive = true` turns it on.
hive = ["dep:meshharbor-mod-hive", "fleet", "chat"]
# FR-90 P3-1 — the vault: secrets under envelope encryption. Built ON `hive`
# from P3-3b (a lease is believed from a session's record — the graph's
# `vault → hive` edge), so the feature implies it. In `profile-full` only,
# and its runtime switch defaults OFF like hive's: `[modules] vault = true`,
# or a `vault.tenants` list.
vault = ["dep:meshharbor-mod-vault", "hive"]


[dependencies]
meshharbor-config = { path = "../config" }
meshharbor-db = { path = "../db" }
meshharbor-services = { path = "../services" }
meshharbor-remote-control = { path = "../remote_control" }
# FR-69 — the composition contract, `Core`, and the primitives every module
# handler needs.
meshharbor-core = { path = "../core" }
# FR-69 — module crates, one optional dependency each, selected by the
# features below (`crates/api/src/compose.rs` is where they are mounted).
meshharbor-mod-saas = { path = "../modules/saas", optional = true }
meshharbor-mod-chat = { path = "../modules/chat", optional = true }
meshharbor-mod-conference = { path = "../modules/conference", optional = true }
meshharbor-mod-remote = { path = "../modules/remote", optional = true }
# FR-69 P5a — NOT optional yet: the host still serves the agent socket from
# the fleet module's handles (the Hub, the agent row, presence). It becomes a
# feature like the others when the socket moves into the module (P5b).
meshharbor-mod-fleet = { path = "../modules/fleet", optional = true }
# FR-69 P7a — NOT optional yet either: the host's tunnel, DERP and agent-socket
# code still calls the engine that moved here (`state.network()`). It becomes a
# feature when the sockets move (P7b).
meshharbor-mod-network = { path = "../modules/network", optional = true }
meshharbor-mod-hive = { path = "../modules/hive", optional = true }
meshharbor-mod-vault = { path = "../modules/vault", optional = true }

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
serde.workspace = true
serde_json.workspace = true
mongodb.workspace = true
bson.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# #1731 — the non-blocking, lossy log writer (`src/logging.rs`): a log call
# must never wait on stdout. Already in the lockfile (the agent uses it).
tracing-appender = "0.2"
thiserror.workspace = true
anyhow.workspace = true
jsonwebtoken.workspace = true
dashmap.workspace = true
rand.workspace = true
futures.workspace = true
validator.workspace = true
reqwest.workspace = true
dotenvy.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
async-trait.workspace = true
nanoid.workspace = true
ipnet = "2" # subnet-route CIDR validation for the mesh subnet-router admin API
# Magic-byte content sniffing for uploads. A stored content-type that came
# from the client is a claim, not a fact; this reads what the bytes actually
# are. Pure Rust, no transitive deps, already in the lockfile.
infer = "0.19"
# FR-69 P1b — `object_store`, `maxminddb`, `redis`, `bytes` and `tempfile`
# left with the storage / analytics / cluster / pub-sub modules that used
# them; they are `meshharbor-core`'s now.

# #1731 — the stall watchdog (`src/stall_watchdog.rs`) walks and names every
# thread's stack while the runtime is frozen. Linux only: it signals threads
# with `tgkill` and reads `/proc/self/task`, which is the production target;
# on other hosts the watchdog is inert.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
backtrace = "0.3"

[dev-dependencies]
tempfile.workspace = true
