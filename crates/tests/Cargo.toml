[package]
name = "meshharbor-tests"
license = "AGPL-3.0-only"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "meshharbor_tests"
path = "src/lib.rs"

[dependencies]
meshharbor-config = { path = "../config" }
meshharbor-db = { path = "../db" }
meshharbor-services = { path = "../services" }
base64.workspace = true
meshharbor-remote-control = { path = "../remote_control" }
meshharbor-api = { path = "../api" }
meshharbor-core = { path = "../core" }
# FR-115 P3b — the session-slot tests age a lease by hand.
redis.workspace = true
meshharbor-mod-fleet = { path = "../modules/fleet" }
meshharbor-mod-network = { path = "../modules/network", features = ["path-planner-test-support", "access-authority-test-support"] }
# FR-115 P3b — the external session's charge scope (`extauth::charge_scope`).
meshharbor-mod-remote = { path = "../modules/remote" }
# `external-access` so the FR-52 loopback proof runs the REAL device-side login
# (the OPAQUE record, the guess budget, the live config read) rather than a
# stand-in — the spec's bar for P3 is "proven on loopback against the real
# agent". Everything else in this crate is unaffected: the feature only adds
# the credential modules.
meshharbord = { path = "../../agents/meshharbord", features = ["external-access"] }
webrtc.workspace = true
tokio.workspace = true
mongodb.workspace = true
bson.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
hmac.workspace = true
ring = "0.17"
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
meshharbor-node-core = { path = "../agent-core" }
meshharbor-mod-fleet = { path = "../modules/fleet", features = ["test-fixtures"] }
tempfile = { workspace = true }
tokio-test = "0.4"
tokio-tungstenite = "0.26"
futures.workspace = true
# FR-52 — the OUTSIDER's half of the login in `extauth_tests`, standing in for
# the browser (P4). Same version and features as meshharbord's, so cargo unifies
# them into one crate; `rand_opaque` is the rand 0.8 alias opaque-ke needs
# (see meshharbord's Cargo.toml for why it cannot be the workspace rand).
opaque-ke = { version = "4", default-features = false, features = ["ristretto255", "serde", "argon2", "std"] }
rand_opaque = { package = "rand", version = "0.8" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
meshharbord = { path = "../../agents/meshharbord", features = ["backbone-test-support"] }
meshharbor-cli = { path = "../../agents/meshharbor-cli" }

[features]
# Test-only opt-in for real embedded SSH; no new dependency or release default.
native-shared-ssh-composed = ["meshharbord/ssh-server"]
