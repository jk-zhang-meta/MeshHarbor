[package]
name = "meshharbor-remote-control"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "meshharbor_remote_control"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# CIDR matching for models::host_matches (moved here from tunnel-core policy
# in P3e lever E — the matcher lives next to its canonical shapes). Pure, tiny.
ipnet = "2"
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
ring = "0.17"
# Optional since P3e Phase 3: only the `server`-gated audit/hub modules (and
# the Error::Mongo variant) touch the driver. Agent-side consumers set
# `default-features = false` and drop ~40 transitive crates per binary.
mongodb = { workspace = true, optional = true }
bson.workspace = true
bitflags = { workspace = true, features = ["serde"] }

[features]
# The server half of this crate: the Mongo audit DAO + the session Hub.
# Default-ON so api/services/tests (and any consumer that doesn't opt out)
# keep compiling unchanged; the wire types, models, permissions, signaling,
# consent, TURN creds and worker_pick are always available.
default = ["server"]
server = ["dep:mongodb"]
# In-memory audit fixtures for downstream tests; never enabled by default.
test-fixtures = ["server"]

[dev-dependencies]
tokio-test.workspace = true
# FR-101 P1b: `server_url`'s tests read each URL the way its dialler does.
url = "2"
