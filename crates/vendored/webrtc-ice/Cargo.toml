# Vendored copy of webrtc-ice 0.12.0 from crates.io.
# Upstream is verbatim EXCEPT (P5 — the delta IS
# `crates/vendored/webrtc-ice.patch`; re-derive with
# `scripts/revendor-webrtc-ice.sh`, drift-checked in CI):
#   - src/agent/agent_gather.rs: patched gather_candidates_relay to add
#     a TURNS-over-TLS-over-TCP branch (was a NOT_PLANNED TODO upstream),
#     using the workspace `tcp-turn-conn` crate's Conn adapter.
#   - src/agent/agent_selector.rs: per-attempt STUN build failures
#     downgraded log::error!→debug! with greppable targets (2026-05-18
#     field log-flood fix; not session-fatal — ICE keeps trying pairs).
#   - src/agent/mod.rs + src/agent/agent_internal.rs (#1740): the mDNS
#     resolution of a remote `.local` candidate ends with the agent (upstream
#     never ended one nobody answered, and it held the closed agent and every
#     socket it owned forever), and a candidate gathered after close() is
#     closed instead of kept.
#   - src/util/mod.rs: exclude IPv6 unicast link-local (`fe80::/10`) from
#     `local_interfaces()`, which returns unscoped `IpAddr`; on WSL2 Linux,
#     binding `SocketAddr::new(ip, 0)` (`sin6_scope_id = 0`) fails with
#     `EINVAL` after ~246 ms median per attempt.
#   - this Cargo.toml: the `tcp-turn-conn` path dependency below.

[package]
edition = "2021"
name = "webrtc-ice"
version = "0.12.0"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust implementation of ICE"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc-ice"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webrtc-rs/webrtc/tree/master/ice"

[lib]
name = "webrtc_ice"
path = "src/lib.rs"

[[example]]
name = "ping_pong"
path = "examples/ping_pong.rs"
bench = false

[dependencies.arc-swap]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.crc]
version = "3"

[dependencies.log]
version = "0.4"

[dependencies.mdns]
version = "0.8.0"
package = "webrtc-mdns"

[dependencies.portable-atomic]
version = "1.6"

[dependencies.rand]
version = "0.8"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.stun]
version = "0.7.0"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.turn]
version = "0.9.0"

# VENDOR PATCH (P5): the TURNS-over-TLS-over-TCP Conn adapter the patched
# gather arm uses. Path dep into the workspace — legal for a
# [patch.crates-io]-resolved, workspace-excluded crate.
[dependencies.tcp-turn-conn]
path = "../../tcp-turn-conn"

[dependencies.url]
version = "2"

[dependencies.util]
version = "0.10.0"
features = [
    "conn",
    "vnet",
    "sync",
]
default-features = false
package = "webrtc-util"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.waitgroup]
version = "0.1"

[dev-dependencies.chrono]
version = "0.4.28"

[dev-dependencies.clap]
version = "3"

[dev-dependencies.env_logger]
version = "0.11.3"

[dev-dependencies.hyper]
version = "0.14.27"
features = ["full"]

[dev-dependencies.ipnet]
version = "2"

[dev-dependencies.lazy_static]
version = "1"

[dev-dependencies.regex]
version = "1.9.5"

[dev-dependencies.sha1]
version = "0.10"

[dev-dependencies.tokio-test]
version = "0.4"
