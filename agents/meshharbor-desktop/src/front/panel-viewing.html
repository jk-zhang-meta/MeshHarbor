<!doctype html>
<!--
  FR-27 — the "Being viewed by …" banner, with a Disconnect.

  Windows has had this as a native, capture-excluded overlay in the daemon
  since 0.1.33. macOS and Linux have had nothing: `indicator/mod.rs` stubs the
  whole module out on both, so a person could be watched with no local sign of
  it at all. This is that indicator for those platforms (and, behind
  ROOMLER_DESKTOP_BANNER=1, an A/B against the native one on Windows).

  Draggable by its body, because an always-on-top strip WILL eventually sit
  over something the person needs to read.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roomler — session active</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        box-sizing: border-box;
        border: 1px solid #d33;
        border-radius: 8px;
        user-select: none;
      }
      /* A steady red dot, not a blinking one: this is a state, and something
         that flashes forever gets tuned out — which is the one thing an
         indicator must not do. */
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d33;
        flex: 0 0 auto;
      }
      .who {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 12.5px;
        line-height: 1.25;
      }
      .who b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub {
        display: block;
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #v-stop,
      #v-rec-stop {
        flex: 0 0 auto;
        font-size: 12px;
        padding: 4px 10px;
      }
    </style>
  </head>
  <!-- `data-tauri-drag-region` (NOT Electron's `-webkit-app-region`, which
       wry does not implement) makes the strip itself the drag handle: it is
       borderless, so there is no title bar to grab, and an always-on-top strip
       WILL eventually sit over something the person needs to read. Applied to
       the inert parts only — a button inside a drag region stops clicking. -->
  <body data-tauri-drag-region>
    <span class="dot" aria-hidden="true" data-tauri-drag-region></span>
    <span class="who" data-tauri-drag-region>
      <b id="v-who" data-tauri-drag-region>Being viewed</b>
      <span class="sub" id="v-sub" data-tauri-drag-region></span>
    </span>
    <!-- FR-85 P3b — shown only while a controller RECORDS: stops the
         recording (the file is kept, and the controller is told the host
         stopped it) without ending the session. -->
    <button type="button" id="v-rec-stop" class="consent-btn consent-deny" hidden>Stop recording</button>
    <button type="button" id="v-stop" class="consent-btn consent-deny">Disconnect</button>
    <script src="panel-viewing.js"></script>
  </body>
</html>
