[package]
name = "meshharbor-cli"
license = "MPL-2.0"
publish = false
version.workspace = true
edition.workspace = true
description = "MeshHarbor tunnel client — TeamViewer-style native CLI that forwards local TCP ports to a meshharbord's intranet via the existing MeshHarbor WebRTC plane."

[lib]
name = "meshharbor_cli"
path = "src/lib.rs"

[[bin]]
# P3d Slice B: OUTPUT binary is `mh` (the unified CLI). FR-21 P2b then
# brought the package (`meshharbor-cli`) and lib (`meshharbor_cli`) names into line
# with it. CI stages a
# RETIRED-NAME-ANCHOR(3): the alias name is what the DEPLOYED self-updater
# extracts. It is an input to code already running in the field.
# `meshharbor-tunnel.exe` alias into the release zip so the deployed fleet's
# self-updater (which extracts `meshharbor-tunnel.exe`) is never orphaned.
name = "mh"
path = "src/main.rs"

[dependencies]
# Shared transport, signalling, ACL, forwarding pump
meshharbor-tunnel-core = { path = "../../crates/tunnel-core" }
# Shared wire types (rc:tunnel.* lands here in T2)
# default-features = false drops the `server` half (Mongo audit DAO + Hub) —
# agent-side code only needs the wire/model/permission surface (P3e Phase 3).
meshharbor-remote-control = { path = "../../crates/remote_control", default-features = false }

# Async + networking
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
# Trait-object signaling seam impls (WsSink / WsSource) for the tunnel driver.
async-trait = { workspace = true }

# CLI + config
clap = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }

# Serialization
serde = { workspace = true }
# `raw_value`: `mh hive adopt` keeps every setting it does not own
# exactly as written (FR-90 P1j-3).
serde_json = { workspace = true, features = ["raw_value"] }
# ... and in the order written.
indexmap = { version = "2", features = ["serde"] }
base64 = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors
anyhow = { workspace = true }
thiserror = { workspace = true }

# Hashing (for machine_id derivation — mirrors agent's pattern)
sha2 = { workspace = true }
hex = { workspace = true }

# RETIRED-NAME-ANCHOR(2): same alias as above, same reason.
# Self-update: extract the meshharbor-tunnel binary from the release .zip.
zip = { version = "2", default-features = false, features = ["deflate"] }

# ObjectId for session keys (mirrors the shared protocol)
bson = { workspace = true }

# CIDR parsing + longest-prefix match for the mesh subnet-router route table.
ipnet = "2"

# WebRTC peer (vendored — SCTP rwnd setter)
webrtc = { workspace = true }

# Random fallback for machine_id
rand = { workspace = true }
ssh-key = { workspace = true }

# rc.66: raw socket access for `setsockopt(SO_SNDBUF)` on the local
# listener's accepted TcpStream. Tokio re-exports tcp socket helpers
# but `set_send_buffer_size` isn't a stable public method on
# `tokio::net::TcpStream`; the canonical async-Rust pattern is to
# borrow a `socket2::SockRef` from the tokio socket and call
# `set_send_buffer_size` on that. The crate is already a transitive
# dep (vendored webrtc-data pulls it in), so adding it as a direct
# dep is zero extra build cost.
socket2 = "0.5"
# FR-52 — hidden terminal input for `rc password set`. +2 crates (rpassword,
# rtoolbox); libc / windows-sys are already here.
#
# Hand-rolling the ~60 lines (termios `ECHO` off on Unix, `SetConsoleMode` on
# Windows) would mean owning the RESTORE path, and getting that wrong leaves the
# operator's shell with echo permanently off after a Ctrl-C — a worse bug than
# the one it saves a dependency on. This crate restores on drop.
rpassword = "7.5.4"

# SIGPIPE reset at the CLI entry (cli::run_from) so `meshharbor … | head` dies
# quietly on EPIPE instead of panicking — Rust starts with SIGPIPE ignored.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# FR-97 P6b — `self-update` on Linux and macOS reads the binary out of the
# release tarball in memory (nothing is extracted to disk), and writes the
# verified `.deb` into a private dir before `dpkg -i`.
flate2 = "1"
tar = "0.4"
tempfile = { workspace = true }

# build.rs embeds a Windows VERSIONINFO resource into mh.exe. See
# agents/meshharbord/Cargo.toml for why this is embed-resource rather than
# winres/winresource (per-binary scoping vs. a link-lib that leaks into
# meshharbor-setup.exe, which depends on this crate).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

# ---------------------------------------------------------------------------
# Packaging metadata — mirrors meshharbord. release-tunnel.yml CI lands
# in T4 (or release-agent.yml extended with a second matrix entry).
# ---------------------------------------------------------------------------

# cargo-deb (Linux .deb)
#   cargo deb -p meshharbor-cli --no-build
[package.metadata.deb]
maintainer = "G ROX LTD <goran.jovanov@gmail.com>"
copyright = "2026, G ROX LTD"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Native tunnel client for the MeshHarbor platform. Runs on the \
operator's laptop, opens a local TCP listener, and forwards bytes \
over a WebRTC P2P data channel to an enrolled meshharbord that \
dials the corresponding intranet destination. The MeshHarbor API is \
signalling-only — server never sees the payload."""
section = "net"
priority = "optional"
# #2472 — explicit, never cargo-deb's `$auto`: the tunnel release builds on
# `ubuntu-latest`, where dpkg-shlibdeps names OpenSSL `libssl3t64` (the 64-bit
# time name of Debian 13 and Ubuntu 24.04). Debian 12 and Ubuntu 22.04 call it
# `libssl3`, so the automatic dependency made the package uninstallable there.
depends = "libc6 (>= 2.34), libssl3 (>= 3.0.0) | libssl3t64 (>= 3.0.0)"
# RETIRED-NAME-ANCHOR-BEGIN
# The dpkg takeover has to name the REAL predecessor package. A rename here
# is not a typo, it is a silently broken upgrade: dpkg would see a brand new
# package and leave the old one owning /usr/bin/meshharbor.
# FR-21 P2b: the crate renamed `meshharbor-tunnel` -> `meshharbor-cli`, and cargo-deb
# derives the Debian `Package:` from the crate name, so without these dpkg would
# see a brand-new package and collide with the installed `meshharbor-tunnel` over
# `/usr/bin/mh`. Same shape and same reasoning as meshharbord's block: `name`
# is stated EXPLICITLY so a future crate rename cannot move the Debian package
# name by accident, and there is deliberately NO `conflicts` — that would demand
# the old package be removed first, which the CLI's `dpkg -i` install path
# cannot do.
name = "meshharbor-cli"
provides = "meshharbor-tunnel"
replaces = "meshharbor-tunnel"
# RETIRED-NAME-ANCHOR-END
assets = [
    # P3d Slice B: installed CLI binary is `mh` (the [[bin]] output name).
    ["target/release/mh", "usr/bin/", "755"],
]

# cargo-wix (Windows .msi)
#   cargo wix -p meshharbor-cli --nocapture
# Source lives at agents/meshharbor-cli/wix/main.wxs (T4).
[package.metadata.wix]
upgrade-guid = "8A4D2E1B-5C9F-4D7E-A2B3-1F4E6A8B9C2D"
path-guid    = "4D2C8F12-7E9A-4B6D-8C3F-5A1E9F2D8B47"
license      = false
eula         = false
