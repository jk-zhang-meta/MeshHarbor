<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="rd-title rd-desc">
  <!-- Sibling of hero-mesh.svg — same visual system as the landing page
       (ui/src/components/landing/ArchitectureGraphic.vue). -->
  <title id="rd-title">Desktop sharing and remote control</title>
  <desc id="rd-desc">
    A laptop anywhere shows the live desktop of an office PC inside a browser
    tab. The pixel stream flows from the PC to the laptop straight through a
    corporate firewall; mouse and keyboard input flows back. Everything is
    end-to-end encrypted, with no software to install on the viewing side.
  </desc>
  <style>
    .ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rd-line { stroke: #ef5350; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 10 7; animation: rd-march-17 1.1s linear infinite; }
    .in-line { stroke: rgba(0,150,136,.6); stroke-width: 1.5; stroke-linecap: round;
      stroke-dasharray: 3 7; animation: rd-march-10 1.6s linear infinite reverse; }
    @keyframes rd-march-17 { to { stroke-dashoffset: -17; } }
    @keyframes rd-march-10 { to { stroke-dashoffset: -10; } }
    .pkt { fill: #009688; will-change: transform; animation: rd-packet 2.6s ease-in-out infinite; }
    @keyframes rd-packet {
      0% { transform: translate(0,0); opacity: 0; }
      8% { opacity: 1; } 92% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .ring { transform-box: fill-box; transform-origin: center; animation: rd-ring 2.2s ease-out infinite; }
    @keyframes rd-ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }
    .fan { transform-box: fill-box; transform-origin: center; animation: rd-spin 3.5s linear infinite; }
    @keyframes rd-spin { to { transform: rotate(360deg); } }
    .shimmer { animation: rd-shimmer 2.8s ease-in-out infinite; }
    @keyframes rd-shimmer {
      0% { transform: translateX(-40px) skewX(-18deg); }
      65% { transform: translateX(300px) skewX(-18deg); }
      100% { transform: translateX(300px) skewX(-18deg); }
    }
    .rd-live { animation: rd-live 2s ease-in-out infinite; }
    @keyframes rd-live { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
    .cursor { animation: rd-cursor 6s ease-in-out infinite; }
    @keyframes rd-cursor {
      0%, 14% { transform: translate(140px, 150px); }
      38%, 60% { transform: translate(228px, 158px); }
      80% { transform: translate(168px, 196px); }
      100% { transform: translate(140px, 150px); }
    }
    .click { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rd-click 6s ease-out infinite; }
    @keyframes rd-click {
      0%, 40% { transform: scale(.2); opacity: 0; }
      44% { transform: scale(.4); opacity: .8; }
      56% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pkt, .ring, .shimmer, .click { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="rd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2f1" />
      <stop offset=".5" stop-color="#e8f5e9" />
      <stop offset="1" stop-color="#e0f7fa" />
    </linearGradient>
    <linearGradient id="rd-desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(0,150,136,.35)" />
      <stop offset="1" stop-color="rgba(0,121,107,.15)" />
    </linearGradient>
    <clipPath id="rd-viewport"><rect x="78" y="106" width="234" height="126" rx="3" /></clipPath>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="18" fill="url(#rd-bg)" />

  <!-- ══ The laptop: you, anywhere ══ -->
  <g>
    <rect x="66" y="76" width="258" height="168" rx="6" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" stroke-width="1.5" />
    <path d="M52 244 h286 l14 14 h-314 z" fill="#cfd8dc" />
    <rect x="168" y="248" width="54" height="4" rx="2" fill="#b0bec5" />
    <!-- browser chrome -->
    <rect x="78" y="88" width="234" height="16" rx="3" fill="#37474f" />
    <circle cx="86" cy="96" r="2" fill="#ef5350" />
    <circle cx="93" cy="96" r="2" fill="#ffb300" />
    <circle cx="100" cy="96" r="2" fill="#4caf50" />
    <rect x="110" y="91" width="120" height="10" rx="5" fill="rgba(255,255,255,.15)" />
    <text x="170" y="98.5" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,.75)">meshharbor.itachi.fans — office-pc</text>
    <!-- the remote desktop, live inside the tab -->
    <rect x="78" y="106" width="234" height="126" fill="url(#rd-desk)" />
    <rect x="78" y="222" width="234" height="10" fill="rgba(26,26,46,.55)" />
    <circle cx="88" cy="227" r="2.5" fill="rgba(224,242,241,.8)" />
    <rect x="96" y="224" width="6" height="6" rx="1" fill="rgba(224,242,241,.5)" />
    <rect x="106" y="224" width="6" height="6" rx="1" fill="rgba(224,242,241,.5)" />
    <!-- remote windows -->
    <rect x="92" y="118" width="102" height="62" rx="2.5" fill="rgba(236,250,249,.95)" />
    <rect x="92" y="118" width="102" height="10" rx="2.5" fill="rgba(0,121,107,.25)" />
    <rect x="99" y="134" width="62" height="3" rx="1.5" fill="rgba(0,121,107,.45)" />
    <rect x="99" y="142" width="82" height="3" rx="1.5" fill="rgba(0,121,107,.3)" />
    <rect x="99" y="150" width="48" height="3" rx="1.5" fill="rgba(0,121,107,.4)" />
    <rect x="99" y="163" width="34" height="10" rx="2" fill="#009688" />
    <rect x="204" y="132" width="88" height="74" rx="2.5" fill="rgba(236,250,249,.8)" />
    <rect x="204" y="132" width="88" height="10" rx="2.5" fill="rgba(239,83,80,.3)" />
    <rect x="211" y="148" width="74" height="42" rx="2" fill="rgba(26,26,46,.85)" />
    <rect x="215" y="153" width="30" height="2.5" rx="1.25" fill="#4DB6AC" />
    <rect x="215" y="159" width="48" height="2.5" rx="1.25" fill="rgba(77,182,172,.6)" />
    <rect x="215" y="165" width="22" height="2.5" rx="1.25" fill="rgba(77,182,172,.8)" />
    <rect x="215" y="171" width="40" height="2.5" rx="1.25" fill="rgba(77,182,172,.5)" />
    <!-- click ripple + your cursor, moving inside the remote desktop -->
    <circle class="click" cx="234" cy="164" r="9" fill="none" stroke="#ef5350" stroke-width="1.5" clip-path="url(#rd-viewport)" />
    <g class="cursor" transform="translate(140,150)">
      <path d="M0 0 L0 13 L3.6 10.2 L6.4 16 L8.8 14.8 L6.2 9.2 L9.6 9.2 Z" fill="#ffffff" stroke="#1a1a2e" stroke-width="1" />
    </g>
    <!-- live affordances -->
    <rect class="shimmer" x="66" y="100" width="22" height="140" fill="rgba(255,255,255,.14)" clip-path="url(#rd-viewport)" />
    <rect class="rd-live" x="77" y="105" width="236" height="128" rx="3" fill="none" stroke="#ef5350" stroke-width="1.5" />
    <text x="195" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">you — anywhere</text>
    <text x="195" y="299" text-anchor="middle" font-size="9.5" fill="rgba(26,26,46,.6)">any browser · nothing to install</text>
  </g>

  <!-- ══ The firewall the stream crosses ══ -->
  <g>
    <rect x="455" y="100" width="22" height="100" rx="1" fill="rgba(26,26,46,.1)" stroke="rgba(26,26,46,.5)" />
    <path d="M455 117 h22 M455 134 h22 M455 151 h22 M455 168 h22 M455 185 h22
             M466 100 v17 M460 117 v17 M472 134 v17 M462 151 v17 M470 168 v17 M464 185 v15"
      stroke="rgba(26,26,46,.4)" stroke-width="1" fill="none" />
    <text x="466" y="215" text-anchor="middle" font-size="8.5" fill="rgba(26,26,46,.55)">NAT &amp; firewalls</text>
  </g>

  <!-- ══ The streams ══ -->
  <g>
    <path d="M545 138 C480 100 390 105 324 145" fill="none" stroke="rgba(239,83,80,.18)" stroke-width="8" />
    <path class="rd-line" d="M545 138 C480 100 390 105 324 145" fill="none" />
    <rect x="350" y="60" width="180" height="21" rx="10.5" fill="#ffffff" stroke="rgba(239,83,80,.4)" />
    <text x="440" y="74" text-anchor="middle" font-size="10" fill="#ef5350">live desktop → your tab · 60 fps</text>
    <line class="in-line" x1="326" y1="192" x2="543" y2="188" />
    <circle class="pkt" cx="334" cy="192" r="3" style="--dx: 200px; --dy: -4px; animation-duration: 2.2s" />
    <text x="408" y="180" text-anchor="middle" font-size="8.5" fill="rgba(26,26,46,.55)">your mouse &amp; keys</text>
    <rect x="352" y="205" width="164" height="20" rx="10" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <path d="M362 214.5 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#00796B" stroke-width="1.3" />
    <rect x="361" y="214.5" width="8" height="6" rx="1" fill="#00796B" />
    <text x="440" y="218.5" text-anchor="middle" font-size="9" fill="#00796B">end-to-end encrypted</text>
  </g>

  <!-- ══ The machine you reach ══ -->
  <g>
    <rect x="545" y="95" width="120" height="80" rx="4" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" stroke-width="1.5" />
    <rect x="556" y="108" width="52" height="4" rx="2" fill="#009688" opacity=".8" />
    <rect x="556" y="118" width="84" height="4" rx="2" fill="#009688" opacity=".5" />
    <rect x="556" y="128" width="40" height="4" rx="2" fill="#009688" opacity=".65" />
    <rect x="556" y="138" width="66" height="4" rx="2" fill="#009688" opacity=".4" />
    <rect x="556" y="148" width="30" height="4" rx="2" fill="#009688" opacity=".55" />
    <rect x="597" y="175" width="12" height="14" fill="#cfd8dc" />
    <rect x="577" y="189" width="52" height="5" rx="2.5" fill="#cfd8dc" />
    <rect x="680" y="88" width="44" height="100" rx="4" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" stroke-width="1.5" />
    <circle cx="702" cy="126" r="13" fill="none" stroke="#009688" stroke-width="1.4" />
    <g class="fan" stroke="#4DB6AC" stroke-width="1.8">
      <line x1="702" y1="117" x2="702" y2="135" />
      <line x1="694.2" y1="121.5" x2="709.8" y2="130.5" />
      <line x1="709.8" y1="121.5" x2="694.2" y2="130.5" />
    </g>
    <circle cx="702" cy="126" r="2.2" fill="#009688" />
    <rect x="691" y="150" width="22" height="3" rx="1.5" fill="rgba(0,150,136,.5)" />
    <rect x="691" y="158" width="22" height="3" rx="1.5" fill="rgba(0,150,136,.3)" />
    <rect x="691" y="166" width="22" height="3" rx="1.5" fill="rgba(0,150,136,.4)" />
    <circle cx="668" cy="90" r="4" fill="#4caf50" />
    <circle class="ring" cx="668" cy="90" r="4" fill="none" stroke="rgba(76,175,80,.5)" />
    <text x="634" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">your PC — at the office</text>
    <text class="ip" x="634" y="299" text-anchor="middle" font-size="10" fill="#00796B">office-pc · 100.64.0.23</text>
  </g>

  <!-- ══ Value chips ══ -->
  <g font-size="10">
    <rect x="103" y="330" width="150" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="178" y="345.5" text-anchor="middle" fill="#00796B">hardware-encoded · fluid</text>
    <rect x="277" y="330" width="206" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="380" y="345.5" text-anchor="middle" fill="#00796B">consent + audit on every session</text>
    <rect x="507" y="330" width="150" height="24" rx="12" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
    <text x="582" y="345.5" text-anchor="middle" fill="#00796B">works on the lock screen</text>
  </g>
</svg>
