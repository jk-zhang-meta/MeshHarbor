<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="sc-t">
  <title id="sc-t">A browser tab showing a remote machine's desktop, with input flowing back</title>
  <!-- Browser on the left -->
  <rect x="8" y="22" width="150" height="106" rx="7" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
  <rect x="8" y="22" width="150" height="16" rx="7" fill="rgba(0,150,136,0.12)"/>
  <rect x="8" y="32" width="150" height="6" fill="rgba(0,150,136,0.12)"/>
  <g fill="#ef5350"><circle cx="19" cy="30" r="2.6"/></g>
  <circle cx="28" cy="30" r="2.6" fill="#ffb74d"/>
  <circle cx="37" cy="30" r="2.6" fill="#4caf50"/>
  <text x="50" y="33" font-size="7.5" fill="rgba(26,26,46,0.6)">meshharbor.itachi.fans</text>

  <!-- The remote screen rendered inside it -->
  <rect x="18" y="46" width="130" height="72" rx="4" fill="#1a1a2e"/>
  <rect x="26" y="54" width="52" height="30" rx="3" fill="rgba(0,150,136,0.55)"/>
  <rect x="84" y="54" width="56" height="14" rx="3" fill="rgba(255,255,255,0.22)"/>
  <rect x="84" y="72" width="40" height="12" rx="3" fill="rgba(255,255,255,0.14)"/>
  <rect x="26" y="90" width="114" height="20" rx="3" fill="rgba(255,255,255,0.10)"/>
  <path d="M104 92 l0 14 l4 -4 l3 6 l3 -1.5 l-3 -6 l5 0 z" fill="#ffffff"/>

  <!-- Encrypted stream both ways -->
  <g stroke="#009688" stroke-width="1.6" fill="none">
    <path d="M162 62 h48" marker-end="url(#scA)"/>
  </g>
  <g stroke="#ef5350" stroke-width="1.6" fill="none">
    <path d="M210 92 h-48" marker-end="url(#scB)"/>
  </g>
  <defs>
    <marker id="scA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#009688"/>
    </marker>
    <marker id="scB" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#ef5350"/>
    </marker>
  </defs>
  <text x="186" y="56" text-anchor="middle" font-size="7.5" font-weight="600" fill="#00796B">pixels</text>
  <text x="186" y="106" text-anchor="middle" font-size="7.5" font-weight="600" fill="#ef5350">keys · mouse</text>
  <g transform="translate(186 77)">
    <circle r="9" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.2"/>
    <path d="M-3 -1 v-2 a3 3 0 0 1 6 0 v2 M-4 -1 h8 v6 h-8 z" fill="none" stroke="#00796B" stroke-width="1.2"/>
  </g>

  <!-- The remote machine -->
  <rect x="222" y="34" width="120" height="76" rx="6" fill="#ffffff" stroke="rgba(0,150,136,0.45)" stroke-width="1.5"/>
  <rect x="232" y="44" width="100" height="50" rx="3" fill="rgba(0,150,136,0.16)"/>
  <rect x="262" y="112" width="40" height="6" rx="3" fill="rgba(26,26,46,0.35)"/>
  <text x="282" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#00796B">office PC</text>
  <circle cx="336" cy="42" r="3.2" fill="#4caf50"/>
</svg>
