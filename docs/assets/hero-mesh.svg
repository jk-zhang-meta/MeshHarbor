<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-labelledby="hm-title hm-desc">
  <!-- Standalone port of ui/src/components/landing/ArchitectureGraphic.vue
       (the landing-page hero animation). Pure CSS animations — GitHub renders
       these when the SVG is embedded via <img>. Keep palette in sync with the
       landing page: teal #009688/#00796B, accent #ef5350, ink #1a1a2e. -->
  <title id="hm-title">MeshHarbor at a glance</title>
  <desc id="hm-desc">
    Four machines — your laptop, a GPU workstation, a Kubernetes cluster, and a
    home server routing its LAN — joined in a direct encrypted mesh with stable
    private addresses that crosses NATs and firewalls. Thin control channels link
    each machine to the meshharbor.itachi.fans control plane, and a live remote desktop
    stream runs from the GPU workstation to the laptop's browser.
  </desc>
  <style>
    .ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ctrl-line { fill: none; stroke: rgba(0,121,107,.5); stroke-width: 1.25; stroke-linecap: round;
      stroke-dasharray: 2 6; animation: hm-march-8 2.6s linear infinite; }
    .mesh-line { stroke: rgba(0,150,136,.55); stroke-width: 1.75; stroke-linecap: round;
      stroke-dasharray: 7 9; animation: hm-march-16 1.8s linear infinite; }
    .rd-line { stroke: #ef5350; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 10 7; animation: hm-march-17 1.1s linear infinite; }
    @keyframes hm-march-8 { to { stroke-dashoffset: -8; } }
    @keyframes hm-march-16 { to { stroke-dashoffset: -16; } }
    @keyframes hm-march-17 { to { stroke-dashoffset: -17; } }
    .pkt { fill: #009688; will-change: transform; animation: hm-packet 2.6s ease-in-out infinite; }
    @keyframes hm-packet {
      0% { transform: translate(0,0); opacity: 0; }
      8% { opacity: 1; } 92% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .ring, .ripple { transform-box: fill-box; transform-origin: center; }
    .ring { animation: hm-ring 2.2s ease-out infinite; }
    .ripple { animation: hm-ripple 3.6s ease-out infinite; }
    .fan { transform-box: fill-box; transform-origin: center; animation: hm-spin 3.5s linear infinite; }
    @keyframes hm-spin { to { transform: rotate(360deg); } }
    @keyframes hm-ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes hm-ripple { 0% { transform: scale(.85); opacity: .5; } 100% { transform: scale(1.45); opacity: 0; } }
    .shimmer { animation: hm-shimmer 2.8s ease-in-out infinite; }
    @keyframes hm-shimmer {
      0% { transform: translateX(-18px) skewX(-18deg); }
      65% { transform: translateX(78px) skewX(-18deg); }
      100% { transform: translateX(78px) skewX(-18deg); }
    }
    .rd-live { animation: hm-live 2s ease-in-out infinite; }
    @keyframes hm-live { 0%, 100% { opacity: .9; } 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pkt, .ring, .ripple, .shimmer { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2f1" />
      <stop offset=".5" stop-color="#e8f5e9" />
      <stop offset="1" stop-color="#e0f7fa" />
    </linearGradient>
    <linearGradient id="hm-desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(0,150,136,.35)" />
      <stop offset="1" stop-color="rgba(0,121,107,.15)" />
    </linearGradient>
    <clipPath id="hm-screen"><rect x="69" y="201" width="62" height="40" rx="3" /></clipPath>
  </defs>

  <rect x="0" y="0" width="600" height="540" rx="18" fill="url(#hm-bg)" />

  <g transform="translate(20,20)">
    <!-- Control plane: coordination only — keys, ACLs, presence. -->
    <g>
      <circle class="ripple" cx="277" cy="63" r="52" fill="none" stroke="rgba(0,150,136,.35)" />
      <circle class="ripple" cx="277" cy="63" r="52" fill="none" stroke="rgba(0,150,136,.35)" style="animation-delay: 1.8s" />
      <path d="M240 92 h84 a20 20 0 0 0 7 -39 a30 30 0 0 0 -53 -18 a26 26 0 0 0 -45 18 a20 20 0 0 0 7 39 z"
        fill="#ffffff" stroke="rgba(0,150,136,.45)" stroke-width="1.5" />
      <text x="277" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#00796B">meshharbor.itachi.fans</text>
      <text x="277" y="75" text-anchor="middle" font-size="9" fill="rgba(26,26,46,.55)">control plane</text>
      <path class="ctrl-line" d="M234 84 Q130 130 100 198" />
      <path class="ctrl-line" d="M324 84 Q430 128 458 192" />
      <path class="ctrl-line" d="M250 92 Q175 255 150 388" />
      <path class="ctrl-line" d="M310 92 Q385 255 414 391" />
    </g>

    <!-- WireGuard-style overlay: a direct, end-to-end encrypted mesh. -->
    <g>
      <rect x="352" y="180" width="16" height="48" rx="1" fill="rgba(26,26,46,.1)" stroke="rgba(26,26,46,.5)" />
      <path d="M352 192 h16 M352 204 h16 M352 216 h16 M360 180 v12 M356 192 v12 M364 204 v12 M360 216 v12"
        stroke="rgba(26,26,46,.45)" stroke-width="1" fill="none" />
      <text x="360" y="242" text-anchor="middle" font-size="8.5" fill="rgba(26,26,46,.55)">through NAT &amp; firewalls</text>
      <line class="mesh-line" x1="136" y1="222" x2="418" y2="216" />
      <line class="mesh-line" x1="100" y1="250" x2="143" y2="388" style="animation-delay: -0.3s" />
      <line class="mesh-line" x1="128" y1="248" x2="392" y2="405" style="animation-delay: -0.6s" />
      <line class="mesh-line" x1="428" y1="242" x2="176" y2="404" style="animation-delay: -0.9s" />
      <line class="mesh-line" x1="455" y1="250" x2="420" y2="390" style="animation-delay: -1.2s" />
      <line class="mesh-line" x1="196" y1="428" x2="388" y2="428" style="animation-delay: -1.5s" />
      <circle class="pkt" cx="100" cy="250" r="3" style="--dx: 43px; --dy: 138px; animation-duration: 2.4s" />
      <circle class="pkt" cx="428" cy="242" r="3" style="--dx: -252px; --dy: 162px; animation-duration: 3s; animation-delay: 0.8s" />
      <circle class="pkt" cx="196" cy="428" r="3" style="--dx: 192px; --dy: 0px; animation-duration: 2.6s; animation-delay: 1.4s" />
      <circle class="pkt" cx="128" cy="248" r="3" style="--dx: 264px; --dy: 157px; animation-duration: 3.2s; animation-delay: 2s" />
      <rect x="245" y="308" width="110" height="20" rx="10" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
      <path d="M253 317 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#00796B" stroke-width="1.3" />
      <rect x="252" y="317" width="8" height="6" rx="1" fill="#00796B" />
      <text x="308" y="321.5" text-anchor="middle" font-size="9" fill="#00796B">end-to-end encrypted</text>
      <rect x="290" y="353" width="56" height="15" rx="7.5" fill="#ffffff" stroke="rgba(0,150,136,.35)" />
      <text x="318" y="363.5" text-anchor="middle" font-size="8.5" fill="#00796B">ssh · kubectl</text>
    </g>

    <!-- Machines: anywhere — home, office, cloud. -->
    <g>
      <ellipse cx="150" cy="428" rx="92" ry="54" fill="rgba(0,150,136,.04)" stroke="rgba(26,26,46,.25)" stroke-dasharray="4 5" />

      <rect x="68" y="200" width="64" height="42" rx="3" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" />
      <path d="M60 242 h80 l7 9 h-94 z" fill="#cfd8dc" />
      <circle cx="135" cy="197" r="3.5" fill="#4caf50" />
      <circle class="ring" cx="135" cy="197" r="3.5" fill="none" stroke="rgba(76,175,80,.5)" />
      <text x="100" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a2e">laptop — you</text>
      <text class="ip" x="100" y="286" text-anchor="middle" font-size="10" fill="#00796B">100.64.0.12</text>

      <rect x="424" y="198" width="58" height="38" rx="3" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" />
      <rect x="430" y="206" width="28" height="3" rx="1.5" fill="#009688" opacity=".8" />
      <rect x="430" y="213" width="40" height="3" rx="1.5" fill="#009688" opacity=".5" />
      <rect x="430" y="220" width="22" height="3" rx="1.5" fill="#009688" opacity=".65" />
      <rect x="450" y="236" width="6" height="9" fill="#cfd8dc" />
      <rect x="438" y="245" width="28" height="3.5" rx="1.75" fill="#cfd8dc" />
      <rect x="488" y="196" width="28" height="46" rx="3" fill="#1a1a2e" stroke="rgba(0,150,136,.5)" />
      <circle cx="502" cy="216" r="8" fill="none" stroke="#009688" stroke-width="1.2" />
      <g class="fan" stroke="#4DB6AC" stroke-width="1.4">
        <line x1="502" y1="210.5" x2="502" y2="221.5" />
        <line x1="497.2" y1="213.2" x2="506.8" y2="218.8" />
        <line x1="506.8" y1="213.2" x2="497.2" y2="218.8" />
      </g>
      <circle cx="502" cy="216" r="1.6" fill="#009688" />
      <rect x="495" y="230" width="14" height="2" rx="1" fill="rgba(0,150,136,.5)" />
      <rect x="495" y="235" width="14" height="2" rx="1" fill="rgba(0,150,136,.3)" />
      <circle cx="510" cy="193" r="3.5" fill="#4caf50" />
      <circle class="ring" cx="510" cy="193" r="3.5" fill="none" stroke="rgba(76,175,80,.5)" style="animation-delay: 0.5s" />
      <text x="466" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a2e">GPU workstation</text>
      <text class="ip" x="466" y="282" text-anchor="middle" font-size="10" fill="#00796B">100.64.0.23</text>

      <rect x="130" y="392" width="40" height="50" rx="4" fill="#ffffff" stroke="rgba(26,26,46,.4)" />
      <rect x="136" y="400" width="28" height="3" rx="1.5" fill="rgba(26,26,46,.25)" />
      <rect x="136" y="407" width="28" height="3" rx="1.5" fill="rgba(26,26,46,.25)" />
      <circle cx="138" cy="432" r="2" fill="#4caf50" />
      <circle class="ring" cx="138" cy="432" r="2" fill="none" stroke="rgba(76,175,80,.5)" style="animation-delay: 1s" />
      <circle cx="145" cy="432" r="2" fill="#009688" />
      <text x="150" y="461" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a2e">home server</text>
      <text class="ip" x="150" y="475" text-anchor="middle" font-size="10" fill="#00796B">100.64.0.31</text>
      <text x="150" y="490" text-anchor="middle" font-size="9" fill="rgba(26,26,46,.55)">subnet router · exit node · 192.168.1.0/24</text>

      <path d="M415 393 L438 406.5 V433.5 L415 447 L392 433.5 V406.5 Z" fill="#ffffff" stroke="rgba(0,150,136,.5)" stroke-width="1.5" />
      <rect x="404" y="406" width="22" height="7" rx="1.5" fill="rgba(26,26,46,.07)" stroke="rgba(26,26,46,.3)" stroke-width=".8" />
      <rect x="404" y="416.5" width="22" height="7" rx="1.5" fill="rgba(26,26,46,.07)" stroke="rgba(26,26,46,.3)" stroke-width=".8" />
      <rect x="404" y="427" width="22" height="7" rx="1.5" fill="rgba(26,26,46,.07)" stroke="rgba(26,26,46,.3)" stroke-width=".8" />
      <circle cx="408.5" cy="409.5" r="1.4" fill="#4caf50" />
      <circle cx="408.5" cy="420" r="1.4" fill="#4caf50" />
      <circle cx="408.5" cy="430.5" r="1.4" fill="#009688" />
      <circle cx="440" cy="398" r="3.5" fill="#4caf50" />
      <circle class="ring" cx="440" cy="398" r="3.5" fill="none" stroke="rgba(76,175,80,.5)" style="animation-delay: 1.5s" />
      <text x="415" y="466" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a2e">k8s cluster</text>
      <text class="ip" x="415" y="480" text-anchor="middle" font-size="10" fill="#00796B">100.64.0.44</text>
    </g>

    <!-- Remote desktop: the GPU workstation's screen, live in the laptop's browser. -->
    <g>
      <path d="M136 214 Q283 156 418 204" fill="none" stroke="rgba(239,83,80,.18)" stroke-width="7" />
      <path class="rd-line" d="M136 214 Q283 156 418 204" fill="none" />
      <rect x="217" y="163" width="132" height="20" rx="10" fill="#ffffff" stroke="rgba(239,83,80,.4)" />
      <text x="283" y="176.5" text-anchor="middle" font-size="9.5" fill="#ef5350">remote desktop · 60 fps</text>
      <rect x="70" y="202" width="60" height="7" fill="#37474f" />
      <circle cx="74" cy="205.5" r="1.2" fill="#ef5350" />
      <circle cx="78" cy="205.5" r="1.2" fill="#ffb300" />
      <circle cx="82" cy="205.5" r="1.2" fill="#4caf50" />
      <rect x="70" y="211" width="60" height="29" fill="url(#hm-desk)" />
      <rect x="74" y="215" width="24" height="14" rx="1.5" fill="rgba(224,242,241,.9)" />
      <rect x="102" y="219" width="20" height="16" rx="1.5" fill="rgba(224,242,241,.75)" />
      <rect class="shimmer" x="64" y="195" width="14" height="60" fill="rgba(255,255,255,.14)" clip-path="url(#hm-screen)" />
      <rect class="rd-live" x="69" y="201" width="62" height="40" rx="3" fill="none" stroke="#ef5350" stroke-width="1.5" />
    </g>
  </g>
</svg>
