[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/db",
    "crates/services",
    "crates/remote_control",
    "crates/localapi",
    "crates/agent-core",
    # FR-90 — Hive on the device: transcript events, the replica store, the
    # stream-json adapter, the launch spec. Daemon-side only (MPL).
    "crates/hive-node",
    "crates/tunnel-core",
    # P5 — the webrtc-ice fork's substance (TURNS/TCP Conn adapter), extracted
    # so the vendored tree is a mechanical patch. Consumed by tunnel-core AND
    # (via path dep) the vendored webrtc-ice's gather arm.
    "crates/tcp-turn-conn",
    "crates/roomler-setup-core",
    # Standalone regional DERP relay (one per relay PoP; ticket-authenticated,
    # DB-free — see crates/derp-relay/src/main.rs).
    "crates/derp-relay",

    # FR-69 — the server composition contract (the Module trait, hooks, jobs,
    # capabilities) and the composition snapshot that gates every module move.
    "crates/core",
    # FR-69 — the module crates, one per pillar, behind features on `crates/api`.
    "crates/modules/saas",
    "crates/modules/chat",
    "crates/modules/conference",
    "crates/modules/fleet",
    "crates/modules/remote",
    "crates/modules/network",
    # FR-90 — agent sessions, the server side: the session record and its
    # lifecycle, never what is in a session.
    "crates/modules/hive",
    # FR-90 P3 — the vault: secrets under envelope encryption, and the audit
    # of every decision. Never a value in an answer.
    "crates/modules/vault",

    "crates/api",
    "crates/tests",

    "agents/roomlerd",
    "agents/roomler-desktop",
    "agents/roomler-cli-shim",
    "agents/roomler-setup",
    "agents/roomler-cli",
]
exclude = [
    # Vendored upstream (kept verbatim except the H265 payloader fix);
    # referenced via `[patch.crates-io]` below, not a workspace member.
    "crates/vendored/rtp",
    # Vendored upstream (kept verbatim except agent_gather.rs); adds the
    # TURNS-over-TCP relay code path that upstream marked NOT_PLANNED.
    "crates/vendored/webrtc-ice",
    # Vendored upstream with a SettingEngine setter that exposes the
    # SCTP `a_rwnd` (was hardcoded to 0 = 1 MiB upstream default).
    # Needed for roomler native-to-native peers to advertise
    # 8 MiB so DC throughput stays link-bound at high BDP.
    # FR-101: plus `set_dtls_cipher_suites`, so a remote-desktop session
    # can drop the AES-256-CBC-SHA suites upstream's DTLS default carries.
    "crates/vendored/webrtc",
    # Vendored upstream minus the on-drop NetworkList registry deletion —
    # see the wintun-bindings patch note above [patch.crates-io].
    "crates/vendored/wintun-bindings",
    # Vendored upstream plus an accessor for the macOS IOSurface row pitch —
    # see the scrap patch note below [patch.crates-io].
    "crates/vendored/scrap",
    # Vendored upstream with the FORWARD-TSN bundled-chunk parse fix —
    # see the webrtc-sctp patch note below [patch.crates-io].
    "crates/vendored/webrtc-sctp",
    # Vendored upstream with TCP congestion control that actually bounds
    # bytes in flight — see the smoltcp patch note below [patch.crates-io].
    "crates/vendored/smoltcp",
]

# Patch webrtc-rs's rtp-0.12.0 dependency with our local vendored copy
# that carries the H265 payloader fix — upstream drops the current
# NAL after emitting a VPS/SPS/PPS aggregation packet, and also drops
# any NAL whose type isn't in a hardcoded list (IDR_N_LP, CRA, TRAIL_R,
# ...). Symptom in Chrome: framesAssembledFromMultiplePackets stays 0
# and the decoder PLI-storms despite packets flowing. See
# crates/vendored/rtp/src/codecs/h265/mod.rs for the patch notes.
#
# webrtc-ice-0.12.0: upstream `gather_candidates_relay` only implements
# TURN-over-UDP — TURN/TCP, TURNS/TCP, TURNS/UDP (DTLS) all fall through
# to a `log::warn!("Unable to handle URL")` and return without creating
# a candidate. Upstream issue webrtc-rs/webrtc#690 closed NOT_PLANNED
# 2026-01-31. Our vendored copy adds a TURNS-over-TLS-over-TCP branch
# so the daemon can establish relay candidates from corporate
# networks that block UDP entirely. See agent_gather.rs and the new
# tcp_turn_conn.rs module for the patch notes.
#
# webrtc-ice-0.12.0, second delta (#1740): a browser hides its LAN host
# candidates behind `<uuid>.local` names, and upstream resolves each one
# over raw multicast with a query that ends only when answered — no
# deadline, and it never notices the agent closing. A browser off the
# agent's LAN never answers, so a session whose names the OS resolver
# could not answer either (`roomlerd`'s `mdns_resolve`) left that query
# asking once a second FOREVER, holding the closed ICE agent and every
# socket its candidates owned. Field 2026-09-27 on a vmtest guest: +17 UDP
# sockets and +2 mDNS queries/s per ended session, cumulative. Our vendored
# copy ends the resolution with the agent, and closes a candidate gathered
# after the close (the same leak by a narrower door).
#
# webrtc-0.12.0: upstream SettingEngine has no way to set SCTP
# `max_receive_buffer_size` — `RTCSctpTransport::start` hardcodes 0
# which falls back to the 1 MiB INITIAL_RECV_BUF_SIZE constant in
# webrtc-sctp-0.11.0. At 50-100 ms RTT this caps single-stream DC
# throughput at ~80-167 Mbps. roomler native-to-native peers
# need 8 MiB rwnd to stay link-bound on home-broadband paths. Our
# vendored copy adds set_sctp_max_receive_buffer_size to
# SettingEngine and threads it through the SCTP `Config` constructor.
# See crates/vendored/webrtc/Cargo.toml for the full patch notes.
#
# wintun-bindings-0.7.39 (windows-only, via `tun` 0.8.10): upstream's
# `winreg` feature — which `tun` hard-requests — deletes every
# `NetworkList\Profiles` / `NetworkList\Signatures\Unmanaged` registry
# entry whose ProfileName/Description matches the adapter NAME, on every
# adapter drop. That erases the roomler network's NLA identity (and the
# operator's Private-profile firewall categorization) that the constant
# requested GUID (rc.279) exists to keep stable across sessions. Our
# vendored copy removes the deletion; the feature flag stays declared so
# `tun`'s dependency request resolves. One canonical diff:
# crates/vendored/wintun-bindings.patch (scripts/revendor-wintun-bindings.sh).
#
# scrap-0.5.0 (macOS): upstream's quartz `Frame` derefs to a slice whose
# length is `IOSurfaceGetAllocSize` — the page-rounded TOTAL allocation — and
# it binds no accessor for the surface's row pitch. A consumer therefore
# cannot learn the stride and is forced to guess it as `len() / height`, which
# overshoots the true `bytes_per_row` and is usually not even a multiple of
# the pixel size, so every captured frame shears progressively. Field-hit on a
# MacBook Pro 2026-08-23 ("totally distorted screen"); invisible on X11 (the
# buffer is exactly w*h*4) and on DXGI (len is height * Pitch), which is why
# it survived this long. Our vendored copy binds `IOSurfaceGetBytesPerRow` and
# exposes `Frame::bytes_per_row()`. One canonical diff:
# crates/vendored/scrap.patch (scripts/revendor-scrap.sh).
#
# webrtc-sctp-0.11.0: upstream `ChunkForwardTsn::unmarshal` bounds its
# stream-entry loop by the PACKET buffer instead of the chunk's declared
# length, so a FORWARD-TSN with any chunk bundled after it fails with
# `chunk too short` and the whole packet is dropped — SACK included.
# Chrome's dcSCTP bundles exactly that (FORWARD-TSN + SACK) whenever it
# abandons a message on an unreliable stream, i.e. on every loss in the
# viewer→agent direction while the input channel is busy; each dropped
# packet is a lost acknowledgement and the outbound video stalls on an
# RTO. Field 2026-09-02: 549 drops on one host in a day, 523 of them in
# one 4-minute LAN session that ran 3-4 s behind. Our vendored copy
# bounds the loop by the chunk. Second delta (#1856): upstream's write
# loop closed the association on ANY failed send, so one EHOSTUNREACH
# (a route absent for 3 ms) killed every DataChannel of a remote-desktop
# session; ours drops the packet and lets SCTP retransmit it. One
# canonical diff: crates/vendored/webrtc-sctp.patch
# (scripts/revendor-webrtc-sctp.sh).
#
# smoltcp-0.13.1 (MeshHarbor §6 item 5, the overlay netstack): upstream's
# congestion window never bounded bytes in flight — `seq_to_transmit` clipped
# only the space the remote window left, and `dispatch` sized segments by the
# remote window alone — so every controller let a sender fill the whole
# remote window, and smoltcp's go-back-N recovery resent all of it on a loss.
# The vendored copy makes cwnd bound the bytes in flight in both places and
# replaces Reno with a NewReno-lite (IW10, byte-counted slow start, one
# decrease per RTT on fast retransmit, one segment after a timeout); tunnel-core
# selects it explicitly. Canonical diff: crates/vendored/smoltcp.patch
# (scripts/revendor-smoltcp.sh).
[patch.crates-io]
rtp = { path = "crates/vendored/rtp" }
webrtc-ice = { path = "crates/vendored/webrtc-ice" }
webrtc = { path = "crates/vendored/webrtc" }
webrtc-sctp = { path = "crates/vendored/webrtc-sctp" }
smoltcp = { path = "crates/vendored/smoltcp" }
wintun-bindings = { path = "crates/vendored/wintun-bindings" }
scrap = { path = "crates/vendored/scrap" }

[workspace.package]
version = "0.4.151"
edition = "2024"
authors = ["Goran Jovanov <goran.jovanov@gmail.com>"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower_governor = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MongoDB
mongodb = "3.2"
bson = { version = "2", features = ["chrono-0_4", "serde_with"] }

# Auth
jsonwebtoken = { version = "9", features = ["use_pem"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Config
config = "0.14"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "stream"] }

# SMTP client (used by the EmailService SMTP backend; SendGrid HTTP
# remains the prod default). `default-features = false` avoids pulling
# in native-tls / rustls — Mailpit (the e2e capture target) accepts
# plaintext on :1025, so we go through `builder_dangerous`. When prod
# wants direct SMTP delivery, flip on `tokio1-rustls-tls` and switch
# to `starttls_relay`.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "builder", "hostname"] }
# FR-58 — newsletter issue bodies are authored as markdown (the same file is
# the Medium post) and rendered server-side; raw-HTML events are filtered out
# before push_html, so the only HTML in an email body is renderer-emitted.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
dashmap = "6"
# Optional GeoIP country lookup for platform user analytics (wave 2).
# Pure Rust, no C deps. The DATABASE is never vendored: the server image
# carries DB-IP's CC BY 4.0 country database, fetched at build time (#1896).
maxminddb = "0.24"
parking_lot = "0.12"
bitflags = "2"

# Background tasks
tokio-cron-scheduler = "0.13"

# Export
rust_xlsxwriter = { version = "0.82", features = ["zlib"] }
genpdf = "0.2"

# File handling
tempfile = "3"

# FR-90 Hive — the device-side replica store and its event hash chain
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# mediasoup
mediasoup = "0.20"

# Testing
tokio-test = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Env
dotenvy = "0.15"


# Web Push
web-push = "0.10"

# Misc
rand = "0.9"
# `roomler ssh` mints a per-session ephemeral keypair in the CLI process, so
# the private half never crosses the LocalAPI socket. Version is PINNED to the
# one russh 0.62 already resolves — a second `ssh-key` generation in the tree
# would mean two incompatible `PublicKey` types across the server and client
# halves of the same feature. It is a `-rc`, which this workspace otherwise
# avoids (see the `rsa`-off note in the agent's Cargo.toml); accepted here
# because it is the SAME crate already trusted for the SSH server side, not a
# new pre-release surface.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = [
    "ed25519",
    "alloc",
    "std",
    "rand_core",
] }
base64 = "0.22"
futures = "0.3"
async-trait = "0.1"
urlencoding = "2"
nanoid = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

# FR-90 P3 — the vault's envelope encryption: an XChaCha20-Poly1305 data key
# per version (the version the tree already builds), wrapped to an `age`
# X25519 KEK. `age` is the reference implementation's library, so a wrapped
# key opens with the stock `age` tool and the KEK is an `age-keygen` file.
# ⚠️ 0.11, not 0.12: 0.12's post-quantum recipients pull `ml-kem` 0.2, which
# needs `kem` 0.3.0-pre.0 — while russh already resolves `ml-kem` 0.3 onto
# `kem` 0.3.0, and one lockfile holds one `kem` 0.3.x. The X25519 recipient and
# the file format are the same in both.
age = { version = "0.11", default-features = false }
# FR-90 P3-2 — the vault's policy language (design §8.4): Rust-native,
# schema-validated, formally analysed. No extensions: the vault's policies
# compare strings, sets and integers.
cedar-policy = { version = "4.14", default-features = false }
chacha20poly1305 = "0.10"
zeroize = "1"
# FR-90 P3-3 — a leased value crosses to a device as a libsodium-compatible
# sealed box (`crypto_box_seal`: X25519, XSalsa20-Poly1305) for the key the
# daemon holds. The device's half is `roomlerd`'s `vault` feature. RustCrypto,
# on the `curve25519-dalek` 4 and `aead` 0.5 the tree already builds.
crypto_box = { version = "0.9.1", features = ["seal"] }

# Agent-specific
clap = { version = "4", features = ["derive"] }
# rc.53 Phase 5: native cert roots (Schannel on Windows, CryptoKit on macOS,
# system trust on Linux) — matches the rc.32 vendored webrtc-ice swap so a
# corporate TLS-inspection box's root CA (e.g. Symantec Enterprise Mobile
# Root) trusts both the TURNS/TCP path AND the WS signaling path uniformly.
# Zero behaviour change on plain-internet hosts (native roots include the
# Mozilla bundle on every supported platform via the OS trust store).
# Backlog (rc.54): unify the third TLS stack — reqwest still uses native-tls
# (Schannel) via default-tls. Three TLS implementations in one binary today.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
directories = "6"
toml = "0.9"
webrtc = "0.12"
# TURN client + the `webrtc-util` `Conn` trait it yields, for the
# QUIC-over-TURN relay tiers (Phase 3 Tier 2/3). `tunnel-core`'s
# `transport::relay::TurnRelayConn` wraps a TURN-relayed `util::Conn`
# as a quinn `AsyncUdpSocket` so QUIC rides a coturn allocation on
# symmetric-NAT / UDP-blocked nets. Versions pinned to exactly what the
# vendored `webrtc-ice` already resolves (`turn` 0.9.0 / `webrtc-util`
# 0.10.0) so there's a SINGLE `util::Conn` trait instance in the tree —
# a mismatch would make the `turn` client's `allocate()` hand back a
# `dyn Conn` from a different crate version that `TurnRelayConn` can't
# name. Both are pure-Rust (no OpenSSL) so they build under MSVC.
turn = "0.9"
webrtc-util = "0.10"
# Screen capture. `scrap` is pure-X11 on Linux and avoids the libwayland-dev
# build dep that xcap / screenshots would pull in. Cross-platform: XShm on
# Linux, DXGI Desktop Duplication on Windows, CoreGraphics on macOS.
scrap = "0.5"
# Software H.264 encoder. `source` feature compiles OpenH264 from C — slow
# first build but no runtime lib needed. Alternatives (nvenc/qsv/vaapi)
# come behind other feature flags in a later phase.
openh264 = { version = "0.9", default-features = false, features = ["source"] }
# Cross-platform input injection. Default features pull x11rb which is
# pure-Rust (no libxcb system dep) so we can ship the agent binary from
# any host without X11 dev packages installed.
enigo = "0.6"

# Cross-platform text clipboard (Win32 OpenClipboard / XClipboard /
# NSPasteboard). Used by the clipboard data-channel handler on the
# agent side. No system deps required on Windows/macOS; Linux pulls
# `x11rb` which we already have from `enigo`.
arboard = { version = "3", default-features = false }

# FR-6 wave 23 (#773): the crypto crates build optimized even in the dev and
# test profiles. Unoptimized, one `Argon2::default()` hash or verify took
# 0.5-0.9 s in the integration suite, and `seed_tenant` does four (register +
# login, twice), so password hashing was most of the suite's 30 minutes:
# `auth_tests::health_check_returns_ok` took 1.1 s, a register 2.1 s, a
# register + login 2.5 s (PR run 39305102217). These crates are small, change
# rarely and are never stepped through, so optimizing them costs a few seconds
# of build once. Release builds are untouched; the list covers the arithmetic
# under each scheme too (crypto-bigint, primeorder, num-bigint-dig).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.opaque-ke]
opt-level = 3
[profile.dev.package.voprf]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
