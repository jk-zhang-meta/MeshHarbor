# MeshHarbor — self-hosted, one command.
#
# This is NOT `docker-compose.yml`. That file brings up the *development*
# dependencies (Mongo, Redis, MinIO, coturn) and expects you to run the API and
# the Vite dev server yourself. This one runs the whole product: the built image
# serves the SPA and the API behind nginx on one port, with its own datastores.
#
#   cp .env.selfhost.example .env.selfhost
#   $EDITOR .env.selfhost                 # two secrets, both generated for you
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build
#
# Then open http://localhost:8080 and register — the first account owns the
# first organization. Full walkthrough, including putting it behind a real
# hostname with TLS: docs/self-hosting.md
#
# ── Networking note, read before you file an issue about video calls ──────────
# Conference media (mediasoup) is the one part that cannot be proxied. It needs
# a UDP port range reachable at an address the browser can actually send to, so
# two knobs matter and the defaults are deliberately conservative:
#
#   MESHHARBOR__MEDIASOUP__ANNOUNCED_IP  the address browsers send RTP to. `127.0.0.1`
#                                     works only for calls made on this machine.
#                                     Set it to the host's LAN or public IP.
#   RTC_MIN_PORT / RTC_MAX_PORT       mapped below. 32 ports is enough to try
#                                     the product; widen for real use.
#
# On Linux you can skip all of that by giving the `meshharbor` service
# `network_mode: host` and deleting its `ports:` block — then the full
# 40000-49999 range is reachable and ANNOUNCED_IP is just the host's IP. That is
# how the hosted service runs. It is not available on Docker Desktop for
# macOS/Windows, which is why it is not the default here.
#
# Remote desktop, tunnels, SSH and the overlay mesh do NOT use mediasoup and are
# unaffected by any of the above — they are peer-to-peer with a relay fallback.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env.selfhost}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.selfhost}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [meshharbor]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [meshharbor]

  # MinIO's own images (minio/minio, minio/mc) are gone from Docker Hub, so a clean `pull` failed
  # here (#2034). Chainguard builds MinIO from source for amd64 and arm64; this is its
  # RELEASE.2026-09-22T19-25-18Z build, copied byte-for-byte to our GHCR (the same digest as
  # cgr.dev/chainguard/minio) so it cannot disappear with a free tier. MinIO is AGPL-3.0: the
  # source is github.com/minio/minio at commit df34868a88cc8c396807e04a7e220810b321bdaa. The
  # hosted service runs this image too. It carries `mc` and a
  # shell, so it also serves `minio-init` below. It runs as root because every existing
  # `minio_data` volume was written by the root-run upstream image; Chainguard's default user
  # (65532) cannot write those.
  minio:
    image: ghcr.io/gjovanov/minio:RELEASE.2026-09-22T19-25-18Z@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.selfhost}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.selfhost}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [meshharbor]

  # One-shot: create the bucket the API expects. Without it the first file
  # upload fails with a NoSuchBucket that reads like an auth problem.
  minio-init:
    image: ghcr.io/gjovanov/minio:RELEASE.2026-09-22T19-25-18Z@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    user: "0:0"
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      echo 'bucket ready:' $$BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${MESHHARBOR_S3_BUCKET:-meshharbor}
    networks: [meshharbor]
    restart: "no"

  # TURN relay. Only needed when two peers can punch no direct path AND you want
  # a relay you own; the DERP floor over the API's own :443 already guarantees
  # connectivity without it. Comment the service out if you don't want it —
  # nothing else depends on it.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${MESHHARBOR_TURN_SECRET:?set MESHHARBOR_TURN_SECRET in .env.selfhost}
      - --realm=${MESHHARBOR_TURN_REALM:-meshharbor.local}
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Refuse to relay to private ranges — an open TURN server that can reach
      # your LAN is a proxy into your LAN for anyone who obtains a credential.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --external-ip=${MESHHARBOR_PUBLIC_IP:-127.0.0.1}
      - --min-port=49152
      - --max-port=49252
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49252:49152-49252/udp"
    networks: [meshharbor]

  meshharbor:
    # Two ways to get this running, and the fast one is the default:
    #
    #   docker compose … pull && docker compose … up -d     ← pulls, ~1 minute
    #   docker compose … up -d --build                      ← builds, ~6-20 min
    #
    # ⚠️ `up -d` ALONE will BUILD, not pull. Compose treats a service that has
    # a `build:` section as buildable, so a missing image is built rather than
    # fetched. That is why the documented quickstart runs `pull` first — it is
    # not decoration, and skipping it silently costs the operator the 20
    # minutes this image exists to save.
    #
    # `build:` stays because it is the AGPL promise in practice: the published
    # image must never be the only way to run the server.
    image: ${MESHHARBOR_IMAGE:-ghcr.io/jk-zhang-meta/meshharbor:latest}
    build:
      context: .
      args:
        VERSION: selfhost
        # FR-69 P8 — which pillars a source build carries (`full` | `collab` |
        # `remote` | `mesh` | `access`; docs/self-hosting.md "Choose a
        # profile"). A pulled image picks its profile by TAG instead
        # (`MESHHARBOR_IMAGE=…:<tag>-mesh`). `SAAS=0`: a self-host build never
        # carries the hosted service's billing module.
        PROFILE: ${MESHHARBOR_PROFILE:-full}
        SAAS: "0"
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "${MESHHARBOR_HTTP_PORT:-8080}:80"
      # Conference media. Must match RTC_MIN_PORT/RTC_MAX_PORT below.
      - "40000-40031:40000-40031/udp"
      - "40000-40031:40000-40031/tcp"
    environment:
      # ── identity + security ────────────────────────────────────────────────
      # `production` makes the server REFUSE to boot on the built-in default
      # JWT secret. That is the point: a self-hosted instance reachable from a
      # network must not run on a secret published in this repository.
      MESHHARBOR__APP__ENVIRONMENT: ${MESHHARBOR_ENVIRONMENT:-production}
      MESHHARBOR__JWT__SECRET: ${MESHHARBOR_JWT_SECRET:?set MESHHARBOR_JWT_SECRET in .env.selfhost — openssl rand -hex 32}
      MESHHARBOR__APP__FRONTEND_URL: ${MESHHARBOR_PUBLIC_URL:-http://localhost:8080}
      MESHHARBOR__OAUTH__BASE_URL: ${MESHHARBOR_PUBLIC_URL:-http://localhost:8080}
      # ── datastores ─────────────────────────────────────────────────────────
      MESHHARBOR__DATABASE__URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MESHHARBOR__DATABASE__NAME: ${MESHHARBOR_DB_NAME:-meshharbor}
      MESHHARBOR__REDIS__URL: redis://redis:6379
      MESHHARBOR__S3__ENABLED: "true"
      MESHHARBOR__S3__ENDPOINT: http://minio:9000
      MESHHARBOR__S3__ACCESS_KEY: ${MINIO_ROOT_USER}
      MESHHARBOR__S3__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MESHHARBOR__S3__BUCKET: ${MESHHARBOR_S3_BUCKET:-meshharbor}
      # ── conference media ───────────────────────────────────────────────────
      MESHHARBOR__MEDIASOUP__ANNOUNCED_IP: ${MESHHARBOR_ANNOUNCED_IP:-127.0.0.1}
      MESHHARBOR__MEDIASOUP__RTC_MIN_PORT: "40000"
      MESHHARBOR__MEDIASOUP__RTC_MAX_PORT: "40031"
      MESHHARBOR__MEDIASOUP__NUM_WORKERS: ${MESHHARBOR_MEDIASOUP_WORKERS:-2}
      # ── TURN (see the coturn service above) ────────────────────────────────
      MESHHARBOR__TURN__URL: ${MESHHARBOR_TURN_URL:-turn:127.0.0.1:3478}
      MESHHARBOR__TURN__SHARED_SECRET: ${MESHHARBOR_TURN_SECRET}
      # ── first-run ergonomics ───────────────────────────────────────────────
      # No SMTP is configured out of the box, so activation mail cannot be sent
      # and an account that must be activated by email would be unreachable.
      # Set this false once you have configured MESHHARBOR__EMAIL__*.
      MESHHARBOR__AUTH__AUTO_VERIFY: ${MESHHARBOR_AUTO_VERIFY:-true}
      RUST_LOG: ${MESHHARBOR_LOG:-info}
    # ⚠️ Zero-dependency on purpose. The runtime image has no curl, no wget and
    # no nc (checked), and adding one to a production image just to run a
    # liveness probe is a poor trade. bash's /dev/tcp is a shell builtin and
    # bash is already in debian-slim — so this costs nothing and makes
    # `docker compose ps` report the app as healthy rather than merely running.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 5s
      retries: 20
      # The first start runs schema migrations behind a lease, so give it room
      # before a failing probe starts counting against `retries`.
      start_period: 45s
    networks: [meshharbor]

volumes:
  mongo_data:
  redis_data:
  minio_data:

networks:
  meshharbor:
    name: meshharbor-selfhost
