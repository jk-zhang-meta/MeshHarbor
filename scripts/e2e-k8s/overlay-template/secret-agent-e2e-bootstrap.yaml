# Phase 1 Chunk 1B — bootstrap Secret consumed by the agent-e2e
# StatefulSet. The seed Job (job-agent-e2e-seed.yaml) creates the
# admin user + tenant; THIS file pins the credentials the agent
# StatefulSet signs in with.
#
# FR-114: there is no tenant_id here any more. The agents, the seed and
# the nightly each find the tenant by its slug (`agent-e2e`) through
# `GET /api/tenant`, so a wiped e2e DB needs no hand rebake: a fresh
# tenant gets a fresh id and everyone still finds it.
#
# Plaintext is fine in e2e — sealed-secrets are encrypted per-
# namespace and don't decrypt when copied across namespaces; the
# same posture as `secret-meshharbor2.yaml` in this overlay.
apiVersion: v1
kind: Secret
metadata:
  name: agent-e2e-bootstrap
type: Opaque
stringData:
  admin_email: agent-e2e-admin@meshharbor.local
  admin_password: agent-e2e-bootstrap-pw-2026
