# meshharbor-e2e overlay
# Spins up a parallel stack of the API + MongoDB + Redis + MinIO in
# the `meshharbor-e2e` namespace for Playwright e2e runs. Read
# scripts/e2e-k8s.sh for the orchestration script.
#
# Differences from prod overlay:
#   - separate namespace, ephemeral storage (emptyDir, not PVC)
#   - no hostNetwork (uses ClusterIP service for the API)
#   - no nodeSelector pinning to k8s-worker-3 (any tier=high-performance)
#   - no tier=high-performance affinity (any node)
#   - plaintext Secrets (sealed-secrets are encrypted per-namespace
#     and don't decrypt when copied across namespaces)
#   - NEW Service for meshharbor2 (prod relies on hostNetwork)
#   - lowered resource requests/limits
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meshharbor-e2e

resources:
  - namespace.yaml
  - configmap-meshharbor2-config.yaml
  - secret-meshharbor2.yaml
  - secret-mongodb.yaml
  - secret-minio.yaml
  - service-mongodb.yaml
  - service-redis.yaml
  - service-minio.yaml
  - service-meshharbor2.yaml
  - service-mailpit.yaml
  - deployment-redis.yaml
  - deployment-meshharbor2.yaml
  - deployment-mailpit.yaml
  - statefulset-mongodb.yaml
  - statefulset-minio.yaml
  # Phase 1 Chunk 1B — agent-e2e harness. The seed Job runs once per
  # namespace lifetime to create the admin + tenant; the StatefulSet
  # runs 3 replicas of the synthetic-frame agent enrolled against
  # that tenant. The Secret holds the admin's credentials; the agents,
  # the seed and the nightly find the tenant by its slug (FR-114), so
  # nothing is rebaked after the first seed or a wiped DB.
  - secret-agent-e2e-bootstrap.yaml
  - job-agent-e2e-seed.yaml
  - service-agent-e2e.yaml
  - statefulset-agent-e2e.yaml

# Pin to whichever prod tag is currently live. Bump in lockstep when
# you want e2e to validate a newer build than what's on meshharbor.itachi.fans.
images:
  - name: jk-zhang-meta/MeshHarbor
    newName: registry.meshharbor.itachi.fans/meshharbor
    newTag: v20260506-c89d55489f21
  # Phase 1 Chunk 1B — agent-e2e Linux image, built from
  # Dockerfile.agent-e2e. FR-114: pinned to the DATED tag that was pushed,
  # never `latest` (install-overlay.sh pins it from AGENT_E2E_TAG), so a
  # night's agent is a known build. The placeholder fails a pull loudly
  # rather than run an unknown agent.
  - name: jk-zhang-meta/meshharbord-e2e
    newName: registry.meshharbor.itachi.fans/meshharbord-e2e
    newTag: set-by-AGENT_E2E_TAG

commonLabels:
  env: e2e
  app.kubernetes.io/instance: meshharbor-e2e
