# Phase 1 Chunk 1B — 3-replica StatefulSet of synthetic-frame agents
# enrolled against the in-cluster API. StatefulSet (not Deployment)
# so the Pod hostnames are deterministic — `agent-e2e-0` … `agent-e2e-2`
# — which become the `machine_name` in the rc:agent.hello payload.
# Tests that drive a session need a stable `agent_id` map; the
# deterministic name makes the look-up cheap.
#
# Each Pod's bootstrap script (baked into the image — see
# Dockerfile.agent-e2e) calls `meshharbord enroll` on every start,
# which mints a fresh agent_id per restart. Tests poll
# `GET /api/tenant/<tid>/agent?name=<hostname>` to resolve the
# current id before issuing rc:session.request.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-e2e
  labels:
    app: agent-e2e
spec:
  serviceName: agent-e2e
  # FR-114 — three, one per recording state the specs need (see the
  # MESHHARBOR_E2E_*_ORDINALS env below); every other spec takes any of them,
  # and the switch-device spec has a second device to switch to.
  replicas: 3
  selector:
    matchLabels:
      app: agent-e2e
  template:
    metadata:
      labels:
        app: agent-e2e
    spec:
      imagePullSecrets:
        - name: regcred
      # The seed Job must complete before the agent Pods start —
      # they need the admin user to exist before their bootstrap
      # script can log in. K8s doesn't have a native "depend on a
      # Job" primitive; the agent's bootstrap loop retries login
      # for ~60 s so the Job's typical ~5 s completion fits within
      # the agent's startup wait window.
      containers:
        # FR-114 — an enrollment token travels over TLS unless the server is
        # LOOPBACK (`normalize_server_url`, crates/agent-core/src/enrollment.rs;
        # FR-101 P1b: no plaintext escape). The e2e server serves plain HTTP on
        # `meshharbor2:80`, so the agent reaches it through this byte-transparent
        # proxy on the pod's own 127.0.0.1, which every container in the pod
        # shares. Signalling and the WebSocket ride it; media is WebRTC, pod to pod.
        - name: server-proxy
          image: alpine/socat:1.8.0.0
          args: ["TCP-LISTEN:18080,fork,reuseaddr,bind=127.0.0.1", "TCP:meshharbor2:80"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
        - name: agent
          image: jk-zhang-meta/meshharbord-e2e:latest # rewritten by kustomization images:
          imagePullPolicy: IfNotPresent
          env:
            # The loopback proxy above, never `http://meshharbor2` itself: the
            # agent would promote that to https:// and time out.
            - name: MESHHARBOR_E2E_SERVER
              value: http://127.0.0.1:18080
            - name: MESHHARBOR_E2E_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: agent-e2e-bootstrap
                  key: admin_email
            - name: MESHHARBOR_E2E_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-e2e-bootstrap
                  key: admin_password
            # FR-114 — the tenant is found by its SLUG (`GET /api/tenant`),
            # never pasted into a Secret: a wiped e2e DB gets a fresh id and
            # the agents still find it.
            - name: MESHHARBOR_E2E_TENANT_SLUG
              value: agent-e2e
            # Capture cascade short-circuit — see capture/mod.rs:open_default.
            - name: MESHHARBORD_SYNTHETIC_FRAMES
              value: "1"
            # Image carries the version we want to test; don't let
            # the auto-updater swap it mid-test.
            - name: MESHHARBORD_AUTO_UPDATE
              value: "0"
            # AutoGrant consent — no operator-prompt in CI.
            - name: MESHHARBORD_AUTO_GRANT_SESSION
              value: "1"
            # FR-102 — the install trace: these devices are a container
            # image's entrypoint enrolling itself (an older image ignores it).
            - name: MESHHARBOR_INSTALL_METHOD
              value: container
            - name: MESHHARBOR_INSTALL_SCOPE
              value: system
            # FR-114 — the recording states, by pod ordinal: agent-e2e-0 is a
            # recorder whose owner has NOT opted in (remote-recording-refused),
            # agent-e2e-1 has opted in (`record_remote_enabled`, remote-
            # recording-smoke), agent-e2e-2 has no recorder at all
            # (`MESHHARBORD_RECORDING=0`; remote-recording-refused P3c-2).
            - name: MESHHARBOR_E2E_RECORD_REMOTE_ORDINALS
              value: "1"
            - name: MESHHARBOR_E2E_NO_RECORDER_ORDINALS
              value: "2"
          volumeMounts:
            - name: config
              mountPath: /etc/meshharbor
            - name: data
              mountPath: /root/.local/share/meshharbor
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No HTTP listener on the agent — it's an outbound WS
          # client. Liveness via `meshharbord service status`
          # would need wiring through a tiny health-port; skip for
          # the initial Chunk 1B and rely on the watchdog's own
          # process-exit on stall (the supervisor — implicitly the
          # K8s restartPolicy=Always behaviour of a Pod — restarts).
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
      terminationGracePeriodSeconds: 10
