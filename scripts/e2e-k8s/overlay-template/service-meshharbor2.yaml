# Net-new Service for the meshharbor2 deployment in the e2e namespace.
# Prod uses hostNetwork: true and reaches the API via the host's
# port 80; in-cluster e2e drops hostNetwork so we need a ClusterIP
# Service for the Playwright Job (and other in-cluster clients) to
# resolve `http://meshharbor2[:80]/health` and SPA + API + WS routes.
apiVersion: v1
kind: Service
metadata:
  name: meshharbor2
  labels:
    app: meshharbor2
spec:
  type: ClusterIP
  selector:
    app: meshharbor2
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
